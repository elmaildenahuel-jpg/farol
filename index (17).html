function Metricas({clientes,prods}){
  const todas=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,clienteNombre:c.nombre,rubro:c.rubro,zona:c.zona}))),[clientes]);

  // KPIs: ticket promedio, frecuencia de compra, cobrado vs pendiente
  const montoTotalVentas=useMemo(()=>todas.reduce((s,v)=>s+(v.monto||0),0),[todas]);
  const ticketPromedio=todas.length?Math.round(montoTotalVentas/todas.length):0;
  const deudaTotal=totalAdeudado(clientes);
  const montoPagado=montoTotalVentas-deudaTotal;
  const pctCobrado=montoTotalVentas>0?Math.round((montoPagado/montoTotalVentas)*100):100;
  const frecuenciaCompraDias=useMemo(()=>{
    const gaps=[];
    clientes.forEach(c=>{
      const fechas=(c.ventas||[]).map(v=>v.fecha).filter(Boolean).sort();
      for(let i=1;i<fechas.length;i++){
        const diff=(new Date(fechas[i]+"T00:00:00")-new Date(fechas[i-1]+"T00:00:00"))/86400000;
        if(diff>=0)gaps.push(diff);
      }
    });
    return gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null;
  },[clientes]);

  // Evolución mensual (últimos 6 meses)
  const evolucionMensual=useMemo(()=>{
    const hoy=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]={litros:0,monto:0});
    todas.forEach(v=>{
      const key=(v.fecha||"").slice(0,7);
      if(map[key]){map[key].litros+=v.cantidad||0;map[key].monto+=v.monto||0;}
    });
    return meses.map(m=>({...m,...map[m.key]}));
  },[todas]);
  const maxMes=Math.max(1,...evolucionMensual.map(m=>m.litros));

  // Top clientes por facturación total
  const topClientesFacturacion=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.clienteNombre])map[v.clienteNombre]={litros:0,monto:0,pedidos:0};
      map[v.clienteNombre].litros+=v.cantidad||0;
      map[v.clienteNombre].monto+=v.monto||0;
      map[v.clienteNombre].pedidos+=1;
    });
    return Object.entries(map).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.monto-a.monto).slice(0,8);
  },[todas]);
  const maxFacturacion=topClientesFacturacion[0]?.monto||1;

  // Ventas por tipo de envase
  const ENVASE_COLOR={PET:G,Barril:AM,Lata:"#4472BE"};
  const rankingEnvase=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      const envase=prods.find(p=>p.id===v.producto)?.envase||"Otro";
      if(!map[envase])map[envase]={litros:0,monto:0};
      map[envase].litros+=v.cantidad||0;
      map[envase].monto+=v.monto||0;
    });
    return Object.entries(map).map(([envase,d])=>({envase,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods]);
  const maxEnvase=Math.max(1,...rankingEnvase.map(e=>e.litros));

  // Día de la semana con más ventas
  const DIAS_LBL=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const ventasPorDiaSemana=useMemo(()=>{
    const acc=[0,0,0,0,0,0,0];
    todas.forEach(v=>{
      if(!v.fecha)return;
      const dow=new Date(v.fecha+"T00:00:00").getDay();
      acc[dow===0?6:dow-1]+=v.cantidad||0;
    });
    return DIAS_LBL.map((lbl,i)=>({lbl,litros:acc[i]}));
  },[todas]);
  const maxDiaSem=Math.max(1,...ventasPorDiaSemana.map(d=>d.litros));
  const diaTop=ventasPorDiaSemana.reduce((max,d)=>d.litros>max.litros?d:max,ventasPorDiaSemana[0]);
 
  // Ranking por producto
  const rankingProducto=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.producto])map[v.producto]={litros:0,monto:0,pedidos:0};
      map[v.producto].litros+=v.cantidad;
      map[v.producto].monto+=v.monto;
      map[v.producto].pedidos+=1;
    });
    return Object.entries(map).map(([id,d])=>({id,nombre:prods.find(p=>p.id===id)?.nombre||id,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods]);
 
  // Ranking clientes por producto
  const rankingClientesPorProd=useMemo(()=>{
    const byProd={};
    prods.forEach(p=>byProd[p.id]={});
    todas.forEach(v=>{
      if(!byProd[v.producto])byProd[v.producto]={};
      if(!byProd[v.producto][v.clienteNombre])byProd[v.producto][v.clienteNombre]={litros:0,monto:0};
      byProd[v.producto][v.clienteNombre].litros+=v.cantidad;
      byProd[v.producto][v.clienteNombre].monto+=v.monto;
    });
    const result={};
    Object.entries(byProd).forEach(([prodId,clientes])=>{
      result[prodId]=Object.entries(clientes).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.litros-a.litros).slice(0,5);
    });
    return result;
  },[todas,prods]);
 
  // Ranking por zona
  const rankingZona=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.zona])map[v.zona]={litros:0,monto:0,pedidos:0};
      map[v.zona].litros+=v.cantidad;
      map[v.zona].monto+=v.monto;
      map[v.zona].pedidos+=1;
    });
    return Object.entries(map).map(([zona,d])=>({zona,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas]);
 
  // Ranking por rubro
  const rankingRubro=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.rubro])map[v.rubro]={litros:0,monto:0,pedidos:0};
      map[v.rubro].litros+=v.cantidad;
      map[v.rubro].monto+=v.monto;
      map[v.rubro].pedidos+=1;
    });
    return Object.entries(map).map(([rubro,d])=>({rubro,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas]);
 
  const maxZona=rankingZona[0]?.litros||1;
  const maxRubro=rankingRubro[0]?.litros||1;
 
  if(todas.length===0) return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Métricas</span>
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:32,textAlign:"center",marginTop:20}}>
        <div style={{fontSize:15,color:MU}}>Sin ventas registradas todavía.</div>
        <div style={{fontSize:12,color:MU,marginTop:6}}>Las métricas aparecen cuando registrés pedidos entregados.</div>
      </div>
    </div>
  );
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Métricas</span>
      <p style={{fontSize:12,color:MU,marginBottom:20}}>Rankings de ventas · {todas.length} registros</p>

      {/* KPIs generales */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ticket promedio</div>
          <div className="bebas" style={{fontSize:20,color:CR}}>{fmtARS(ticketPromedio)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Frecuencia de compra</div>
          <div className="bebas" style={{fontSize:20,color:CR}}>{frecuenciaCompraDias!=null?`${frecuenciaCompraDias} días`:"—"}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${G}33`,borderRadius:18,padding:14}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Cobrado</div>
          <div className="bebas" style={{fontSize:20,color:G}}>{pctCobrado}%</div>
          <div style={{fontSize:11,color:MU,marginTop:1}}>{fmtARS(montoPagado)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${deudaTotal>0?RE+"33":BO}`,borderRadius:18,padding:14}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Pendiente de cobro</div>
          <div className="bebas" style={{fontSize:20,color:deudaTotal>0?"#C24545":CR}}>{fmtARS(deudaTotal)}</div>
        </div>
      </div>

      {/* Evolución mensual */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Evolución mensual · litros vendidos</div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90}}>
          {evolucionMensual.map((m,i)=>(
            <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
              <div style={{width:"100%",maxWidth:28,height:`${Math.max(4,Math.round((m.litros/maxMes)*68))}px`,borderRadius:6,background:i===evolucionMensual.length-1?G:GLT,transition:"height 0.4s"}}/>
              <span style={{fontSize:9,fontWeight:i===evolucionMensual.length-1?700:500,color:i===evolucionMensual.length-1?G:MU,textTransform:"capitalize"}}>{m.lbl}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Top clientes por facturación total */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`}}><span style={{fontSize:14,fontWeight:700,color:CR}}>💰 Top clientes · facturación total</span></div>
        {topClientesFacturacion.length===0?<p style={{padding:16,fontSize:13,color:MU,textAlign:"center"}}>Sin datos.</p>:topClientesFacturacion.map((c,idx)=>(
          <div key={c.nombre} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:idx===0?GLT:BG,color:idx===0?G:MU,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:12,fontWeight:700}}>{iniciales(c.nombre)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nombre}</div>
              <div style={{marginTop:4,height:3,background:BO,borderRadius:2}}><div style={{width:`${(c.monto/maxFacturacion)*100}%`,height:"100%",background:G,borderRadius:2}}/></div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:G}}>{fmtARS(c.monto)}</div>
              <div style={{fontSize:11,color:MU}}>{c.litros}L · {c.pedidos} pedido{c.pedidos!==1?"s":""}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Ventas por tipo de envase */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`}}><span style={{fontSize:14,fontWeight:700,color:CR}}>📦 Ventas por envase</span></div>
        {rankingEnvase.map(e=>(
          <div key={e.envase} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:ENVASE_COLOR[e.envase]||MU,flexShrink:0}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:CR}}>{e.envase}</div>
              <div style={{marginTop:4,height:3,background:BO,borderRadius:2}}><div style={{width:`${(e.litros/maxEnvase)*100}%`,height:"100%",background:ENVASE_COLOR[e.envase]||MU,borderRadius:2}}/></div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:CR}}>{e.litros}L</div>
              <div style={{fontSize:11,color:MU}}>{fmtARS(e.monto)}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Ventas por día de la semana */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ventas por día de la semana</div>
        <div style={{fontSize:12,color:MU,marginBottom:12}}>Mejor día: <span style={{color:G,fontWeight:700}}>{diaTop.lbl}</span> ({diaTop.litros}L acumulados)</div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:80}}>
          {ventasPorDiaSemana.map(d=>(
            <div key={d.lbl} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
              <div style={{width:"100%",maxWidth:24,height:`${Math.max(4,Math.round((d.litros/maxDiaSem)*58))}px`,borderRadius:6,background:d.lbl===diaTop.lbl?G:GLT,transition:"height 0.4s"}}/>
              <span style={{fontSize:9,fontWeight:d.lbl===diaTop.lbl?700:500,color:d.lbl===diaTop.lbl?G:MU}}>{d.lbl}</span>
            </div>
          ))}
        </div>
      </div>
 
      {/* Resumen general por producto */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        {rankingProducto.map(p=>(
          <div key={p.id} style={{background:CA,border:`1px solid ${G}33`,borderRadius:18,padding:14}}>
            <div style={{fontSize:12,fontWeight:700,color:G,marginBottom:6}}>{p.nombre}</div>
            <div className="bebas" style={{fontSize:26,color:CR}}>{p.litros}L</div>
            <div style={{fontSize:12,color:MU,marginTop:2}}>{fmtARS(p.monto)}</div>
            <div style={{fontSize:11,color:MU,marginTop:1}}>{p.pedidos} pedido{p.pedidos!==1?"s":""}</div>
          </div>
        ))}
      </div>
 
      {/* Ranking clientes por producto */}
      {prods.map(prod=>{
        const ranking=rankingClientesPorProd[prod.id]||[];
        if(ranking.length===0)return null;
        const maxL=ranking[0]?.litros||1;
        return(
          <div key={prod.id} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
            <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:14,fontWeight:700,color:CR}}>🏆 Top clientes · {prod.nombre}</span>
            </div>
            {ranking.map((c,idx)=>(
              <div key={c.nombre} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:22,height:22,borderRadius:"50%",background:idx===0?G+"33":BO,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:12,fontWeight:700,color:idx===0?G:MU}}>#{idx+1}</span>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nombre}</div>
                  <div style={{marginTop:4,height:3,background:BO,borderRadius:2}}>
                    <div style={{width:`${(c.litros/maxL)*100}%`,height:"100%",background:G,borderRadius:2}}/>
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:G}}>{c.litros}L</div>
                  <div style={{fontSize:11,color:MU}}>{fmtARS(c.monto)}</div>
                </div>
              </div>
            ))}
          </div>
        );
      })}
 
      {/* Ranking por zona */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`}}>
          <span style={{fontSize:14,fontWeight:700,color:CR}}>📍 Ventas por zona</span>
        </div>
        {rankingZona.map((z,idx)=>(
          <div key={z.zona} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:idx===0?G+"33":BO,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{fontSize:12,fontWeight:700,color:idx===0?G:MU}}>#{idx+1}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:CR}}>{z.zona}</div>
              <div style={{marginTop:4,height:3,background:BO,borderRadius:2}}>
                <div style={{width:`${(z.litros/maxZona)*100}%`,height:"100%",background:G,borderRadius:2}}/>
              </div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:G}}>{z.litros}L</div>
              <div style={{fontSize:11,color:MU}}>{fmtARS(z.monto)}</div>
            </div>
          </div>
        ))}
      </div>
 
      {/* Ranking por rubro */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`}}>
          <span style={{fontSize:14,fontWeight:700,color:CR}}>🏪 Ventas por tipo de comercio</span>
        </div>
        {rankingRubro.map((r,idx)=>(
          <div key={r.rubro} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:idx===0?G+"33":BO,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{fontSize:12,fontWeight:700,color:idx===0?G:MU}}>#{idx+1}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:CR}}>{r.rubro}</div>
              <div style={{marginTop:4,height:3,background:BO,borderRadius:2}}>
                <div style={{width:`${(r.litros/maxRubro)*100}%`,height:"100%",background:G,borderRadius:2}}/>
              </div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:G}}>{r.litros}L</div>
              <div style={{fontSize:11,color:MU}}>{r.pedidos} pedido{r.pedidos!==1?"s":""}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
 
// ── CONFIGURACIÓN ─────────────────────────────────────────────────
function Configuracion({cal,clientes,setClientes,prospectos,setProspectos,pedidos,setPedidos,prods,setProds,setMetaSemanal}){
  const[clientId,setClientId]=useState(getCalClientId());
  const[guardado,setGuardado]=useState(false);
 
  const guardarClientId=()=>{
    const val=clientId.trim();
    if(!val)return;
    localStorage.setItem("farol_gcal_client_id",val);
    setGuardado(true);
    setTimeout(()=>setGuardado(false),2000);
  };
  const limpiarClientId=()=>{
    localStorage.removeItem("farol_gcal_client_id");
    setClientId("");
    cal.logout&&cal.logout();
  };
  const tieneClientId=!!getCalClientId();
 
  // ── Exportaciones ──
  const exportarClientes=()=>{
    const filas=clientes.map(c=>{
      const saldo=saldoCliente(c);
      const totalVentas=c.ventas.reduce((s,v)=>s+v.monto,0);
      const totalLitros=c.ventas.reduce((s,v)=>s+v.cantidad,0);
      const ultimaVenta=lastSale(c);
      return[
        `"${c.nombre}"`,
        `"${c.rubro}"`,
        `"${c.zona}"`,
        `"${c.direccion||""}"`,
        `"${c.telefono||""}"`,
        totalVentas,
        totalLitros,
        saldo,
        c.ventas.length,
        ultimaVenta?ultimaVenta.fecha:"",
        `"${c.notas||""}"`,
      ].join(",");
    });
    const header="Nombre,Rubro,Zona,Dirección,Teléfono,Total vendido (ARS),Total litros,Saldo pendiente (ARS),Cantidad pedidos,Última venta,Notas";
    descargarCSV(`clientes_farol_${hoyISO()}.csv`,header+"\n"+filas.join("\n"));
  };
 
  const exportarVentas=()=>{
    const filas=clientes.flatMap(c=>
      c.ventas.map(v=>{
        const prod=prods.find(p=>p.id===v.producto);
        return[
          `"${c.nombre}"`,
          `"${c.rubro}"`,
          `"${c.zona}"`,
          v.fecha,
          `"${prod?prod.nombre:v.producto}"`,
          v.cantidad,
          v.monto,
          v.pagado?"Pagado":"Pendiente",
        ].join(",");
      })
    ).sort();
    const header="Cliente,Rubro,Zona,Fecha,Producto,Cantidad (L),Monto (ARS),Estado pago";
    descargarCSV(`ventas_farol_${hoyISO()}.csv`,header+"\n"+filas.join("\n"));
  };
 
  const exportarTodo=()=>{
    const data=JSON.stringify({clientes,exportadoEn:new Date().toISOString()},null,2);
    const blob=new Blob([data],{type:"application/json;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`backup_farol_${hoyISO()}.json`;a.click();
  };
 
  function descargarCSV(nombre,contenido){
    const blob=new Blob(["\uFEFF"+contenido],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=nombre;a.click();
  }

  // ── Borrado y reseteo ──
  const borrarClientes=()=>{
    if(!confirm(`¿Borrar los ${clientes.length} clientes? Se pierde todo el historial de ventas y saldos. Esta acción no se puede deshacer.`))return;
    if(!confirm("Confirmá de nuevo: esto borra TODOS los clientes y sus ventas."))return;
    setClientes([]);
  };
  const borrarComercios=()=>{
    if(!confirm(`¿Borrar los ${prospectos.length} comercios/prospectos? Esta acción no se puede deshacer.`))return;
    setProspectos([]);
  };
  const resetGeneral=()=>{
    if(!confirm("¿Resetear el programa por completo? Se borran clientes, comercios, pedidos, la meta semanal y los productos vuelven a sus valores de fábrica."))return;
    if(!confirm("Última confirmación: esto borra TODOS los datos de Grunge & Farol y no se puede deshacer. ¿Continuar?"))return;
    setClientes([]);
    setProspectos([]);
    setPedidos([]);
    setProds(PRODS_INIT);
    setMetaSemanal(0);
  };

  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Configuración</span>
      <p style={{fontSize:12,color:MU,marginBottom:24}}>Integraciones, exportaciones y ajustes</p>
 
      {/* ── Exportar datos ── */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:20,marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:CR,marginBottom:4}}>📦 Exportar datos</div>

const SYNC_STATUS={
  connecting:{icon:"☁️",label:"Conectando…",color:MU},
  saving:    {icon:"⏳",label:"Guardando…", color:AM},
  synced:    {icon:"✓", label:"Guardado",   color:GR},
  offline:   {icon:"⚡",label:"Sin conexión",color:AM},
  error:     {icon:"⚠️",label:"Error sync", color:RE},
};
 
function useFirebaseSync(clientes,setClientes,prospectos,setProspectos,speeches,setSpeeches,pedidos,setPedidos,prods,setProds,metaSemanal,setMetaSemanal){
  const[status,setStatus]=useState("connecting");
  const[errorMsg,setErrorMsg]=useState(null);

  const KEYS=["clientes","prospectos","speeches","pedidos","prods","config"];
  const valuesRef=React.useRef({});
  valuesRef.current={clientes,prospectos,speeches,pedidos,prods,config:{metaSemanal}};
  const settersRef=React.useRef({
    clientes:setClientes,prospectos:setProspectos,speeches:setSpeeches,pedidos:setPedidos,
    prods:d=>{if(Array.isArray(d)&&d.length>0)setProds(d);},
    config:d=>{if(d&&typeof d.metaSemanal==="number")setMetaSemanal(d.metaSemanal);},
  });
  const lastSyncRef=React.useRef({});
  const loadedRef=React.useRef({});
  const timersRef=React.useRef({});

  const fallo=React.useCallback(e=>{
    const msg=(e&&e.code?`[${e.code}] `:"")+(e&&e.message?e.message:String(e||"Error desconocido"));
    setErrorMsg(msg);
    console.error("Firestore error:",e);
    setStatus("error");
  },[]);

  React.useEffect(()=>{
    let cancel=false;
    let intentos=0;
    const unsubs=[];

    const attach=()=>{
      if(cancel)return;
      if(!window.fbAuth||!window.fbDb){
        if(intentos<20){intentos++;setTimeout(attach,500);}
        else fallo(new Error("Firebase no disponible: revisá tu conexión o si algún bloqueador de scripts está activo"));
        return;
      }
      const unsubAuth=window.fbAuth.onAuthStateChanged(async user=>{
        if(!user||cancel)return;
        const col=window.fbDb.collection("farolcrm");

        // Migración única desde el doc viejo "farolcrm/data" (todo-en-uno) hacia documentos separados por sección
        try{
          const legacySnap=await col.doc("data").get();
          if(legacySnap.exists){
            const d=legacySnap.data()||{};
            const checks=await Promise.all(KEYS.map(k=>col.doc(k).get()));
            const batch=window.fbDb.batch();
            let necesitaMigrar=false;
            KEYS.forEach((k,i)=>{
              if(!checks[i].exists){
                necesitaMigrar=true;
                const val=k==="config"?{metaSemanal:d.metaSemanal||0}:(d[k]||[]);
                batch.set(col.doc(k),{value:val,updatedAt:Date.now()});
              }
            });
            if(necesitaMigrar)await batch.commit();
          }
        }catch(e){/* si falla la migración, cada doc se crea solo abajo con el estado local */}

        if(cancel)return;
        KEYS.forEach(k=>{
          const ref=col.doc(k);
          const unsub=ref.onSnapshot(snap=>{
            if(cancel)return;
            if(snap.exists){
              const data=snap.data()||{};
              const incoming=JSON.stringify(data.value);
              if(incoming!==lastSyncRef.current[k]){
                lastSyncRef.current[k]=incoming;
                settersRef.current[k](data.value);
              }
            }else{
              const seedVal=valuesRef.current[k];
              lastSyncRef.current[k]=JSON.stringify(seedVal);
              ref.set({value:seedVal,updatedAt:Date.now()}).catch(fallo);
            }
            loadedRef.current[k]=true;
            if(KEYS.every(kk=>loadedRef.current[kk])){setStatus("synced");setErrorMsg(null);}
          },fallo);
          unsubs.push(unsub);
        });
      });
// NOTA: pantalla de login (email/contraseña) desactivada a pedido de Nahu. El código de <Login/> y
// <AppGate/> sigue completo más abajo — para reactivarla, cambiar el render final al pie del archivo
// de <App/> a <AppGate/>, y sacar el signInAnonymously() de acá abajo (useFirebaseSync).
      unsubs.push(unsubAuth);
      window.fbAuth.signInAnonymously().catch(fallo);
    };
    attach();

    const goOff=()=>setStatus(s=>s==="error"?s:"offline");
    const goOn=()=>setStatus(s=>s==="error"?s:"synced");
    window.addEventListener("offline",goOff);
    window.addEventListener("online",goOn);
    return()=>{
      cancel=true;
      unsubs.forEach(u=>{try{u&&u();}catch(e){}});
      window.removeEventListener("offline",goOff);
      window.removeEventListener("online",goOn);
    };
  },[]);

  // Guardar en Firestore cuando cambia cada sección (debounce 800ms, independiente por sección)
  React.useEffect(()=>{
    KEYS.forEach(k=>{
      if(!loadedRef.current[k])return;
      const val=valuesRef.current[k];
      const current=JSON.stringify(val);
      if(current===lastSyncRef.current[k])return;
      if(timersRef.current[k])clearTimeout(timersRef.current[k]);
      setStatus(s=>s==="error"?s:"saving");
      timersRef.current[k]=setTimeout(()=>{
        if(!window.fbDb){fallo(new Error("Sin conexión a Firestore"));return;}
        window.fbDb.collection("farolcrm").doc(k).set({value:val,updatedAt:Date.now()})
          .then(()=>{
            lastSyncRef.current[k]=current;
            setStatus(s=>s==="error"?s:"synced");
            setErrorMsg(null);
          })
          .catch(e=>{ navigator.onLine?fallo(e):setStatus("offline"); });
      },800);
    });
  },[clientes,prospectos,speeches,pedidos,prods,metaSemanal]);

  return{status,errorMsg};
}

function SyncBadge({status,errorMsg}){
  const s=SYNC_STATUS[status]||SYNC_STATUS.connecting;
  const tocable=status==="error"&&errorMsg;
  return(
    <div onClick={()=>{if(tocable)alert("Error de sincronización:\n\n"+errorMsg);}}
      style={{display:"flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,color:s.color,padding:"3px 8px",borderRadius:6,background:s.color+"11",border:`1px solid ${s.color}33`,cursor:tocable?"pointer":"default"}}>
      <span>{s.icon}</span><span>{s.label}</span>{tocable&&<span style={{textDecoration:"underline"}}>(ver)</span>}
    </div>
  );
}

function Login(){
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[error,setError]=useState("");
  const[cargando,setCargando]=useState(false);
  const[mostrarPass,setMostrarPass]=useState(false);

  const entrar=async(e)=>{
    e.preventDefault();
    setError("");setCargando(true);

    // Si Firebase todavía no terminó de cargar, esperamos un poco antes de rendirnos
    let intentos=0;
    while(!window.fbAuth&&intentos<20){
      await new Promise(r=>setTimeout(r,300));
      intentos++;
    }
    if(!window.fbAuth){
      const msg="No se pudo conectar con el servidor de autenticación. Revisá tu conexión a internet y volvé a intentar. Si persiste, avisame.";
      setError(msg);alert(msg);setCargando(false);
      return;
    }

    // Si el login tarda demasiado (ej: red lenta, o falta habilitar el proveedor en Firebase), avisamos igual
    const timeoutId=setTimeout(()=>{
      const msg="El inicio de sesión está tardando demasiado. Puede ser un problema de conexión, o que todavía no habilitaste el método 'Correo electrónico/contraseña' en Firebase Authentication.";
      setError(msg);alert(msg);setCargando(false);
    },15000);

    try{
      await window.fbAuth.signInWithEmailAndPassword(email.trim(),pass);
      clearTimeout(timeoutId);
    }catch(err){
      clearTimeout(timeoutId);
      const msgs={
        "auth/invalid-email":"El email no es válido.",
        "auth/user-not-found":"No existe una cuenta con ese email.",
        "auth/wrong-password":"Contraseña incorrecta.",
        "auth/invalid-credential":"Email o contraseña incorrectos.",
        "auth/too-many-requests":"Demasiados intentos fallidos. Esperá unos minutos e intentá de nuevo.",
        "auth/network-request-failed":"Sin conexión a internet.",
        "auth/user-disabled":"Esta cuenta fue deshabilitada.",
        "auth/operation-not-allowed":"El método de email/contraseña no está habilitado en Firebase todavía. Andá a Firebase Console → Authentication → Sign-in method y activalo.",
      };
      const msg=msgs[err&&err.code]||("No se pudo iniciar sesión: "+(err&&(err.message||err.code)||"error desconocido"));
      setError(msg);alert(msg);
      setCargando(false);
    }
  };

  return(
    <div style={{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <form onSubmit={entrar} style={{width:"100%",maxWidth:360,background:CA,border:`1px solid ${BO}`,borderRadius:24,padding:32,boxShadow:"0 8px 30px rgba(0,0,0,0.08)"}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:24}}>
          <div style={{width:56,height:56,borderRadius:16,background:"#0E4A2C",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}>{I.beer}</div>
          <div className="bebas" style={{fontSize:26,color:CR}}>Grunge & Farol</div>
          <div style={{fontSize:12,color:MU,marginTop:2}}>Iniciá sesión para continuar</div>
        </div>
        <div style={{marginBottom:14}}>
          <Lbl t="Email"/>
          <input type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" required autoFocus/>
        </div>
        <div style={{marginBottom:14}}>
          <Lbl t="Contraseña"/>
          <div style={{position:"relative"}}>
            <input type={mostrarPass?"text":"password"} autoComplete="current-password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" required style={{paddingRight:40,width:"100%"}}/>
            <button type="button" onClick={()=>setMostrarPass(v=>!v)} style={{position:"absolute",right:6,top:0,bottom:0,background:"none",border:"none",color:MU,cursor:"pointer",display:"flex",alignItems:"center"}}>{mostrarPass?I.eyeOff:I.eye}</button>
          </div>
        </div>
        {error&&<div style={{background:RE+"11",border:`1px solid ${RE}33`,borderRadius:10,padding:"9px 12px",fontSize:12,color:RE,marginBottom:14}}>{error}</div>}
        <button type="submit" disabled={cargando} style={{width:"100%",padding:"13px",borderRadius:14,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:cargando?"not-allowed":"pointer",opacity:cargando?0.6:1}}>{cargando?"Ingresando...":"Ingresar"}</button>
        <div style={{fontSize:11,color:MU,textAlign:"center",marginTop:16}}>¿No tenés cuenta? Pedile a Nahu que te la cree desde Firebase.</div>
      </form>
    </div>
  );
}

function AppGate(){
  const[user,setUser]=useState(undefined); // undefined=cargando, null=sin sesión, objeto=logueado
  React.useEffect(()=>{
    let cancel=false,intentos=0;
    const check=()=>{
      if(cancel)return;
      if(window.fbAuth){
        window.fbAuth.onAuthStateChanged(u=>{if(!cancel)setUser(u);});
      }else if(intentos<20){
        intentos++;setTimeout(check,300);
      }else{
        setUser(null);
      }
    };
    check();
    return()=>{cancel=true;};
  },[]);

  if(user===undefined){
    return(
      <div style={{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{color:MU,fontSize:13}}>Cargando…</div>
      </div>
    );
  }
  if(!user)return<Login/>;
  return<App/>;
}

function App(){
  const[tab,setTab]=useState("inicio");
  const[clientes,setClientes]=useState(initClientes);
  const[prospectos,setProspectos]=useState(initProspectos);
  const[speeches,setSpeeches]=useState(initSpeeches);
  const[pedidos,setPedidos]=useState([]);
  const[prods,setProds]=useState(PRODS_INIT);
  const[metaSemanal,setMetaSemanal]=useState(0);
  const cal=useGoogleCalendar();
 
  // Sincronización Firebase — todos los datos en la nube
  const{status:syncStatus,errorMsg:syncError}=useFirebaseSync(
    clientes,setClientes,
    prospectos,setProspectos,
    speeches,setSpeeches,
    pedidos,setPedidos,
    prods,setProds,
    metaSemanal,setMetaSemanal
  );
 
  const convertir=p=>{
    setClientes(prev=>[...prev,{id:uid(),nombre:p.nombre,rubro:p.rubro,zona:p.zona,direccion:p.direccion,telefono:p.telefono,notas:p.notas,agenda:[],historial:[],ventas:[]}]);
    setProspectos(prev=>prev.filter(x=>x.id!==p.id));
    setTab("clientes");
  };
 
  
 
  return(
    <div style={{minHeight:"100vh",background:BG}}>
      <div style={{display:"flex"}}>
        {/* Sidebar desktop */}
        <aside style={{width:200,minHeight:"100vh",background:SU,borderRight:`1px solid ${BO}`,position:"fixed",top:0,left:0,flexDirection:"column",display:"none"}} id="sb">
          <div style={{padding:"24px 20px 16px",borderBottom:`1px solid ${BO}`}}>
            <div className="bebas" style={{fontSize:28,color:G}}>GRUNGE & FAROL</div>
            <div style={{fontSize:10,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>Distribución de cerveza artesanal</div>
          </div>
          <nav style={{padding:12,display:"flex",flexDirection:"column",gap:4,flex:1,overflowY:"auto"}}>
            {TABS.map(({key,label,icon})=>(
              <button key={key} onClick={()=>setTab(key)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,fontSize:14,fontWeight:600,cursor:"pointer",border:"none",background:tab===key?G:"transparent",color:tab===key?"#fff":MU}}>{icon}{label}</button>
            ))}
          </nav>
          <div style={{padding:"16px 20px",borderTop:`1px solid ${BO}`}}>
            <SyncBadge status={syncStatus} errorMsg={syncError}/>
            <div style={{fontSize:10,color:BO,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginTop:8}}>Dos marcas, un mismo reparto</div>
          </div>
        </aside>
 
        <main style={{flex:1,paddingTop:56,minHeight:"100vh"}} id="mn">
          {tab==="inicio"&&<Inicio clientes={clientes} prospectos={prospectos} pedidos={pedidos} prods={prods} metaSemanal={metaSemanal} setMetaSemanal={setMetaSemanal} setTab={setTab}/>}
          {tab==="clientes"&&<Clientes clientes={clientes} setClientes={setClientes} speeches={speeches} cal={cal} prods={prods}/>}
          {tab==="comercios"&&<Comercios prospectos={prospectos} setProspectos={setProspectos} onConvertir={convertir} speeches={speeches} prods={prods}/>}
          {tab==="pedidos"&&<Pedidos pedidos={pedidos} setPedidos={setPedidos} clientes={clientes} setClientes={setClientes} prods={prods} setProds={setProds}/>}
          {tab==="cuentascorrientes"&&<CuentasCorrientes clientes={clientes} setClientes={setClientes}/>}
          {tab==="maps"&&<BuscadorMaps prospectos={prospectos} setProspectos={setProspectos}/>}
          {tab==="speeches"&&<Speeches speeches={speeches} setSpeeches={setSpeeches}/>}
          {tab==="ventas"&&<Ventas clientes={clientes} prods={prods}/>}
          {tab==="caja"&&<Caja clientes={clientes}/>}
          {tab==="metricas"&&<Metricas clientes={clientes} prods={prods}/>}
          {tab==="productos"&&<Productos prods={prods} setProds={setProds}/>}
          {tab==="config"&&<Configuracion cal={cal} clientes={clientes} setClientes={setClientes} prospectos={prospectos} setProspectos={setProspectos} pedidos={pedidos} setPedidos={setPedidos} prods={prods} setProds={setProds} setMetaSemanal={setMetaSemanal}/>}
        </main>
      </div>
 
      {/* Header mobile */}
      <div id="tb" style={{position:"fixed",top:0,left:0,right:0,zIndex:40,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",background:"#FFFFFF",borderBottom:`1px solid ${BO}`,boxShadow:"0 1px 8px rgba(0,0,0,0.08)"}}>
        <span className="bebas" style={{fontSize:19,color:G}}>GRUNGE & FAROL</span>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <SyncBadge status={syncStatus} errorMsg={syncError}/>
          <button onClick={()=>setTab("config")} style={{fontSize:12,padding:"5px 10px",borderRadius:8,background:tab==="config"?G:"none",border:`1px solid ${tab==="config"?G:BO}`,color:tab==="config"?"#fff":cal.calToken?GR:MU,cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
            {cal.calToken?"📅✓":"⚙️"}
          </button>
        </div>
      </div>
 
      {/* Bottom nav mobile - TRES FILAS */}
      <div id="bn" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:40,background:"#FFFFFF",borderTop:`1px solid ${BO}`,boxShadow:"0 -2px 12px rgba(0,0,0,0.08)"}}>
        {[
          ["inicio","pedidos","clientes","caja"],
          ["cuentascorrientes","ventas","metricas","comercios"],
          ["maps","speeches","productos"],
        ].map((fila,i)=>(
          <div key={i} style={{display:"flex",borderBottom:i<2?`1px solid ${BO}`:"none"}}>
            {fila.map(key=>{
              const t=TABS.find(x=>x.key===key);
              if(!t)return null;
              return(
                <button key={key} onClick={()=>setTab(key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",gap:3,background:"none",border:"none",cursor:"pointer",color:tab===key?G:MU}}>
                  <span style={{width:26,height:26,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:tab===key?GLT:"transparent",transition:"background 0.15s"}}>{React.cloneElement(t.icon,{width:18,height:18})}</span>
                  <span style={{fontSize:10,fontWeight:700}}>{t.label}</span>
                </button>
              );
            })}
          </div>
        ))}
      </div>
 
      <style>{`@media(min-width:768px){#sb{display:flex!important}#mn{margin-left:200px;padding-top:0!important}#tb{display:none!important}#bn{display:none!important}}`}</style>
    </div>
  );
}
 
// Login desactivado por ahora (ver nota en useFirebaseSync) — se renderiza <App/> directo.
// Para reactivar el login: ReactDOM.createRoot(document.getElementById("root")).render(<AppGate/>);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
