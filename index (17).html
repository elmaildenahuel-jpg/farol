      {/* Accesos rápidos */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        {[{tab:"comercios",icon:I.store,t:"Prospectos",s:"Sumar nuevas cuentas"},{tab:"speeches",icon:I.msg,t:"Speeches",s:"Copiar y mandar por WA"}].map(x=>(
          <button key={x.tab} onClick={()=>setTab(x.tab)} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,textAlign:"left",cursor:"pointer"}}>
            <div style={{color:G,marginBottom:8}}>{x.icon}</div><div style={{fontSize:14,fontWeight:600,color:CR}}>{x.t}</div><div style={{fontSize:12,color:MU,marginTop:2}}>{x.s}</div>
          </button>
        ))}
      </div>
 
      {/* Línea Farol */}
      <button onClick={()=>setTab("productos")} style={{width:"100%",background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",cursor:"pointer",textAlign:"left"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px 8px"}}><span style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.1em"}}>Catálogo de productos</span><span style={{fontSize:11,color:G,display:"flex",alignItems:"center",gap:4}}>{I.edit}Editar precios</span></div>
        {prods.map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderTop:`1px solid ${BO}`}}><div><div style={{fontSize:14,fontWeight:500,color:CR}}>{p.nombre}</div><div style={{fontSize:12,color:MU}}>{p.marca||"Farol"} · {p.envase||"PET"}{(p.promos||[]).length>0?` · ${p.promos.length} promo${p.promos.length>1?"s":""}`:""}</div></div><div className="bebas" style={{fontSize:18,color:G}}>{fmtARS(p.precio)}<span style={{fontSize:10,color:MU,fontWeight:400}}> /L</span></div></div>)}
      </button>
    </div>
  );
}
 
// ── CLIENTES ──────────────────────────────────────────────────────
function Clientes({clientes,setClientes,speeches,cal,prods}){
  const[q,setQ]=useState("");
  const[filtro,setFiltro]=useState("todos");
  const[orden,setOrden]=useState("reciente");
  const[showNew,setShowNew]=useState(false);
  const[sel,setSel]=useState(null);
  const filtered=useMemo(()=>clientes.filter(c=>{const t=q.toLowerCase();return!t||c.nombre.toLowerCase().includes(t)||c.zona.toLowerCase().includes(t)||c.rubro.toLowerCase().includes(t);}).filter(c=>filtro==="todos"||estadoC(c)===filtro).sort((a,b)=>{
    if(orden==="az")return a.nombre.localeCompare(b.nombre);
    if(orden==="deuda")return saldoCliente(b)-saldoCliente(a);
    const la=lastSale(a),lb=lastSale(b);return(lb?daysSince(lb.fecha):0)-(la?daysSince(la.fecha):0);
  }),[clientes,q,filtro,orden]);
  const selObj=clientes.find(c=>c.id===sel);
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Clientes</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <div style={{position:"relative",marginBottom:12}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38}} placeholder="Buscar por nombre, zona o rubro..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"activo",l:"Activos"},{k:"atencion",l:"Atención"},{k:"inactivo",l:"Inactivos"}].map(f=>(
          <button key={f.k} onClick={()=>setFiltro(f.k)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",border:`1px solid ${filtro===f.k?G:BO}`,background:filtro===f.k?G:"transparent",color:filtro===f.k?"#fff":MU}}>{f.l}</button>
        ))}
      </div>
      <div style={{marginBottom:16}}>
        <select value={orden} onChange={e=>setOrden(e.target.value)}>
          <option value="reciente">Ordenar: más recientes</option>
          <option value="az">Ordenar: A → Z</option>
          <option value="deuda">Ordenar: mayor deuda</option>
        </select>
      </div>
      {filtered.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:14}}>Sin clientes para mostrar.</p>:filtered.map(c=>{const e=EST[estadoC(c)];const ls=lastSale(c);const deuda=saldoCliente(c);return(
        <button key={c.id} onClick={()=>setSel(c.id)} style={{display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:"12px 16px",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:8}}>
          <div style={{width:38,height:38,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{iniciales(c.nombre)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:14,fontWeight:600,color:CR}}>{c.nombre}</span><span style={{color:MU}}>{I.chev}</span></div>
            <div style={{fontSize:12,color:MU,marginTop:2}}>{c.rubro} · {c.zona}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,background:e.c+"15"}}>
                <span style={{width:5,height:5,borderRadius:"50%",background:e.c}}/>
                <span style={{fontSize:11,fontWeight:600,color:e.c}}>{ls?`Hace ${daysSince(ls.fecha)} días`:e.l}</span>
              </div>
              {deuda>0&&<div style={{fontSize:11,fontWeight:700,color:"#E08070"}}>💰{fmtARS(deuda)}</div>}
            </div>
          </div>
        </button>
      );})}
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo cliente">
        <FormCliente onCancel={()=>setShowNew(false)} onSave={f=>{setClientes(p=>[...p,{id:uid(),...f,agenda:[],historial:[],ventas:[]}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!selObj} onClose={()=>setSel(null)} title={selObj?.nombre||""}>
        {selObj&&<DetalleCliente cliente={selObj} speeches={speeches} cal={cal} prods={prods} onUpdate={u=>setClientes(p=>p.map(c=>c.id===u.id?u:c))} onDelete={id=>{setClientes(p=>p.filter(c=>c.id!==id));setSel(null);}}/>}
      </Modal>
    </div>
  );
}
 
// ── COMERCIOS ─────────────────────────────────────────────────────
function Comercios({prospectos,setProspectos,onConvertir,speeches,prods}){
  const[q,setQ]=useState("");
  const[zona,setZona]=useState("");
  const[rubro,setRubro]=useState("");
  const[estadoF,setEstadoF]=useState("");
  const[tieneTel,setTieneTel]=useState(false);
  const[ordenar,setOrdenar]=useState("score");
  const[showNew,setShowNew]=useState(false);
  const[editing,setEditing]=useState(null);
  const[compartiendoId,setCompartiendoId]=useState(null);
  const compartirCatalogoDesdeComercios=async(prospectoId)=>{
    setCompartiendoId(prospectoId);
    try{ await compartirCatalogoPDF(prods||[]); }finally{ setCompartiendoId(null); }
  };
  const[spTarget,setSpTarget]=useState(null);
  const[expandido,setExpandido]=useState(null);
 
  const resultados=useMemo(()=>{
    const t=q.trim().toLowerCase();const terms=t?t.split(/\s+/):[];
    return prospectos.map(p=>{
      let qScore=0;
      if(terms.length){terms.forEach(term=>{if(p.nombre.toLowerCase().includes(term))qScore+=10;if(p.rubro.toLowerCase().includes(term))qScore+=8;if((p.zona||"").toLowerCase().includes(term))qScore+=6;if((p.direccion||"").toLowerCase().includes(term))qScore+=4;if((p.notas||"").toLowerCase().includes(term))qScore+=2;});}else qScore=1;
      const pass=(terms.length===0||qScore>0)&&(!zona||p.zona===zona)&&(!rubro||p.rubro===rubro)&&(!estadoF||p.estado===estadoF)&&(!tieneTel||!!p.telefono);
      return{...p,_qScore:qScore,_potScore:calcScore(p),_pass:pass};
    }).filter(p=>p._pass).sort((a,b)=>{
      if(ordenar==="score")return b._potScore-a._potScore;
      if(ordenar==="relevancia"&&t)return b._qScore-a._qScore;
      if(ordenar==="az")return a.nombre.localeCompare(b.nombre);
      if(ordenar==="estado")return ESTADOS_P.indexOf(a.estado)-ESTADOS_P.indexOf(b.estado);
      return b._potScore-a._potScore;
    });
  },[prospectos,q,zona,rubro,estadoF,tieneTel,ordenar]);
 
  const stats=useMemo(()=>({total:resultados.length,conTel:resultados.filter(p=>p.telefono).length,porC:resultados.filter(p=>p.estado==="Por contactar").length,enN:resultados.filter(p=>p.estado==="En negociación").length,avgScore:resultados.length?Math.round(resultados.reduce((s,p)=>s+p._potScore,0)/resultados.length):0}),[resultados]);
  const hayFiltros=q||zona||rubro||estadoF||tieneTel;
  const limpiar=()=>{setQ("");setZona("");setRubro("");setEstadoF("");setTieneTel(false);};
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Comercios</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <p style={{fontSize:12,color:MU,marginBottom:14}}>Prospección CABA y GBA · Recorrida con la Berlingo</p>
      <div style={{position:"relative",marginBottom:10}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38,paddingRight:q?36:12}} placeholder="Nombre, rubro, zona, dirección o nota..." value={q} onChange={e=>setQ(e.target.value)}/>
        {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:MU,padding:2}}>{I.x}</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <select value={zona} onChange={e=>setZona(e.target.value)}><option value="">Todas las zonas</option>{ZONAS.map(z=><option key={z} value={z}>{z}</option>)}</select>
        <select value={rubro} onChange={e=>setRubro(e.target.value)}><option value="">Todos los rubros</option>{RUBROS.map(r=><option key={r} value={r}>{r}</option>)}</select>
        <select value={estadoF} onChange={e=>setEstadoF(e.target.value)}><option value="">Todos los estados</option>{ESTADOS_P.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <select value={ordenar} onChange={e=>setOrdenar(e.target.value)}><option value="score">Ordenar: potencial</option><option value="relevancia">Ordenar: relevancia</option><option value="az">Ordenar: A → Z</option><option value="estado">Ordenar: estado</option></select>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:tieneTel?G:MU}}><input type="checkbox" checked={tieneTel} onChange={e=>setTieneTel(e.target.checked)} style={{width:14,height:14,accentColor:G}}/>Solo con teléfono</label>
        {hayFiltros&&<button onClick={limpiar} style={{fontSize:12,color:AM,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Limpiar filtros</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:16}}>
        {[{l:"Total",v:stats.total,c:CR},{l:"Con WA",v:stats.conTel,c:GR},{l:"Por cont.",v:stats.porC,c:AM},{l:"En neg.",v:stats.enN,c:G},{l:"Score prom.",v:stats.avgScore,c:scoreLabel(stats.avgScore).c}].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
            <div className="bebas" style={{fontSize:18,color:s.c}}>{s.v}</div>
            <div style={{fontSize:10,color:MU,textTransform:"uppercase",letterSpacing:"0.04em",marginTop:1}}>{s.l}</div>
          </div>
        ))}
      </div>
      {resultados.length===0?<div style={{textAlign:"center",padding:"48px 0"}}><div style={{color:MU,fontSize:14,marginBottom:8}}>Sin resultados.</div>{hayFiltros&&<button onClick={limpiar} style={{fontSize:13,color:G,background:"none",border:`1px solid ${G}44`,borderRadius:8,padding:"6px 14px",cursor:"pointer"}}>Limpiar filtros</button>}</div>
        :resultados.map(p=>{
          const isOpen=expandido===p.id;const sl=scoreLabel(p._potScore);
          return(
            <div key={p.id} style={{background:CA,border:`1px solid ${isOpen?G:BO}`,borderRadius:18,marginBottom:8,overflow:"hidden",transition:"border-color 0.2s"}}>
              <button onClick={()=>setExpandido(isOpen?null:p.id)} style={{width:"100%",display:"flex",alignItems:"center",background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
                <div style={{width:3,alignSelf:"stretch",background:PEST[p.estado],flexShrink:0}}/>
                <div style={{flex:1,padding:"12px 14px",display:"flex",alignItems:"flex-start",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0,marginTop:1}}>{iniciales(p.nombre)}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</div><div style={{fontSize:12,color:MU,marginTop:2}}>{p.rubro} · {p.zona}</div></div>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}><Pill color={PEST[p.estado]}>{p.estado}</Pill><span style={{color:MU,display:"flex",transform:isOpen?"rotate(90deg)":"none",transition:"transform 0.2s"}}>{I.chev}</span></div>
                    </div>
                    <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:10,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",whiteSpace:"nowrap"}}>Potencial</span><div style={{flex:1}}><ScoreBar score={p._potScore}/></div><span style={{fontSize:12,fontWeight:700,color:sl.c,whiteSpace:"nowrap"}}>{sl.l}</span></div>
                  </div>
                </div>
              </button>
              {isOpen&&(
                <div style={{borderTop:`1px solid ${BO}`,padding:"14px 16px"}}>
                  <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px",marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10,display:"flex",justifyContent:"space-between"}}><span>Desglose de score</span><span style={{color:sl.c}}>{p._potScore}/100</span></div>
                    {[{l:"Rubro",v:RUBRO_SCORE[p.rubro]||6,max:22,hint:p.rubro},{l:"Zona",v:ZONA_SCORE[p.zona]||10,max:18,hint:p.zona},{l:"Estado",v:ESTADO_SCORE[p.estado]||0,max:20,hint:p.estado},{l:"Teléfono",v:p.telefono?15:0,max:15,hint:p.telefono?"Cargado":"Sin cargar"},{l:"Notas",v:p.notas&&p.notas.length>30?5:p.notas?2:0,max:5,hint:p.notas?"Completas":"Sin notas"}].map(row=>(
                      <div key={row.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                        <span style={{fontSize:12,color:MU,width:64,flexShrink:0}}>{row.l}</span>
                        <div style={{flex:1,height:3,background:BO,borderRadius:2}}><div style={{width:`${(row.v/row.max)*100}%`,height:"100%",background:G,borderRadius:2}}/></div>
                        <span style={{fontSize:12,fontWeight:600,color:CR,width:28,textAlign:"right",flexShrink:0}}>{row.v}/{row.max}</span>
                        <span style={{fontSize:11,color:MU,width:80,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.hint}</span>
                      </div>
                    ))}
                  </div>
                  {p.direccion&&<div style={{fontSize:12,color:MU,display:"flex",alignItems:"center",gap:4,marginBottom:8}}>{I.map}{p.direccion}</div>}
                  {p.telefono&&<div style={{fontSize:12,color:GR,display:"flex",alignItems:"center",gap:4,marginBottom:8}}>{I.phone}{p.telefono}</div>}
                  {p.notas&&<div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px",marginBottom:12}}><div style={{fontSize:10,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Notas</div><div style={{fontSize:13,color:"#A89682",lineHeight:1.6}}>{p.notas}</div></div>}
                  {/* Historial de contactos del prospecto */}
                  <div style={{borderTop:`1px solid ${BO}`,paddingTop:12,marginBottom:12}}>
                    <HistorialAgenda
                      entidad={p}
                      agenda={p.agenda||[]}
                      historial={p.historial||[]}
                      cal={{calToken:null,calError:"",login:()=>{},crearEvento:async()=>false}}
                      onAgregarAgenda={ev=>setProspectos(prev=>prev.map(x=>x.id===p.id?{...x,agenda:[...(x.agenda||[]),ev]}:x))}
                      onAgregarContacto={c=>setProspectos(prev=>prev.map(x=>x.id===p.id?{...x,historial:[...(x.historial||[]),c]}:x))}
                    />
                  </div>
                  <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:G,display:"flex",alignItems:"center",gap:6}}>
                    {I.zap}
                    {p.estado==="Por contactar"&&!p.telefono&&"Conseguí el teléfono para sumar +15 pts."}
                    {p.estado==="Por contactar"&&p.telefono&&"Listo para primer contacto."}
                    {p.estado==="Contactado"&&"Ya tuviste contacto. Pasalo a 'En negociación' si mostró interés."}
                    {p.estado==="En negociación"&&"Prioridad alta. Confirmá pedido y convertilo."}
                    {p.estado==="Descartado"&&"Descartado. Podés actualizarlo si cambia."}
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    <button onClick={()=>setEditing(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:MU,background:"none",border:`1px solid ${BO}`}}>{I.edit}Editar</button>
                    <button onClick={()=>compartirCatalogoDesdeComercios(p.id)} disabled={compartiendoId===p.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:compartiendoId===p.id?"not-allowed":"pointer",color:G,background:"none",border:`1px solid ${G}44`,opacity:compartiendoId===p.id?0.6:1}}>{I.share}{compartiendoId===p.id?"...":"Catálogo"}</button>
                    {p.telefono&&<>
                      <a href={`https://wa.me/${p.telefono}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:6,background:"#25D36615",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none"}}>{I.wa}WA directo</a>
                      <button onClick={()=>setSpTarget(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",background:G+"20",color:G,border:`1px solid ${G}44`}}>{I.msg}Speech → WA</button>
                    </>}
                    <button onClick={()=>onConvertir(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:GR,background:"none",border:`1px solid ${GR}44`,marginLeft:"auto"}}>{I.plus}→ Cliente</button>
                    <button onClick={()=>{if(window.confirm(`¿Eliminar "${p.nombre}"? Esta acción no se puede deshacer.`)){setProspectos(prev=>prev.filter(x=>x.id!==p.id));setExpandido(null);}}} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,padding:"7px 10px",borderRadius:6,cursor:"pointer",color:RE,background:"none",border:`1px solid ${RE}44`}}>{I.trash}</button>
                  </div>
                </div>
              )}
            </div>
          );
        })
      }
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo comercio">
        <FormProspecto onCancel={()=>setShowNew(false)} onSave={f=>{setProspectos(p=>[...p,{id:uid(),...f}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!editing} onClose={()=>setEditing(null)} title="Editar comercio">
        {editing&&<FormProspecto initial={editing} onCancel={()=>setEditing(null)} onSave={f=>{setProspectos(p=>p.map(x=>x.id===editing.id?{...x,...f}:x));setEditing(null);}}/>}
      </Modal>
      <SpeechPicker open={!!spTarget} onClose={()=>setSpTarget(null)} speeches={speeches} telefono={spTarget?.telefono} nombre={spTarget?.nombre||""}/>
    </div>
  );
}
 
// ── PEDIDOS ───────────────────────────────────────────────────────
function Pedidos({pedidos,setPedidos,clientes,setClientes,prods,setProds}){
  const[showNew,setShowNew]=useState(false);
  // Cabecera del pedido
  const[clienteId,setClienteId]=useState("");
  const[fechaEntrega,setFechaEntrega]=useState(hoyISO());
  const[horaEntrega,setHoraEntrega]=useState("10:00");
  const[pagado,setPagado]=useState(false);
  const[notas,setNotas]=useState("");
  const[comisionPct,setComisionPct]=useState("");
  // Líneas del pedido (multi-producto)
  const[lineas,setLineas]=useState([{id:uid(),productoId:"rubia",cantidad:"",monto:""}]);
 
  const resetForm=()=>{
    setClienteId("");setFechaEntrega(hoyISO());setHoraEntrega("10:00");setPagado(false);setNotas("");setComisionPct("");
    setLineas([{id:uid(),productoId:"rubia",cantidad:"",monto:""}]);
  };
 
  const agregarLinea=()=>setLineas(prev=>[...prev,{id:uid(),productoId:"ipa",cantidad:"",monto:""}]);
  const quitarLinea=id=>setLineas(prev=>prev.filter(l=>l.id!==id));
  const updateLinea=(id,campo,valor)=>setLineas(prev=>prev.map(l=>{
    if(l.id!==id)return l;
    const updated={...l,[campo]:valor};
    // Auto-calcular monto si cambia cantidad o producto
    if(campo==="cantidad"||campo==="productoId"){
      const prod=prods.find(p=>p.id===(campo==="productoId"?valor:l.productoId));
      const cant=Number(campo==="cantidad"?valor:l.cantidad);
      if(prod&&cant>0) updated.monto=String(montoTotal(prod,cant));
    }
    return updated;
  }));
 
  const totalPedido=lineas.reduce((s,l)=>s+Number(l.monto||0),0);
  const totalLitros=lineas.reduce((s,l)=>s+Number(l.cantidad||0),0);
  const lineasValidas=lineas.filter(l=>l.cantidad&&Number(l.cantidad)>0);
  const gananciaEstimadaPedido=comisionPct?Math.round(totalPedido*Number(comisionPct)/100):0;
 
  const confirmarPedido=()=>{
    if(!clienteId||lineasValidas.length===0)return;
    const nuevoPedido={
      id:uid(),clienteId,fechaEntrega,horaEntrega,pagado,notas,comisionPct:Number(comisionPct)||0,
      lineas:lineasValidas.map(l=>({...l,cantidad:Number(l.cantidad),monto:Number(l.monto||0)})),
      montoTotal:totalPedido,
      estado:"pendiente",creadoEn:new Date().toISOString()
    };
    setPedidos(p=>[nuevoPedido,...p]);
    setShowNew(false);
    resetForm();
  };
 
  const marcarEntregado=(pedidoId)=>{
    const ped=pedidos.find(p=>p.id===pedidoId);
    if(!ped)return;
    // Registrar una venta por cada línea del pedido
    setClientes(prev=>prev.map(c=>{
      if(c.id!==ped.clienteId)return c;
      const nuevasVentas=(ped.lineas||[]).map(l=>({
        id:uid(),fecha:ped.fechaEntrega,producto:l.productoId,
        cantidad:l.cantidad,monto:l.monto,pagado:ped.pagado,comisionPct:ped.comisionPct||0
      }));
      return{...c,ventas:[...c.ventas,...nuevasVentas]};
    }));
    setPedidos(prev=>prev.map(p=>p.id===pedidoId?{...p,estado:"entregado"}:p));
  };
 
  const pendientes=pedidos.filter(p=>p.estado==="pendiente").sort((a,b)=>a.fechaEntrega.localeCompare(b.fechaEntrega));
  const entregados=pedidos.filter(p=>p.estado==="entregado").sort((a,b)=>b.fechaEntrega.localeCompare(a.fechaEntrega)).slice(0,10);

  const[seleccionRuta,setSeleccionRuta]=useState(()=>new Set());
  const toggleRuta=id=>setSeleccionRuta(prev=>{const next=new Set(prev);next.has(id)?next.delete(id):next.add(id);return next;});
  const abrirRuta=()=>{
    const seleccionados=pendientes.filter(p=>seleccionRuta.has(p.id)).sort((a,b)=>a.horaEntrega.localeCompare(b.horaEntrega));
    const paradas=seleccionados.map(p=>{
      const cliente=clientes.find(c=>c.id===p.clienteId);
      return{pedido:p,cliente,direccion:cliente&&cliente.direccion?cliente.direccion.trim():""};
    });
    const conDireccion=paradas.filter(x=>x.direccion);
    const sinDireccion=paradas.filter(x=>!x.direccion);
    if(conDireccion.length===0){
      alert("Ninguno de los clientes seleccionados tiene dirección cargada. Agregá la dirección en la ficha del cliente para poder rutear.");
      return;
    }
    if(sinDireccion.length>0){
      const nombres=sinDireccion.map(x=>x.cliente?x.cliente.nombre:"Cliente eliminado").join(", ");
      alert(`Estos clientes no tienen dirección cargada y quedan afuera de la ruta:\n\n${nombres}`);
    }
    const direcciones=conDireccion.map(x=>encodeURIComponent(x.direccion));
    const destino=direcciones[direcciones.length-1];
    const waypoints=direcciones.slice(0,-1).join("|");
    let url=`https://www.google.com/maps/dir/?api=1&destination=${destino}&travelmode=driving`;
    if(waypoints)url+=`&waypoints=${waypoints}`;
    window.open(url,"_blank");
  };
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Pedidos</span>
        <Btn onClick={()=>{resetForm();setShowNew(true);}} small>{I.plus}Nuevo</Btn>
      </div>
 
      {pendientes.length===0
        ?<div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:24,textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:14,color:MU,marginBottom:8}}>Sin entregas pendientes</div>
          <Btn onClick={()=>setShowNew(true)}>{I.plus}Cargar primer pedido</Btn>
        </div>
        :<div style={{marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}}>
            <div style={{fontSize:12,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em"}}>Pendientes de entrega ({pendientes.length})</div>
            {seleccionRuta.size>0&&(
              <button onClick={abrirRuta} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:20,background:G,color:"#fff",border:"none",fontSize:12,fontWeight:700,cursor:"pointer"}}>{I.map}Rutear ({seleccionRuta.size})</button>
            )}
          </div>
          {pendientes.map(p=>{
            const cliente=clientes.find(c=>c.id===p.clienteId);
            const nombreCliente=cliente?cliente.nombre:"Cliente eliminado";
            const esHoy=p.fechaEntrega===hoyISO();
            const lineas=p.lineas||[];
            const enRuta=seleccionRuta.has(p.id);
            return(
              <div key={p.id} style={{background:CA,border:`1px solid ${enRuta?G:esHoy?G+"55":BO}`,borderRadius:18,padding:14,marginBottom:10,boxShadow:esHoy?`0 2px 8px ${G}22`:"0 1px 3px rgba(0,0,0,0.04)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                    <button onClick={()=>toggleRuta(p.id)} title="Incluir en ruta de reparto" style={{width:22,height:22,borderRadius:6,border:`2px solid ${enRuta?G:BO}`,background:enRuta?G:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer",padding:0}}>
                      {enRuta&&<span style={{color:"#fff",display:"flex"}}>{React.cloneElement(I.check,{width:12,height:12})}</span>}
                    </button>
                    <div style={{width:40,height:40,borderRadius:"50%",background:G+"1a",color:G,border:`1px solid ${G}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,flexShrink:0}}>{iniciales(nombreCliente)}</div>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:700,color:CR,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nombreCliente}</div>
                      <div style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:4,padding:"2px 8px",borderRadius:20,background:esHoy?G+"1a":BG,border:`1px solid ${esHoy?G+"44":BO}`}}>
                        <span style={{fontSize:11,fontWeight:esHoy?700:500,color:esHoy?G:MU}}>{esHoy?"⏰ HOY":fmtDate(p.fechaEntrega)}{" · "+p.horaEntrega+"hs"}</span>
                      </div>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div className="bebas" style={{fontSize:19,color:CR}}>{fmtARS(p.montoTotal||0)}</div>
                    <div style={{display:"inline-block",marginTop:3,padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700,background:p.pagado?GR+"1a":AM+"1a",color:p.pagado?GR:AM}}>{p.pagado?"Pagado":"Cta. corriente"}</div>
                  </div>
                </div>
                {/* Líneas del pedido */}
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"8px 12px",marginBottom:10}}>
                  {lineas.map((l,idx)=>{
                    const prod=prods.find(x=>x.id===l.productoId);
                    return(
                      <div key={l.id||idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:idx<lineas.length-1?6:0,marginBottom:idx<lineas.length-1?6:0,borderBottom:idx<lineas.length-1?`1px solid ${BO}`:"none"}}>
                        <span style={{fontSize:13,color:CR}}>{prod?prod.nombre:l.productoId}</span>
                        <div style={{display:"flex",gap:12,alignItems:"center"}}>
                          <span style={{fontSize:12,color:MU}}>{l.cantidad}L</span>
                          <span style={{fontSize:13,fontWeight:600,color:CR}}>{fmtARS(l.monto||0)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {p.notas&&<div style={{fontSize:12,color:"#A89682",marginBottom:10}}>{p.notas}</div>}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>marcarEntregado(p.id)} style={{flex:1,minHeight:44,padding:"9px 0",borderRadius:22,background:GR,color:"#fff",border:"none",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{I.check} Marcar entregado</button>
                  {cliente&&cliente.telefono?(
                    <a href={waLink(cliente.telefono,mensajePedido(p,nombreCliente,prods))} target="_blank" rel="noreferrer" title="Enviar pedido por WhatsApp" style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:"#25D36615",color:"#25D366",border:"1px solid #25D36640",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none"}}>{I.wa}</a>
                  ):(
                    <span title="Cliente sin teléfono cargado" style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:BG,color:MU,border:`1px solid ${BO}`,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>{I.wa}</span>
                  )}
                  <button onClick={()=>{if(window.confirm("¿Cancelar este pedido?"))setPedidos(prev=>prev.map(x=>x.id===p.id?{...x,estado:"cancelado"}:x));}} style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:"none",color:RE,border:`1px solid ${RE}44`,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.trash}</button>
                </div>
              </div>
            );
          })}
        </div>
      }
 
      {entregados.length>0&&(
        <div>
          <div style={{fontSize:12,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Últimas entregas</div>
          {entregados.map(p=>{
            const cliente=clientes.find(c=>c.id===p.clienteId);
            const nombreCliente=cliente?cliente.nombre:"—";
            const lineas=p.lineas||[];
            return(
              <div key={p.id} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:"10px 12px",marginBottom:6,opacity:0.75,display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:GR+"14",color:GR,border:`1px solid ${GR}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{iniciales(nombreCliente)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{fontSize:13,fontWeight:600,color:CR,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nombreCliente}</div>
                    <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}><div style={{fontSize:13,color:CR}}>{fmtARS(p.montoTotal||0)}</div><div style={{fontSize:10,color:GR}}>Entregado · {fmtDate(p.fechaEntrega)}</div></div>
                  </div>
                  <div style={{fontSize:11,color:MU,marginTop:2}}>{lineas.map(l=>{const prod=prods.find(x=>x.id===l.productoId);return`${l.cantidad}L ${prod?prod.nombre:l.productoId}`;}).join(" + ")}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
 
      <Modal open={showNew} onClose={()=>{setShowNew(false);resetForm();}} title="Nuevo pedido">
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {/* Cliente */}
          <div><Lbl t="Cliente"/><select value={clienteId} onChange={e=>{const id=e.target.value;setClienteId(id);const c=clientes.find(x=>x.id===id);if(c&&c.comisionPctDefault)setComisionPct(String(c.comisionPctDefault));}}><option value="">Seleccioná un cliente</option>{clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select></div>
 
          {/* Líneas de productos */}
          <div>
            <Lbl t="Productos del pedido"/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {lineas.map((l,idx)=>{
                const prod=prods.find(p=>p.id===l.productoId);
                const sug=l.cantidad&&prod?montoTotal(prod,Number(l.cantidad)):null;
                return(
                  <div key={l.id} style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:12,fontWeight:700,color:MU}}>Ítem {idx+1}</span>
                      {lineas.length>1&&<button onClick={()=>quitarLinea(l.id)} style={{background:"none",border:"none",cursor:"pointer",color:RE,padding:2}}>{I.trash}</button>}
                    </div>
                    <div style={{marginBottom:8}}>
                      <select value={l.productoId} onChange={e=>updateLinea(l.id,"productoId",e.target.value)}>
                        {prods.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
                      </select>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                      <div>
                        <Lbl t="Cantidad (L)"/>
                        <input type="number" inputMode="numeric" value={l.cantidad} onChange={e=>updateLinea(l.id,"cantidad",e.target.value)} placeholder="12"/>
                      </div>
                      <div>
                        <Lbl t="Monto ARS"/>
                        <input type="number" inputMode="numeric" value={l.monto} onChange={e=>updateLinea(l.id,"monto",e.target.value)} placeholder={sug||"0"}/>
                        {sug&&!l.monto&&<div style={{fontSize:10,color:G,marginTop:2}}>Sug: {fmtARS(sug)}</div>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={agregarLinea} style={{width:"100%",marginTop:8,padding:"9px 0",borderRadius:8,background:"none",border:`1px dashed ${G}44`,color:G,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{I.plus}Agregar otro producto</button>
          </div>
 
          {/* Total */}
          {totalPedido>0&&(
            <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:13,color:MU}}>Total del pedido · {totalLitros}L</span>
              <span className="bebas" style={{fontSize:20,color:G}}>{fmtARS(totalPedido)}</span>
            </div>
          )}
 
          {/* Fecha y hora */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Lbl t="Fecha de entrega"/><input type="date" value={fechaEntrega} onChange={e=>setFechaEntrega(e.target.value)}/></div>
            <div><Lbl t="Hora estimada"/><input type="time" value={horaEntrega} onChange={e=>setHoraEntrega(e.target.value)}/></div>
          </div>
 
          {/* Pago */}
          <div><Lbl t="¿Se cobra al momento de la entrega?"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <button onClick={()=>setPagado(true)} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${pagado?GR:BO}`,background:pagado?GR+"22":"transparent",color:pagado?GR:MU,fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Pagado</button>
              <button onClick={()=>setPagado(false)} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${!pagado?AM:BO}`,background:!pagado?AM+"22":"transparent",color:!pagado?AM:MU,fontSize:13,fontWeight:700,cursor:"pointer"}}>Cuenta corriente</button>
            </div>
          </div>

          {/* Ganancia */}
          <div><Lbl t="% de ganancia (comisión sobre este pedido)"/><input type="number" inputMode="numeric" value={comisionPct} onChange={e=>setComisionPct(e.target.value)} placeholder="Ej: 15"/>{gananciaEstimadaPedido>0&&<div style={{fontSize:11,color:G,marginTop:4}}>Ganancia estimada: {fmtARS(gananciaEstimadaPedido)}</div>}</div>
 
          <div><Lbl t="Notas (opcional)"/><textarea rows={2} value={notas} onChange={e=>setNotas(e.target.value)} placeholder="Alguna aclaración para la entrega..."/></div>
          <div style={{display:"flex",gap:8,paddingTop:4}}>
            <Btn variant="ghost" onClick={()=>{setShowNew(false);resetForm();}}>Cancelar</Btn>
            <Btn variant="green" onClick={confirmarPedido} disabled={!clienteId||lineasValidas.length===0}>{I.box}Confirmar pedido</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}
 
// ── PRODUCTOS ─────────────────────────────────────────────────────
function Productos({prods,setProds}){
  const[editId,setEditId]=useState(null);
  const[ef,setEf]=useState(null);
  const[showPromo,setShowPromo]=useState(null);
  const[pf,setPf]=useState({minCantidad:"",precioUnitario:""});
 
  const[showHist,setShowHist]=useState(null);
  const[showNewProd,setShowNewProd]=useState(false);
  const[np,setNp]=useState({nombre:"",precio:"",marca:"",envase:"PET",descripcion:""});
  const[exportando,setExportando]=useState(false);

  const compartirCatalogo=async()=>{
    setExportando(true);
    try{ await compartirCatalogoPDF(prods); }finally{ setExportando(false); }
  };

  const crearProducto=()=>{
    const nombre=(np.nombre||"").trim();
    const precio=Number(np.precio);
    if(!nombre||!precio||precio<=0)return;
    const nuevoId=uid();
    setProds(prev=>[...prev,{
      id:nuevoId,nombre,precio,
      marca:(np.marca||"").trim(),envase:np.envase||"PET",descripcion:(np.descripcion||"").trim(),
      promos:[],historialPrecios:[],
    }]);
    setNp({nombre:"",precio:"",marca:"",envase:"PET",descripcion:""});
    setShowNewProd(false);
  };

  const startEdit=p=>{setEditId(p.id);setEf({...p});};
  const saveEdit=()=>{
    setProds(prev=>prev.map(p=>{
      if(p.id!==editId)return p;
      const precioAnterior=Number(p.precio)||0;
      const precioIngresado=Number(ef.precio);
      const precioValido=!isNaN(precioIngresado)&&precioIngresado>0;
      const precioNuevo=precioValido?precioIngresado:precioAnterior;
      const historialPrecios=p.historialPrecios||[];
      const huboCambio=precioValido&&precioNuevo!==precioAnterior;
      return{
        ...ef,
        precio:precioNuevo,
        historialPrecios:huboCambio
          ?[{id:uid(),precioAnterior,precioNuevo,fecha:new Date().toISOString()},...historialPrecios]
          :historialPrecios,
      };
    }));
    setEditId(null);
  };
  const agregarPromo=prodId=>{
    if(!pf.minCantidad||!pf.precioUnitario)return;
    setProds(prev=>prev.map(p=>p.id===prodId?{...p,promos:[...(p.promos||[]),{id:uid(),minCantidad:Number(pf.minCantidad),precioUnitario:Number(pf.precioUnitario)}].sort((a,b)=>a.minCantidad-b.minCantidad)}:p));
    setPf({minCantidad:"",precioUnitario:""});setShowPromo(null);
  };
  const eliminarPromo=(prodId,promoId)=>setProds(prev=>prev.map(p=>p.id===prodId?{...p,promos:(p.promos||[]).filter(pr=>pr.id!==promoId)}:p));
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:10}}>
        <div>
          <span className="bebas" style={{fontSize:28,color:CR,display:"block"}}>Productos</span>
          <p style={{fontSize:12,color:MU}}>Precios y promos por volumen</p>
        </div>
        <div style={{display:"flex",gap:8,flexShrink:0}}>
          <Btn onClick={compartirCatalogo} small variant="ghost" disabled={exportando||prods.length===0}>{I.share}{exportando?"...":"Catálogo"}</Btn>
          <Btn onClick={()=>{setNp({nombre:"",precio:"",marca:"",envase:"PET",descripcion:""});setShowNewProd(true);}} small>{I.plus}Nuevo</Btn>
        </div>
      </div>
      <div style={{marginBottom:16}}/>
      {prods.map(p=>(
        <div key={p.id} style={{background:CA,border:`1px solid ${editId===p.id?G:BO}`,borderRadius:18,padding:16,marginBottom:12}}>
          {editId===p.id?(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div><Lbl t="Nombre"/><input value={ef.nombre} onChange={e=>setEf(x=>({...x,nombre:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><Lbl t="Marca"/><input value={ef.marca||""} onChange={e=>setEf(x=>({...x,marca:e.target.value}))} placeholder="Ej: Farol"/></div>
                <div><Lbl t="Envase"/><select value={ef.envase||"PET"} onChange={e=>setEf(x=>({...x,envase:e.target.value}))}>{ENVASES.map(v=><option key={v}>{v}</option>)}</select></div>
              </div>
              <div><Lbl t="Precio base (ARS/L)"/><input type="number" value={ef.precio} onChange={e=>setEf(x=>({...x,precio:e.target.value}))}/></div>
              <div><Lbl t="Descripción corta (estilo, sabor)"/><input value={ef.descripcion||""} onChange={e=>setEf(x=>({...x,descripcion:e.target.value}))} placeholder="Ej: Rubia liviana, notas cítricas, 5% ABV" maxLength={90}/></div>

                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                    <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.08em"}}>Precio base</div>
                    {(p.historialPrecios||[]).length>0&&(
                      <button onClick={()=>setShowHist(showHist===p.id?null:p.id)} title="Ver historial de precios" style={{background:"none",border:"none",cursor:"pointer",color:showHist===p.id?G:MU,padding:2,display:"flex",alignItems:"center"}}>
                        {I.clock}

                  <div className="bebas" style={{fontSize:22,color:G}}>{fmtARS(p.precio)}<span style={{fontSize:12,color:MU,fontWeight:400}}> /L</span></div>
                </div>
              </div>
              {/* Historial de precios */}
              {showHist===p.id&&(
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:12,marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,display:"flex",alignItems:"center",gap:5}}>{I.clock}Historial de precios</div>
                  {(p.historialPrecios||[]).length===0?(
                    <p style={{fontSize:12,color:MU,fontStyle:"italic"}}>Sin cambios registrados.</p>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:220,overflowY:"auto"}}>
                      {(p.historialPrecios||[]).map(h=>{
                        const anterior=Number(h.precioAnterior)||0,nuevo=Number(h.precioNuevo)||0;
                        const subio=nuevo>anterior;
                        return(
                          <div key={h.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:SU,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px"}}>
                            <div style={{fontSize:12,color:MU}}>{fmtDateTime(h.fecha)}</div>
                            <div style={{fontSize:13,fontWeight:600,color:CR,display:"flex",alignItems:"center",gap:5}}>
                              <span style={{color:MU,textDecoration:"line-through"}}>{fmtARS(anterior)}</span>
                              <span style={{color:subio?RE:GR}}>→ {fmtARS(nuevo)}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
              {/* Promos por volumen */}
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Precios por volumen</div>
                {(p.promos||[]).length===0?<p style={{fontSize:12,color:MU,fontStyle:"italic"}}>Sin promos configuradas.</p>:(p.promos||[]).map(pr=>(
                  <div key={pr.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                    <span style={{fontSize:13,color:CR}}>Desde {pr.minCantidad}L → {fmtARS(pr.precioUnitario)}/L</span>
                    <button onClick={()=>eliminarPromo(p.id,pr.id)} style={{background:"none",border:"none",cursor:"pointer",color:RE,padding:4}}>{I.trash}</button>
                  </div>
                ))}
                {showPromo===p.id?(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginTop:8}}>
                    <div><Lbl t="Desde (L)"/><input type="number" value={pf.minCantidad} onChange={e=>setPf(x=>({...x,minCantidad:e.target.value}))} placeholder="48"/></div>
                    <div><Lbl t="Precio/L"/><input type="number" value={pf.precioUnitario} onChange={e=>setPf(x=>({...x,precioUnitario:e.target.value}))} placeholder="1400"/></div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:6}}>
                      <button onClick={()=>agregarPromo(p.id)} style={{padding:"10px 12px",borderRadius:8,background:G,color:"#fff",border:"none",fontWeight:700,cursor:"pointer"}}>{I.check}</button>
                      <button onClick={()=>setShowPromo(null)} style={{padding:"10px 10px",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,cursor:"pointer"}}>{I.x}</button>
                    </div>
                  </div>
                ):(
                  <button onClick={()=>setShowPromo(p.id)} style={{marginTop:8,fontSize:12,color:G,background:"none",border:`1px dashed ${G}44`,borderRadius:8,padding:"7px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>{I.plus}Agregar precio por volumen</button>
                )}
              </div>
            </>
          )}
        </div>
      ))}
      <Modal open={showNewProd} onClose={()=>setShowNewProd(false)} title="Nuevo producto">
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><Lbl t="Nombre"/><input value={np.nombre} onChange={e=>setNp(x=>({...x,nombre:e.target.value}))} placeholder="Ej: Stout Malandra" autoFocus/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Lbl t="Marca"/><input value={np.marca} onChange={e=>setNp(x=>({...x,marca:e.target.value}))} placeholder="Ej: Farol"/></div>
            <div><Lbl t="Envase"/><select value={np.envase} onChange={e=>setNp(x=>({...x,envase:e.target.value}))}>{ENVASES.map(v=><option key={v}>{v}</option>)}</select></div>
          </div>
          <div><Lbl t="Precio base (ARS/L)"/><input type="number" inputMode="numeric" value={np.precio} onChange={e=>setNp(x=>({...x,precio:e.target.value}))} placeholder="1500"/></div>
          <div><Lbl t="Descripción corta (estilo, sabor)"/><input value={np.descripcion} onChange={e=>setNp(x=>({...x,descripcion:e.target.value}))} placeholder="Ej: Rubia liviana, notas cítricas, 5% ABV" maxLength={90}/></div>
          <div style={{display:"flex",gap:8,paddingTop:4}}>
            <Btn variant="ghost" onClick={()=>setShowNewProd(false)}>Cancelar</Btn>
            <Btn onClick={crearProducto} disabled={!np.nombre.trim()||!np.precio||Number(np.precio)<=0}>{I.plus}Crear producto</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}
 
// ── BUSCADOR MAPS ─────────────────────────────────────────────────
function BuscadorMaps({prospectos,setProspectos}){
  const[modo,setModo]=useState("zona");
  const[tipo,setTipo]=useState("");
  const[zona,setZona]=useState("");
  const[radioM,setRadioM]=useState(1000);
  const[busqueda,setBusqueda]=useState("");
  const[loading,setLoading]=useState(false);
  const[resultados,setResultados]=useState([]);
  const[nextToken,setNextToken]=useState(null);
  const[loadingMore,setLoadingMore]=useState(false);
  const[error,setError]=useState("");
  const[gpsPos,setGpsPos]=useState(null);
  const[gpsLabel,setGpsLabel]=useState("");
  const[agregados,setAgregados]=useState({});
  const svcRef=React.useRef(null);
  const yaEnCRM=useMemo(()=>new Set(prospectos.map(p=>p._placeId).filter(Boolean)),[prospectos]);
 
  React.useEffect(()=>{
    if(window.google&&!svcRef.current){
      try{const div=document.createElement("div");const map=new window.google.maps.Map(div);svcRef.current=new window.google.maps.places.PlacesService(map);}
      catch(e){console.warn("Places init falló:",e);}
    }
  },[]);
 
  const ZONAS_COORDS={
    "Palermo, Buenos Aires":{lat:-34.5883,lng:-58.4269},"Villa Crespo, Buenos Aires":{lat:-34.5999,lng:-58.4398},
    "Almagro, Buenos Aires":{lat:-34.6088,lng:-58.4218},"Caballito, Buenos Aires":{lat:-34.6196,lng:-58.4411},
    "Flores, Buenos Aires":{lat:-34.6298,lng:-58.4634},"Belgrano, Buenos Aires":{lat:-34.5614,lng:-58.4573},
    "San Telmo, Buenos Aires":{lat:-34.6218,lng:-58.3732},"Boedo, Buenos Aires":{lat:-34.6268,lng:-58.4209},
    "Paternal, Buenos Aires":{lat:-34.5961,lng:-58.4731},"San Isidro, GBA Norte":{lat:-34.4731,lng:-58.5273},
    "Lomas de Zamora, GBA Sur":{lat:-34.7583,lng:-58.3994},"Ramos Mejía, GBA Oeste":{lat:-34.6462,lng:-58.5643},
    "Avellaneda, GBA Sur":{lat:-34.6607,lng:-58.3657},"Quilmes, GBA Sur":{lat:-34.7206,lng:-58.2537},
  };
  const TIPOS_LIST=["pizzería","bar","parrilla","kiosco","almacén","restaurante","bodegón","autoservicio"];
  const ZONAS_LIST=Object.keys(ZONAS_COORDS);
 
  function buscarPorZona(){
    if(!svcRef.current)return;
    setLoading(true);setError("");setResultados([]);setNextToken(null);
    const query=busqueda.trim()||`${tipo||"comercio"} en ${zona||"Buenos Aires"}`;
    const coords=ZONAS_COORDS[zona]||{lat:-34.6037,lng:-58.3816};
    svcRef.current.textSearch({query,location:new window.google.maps.LatLng(coords.lat,coords.lng),radius:5000},(results,status,pagination)=>{
      setLoading(false);
      if(status==="OK"){setResultados(results);setNextToken(pagination?.hasNextPage?pagination:null);}
      else setError("Sin resultados. Probá otra búsqueda o zona.");
    });
  }
  function buscarCerca(){
    if(!gpsPos){activarGPS();return;}
    if(!svcRef.current)return;
    setLoading(true);setError("");setResultados([]);setNextToken(null);
    svcRef.current.nearbySearch({location:new window.google.maps.LatLng(gpsPos.lat,gpsPos.lng),radius:radioM,keyword:tipo||"restaurante"},(results,status,pagination)=>{
      setLoading(false);
      if(status==="OK"){setResultados(results);setNextToken(pagination?.hasNextPage?pagination:null);}
      else setError("Sin resultados cerca. Probá aumentar el radio.");
    });
  }
  function cargarMas(){
    if(!nextToken)return;setLoadingMore(true);
    setTimeout(()=>{nextToken.nextPage((results,status,pagination)=>{setLoadingMore(false);if(status==="OK"){setResultados(prev=>[...prev,...results]);setNextToken(pagination?.hasNextPage?pagination:null);}else setNextToken(null);});},2000);
  }
  function activarGPS(){
    if(!navigator.geolocation){setError("Tu dispositivo no soporta GPS.");return;}
    setLoading(true);
    navigator.geolocation.getCurrentPosition(pos=>{
      const{latitude:lat,longitude:lng}=pos.coords;setGpsPos({lat,lng});
      const gc=new window.google.maps.Geocoder();gc.geocode({location:{lat,lng}},(res,st)=>{if(st==="OK"&&res[0])setGpsLabel(res[0].formatted_address);else setGpsLabel(`${lat.toFixed(4)}, ${lng.toFixed(4)}`);});
      setLoading(false);
    },()=>{setLoading(false);setError("No se pudo obtener la ubicación. Activá el GPS.");});
  }
  function buscar(){if(modo==="zona")buscarPorZona();else buscarCerca();}
  function agregarProspecto(lugar){
    const dir=lugar.formatted_address||lugar.vicinity||"";
    const zonaDetectada=Object.keys(ZONAS_COORDS).find(z=>dir.toLowerCase().includes(z.split(",")[0].toLowerCase()))||"CABA Centro";
    const types=lugar.types||[];let rubro="Otro";
    if(types.includes("bar"))rubro="Bar";else if(types.includes("convenience_store"))rubro="Kiosco";
    else if(types.includes("grocery_or_supermarket")||types.includes("supermarket"))rubro="Almacén";
    else if(lugar.name.toLowerCase().includes("pizza"))rubro="Pizzería";else if(lugar.name.toLowerCase().includes("parri"))rubro="Parrilla";
    else if(lugar.name.toLowerCase().includes("bodeg"))rubro="Bodegón";else if(types.includes("restaurant")||types.includes("food"))rubro="Restobar";
    const nuevo={id:uid(),_placeId:lugar.place_id,nombre:lugar.name,rubro,zona:zonaDetectada,direccion:dir,telefono:(lugar.formatted_phone_number||"").replace(/\s|-/g,"").replace(/^0/,"54").replace(/^\+/,""),notas:`Google Maps · Rating: ${lugar.rating||"N/D"} ⭐ (${lugar.user_ratings_total||0} reseñas).`,estado:"Por contactar"};
    setProspectos(prev=>[...prev,nuevo]);setAgregados(prev=>({...prev,[lugar.place_id]:true}));
  }
  function stars(r){if(!r)return"";const full=Math.round(r);return"★".repeat(full)+"☆".repeat(5-full);}
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Buscar en Maps</span>
      <p style={{fontSize:12,color:MU,marginBottom:16}}>Encontrá comercios reales con Google Places y agregalos a tu pipeline.</p>
      <div style={{display:"flex",gap:0,marginBottom:16,background:SU,border:`1px solid ${BO}`,borderRadius:10,padding:4}}>
        {[{k:"zona",l:"📍 Por zona"},{k:"cerca",l:"🎯 Cerca de mí"}].map(t=>(
          <button key={t.k} onClick={()=>setModo(t.k)} style={{flex:1,padding:"8px",borderRadius:7,border:"none",fontSize:13,fontWeight:700,background:modo===t.k?G:"transparent",color:modo===t.k?"#fff":MU,transition:"all 0.2s"}}>{t.l}</button>
        ))}
      </div>
      {modo==="zona"&&(
        <div>
          <div style={{marginBottom:10}}><Lbl t="¿Qué comercio buscás?"/><input value={tipo} onChange={e=>setTipo(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="Ej: pizzería, bar, kiosco..." list="tipos-sug"/><datalist id="tipos-sug">{TIPOS_LIST.map(t=><option key={t} value={t}/>)}</datalist></div>
          <div style={{marginBottom:10}}><Lbl t="¿En qué zona?"/><input value={zona} onChange={e=>setZona(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="Ej: Palermo, San Isidro, Lomas..." list="zonas-sug"/><datalist id="zonas-sug">{ZONAS_LIST.map(z=><option key={z} value={z}/>)}</datalist></div>
          <div style={{marginBottom:10}}><Lbl t="O búsqueda libre (opcional)"/><div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span><input style={{paddingLeft:36}} placeholder='Ej: "pizzerías en Villa del Parque"' value={busqueda} onChange={e=>setBusqueda(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()}/></div><div style={{fontSize:11,color:MU,marginTop:4}}>Si completás este campo sobreescribe los de arriba</div></div>
        </div>
      )}
      {modo==="cerca"&&(
        <div>
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:14,marginBottom:10,display:"flex",alignItems:"center",gap:10}}><div style={{color:G}}>{I.map}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:CR}}>Usar mi ubicación actual</div>{gpsLabel?<div style={{fontSize:12,color:GR,marginTop:2}}>✓ {gpsLabel}</div>:<div style={{fontSize:12,color:MU,marginTop:2}}>Activá el GPS para buscar cerca tuyo</div>}</div><button onClick={activarGPS} style={{padding:"7px 14px",borderRadius:8,background:gpsPos?GR+"22":G+"22",color:gpsPos?GR:G,border:`1px solid ${gpsPos?GR+"44":G+"44"}`,fontSize:13,fontWeight:700}}>{gpsPos?"GPS activo":"Activar GPS"}</button></div>
          <div style={{marginBottom:10}}><Lbl t="¿Qué comercio buscás?"/><input value={tipo} onChange={e=>setTipo(e.target.value)} placeholder="Ej: pizzería, bar, parrilla..." list="tipos-sug-c" onKeyDown={e=>e.key==="Enter"&&buscar()}/><datalist id="tipos-sug-c">{TIPOS_LIST.map(t=><option key={t} value={t}/>)}</datalist></div>
          <div><Lbl t="Radio de búsqueda"/><select value={radioM} onChange={e=>setRadioM(Number(e.target.value))}><option value={500}>500 metros</option><option value={1000}>1 km</option><option value={2000}>2 km</option><option value={5000}>5 km</option></select></div>
        </div>
      )}
      <button onClick={buscar} disabled={loading||(modo==="cerca"&&!gpsPos)} style={{width:"100%",padding:"13px",borderRadius:10,background:G,color:"#fff",fontSize:15,fontWeight:700,border:"none",marginTop:16,marginBottom:20,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:(loading||(modo==="cerca"&&!gpsPos))?0.6:1}}>
        {loading?<><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span>Buscando...</>:<>{I.search}Buscar en Google Maps</>}
      </button>
      {error&&<div style={{background:RE+"22",border:`1px solid ${RE}44`,borderRadius:8,padding:"10px 14px",fontSize:13,color:"#E08070",marginBottom:16}}>{error}</div>}
      {resultados.length>0&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontSize:14,fontWeight:600,color:CR}}>{resultados.length} resultados</span><span style={{fontSize:12,color:MU}}>{tipo}s · {modo==="zona"?zona:"cerca de vos"}</span></div>
          {resultados.map(r=>{
            const yaAgregado=agregados[r.place_id]||yaEnCRM.has(r.place_id);
            return(
              <div key={r.place_id} style={{background:CA,border:`1px solid ${yaAgregado?GR+"44":BO}`,borderRadius:18,padding:14,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
                  <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:700,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div><div style={{fontSize:12,color:MU,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.formatted_address||r.vicinity||""}</div></div>
                  {yaAgregado&&<span style={{fontSize:11,fontWeight:700,color:GR,background:GR+"22",padding:"3px 8px",borderRadius:4,flexShrink:0}}>En CRM ✓</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,flexWrap:"wrap"}}>
                  {r.rating&&<span style={{fontSize:13,color:"#E0AA40"}}>{stars(r.rating)} <span style={{color:MU}}>{r.rating} ({r.user_ratings_total||0})</span></span>}
                  {r.opening_hours&&<span style={{fontSize:12,fontWeight:600,color:r.opening_hours.open_now?GR:RE}}>{r.opening_hours.open_now?"● Abierto":"● Cerrado"}</span>}
                  {r.formatted_phone_number&&<span style={{fontSize:12,color:MU}}>{I.phone}{r.formatted_phone_number}</span>}
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <a href={`https://maps.google.com/?place_id=${r.place_id}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:12,padding:"6px 10px",borderRadius:6,color:MU,background:"none",border:`1px solid ${BO}`,textDecoration:"none"}}>{I.map}Ver en Maps</a>
                  {!yaAgregado?<button onClick={()=>agregarProspecto(r)} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"6px 12px",borderRadius:6,color:G,background:G+"11",border:`1px solid ${G}33`}}>{I.plus}Agregar a Prospectos</button>:<span style={{fontSize:12,color:GR,alignSelf:"center",padding:"0 4px"}}>✓ Ya está en tu pipeline</span>}
                </div>
              </div>
            );
          })}
          {nextToken&&<button onClick={cargarMas} disabled={loadingMore} style={{width:"100%",padding:"10px",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:13,cursor:"pointer",marginTop:8}}>{loadingMore?"Cargando...":"Cargar más resultados"}</button>}
        </div>
      )}
    </div>
  );
}
 
// ── SPEECHES ──────────────────────────────────────────────────────
function Speeches({speeches,setSpeeches}){
  const[cat,setCat]=useState("todas");
  const[cp,setCp]=useState(null);
  const[editId,setEditId]=useState(null);
  const[editF,setEditF]=useState(null);
  const[showNew,setShowNew]=useState(false);
  const[nF,setNF]=useState({titulo:"",categoria:"Primer contacto",canal:"WhatsApp",texto:""});
  const CATS=["Primer contacto","Seguimiento","Reactivación","Cierre","Promoción"];
  const cats=["todas",...Array.from(new Set(speeches.map(s=>s.categoria)))];
  const filtered=cat==="todas"?speeches:speeches.filter(s=>s.categoria===cat);
  const copy=s=>{navigator.clipboard?.writeText(s.texto);setCp(s.id);setTimeout(()=>setCp(null),1500);};
  const startEdit=s=>{setEditId(s.id);setEditF({...s});};
  const saveEdit=()=>{setSpeeches(p=>p.map(s=>s.id===editId?{...editF}:s));setEditId(null);};
  const saveNew=()=>{if(!nF.titulo.trim()||!nF.texto.trim())return;setSpeeches(p=>[...p,{id:uid(),...nF}]);setNF({titulo:"",categoria:"Primer contacto",canal:"WhatsApp",texto:""});setShowNew(false);};
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Speeches</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>

function CuentasCorrientes({clientes,setClientes}){
  const[expandido,setExpandido]=useState(null);
  const conDeuda=useMemo(()=>clientes
    .map(c=>({cliente:c,deuda:saldoCliente(c),pendientes:(c.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))}))
    .filter(x=>x.deuda>0)
    .sort((a,b)=>b.deuda-a.deuda),[clientes]);
  const deudaTotal=conDeuda.reduce((s,x)=>s+x.deuda,0);

  const marcarPagada=(clienteId,ventaId)=>setClientes(prev=>prev.map(c=>c.id!==clienteId?c:{...c,ventas:c.ventas.map(v=>v.id===ventaId?{...v,pagado:true}:v)}));
  const marcarTodoPagado=clienteId=>{
    if(!confirm("¿Marcar todas las ventas pendientes de este cliente como cobradas?"))return;
    setClientes(prev=>prev.map(c=>c.id!==clienteId?c:{...c,ventas:c.ventas.map(v=>({...v,pagado:true}))}));
  };
  const actualizarComision=(clienteId,ventaId,valor)=>setClientes(prev=>prev.map(c=>c.id!==clienteId?c:{...c,ventas:c.ventas.map(v=>v.id===ventaId?{...v,comisionPct:valor===""?"":Number(valor)}:v)}));

  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Cuentas corrientes</span>
      <p style={{fontSize:12,color:MU,marginBottom:16}}>{conDeuda.length} cliente{conDeuda.length!==1?"s":""} con saldo pendiente</p>

      <div style={{background:CA,border:`1px solid ${RE}33`,borderRadius:18,padding:18,marginBottom:20}}>
        <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Total pendiente de cobro</div>
        <div className="bebas" style={{fontSize:28,color:"#C24545"}}>{fmtARS(deudaTotal)}</div>
      </div>

      {conDeuda.length===0?(
        <p style={{color:MU,textAlign:"center",padding:"40px 0",fontSize:14}}>🎉 No hay cuentas pendientes. Todo cobrado.</p>
      ):conDeuda.map(({cliente,deuda,pendientes})=>{
        const abierto=expandido===cliente.id;
        return(
          <div key={cliente.id} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:10}}>
            <button onClick={()=>setExpandido(abierto?null:cliente.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:14,background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:RE+"15",color:"#C24545",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{iniciales(cliente.nombre)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cliente.nombre}</div>
                <div style={{fontSize:11,color:MU,marginTop:2}}>{pendientes.length} venta{pendientes.length!==1?"s":""} pendiente{pendientes.length!==1?"s":""}</div>
              </div>
              <div style={{fontSize:14,fontWeight:700,color:"#C24545",flexShrink:0}}>{fmtARS(deuda)}</div>
              <span style={{color:MU,display:"flex",flexShrink:0,transform:abierto?"rotate(90deg)":"none",transition:"transform 0.2s"}}>{I.chev}</span>
            </button>
            {abierto&&(
              <div style={{borderTop:`1px solid ${BO}`,padding:"8px 14px 14px"}}>
                {pendientes.map(v=>(
                  <div key={v.id} style={{padding:"8px 0",borderBottom:`1px solid ${BO}`}}>

  const todas=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,clienteNombre:c.nombre}))),[clientes]);
  const totalFacturado=todas.reduce((s,v)=>s+(v.monto||0),0);
  const totalGanancia=todas.reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);
  const gananciaCobrada=todas.filter(v=>v.pagado).reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);
  const gananciaPendiente=totalGanancia-gananciaCobrada;

  const hoy=hoyISO();
  const mesActual=hoy.slice(0,7);
  const delMes=todas.filter(v=>(v.fecha||"").slice(0,7)===mesActual);
  const facturadoMes=delMes.reduce((s,v)=>s+(v.monto||0),0);
  const gananciaMes=delMes.reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);

  const evolucionGanancia=useMemo(()=>{
    const hoyD=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoyD.getFullYear(),hoyD.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]=0);
    todas.forEach(v=>{
      const key=(v.fecha||"").slice(0,7);
      if(key in map)map[key]+=Math.round((v.monto||0)*(v.comisionPct||0)/100);
    });
    return meses.map(m=>({...m,ganancia:map[m.key]}));
  },[todas]);
  const maxGananciaMes=Math.max(1,...evolucionGanancia.map(m=>m.ganancia));

  const sinComision=todas.filter(v=>!v.comisionPct).length;
  const recientes=useMemo(()=>[...todas].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,15),[todas]);

  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>

        </div>
        <div style={{background:CA,border:`1px solid ${G}33`,borderRadius:18,padding:16}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ganancia total</div>
          <div className="bebas" style={{fontSize:20,color:G}}>{fmtARS(totalGanancia)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ganancia cobrada</div>
          <div className="bebas" style={{fontSize:20,color:GR}}>{fmtARS(gananciaCobrada)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${gananciaPendiente>0?RE+"33":BO}`,borderRadius:18,padding:16}}>
          <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ganancia pendiente</div>
          <div className="bebas" style={{fontSize:20,color:gananciaPendiente>0?"#C24545":CR}}>{fmtARS(gananciaPendiente)}</div>
        </div>
      </div>

      <div style={{background:GDK,borderRadius:18,padding:18,marginBottom:16}}>
        <div style={{fontSize:11,color:"#8FE3B4",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Este mes</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div>
            <div style={{fontSize:10,color:"#8FE3B4",marginBottom:2}}>Facturado</div>
            <div className="bebas" style={{fontSize:20,color:"#fff"}}>{fmtARS(facturadoMes)}</div>

    </div>
  );
