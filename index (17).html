const RUBRO_SCORE={"Pizzería":22,"Parrilla":20,"Restobar":19,"Bodegón":18,"Bar":16,"Autoservicio":14,"Almacén":12,"Despensa":10,"Kiosco":9,"Otro":6};

function calcScore(p){
  const rS=RUBRO_SCORE[p.rubro]||6,zS=ZONA_SCORE[p.zona]||10,eS=ESTADO_SCORE[p.estado]||0;
  const telS=p.telefono?15:0,notasS=p.notas&&p.notas.length>30?5:p.notas?2:0;
  return Math.min(100,rS+zS+eS+telS+notasS);
}

const fmtARS=n=>n.toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});

const fmtDateTime=iso=>{

function construirCatalogoPDF(prods){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const pageW=210,pageH=297,marginX=15;
  const envaseColor=e=>({PET:[23,141,79],Barril:[183,121,31],Lata:[70,110,190]}[e]||[86,91,96]);

  // Header
  doc.setFillColor(14,74,44);
  doc.rect(0,0,pageW,36,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.text("GRUNGE & FAROL",marginX,20);
  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  doc.text("Catálogo de productos",marginX,28);
  doc.setFontSize(9);
  const fecha=new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
  doc.text(fecha,pageW-marginX,28,{align:"right"});

  let y=48;
  (prods||[]).forEach(p=>{
    const tienePromos=(p.promos||[]).length>0;
    const descLines=p.descripcion?doc.splitTextToSize(String(p.descripcion),pageW-marginX*2-40):[];
    let cardH=22+(descLines.length?descLines.length*4.2:0)+(tienePromos?7:0);
    if(y+cardH>pageH-22){doc.addPage();y=20;}
    const[cr,cg,cb]=envaseColor(p.envase);

    doc.setFillColor(255,255,255);
    doc.setDrawColor(228,231,229);
    doc.setLineWidth(0.3);
    doc.roundedRect(marginX,y,pageW-marginX*2,cardH,3,3,"FD");
    doc.setFillColor(cr,cg,cb);
    doc.roundedRect(marginX,y,3,cardH,1.5,1.5,"F");

    doc.setTextColor(26,26,26);
    doc.setFont("helvetica","bold");
    doc.setFontSize(13);
    doc.text(String(p.nombre||"Producto"),marginX+8,y+9);

    doc.setFont("helvetica","normal");
    doc.setFontSize(9.5);
    doc.setTextColor(86,91,96);
    doc.text(`${p.marca||"Farol"} · ${p.envase||"PET"}`,marginX+8,y+15.5);

    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.setTextColor(cr,cg,cb);
    const precioTxt=fmtARS(p.precio||0);
    doc.text(precioTxt,pageW-marginX-6,y+11,{align:"right"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.setTextColor(120,120,120);
    doc.text("por litro",pageW-marginX-6,y+15.5,{align:"right"});

    let yy=y+21;
    if(descLines.length){
      doc.setFont("helvetica","italic");
      doc.setFontSize(9);
      doc.setTextColor(110,114,118);
      doc.text(descLines,marginX+8,yy);
      yy+=descLines.length*4.2;
    }
    if(tienePromos){
      doc.setFont("helvetica","normal");
      doc.setFontSize(8.5);
      doc.setTextColor(23,141,79);
      const promoTxt=p.promos.map(pr=>`Desde ${pr.minCantidad}u: ${fmtARS(pr.precioUnitario)} c/u`).join("   ·   ");
      doc.text(promoTxt,marginX+8,yy+1,{maxWidth:pageW-marginX*2-14});
    }
    y+=cardH+6;
  });

  const totalPages=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFont("helvetica","italic");
    doc.setFontSize(9);
    doc.setTextColor(150,150,150);
    doc.text("¡Escribinos para hacer tu pedido! · Grunge & Farol",pageW/2,pageH-12,{align:"center"});
  }
  return doc;
}
async function compartirCatalogoPDF(prods){
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert("No se pudo cargar el generador de PDF (jsPDF). Revisá tu conexión a internet y volvé a intentar. Si persiste, avisame para revisarlo.");
    return;
  }
  try{
    const doc=construirCatalogoPDF(prods);
    const fileName=`catalogo-farol-${hoyISO()}.pdf`;
    const blob=doc.output("blob");
    let compartido=false;

    if(navigator.share&&navigator.canShare){
      try{
        const file=new File([blob],fileName,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Catálogo Grunge & Farol",text:"Catálogo de productos Grunge & Farol 🍺"});
          compartido=true;
        }
      }catch(e){
        if(e&&e.name==="AbortError")compartido=true; // el usuario cerró el menú de compartir, no reintentar
      }
    }

    if(!compartido){
      // Abrimos el PDF en una pestaña nueva: el visor de PDF del navegador/celular tiene su propio
      // botón de compartir y guardar, mucho más confiable en mobile que forzar una descarga invisible.
      const url=URL.createObjectURL(blob);
      const nuevaVentana=window.open(url,"_blank");
      if(!nuevaVentana){
        const a=document.createElement("a");a.href=url;a.download=fileName;a.target="_blank";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        alert("Se abrió/descargó el catálogo. Si no ves nada, revisá si el navegador bloqueó una ventana emergente y permitila para este sitio.");
      }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
  }catch(e){
    alert("No se pudo generar el catálogo:\n\n"+(e&&e.message?e.message:String(e))+"\n\nMandame este mensaje para arreglarlo.");
  }
}

function saldoCliente(c){ return (c.ventas||[]).filter(v=>!v.pagado).reduce((s,v)=>s+v.monto,0); }
function totalAdeudado(clientes){ return clientes.reduce((s,c)=>s+saldoCliente(c),0); }
 
// ── Meta semanal helpers ──────────────────────────────────────────
function rangoSemanaActual(){
  const hoy=new Date(),dia=hoy.getDay(),offsetLunes=dia===0?-6:1-dia;
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()+offsetLunes); lunes.setHours(0,0,0,0);
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6); domingo.setHours(23,59,59,999);
  return{lunes,domingo};
}
function litrosEstaSemana(clientes){
  const{lunes,domingo}=rangoSemanaActual(); let total=0;
  clientes.forEach(c=>(c.ventas||[]).forEach(v=>{const f=new Date(v.fecha+"T00:00:00");if(f>=lunes&&f<=domingo)total+=v.cantidad;}));
  return total;
}
function diasRestantesSemana(){
  const{domingo}=rangoSemanaActual();const hoy=new Date();hoy.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((domingo-hoy)/86400000));
}

// ── Google Calendar hook ──────────────────────────────────────────
function useGoogleCalendar(){
  const[calToken,setCalToken]=useState(null);
  const[calError,setCalError]=useState("");
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const tokenClientRef=React.useRef(null);
 
  // Inicializar gapi.client (librería de Google APIs)
  React.useEffect(()=>{
    const initGapi=()=>{
      if(!window.gapi){setTimeout(initGapi,500);return;}
      window.gapi.load("client",async()=>{
        try{
          await window.gapi.client.init({});
          await window.gapi.client.load("https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest");
          setGapiReady(true);
        }catch(e){
          console.warn("gapi.client init falló:",e);
          setGapiReady(true); // igual marcamos ready para no bloquear
        }
      });
    };
    initGapi();
  },[]);
 
  // Esperar a que Google Identity Services esté disponible
  React.useEffect(()=>{
    const check=()=>{if(window.google?.accounts?.oauth2){setGisReady(true);}else{setTimeout(check,500);}};
    check();
  },[]);
 
  const login=()=>{
    const clientId=getCalClientId();
    if(!clientId){
      setCalError("Primero pegá tu Client ID en Configuración → Google Calendar.");
      return;
    }
    if(!gisReady){setCalError("Google Identity todavía cargando, esperá unos segundos y volvé a intentar.");return;}
    try{
      // Siempre recreamos el token client por si cambió el client_id
      tokenClientRef.current=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:GCAL_SCOPE,
        callback:(resp)=>{
          if(resp.error){
            setCalError("Error OAuth: "+resp.error+". Verificá que el origen esté autorizado en Google Cloud Console.");
            return;
          }
          setCalToken(resp.access_token);
          setCalError("");
          if(window.gapi?.client) window.gapi.client.setToken({access_token:resp.access_token});
        },
        error_callback:(err)=>{
          setCalError("Popup bloqueado o cancelado. Permití popups para este sitio.");
        }
      });
      tokenClientRef.current.requestAccessToken({prompt:""});
    }catch(e){
      setCalError("No se pudo iniciar el login: "+e.message);
    }
  };
 
  const logout=()=>{
    if(calToken&&window.google?.accounts?.oauth2) window.google.accounts.oauth2.revoke(calToken,()=>{});
    setCalToken(null);
    setCalError("");
    tokenClientRef.current=null;
  };
 
  const crearEvento=async({titulo,descripcion,fecha,hora,durMin=60})=>{
    if(!calToken){login();return false;}
    if(!gapiReady){setCalError("La API de Google Calendar todavía está cargando.");return false;}
    try{
      const inicio=new Date(`${fecha}T${hora}:00`);
      const fin=new Date(inicio.getTime()+durMin*60000);
      const toISO=d=>d.toISOString();
      await window.gapi.client.calendar.events.insert({
        calendarId:"primary",
        resource:{
          summary:titulo,
          description:descripcion||"",
          start:{dateTime:toISO(inicio),timeZone:"America/Argentina/Buenos_Aires"},
          end:{dateTime:toISO(fin),timeZone:"America/Argentina/Buenos_Aires"},
          reminders:{useDefault:false,overrides:[{method:"popup",minutes:60},{method:"popup",minutes:10}]},
        }
      });
      return true;
    }catch(e){
      const msg=e.result?.error?.message||e.message||"Error desconocido";
      // Token expirado → intentar renovar
      if(e.status===401){setCalToken(null);login();return false;}
      setCalError("Error al crear evento: "+msg);
      return false;
    }
  };
 
  return{calToken,calError,gapiReady,gisReady,login,logout,crearEvento};
}
 
// ── Modal Agenda ──────────────────────────────────────────────────
function ModalAgenda({open,onClose,entidad,onGuardar,cal}){
  const[titulo,setTitulo]=useState("");
  const[fecha,setFecha]=useState(hoyISO());
  const[hora,setHora]=useState("10:00");
  const[dur,setDur]=useState(30);
  const[nota,setNota]=useState("");
  const[saving,setSaving]=useState(false);
  const[ok,setOk]=useState(false);
  React.useEffect(()=>{if(open&&entidad)setTitulo(`Visita Farol → ${entidad.nombre}`);},[open,entidad]);
  const guardar=async()=>{
    if(!titulo.trim()||!fecha||!hora)return;
    setSaving(true);
    const evento={titulo,descripcion:nota||`Visita comercial Farol a ${entidad?.nombre}`,fecha,hora,durMin:dur};
    let calOk=false;
    if(cal.calToken)calOk=await cal.crearEvento(evento);
    onGuardar({...evento,calSync:calOk,id:uid(),creadoEn:new Date().toISOString()});
    setSaving(false);setOk(true);
    setTimeout(()=>{setOk(false);onClose();},1200);
  };
  return(
    <Modal open={open} onClose={onClose} title={`Agendar visita · ${entidad?.nombre||""}`}>
      {!cal.calToken&&!getCalClientId()&&(
        <div style={{background:AM+"11",border:`1px solid ${AM}33`,borderRadius:8,padding:"10px 14px",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:AM,marginBottom:2}}>⚙️ Google Calendar no configurado</div>
          <div style={{fontSize:12,color:MU,lineHeight:1.5}}>El evento se va a guardar solo en la app. Para sincronizar con Google Calendar, pegá tu Client ID en <strong style={{color:CR}}>Configuración</strong>.</div>
        </div>
      )}
      {!cal.calToken&&getCalClientId()&&(
        <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div><div style={{fontSize:13,fontWeight:700,color:G}}>Conectar Google Calendar</div><div style={{fontSize:12,color:MU,marginTop:2}}>Para sincronizar este evento con tu agenda</div></div>
          <button onClick={cal.login} style={{padding:"7px 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>Conectar</button>
        </div>
      )}
      {cal.calToken&&<div style={{background:GR+"22",border:`1px solid ${GR}44`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:GR,display:"flex",alignItems:"center",gap:6}}>✓ Google Calendar conectado — el evento se va a crear en tu agenda</div>}
      {cal.calError&&<div style={{background:RE+"22",border:`1px solid ${RE}44`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#E08070",lineHeight:1.5}}>{cal.calError}</div>}
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div><Lbl t="Título del recordatorio"/><input value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Visita Farol → Local..."/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><Lbl t="Fecha"/><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
          <div><Lbl t="Hora"/><input type="time" value={hora} onChange={e=>setHora(e.target.value)}/></div>
        </div>
        <div><Lbl t="Duración estimada"/><select value={dur} onChange={e=>setDur(Number(e.target.value))}><option value={15}>15 minutos</option><option value={30}>30 minutos</option><option value={60}>1 hora</option><option value={120}>2 horas</option></select></div>
        <div><Lbl t="Notas (opcional)"/><textarea rows={2} value={nota} onChange={e=>setNota(e.target.value)} placeholder="Qué llevar, a quién ver, objetivo..."/></div>
        <div style={{display:"flex",gap:8,paddingTop:4}}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <button onClick={guardar} disabled={saving||ok||!titulo.trim()} style={{flex:1,padding:"10px 16px",borderRadius:8,fontSize:14,fontWeight:700,border:"none",cursor:saving||!titulo.trim()?"not-allowed":"pointer",background:ok?GR:G,color:ok?"#fff":"#fff",opacity:!titulo.trim()?0.4:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            {ok?"✓ Agendado!":saving?"Guardando...":"📅 Agendar visita"}
          </button>
        </div>
      </div>
    </Modal>
  );
}

// ── CuentaCorriente ───────────────────────────────────────────────
function CuentaCorriente({cliente,onUpdate}){
  const[montoPago,setMontoPago]=useState("");
  const[showParcial,setShowParcial]=useState(false);
  const[showHistorial,setShowHistorial]=useState(false);
  const[showCobroIndep,setShowCobroIndep]=useState(false);
  const[montoCobroIndep,setMontoCobroIndep]=useState("");
  const[notaCobro,setNotaCobro]=useState("");
 
  const pendientes=(cliente.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const pagadas=(cliente.ventas||[]).filter(v=>v.pagado).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const saldo=saldoCliente(cliente);
 
  const marcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:true}:v)});
  const desmarcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:false}:v)});
  const marcarTodo=()=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>({...v,pagado:true}))});
 
  // Cobro independiente — registra un pago en efectivo sin crear venta nueva
  const registrarCobroIndependiente=()=>{
    const monto=Number(montoCobroIndep);
    if(!monto||monto<=0)return;
    // Aplica el cobro saldando ventas pendientes de más antigua a más nueva
    let restante=monto;
    const nuevasVentas=[...cliente.ventas].map(v=>{
      if(v.pagado||restante<=0)return v;
      if(restante>=v.monto){restante-=v.monto;return{...v,pagado:true};}
      // Pago parcial: divide la venta
      const montoPagado=restante,montoRestante=v.monto-restante;
      const cantPagada=Math.round((v.cantidad*(montoPagado/v.monto))*10)/10;
      restante=0;
      return{...v,_split:true,_montoPagado:montoPagado,_montoRestante:montoRestante,_cantPagada:cantPagada,_cantRestante:v.cantidad-cantPagada};
    });
    const ventasFinales=[];
    nuevasVentas.forEach(v=>{
      if(v._split){
        ventasFinales.push({id:v.id,fecha:v.fecha,producto:v.producto,cantidad:v._cantPagada,monto:v._montoPagado,pagado:true,nota:notaCobro||"Cobro en efectivo"});
        ventasFinales.push({id:uid(),fecha:v.fecha,producto:v.producto,cantidad:v._cantRestante,monto:v._montoRestante,pagado:false});
      }else{ventasFinales.push(v);}
    });
    onUpdate({...cliente,ventas:ventasFinales});
    setMontoCobroIndep("");setNotaCobro("");setShowCobroIndep(false);
  };
 
  const aplicarPagoParcial=()=>{
    const pago=Number(montoPago);
    if(!pago||pago<=0)return;
    let restante=pago;
    const nuevasVentas=[...cliente.ventas].map(v=>{
      if(v.pagado||restante<=0)return v;
      if(restante>=v.monto){restante-=v.monto;return{...v,pagado:true};}
      const montoPagado=restante,montoRestante=v.monto-restante;
      const cantidadPagada=Math.round((v.cantidad*(montoPagado/v.monto))*10)/10;
      const cantidadRestante=v.cantidad-cantidadPagada;
      restante=0;
      return{...v,_split:true,_montoPagado:montoPagado,_montoRestante:montoRestante,_cantPagada:cantidadPagada,_cantRestante:cantidadRestante};
    });
    const ventasFinales=[];
    nuevasVentas.forEach(v=>{
      if(v._split){
        ventasFinales.push({id:v.id,fecha:v.fecha,producto:v.producto,cantidad:v._cantPagada,monto:v._montoPagado,pagado:true});
        ventasFinales.push({id:uid(),fecha:v.fecha,producto:v.producto,cantidad:v._cantRestante,monto:v._montoRestante,pagado:false});
      }else{ventasFinales.push(v);}
    });
    onUpdate({...cliente,ventas:ventasFinales});
    setMontoPago("");setShowParcial(false);
  };
 
  return(
    <div style={{background:saldo>0?RE+"11":GR+"11",border:`1px solid ${saldo>0?RE+"33":GR+"33"}`,borderRadius:10,padding:14,marginBottom:14}}>
      {/* Saldo siempre visible */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:saldo>0?12:0}}>
        <span style={{fontSize:14,fontWeight:700,color:saldo>0?"#C62828":GR}}>
          {saldo>0?"💰 Cuenta corriente":"✓ Sin deuda pendiente"}
        </span>
        <span className="bebas" style={{fontSize:22,color:saldo>0?"#C62828":GR}}>{fmtARS(saldo)}</span>
      </div>
 
      {saldo>0&&(
        <>
          {/* Ventas pendientes */}
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
            {pendientes.map(v=>(
              <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                <div>
                  <div style={{fontSize:14,color:CR,fontWeight:500}}>{fmtDate(v.fecha)}</div>
                  <div style={{fontSize:12,color:MU}}>{v.cantidad}L · {v.nota||""}</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:15,fontWeight:700,color:"#C62828"}}>{fmtARS(v.monto)}</span>
                  <button onClick={()=>marcarPagada(v.id)} style={{fontSize:12,fontWeight:700,padding:"6px 12px",borderRadius:8,background:GR+"22",color:GR,border:`1px solid ${GR}44`,cursor:"pointer"}}>✓ Cobrado</button>
                </div>
              </div>
            ))}
          </div>
 
          {/* Botones de cobro */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <button onClick={()=>{setShowCobroIndep(true);setShowParcial(false);}} style={{padding:"10px 0",borderRadius:10,background:"none",border:`1px dashed ${G}55`,color:G,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              💵 Cobro en efectivo
            </button>
            <button onClick={()=>{setShowParcial(true);setShowCobroIndep(false);}} style={{padding:"10px 0",borderRadius:10,background:"none",border:`1px dashed ${AM}55`,color:AM,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              🔢 Pago parcial
            </button>
          </div>
 
          {/* Panel cobro independiente */}
          {showCobroIndep&&(
            <div style={{background:"#fff",border:`1px solid ${G}33`,borderRadius:10,padding:14,marginBottom:10}}>
              <div style={{fontSize:14,fontWeight:700,color:CR,marginBottom:10}}>💵 Registrar cobro en efectivo</div>
              <div style={{marginBottom:8}}><Lbl t="Monto cobrado"/><input type="number" inputMode="numeric" value={montoCobroIndep} onChange={e=>setMontoCobroIndep(e.target.value)} placeholder={`Deuda total: ${fmtARS(saldo)}`} autoFocus/></div>
              <div style={{marginBottom:10}}><Lbl t="Nota (opcional)"/><input value={notaCobro} onChange={e=>setNotaCobro(e.target.value)} placeholder="Ej: Cobré en el local, pagó con transferencia..."/></div>
              {montoCobroIndep&&Number(montoCobroIndep)>0&&(
                <div style={{fontSize:13,color:MU,marginBottom:10}}>
                  Cobrás <strong style={{color:G}}>{fmtARS(Number(montoCobroIndep))}</strong> · Saldo restante: <strong style={{color:"#C62828"}}>{fmtARS(Math.max(0,saldo-Number(montoCobroIndep)))}</strong>
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{setShowCobroIndep(false);setMontoCobroIndep("");setNotaCobro("");}} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:14,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                <button onClick={registrarCobroIndependiente} disabled={!montoCobroIndep||Number(montoCobroIndep)<=0} style={{flex:2,padding:"10px 0",borderRadius:10,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",opacity:!montoCobroIndep||Number(montoCobroIndep)<=0?0.4:1}}>
                  ✓ Confirmar cobro
                </button>
              </div>
            </div>
          )}
 
          {/* Panel pago parcial */}
          {showParcial&&(
            <div style={{background:"#fff",border:`1px solid ${AM}33`,borderRadius:10,padding:14,marginBottom:10}}>
              <div style={{fontSize:14,fontWeight:700,color:CR,marginBottom:10}}>🔢 Pago parcial</div>
              <div style={{marginBottom:8}}><Lbl t="¿Cuánto te pagó?"/><input type="number" inputMode="numeric" value={montoPago} onChange={e=>setMontoPago(e.target.value)} placeholder={`Máx: ${fmtARS(saldo)}`} autoFocus/></div>
              {montoPago&&Number(montoPago)>0&&(
                <div style={{fontSize:13,color:MU,marginBottom:10}}>
                  Cobro de <strong style={{color:AM}}>{fmtARS(Number(montoPago))}</strong> · Saldo restante: <strong style={{color:"#C62828"}}>{fmtARS(Math.max(0,saldo-Number(montoPago)))}</strong>
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{setShowParcial(false);setMontoPago("");}} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:14,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                <button onClick={aplicarPagoParcial} disabled={!montoPago||Number(montoPago)<=0} style={{flex:2,padding:"10px 0",borderRadius:10,background:AM,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",opacity:!montoPago||Number(montoPago)<=0?0.4:1}}>
                  ✓ Confirmar {montoPago?fmtARS(Number(montoPago)):"..."}
                </button>
              </div>
            </div>
          )}
 
          {/* Saldar todo */}
          <button onClick={marcarTodo} style={{width:"100%",padding:"11px 0",borderRadius:10,background:GR,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            {I.check} Saldar toda la cuenta · {fmtARS(saldo)}
          </button>
        </>
      )}
 
      {/* Historial de pagos */}
      {pagadas.length>0&&(
        <div style={{marginTop:saldo>0?12:0}}>
          <button onClick={()=>setShowHistorial(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:MU,display:"flex",alignItems:"center",gap:4,padding:0}}>
            {showHistorial?"▲":"▼"} Historial de pagos ({pagadas.length})
          </button>
          {showHistorial&&(
            <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
              {pagadas.slice(0,8).map(v=>(
                <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div>
                    <div style={{fontSize:13,color:CR}}>{fmtDate(v.fecha)}</div>
                    <div style={{fontSize:11,color:GR}}>✓ Cobrado{v.nota?` · ${v.nota}`:""}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:14,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</span>
                    <button onClick={()=>desmarcarPagada(v.id)} style={{fontSize:11,padding:"4px 8px",borderRadius:6,background:RE+"11",color:"#C62828",border:`1px solid ${RE}33`,cursor:"pointer"}}>Deshacer</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DetalleCliente({cliente,onUpdate,onDelete,speeches,cal,prods}){
  const[vForm,setVForm]=useState(false);
  const[edit,setEdit]=useState(false);
  const[spOpen,setSpOpen]=useState(false);
  const[confirmBorrar,setConfirmBorrar]=useState(false);
  const[compartiendoCatalogo,setCompartiendoCatalogo]=useState(false);
  const e=EST[estadoC(cliente)];
  const ls=lastSale(cliente);
  const total=cliente.ventas.reduce((s,v)=>s+v.monto,0);
  const sorted=[...cliente.ventas].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  if(edit)return<FormCliente initial={cliente} onCancel={()=>setEdit(false)} onSave={f=>{onUpdate({...cliente,...f});setEdit(false);}}/>;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <Pill color={e.c}>{e.l}{ls?` · ${daysSince(ls.fecha)}d`:""}</Pill>
        <div style={{display:"flex",gap:4}}>
          <button onClick={()=>setEdit(true)} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:MU}}>{I.edit}</button>
          <button onClick={()=>setConfirmBorrar(true)} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:RE}}>{I.trash}</button>
        </div>
      </div>
      <ModalConfirmar open={confirmBorrar} onClose={()=>setConfirmBorrar(false)} onConfirmar={()=>onDelete(cliente.id)} titulo="¿Eliminar cliente?" mensaje={`Vas a eliminar a ${cliente.nombre} y todo su historial de ventas. Esta acción no se puede deshacer.`} labelConfirmar="Sí, eliminar"/>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14,fontSize:14}}>
        <div style={{color:CR}}><span style={{color:MU}}>Rubro · </span>{cliente.rubro}</div>
        <div style={{color:CR}}><span style={{color:MU}}>Zona · </span>{cliente.zona}</div>
        {cliente.direccion&&<div style={{color:CR,display:"flex",alignItems:"center",gap:6}}><span style={{color:MU}}>{I.map}</span>{cliente.direccion}</div>}
        {!!cliente.comisionPctDefault&&<div style={{color:G,fontWeight:600}}><span style={{color:MU,fontWeight:400}}>% ganancia por defecto · </span>{cliente.comisionPctDefault}%</div>}
      </div>
      {cliente.telefono&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <a href={`https://wa.me/${cliente.telefono}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"9px 0",borderRadius:8,fontSize:13,fontWeight:700,background:"#25D36620",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none"}}>{I.wa}WhatsApp</a>
          <button onClick={()=>setSpOpen(true)} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"9px 0",borderRadius:8,fontSize:13,fontWeight:700,background:G+"22",color:G,border:`1px solid ${G}44`,cursor:"pointer"}}>{I.msg}Enviar speech</button>
        </div>
      )}
      <button onClick={async()=>{setCompartiendoCatalogo(true);try{await compartirCatalogoPDF(prods);}finally{setCompartiendoCatalogo(false);}}} disabled={compartiendoCatalogo||!prods||prods.length===0} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"9px 0",borderRadius:8,fontSize:13,fontWeight:700,background:"none",color:MU,border:`1px solid ${BO}`,cursor:compartiendoCatalogo?"not-allowed":"pointer",marginBottom:14,opacity:compartiendoCatalogo?0.6:1}}>{I.share}{compartiendoCatalogo?"Generando catálogo...":"Compartir catálogo"}</button>
      {cliente.notas&&<div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:12,marginBottom:14}}><div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Notas</div><div style={{fontSize:13,color:"#D9C9B5"}}>{cliente.notas}</div></div>}
      <CuentaCorriente cliente={cliente} onUpdate={onUpdate}/>
      <div style={{borderTop:`1px solid ${BO}`,paddingTop:14,marginBottom:14}}>
        <HistorialAgenda entidad={cliente} agenda={cliente.agenda||[]} historial={cliente.historial||[]} cal={cal} onAgregarAgenda={ev=>onUpdate({...cliente,agenda:[...(cliente.agenda||[]),ev]})} onAgregarContacto={c=>onUpdate({...cliente,historial:[...(cliente.historial||[]),c]})}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:14,fontWeight:600,color:CR}}>Historial de ventas</span>
        <span style={{fontSize:12,color:MU}}>Total: {fmtARS(total)}</span>
      </div>
      {vForm
        ?<div style={{marginBottom:14}}><FormVenta prods={prods} comisionPctDefault={cliente.comisionPctDefault} onCancel={()=>setVForm(false)} onSave={v=>{onUpdate({...cliente,ventas:[...cliente.ventas,{id:uid(),...v}]});setVForm(false);}}/></div>
        :<button onClick={()=>setVForm(true)} style={{width:"100%",marginBottom:10,padding:"10px 0",borderRadius:8,fontSize:14,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,border:"1px dashed #3A3028",background:"none",color:G}}>{I.plus}Nueva venta</button>
      }
      {sorted.length===0?<p style={{fontSize:14,color:MU,textAlign:"center",padding:16}}>Sin ventas aún.</p>:sorted.map(v=>{const p=prods.find(x=>x.id===v.producto);return(
        <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${v.pagado?BO:RE+"44"}`,borderRadius:8,padding:"10px 12px",marginBottom:6}}>
          <div>
            <div style={{fontSize:13,fontWeight:500,color:CR}}>{p?p.nombre:v.producto}</div>
            <div style={{fontSize:11,color:MU}}>{fmtDate(v.fecha)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:14,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</div>
            <div style={{fontSize:11,color:v.pagado?GR:"#E08070"}}>{v.cantidad} L · {v.pagado?"Pagado":"Pendiente"}</div>
          </div>
        </div>
      );})}
      <SpeechPicker open={spOpen} onClose={()=>setSpOpen(false)} speeches={speeches} telefono={cliente.telefono} nombre={cliente.nombre}/>
    </div>
  );
}
 
// ── INICIO ────────────────────────────────────────────────────────
function Inicio({clientes,prospectos,pedidos,prods,metaSemanal,setMetaSemanal,setTab}){
  const totalARS=clientes.reduce((s,c)=>s+c.ventas.reduce((a,v)=>a+v.monto,0),0);
  const litros=clientes.reduce((s,c)=>s+c.ventas.reduce((a,v)=>a+v.cantidad,0),0);
  const activos=clientes.filter(c=>estadoC(c)==="activo").length;
  const alertas=clientes.filter(c=>["inactivo","atencion"].includes(estadoC(c))).sort((a,b)=>{const la=lastSale(a),lb=lastSale(b);return(lb?daysSince(lb.fecha):0)-(la?daysSince(la.fecha):0);}).slice(0,4);
  const top5=useMemo(()=>[...prospectos].filter(p=>p.estado!=="Descartado").map(p=>({...p,_score:calcScore(p)})).sort((a,b)=>b._score-a._score).slice(0,5),[prospectos]);
  const pedidosHoy=(pedidos||[]).filter(p=>p.estado==="pendiente"&&p.fechaEntrega===hoyISO());
  const[filtroPedidos,setFiltroPedidos]=useState("pendientes");
  const ultimosPedidos=useMemo(()=>[...(pedidos||[])]
    .filter(p=>filtroPedidos==="todos"||(filtroPedidos==="pendientes"?p.estado!=="entregado":p.estado==="entregado"))
    .sort((a,b)=>new Date(b.creadoEn||b.fechaEntrega)-new Date(a.creadoEn||a.fechaEntrega)).slice(0,5),[pedidos,filtroPedidos]);
  const recordatoriosHoy=useMemo(()=>{const out=[];clientes.forEach(c=>(c.agenda||[]).forEach(e=>{if(e.fecha===hoyISO())out.push({...e,entidadNombre:c.nombre});}));return out.sort((a,b)=>a.hora.localeCompare(b.hora));},[clientes]);
  const litrosSemana=litrosEstaSemana(clientes);
  const pctMeta=metaSemanal>0?Math.min(100,Math.round((litrosSemana/metaSemanal)*100)):0;
  const diasRest=diasRestantesSemana();
  const deuda=totalAdeudado(clientes);
  const[editandoMeta,setEditandoMeta]=useState(false);
  const[metaTmp,setMetaTmp]=useState(String(metaSemanal));
  const DIAS_LBL=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const litrosPorDia=useMemo(()=>{
    const{lunes}=rangoSemanaActual();
    return[0,1,2,3,4,5,6].map(off=>{
      const d=new Date(lunes);d.setDate(lunes.getDate()+off);
      const iso=d.toISOString().slice(0,10);
      const total=clientes.reduce((s,c)=>s+(c.ventas||[]).filter(v=>v.fecha===iso).reduce((a,v)=>a+(v.cantidad||0),0),0);
      return{lbl:DIAS_LBL[off],total,esHoy:iso===hoyISO()};
    });
  },[clientes]);
  const maxDia=Math.max(1,...litrosPorDia.map(d=>d.total));
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div>
          <div className="bebas" style={{fontSize:24,color:CR}}>Hola, Nahu 👋</div>
          <div style={{fontSize:13,color:MU,marginTop:2}}>Grunge & Farol · Distribución directa</div>
        </div>
        <div style={{width:44,height:44,borderRadius:18,background:GDK,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}>{I.beer}</div>
      </div>
 
      {/* Hoy: entregas y recordatorios */}
      {(pedidosHoy.length>0||recordatoriosHoy.length>0)&&(
        <div style={{background:GDK,borderRadius:18,overflow:"hidden",marginBottom:16}}>
          <div style={{padding:"10px 16px",fontSize:12,fontWeight:700,color:"#fff",opacity:0.85,textTransform:"uppercase",letterSpacing:"0.08em"}}>Hoy</div>
          {pedidosHoy.map(p=>{const cliente=clientes.find(c=>c.id===p.clienteId);const prod=prods.find(x=>x.id===p.producto);return(
            <button key={"pe"+p.id} onClick={()=>setTab("pedidos")} style={{width:"100%",padding:"10px 16px",background:"none",border:"none",borderTop:"1px solid rgba(255,255,255,0.08)",cursor:"pointer",display:"flex",alignItems:"center",gap:10,textAlign:"left"}}>
              <span style={{color:"#8FE3B4",flexShrink:0}}>{I.truck}</span>
              <span style={{flex:1,fontSize:13,color:"#fff",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cliente?cliente.nombre:"Cliente"} · {prod?prod.nombre:p.producto} {p.cantidad}L</span>
              <span style={{fontSize:12,color:"#8FE3B4",flexShrink:0,fontWeight:700}}>{p.horaEntrega}hs</span>
            </button>
          );})}
          {recordatoriosHoy.map(r=>(
            <div key={"re"+r.id} style={{width:"100%",padding:"10px 16px",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",alignItems:"center",gap:10}}>
              <span style={{color:"#8FE3B4",flexShrink:0}}>{I.alert}</span>
              <span style={{flex:1,fontSize:13,color:"#fff",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.titulo}</span>
              <span style={{fontSize:12,color:"#8FE3B4",flexShrink:0,fontWeight:700}}>{r.hora}hs</span>
            </div>
          ))}
        </div>
      )}

      {/* Botón cargar pedido */}
      <button onClick={()=>setTab("pedidos")} style={{width:"100%",padding:"15px 18px",borderRadius:18,background:G,border:"none",cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",gap:12,boxShadow:`0 4px 14px ${G}44`}}>
        <span style={{color:"#fff",flexShrink:0}}>{I.box}</span>
        <span style={{flex:1,textAlign:"left",fontSize:15,fontWeight:700,color:"#fff"}}>Cargar pedido</span>
        <span style={{color:"#fff",opacity:0.75}}>{I.chev}</span>
      </button>
 
      {/* Últimos pedidos cargados */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderBottom:`1px solid ${BO}`,gap:8,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>{I.box}<span style={{fontSize:14,fontWeight:700,color:CR}}>Últimos pedidos</span></div>
          <button onClick={()=>setTab("pedidos")} style={{fontSize:12,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:2}}>Ver todos{I.chev}</button>
        </div>
        <div style={{display:"flex",gap:6,padding:"10px 16px 0"}}>
          {[{k:"todos",l:"Todos"},{k:"pendientes",l:"Pendientes"},{k:"entregados",l:"Entregados"}].map(f=>(
            <button key={f.k} onClick={()=>setFiltroPedidos(f.k)} style={{padding:"5px 12px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filtroPedidos===f.k?G:BO}`,background:filtroPedidos===f.k?G:"transparent",color:filtroPedidos===f.k?"#fff":MU}}>{f.l}</button>
          ))}
        </div>
        {ultimosPedidos.length===0?(
          <p style={{color:MU,fontSize:14,textAlign:"center",padding:"20px 16px"}}>Todavía no cargaste pedidos.</p>
        ):ultimosPedidos.map(p=>{
          const cliente=clientes.find(c=>c.id===p.clienteId);
          const nombreCliente=cliente?cliente.nombre:"Cliente eliminado";
          const lineas=p.lineas||[];
          const resumen=lineas.length
            ?lineas.map(l=>{const prod=prods.find(x=>x.id===l.productoId);return`${l.cantidad}L ${prod?prod.nombre:l.productoId}`;}).join(" + ")
            :(prods.find(x=>x.id===p.producto)?.nombre||"—");
          const entregado=p.estado==="entregado";
          return(
            <button key={p.id} onClick={()=>setTab("pedidos")} style={{width:"100%",padding:"10px 16px",background:"none",border:"none",borderTop:`1px solid ${BO}`,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,textAlign:"left"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{iniciales(nombreCliente)}</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nombreCliente}</div>
                  <div style={{fontSize:11,color:MU,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{resumen}</div>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:600,color:CR}}>{fmtARS(p.montoTotal||0)}</div>
                <div style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:3,padding:"2px 8px",borderRadius:20,background:entregado?GLT:AM+"1a"}}>
                  <span style={{width:5,height:5,borderRadius:"50%",background:entregado?G:AM}}/>
                  <span style={{fontSize:10,fontWeight:700,color:entregado?G:AM}}>{entregado?"Entregado":"Pendiente"}</span>
                </div>
              </div>
            </button>
          );
        })}
      </div>

      {/* Meta semanal */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:13,fontWeight:700,color:CR}}>🎯 Meta semanal</span>
          {!editandoMeta&&<button onClick={()=>{setMetaTmp(String(metaSemanal));setEditandoMeta(true);}} style={{fontSize:11,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>{I.edit}Editar</button>}
        </div>
        {editandoMeta?(
          <div style={{display:"flex",gap:8}}>
            <input type="number" inputMode="numeric" value={metaTmp} onChange={e=>setMetaTmp(e.target.value)} placeholder="Litros por semana" autoFocus/>
            <button onClick={()=>{const n=Number(metaTmp);if(n>0)setMetaSemanal(n);setEditandoMeta(false);}} style={{padding:"0 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontWeight:700,cursor:"pointer"}}>{I.check}</button>
          </div>
        ):metaSemanal>0?(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
              <span className="bebas" style={{fontSize:20,color:G}}>{litrosSemana}L <span style={{fontSize:14,color:MU}}>/ {metaSemanal}L</span></span>
              <span style={{fontSize:12,color:MU}}>{diasRest} día{diasRest!==1?"s":""} restantes</span>
            </div>
            <div style={{height:8,background:BO,borderRadius:4,overflow:"hidden"}}>
              <div style={{width:`${pctMeta}%`,height:"100%",background:pctMeta>=100?GR:G,borderRadius:4,transition:"width 0.4s"}}/>
            </div>
            <div style={{fontSize:12,color:pctMeta>=100?GR:MU,marginTop:6,fontWeight:pctMeta>=100?700:400}}>
              {pctMeta>=100?"🎉 ¡Meta alcanzada esta semana!":`Llevás ${pctMeta}% de la meta`}
            </div>
          </>
        ):(
          <button onClick={()=>setEditandoMeta(true)} style={{fontSize:13,color:MU,background:"none",border:`1px dashed ${BO}`,borderRadius:8,padding:"10px 0",width:"100%",cursor:"pointer"}}>Definir meta semanal de litros</button>
        )}
      </div>
 
      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
        {[{l:"Vendido",v:fmtARS(totalARS),ic:I.trend},{l:"Litros",v:`${litros}L`,ic:I.box},{l:"Activos",v:String(activos),ic:I.users}].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:"14px 12px"}}>
            <div style={{width:26,height:26,borderRadius:9,background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:8}}>{React.cloneElement(s.ic,{width:14,height:14})}</div>
            <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:2}}>{s.l}</div>
            <div className="bebas" style={{fontSize:18,color:CR}}>{s.v}</div>
          </div>
        ))}
      </div>

      {/* Mini gráfico: litros por día de la semana */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Litros vendidos esta semana</div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90}}>
          {litrosPorDia.map(d=>(
            <div key={d.lbl} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
              <div style={{width:"100%",maxWidth:22,height:`${Math.max(4,Math.round((d.total/maxDia)*68))}px`,borderRadius:6,background:d.esHoy?G:GLT,transition:"height 0.4s"}}/>
              <span style={{fontSize:10,fontWeight:d.esHoy?700:500,color:d.esHoy?G:MU}}>{d.lbl}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Alerta: deuda pendiente */}
      {deuda>0&&(
        <button onClick={()=>setTab("cuentascorrientes")} style={{display:"block",width:"100%",background:RE+"11",border:`1px solid ${RE}33`,borderRadius:16,padding:"12px 14px",cursor:"pointer",textAlign:"left",marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"#E08070",textTransform:"uppercase",letterSpacing:"0.06em"}}>Por cobrar</div>
          <div className="bebas" style={{fontSize:18,color:"#E08070",marginTop:2}}>{fmtARS(deuda)}</div>
        </button>
      )}

 
      {/* Top 5 prospectos */}
      <div style={{background:CA,border:`1px solid ${G}44`,borderRadius:18,overflow:"hidden",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${BO}`}}>{I.zap}<span style={{fontSize:14,fontWeight:700,color:G}}>Top 5 para visitar hoy</span><span style={{fontSize:11,color:MU,marginLeft:"auto"}}>por score</span></div>
        {top5.length===0?<p style={{color:MU,fontSize:14,textAlign:"center",padding:"20px 16px"}}>Cargá prospectos para ver el ranking.</p>:top5.map((p,idx)=>(
          <button key={p.id} onClick={()=>setTab("comercios")} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"11px 16px",background:"none",border:"none",borderBottom:`1px solid ${BO}`,cursor:"pointer",textAlign:"left"}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:idx===0?G+"33":BO,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:12,fontWeight:700,color:idx===0?G:MU}}>#{idx+1}</span></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</div>
              <div style={{fontSize:11,color:MU,marginTop:2}}>{p.rubro} · {p.zona}</div>
              <div style={{marginTop:6}}><ScoreBar score={p._score}/></div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
              <Pill color={PEST[p.estado]}>{p.estado}</Pill>
              {p.telefono&&<span style={{fontSize:10,color:GR,display:"flex",alignItems:"center",gap:3}}>{I.phone}WA listo</span>}
            </div>
          </button>
        ))}
        <button onClick={()=>setTab("comercios")} style={{width:"100%",padding:"10px 16px",background:"none",border:"none",fontSize:13,color:G,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>Ver todos {I.chev}</button>
      </div>
 
      {/* Alertas clientes */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${BO}`,color:G}}>{I.alert}<span style={{fontSize:14,fontWeight:600,color:CR}}>Clientes con seguimiento</span></div>
        {alertas.length===0?<p style={{color:MU,fontSize:14,textAlign:"center",padding:"20px 16px"}}>Todos los clientes al día 🍺</p>:alertas.map(c=>{const ls=lastSale(c),d=ls?daysSince(ls.fecha):null,e=EST[estadoC(c)];return(

            <div><div style={{fontSize:14,fontWeight:600,color:CR}}>{c.nombre}</div><div style={{fontSize:12,color:e.c}}>{d} días sin pedir · {c.zona}</div></div>
            <span style={{color:MU}}>{I.chev}</span>
          </button>
        );})}
