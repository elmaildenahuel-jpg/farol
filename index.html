  {key:"ventas",label:"Ventas",icon:<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>},
  {key:"metricas",label:"Métricas",icon:<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>},
  {key:"productos",label:"Productos",icon:<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>},
  {key:"config",label:"Config",icon:<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>},
];
 
function App(){
  const[tab,setTab]=useState("inicio");
  const[clientes,setClientes]=useState(initClientes);
  const[prospectos,setProspectos]=useState(initProspectos);
  const[speeches,setSpeeches]=useState(initSpeeches);
  const[pedidos,setPedidos]=useState([]);
  const[prods,setProds]=useState(PRODS_INIT);
  const[metaSemanal,setMetaSemanal]=useState(0);
  const cal=useGoogleCalendar();
 
  // Sincronización Firebase — todos los datos en la nube
  const syncStatus=useFirebaseSync(
    clientes,setClientes,
    prospectos,setProspectos,
    speeches,setSpeeches,
    pedidos,setPedidos,
    prods,setProds,
    metaSemanal,setMetaSemanal
  );
 
  const convertir=p=>{
    setClientes(prev=>[...prev,{id:uid(),nombre:p.nombre,rubro:p.rubro,zona:p.zona,direccion:p.direccion,telefono:p.telefono,notas:p.notas,agenda:[],historial:[],ventas:[]}]);
    setProspectos(prev=>prev.filter(x=>x.id!==p.id));
    setTab("clientes");
  };
 
  const TABS_MOBILE=TABS.filter(t=>["inicio","clientes","pedidos","ventas","metricas"].includes(t.key));
 
  return(
    <div style={{minHeight:"100vh",background:BG}}>
      <div style={{display:"flex"}}>
        {/* Sidebar desktop */}
        <aside style={{width:200,minHeight:"100vh",background:SU,borderRight:`1px solid ${BO}`,position:"fixed",top:0,left:0,flexDirection:"column",display:"none"}} id="sb">
          <div style={{padding:"24px 20px 16px",borderBottom:`1px solid ${BO}`}}>
            <div className="bebas" style={{fontSize:34,color:G}}>FAROL</div>
            <div style={{fontSize:9,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>Rubia Arrabalera · IPA Malandra</div>
          </div>
          <nav style={{padding:12,display:"flex",flexDirection:"column",gap:4,flex:1,overflowY:"auto"}}>
            {TABS.map(({key,label,icon})=>(
              <button key={key} onClick={()=>setTab(key)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",border:"none",background:tab===key?G:"transparent",color:tab===key?"#000":MU}}>{icon}{label}</button>
            ))}
          </nav>
          <div style={{padding:"16px 20px",borderTop:`1px solid ${BO}`}}>
            <SyncBadge status={syncStatus}/>
            <div style={{fontSize:9,color:BO,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginTop:8}}>Triple P · Premium · Popular · Porteña</div>
          </div>
        </aside>
 
        <main style={{flex:1,paddingTop:56,minHeight:"100vh"}} id="mn">
          {tab==="inicio"&&<Inicio clientes={clientes} prospectos={prospectos} pedidos={pedidos} prods={prods} metaSemanal={metaSemanal} setMetaSemanal={setMetaSemanal} setTab={setTab}/>}
          {tab==="clientes"&&<Clientes clientes={clientes} setClientes={setClientes} speeches={speeches} cal={cal} prods={prods}/>}
          {tab==="comercios"&&<Comercios prospectos={prospectos} setProspectos={setProspectos} onConvertir={convertir} speeches={speeches}/>}
          {tab==="pedidos"&&<Pedidos pedidos={pedidos} setPedidos={setPedidos} clientes={clientes} setClientes={setClientes} prods={prods} setProds={setProds}/>}
          {tab==="maps"&&<BuscadorMaps prospectos={prospectos} setProspectos={setProspectos}/>}
          {tab==="speeches"&&<Speeches speeches={speeches} setSpeeches={setSpeeches}/>}
          {tab==="ventas"&&<Ventas clientes={clientes} prods={prods}/>}
          {tab==="metricas"&&<Metricas clientes={clientes} prods={prods}/>}
          {tab==="productos"&&<Productos prods={prods} setProds={setProds}/>}
          {tab==="config"&&<Configuracion cal={cal} clientes={clientes} prods={prods}/>}
        </main>
      </div>
 
      {/* Header mobile */}
      <div id="tb" style={{position:"fixed",top:0,left:0,right:0,zIndex:40,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",background:"#FFFFFF",borderBottom:`1px solid ${BO}`,boxShadow:"0 1px 8px rgba(0,0,0,0.08)"}}>
        <span className="bebas" style={{fontSize:26,color:G}}>FAROL</span>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <SyncBadge status={syncStatus}/>
          <button onClick={()=>setTab("config")} style={{fontSize:11,padding:"5px 10px",borderRadius:8,background:tab==="config"?G:"none",border:`1px solid ${tab==="config"?G:BO}`,color:tab==="config"?"#fff":cal.calToken?GR:MU,cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
            {cal.calToken?"📅✓":"⚙️"}
          </button>
        </div>
      </div>
 
      {/* Bottom nav mobile - DOS FILAS */}
      <div id="bn" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:40,background:"#FFFFFF",borderTop:`1px solid ${BO}`,boxShadow:"0 -2px 12px rgba(0,0,0,0.08)"}}>
        {/* Fila 1: tabs principales */}
        <div style={{display:"flex",borderBottom:`1px solid ${BO}`}}>
          {[
            {key:"inicio",label:"Inicio",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>},
            {key:"clientes",label:"Clientes",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>},
            {key:"comercios",label:"Comercios",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7"/><rect x="3" y="9" width="18" height="13" rx="1"/><path d="M9 22V12h6v10"/></svg>},
            {key:"pedidos",label:"Pedidos",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>},
          ].map(({key,label,icon})=>(
            <button key={key} onClick={()=>setTab(key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",gap:2,background:"none",border:"none",cursor:"pointer",color:tab===key?G:MU,borderTop:tab===key?`2px solid ${G}`:"2px solid transparent"}}>
              {icon}<span style={{fontSize:10,fontWeight:700}}>{label}</span>
            </button>
          ))}
        </div>
        {/* Fila 2: tabs secundarios */}
        <div style={{display:"flex"}}>
          {[
            {key:"ventas",label:"Ventas",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>},
            {key:"metricas",label:"Métricas",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>},
            {key:"maps",label:"Buscar",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>},
            {key:"speeches",label:"Speeches",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>},
            {key:"productos",label:"Productos",icon:<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>},
          ].map(({key,label,icon})=>(
            <button key={key} onClick={()=>setTab(key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",gap:2,background:"none",border:"none",cursor:"pointer",color:tab===key?G:MU,borderTop:tab===key?`2px solid ${G}`:"2px solid transparent"}}>
              {icon}<span style={{fontSize:10,fontWeight:700}}>{label}</span>
            </button>
          ))}
        </div>
      </div>
 
      <style>{`@media(min-width:768px){#sb{display:flex!important}#mn{margin-left:200px;padding-top:0!important}#tb{display:none!important}#bn{display:none!important}}`}</style>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
