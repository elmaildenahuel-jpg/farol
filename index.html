function calcScore(p){
  const rS=RUBRO_SCORE[p.rubro]||6,zS=ZONA_SCORE[p.zona]||10,eS=ESTADO_SCORE[p.estado]||0;
  const telS=p.telefono?15:0,notasS=p.notas&&p.notas.length>30?5:p.notas?2:0;
  return Math.min(100,rS+zS+eS+telS+notasS);
}

const fmtARS=n=>n.toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});

  if(isNaN(d.getTime()))return"—";

};
// ── Catálogo PDF (para compartir por WhatsApp) ──────────────────────
function construirCatalogoPDF(prods){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const pageW=210,pageH=297,marginX=15;
  const envaseColor=e=>({PET:[23,141,79],Barril:[183,121,31],Lata:[70,110,190]}[e]||[86,91,96]);

  // Header
  doc.setFillColor(14,74,44);
  doc.rect(0,0,pageW,36,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.text("GRUNGE & FAROL",marginX,20);
  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  doc.text("Catálogo de productos",marginX,28);
  doc.setFontSize(9);
  const fecha=new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
  doc.text(fecha,pageW-marginX,28,{align:"right"});

  let y=48;
  (prods||[]).forEach(p=>{
    const tienePromos=(p.promos||[]).length>0;
    const descLines=p.descripcion?doc.splitTextToSize(String(p.descripcion),pageW-marginX*2-40):[];
    let cardH=22+(descLines.length?descLines.length*4.2:0)+(tienePromos?7:0);
    if(y+cardH>pageH-22){doc.addPage();y=20;}
    const[cr,cg,cb]=envaseColor(p.envase);

    doc.setFillColor(255,255,255);
    doc.setDrawColor(228,231,229);
    doc.setLineWidth(0.3);
    doc.roundedRect(marginX,y,pageW-marginX*2,cardH,3,3,"FD");
    doc.setFillColor(cr,cg,cb);
    doc.roundedRect(marginX,y,3,cardH,1.5,1.5,"F");

    doc.setTextColor(26,26,26);
    doc.setFont("helvetica","bold");
    doc.setFontSize(13);
    doc.text(String(p.nombre||"Producto"),marginX+8,y+9);

    doc.setFont("helvetica","normal");
    doc.setFontSize(9.5);
    doc.setTextColor(86,91,96);
    doc.text(`${p.marca||"Farol"} · ${p.envase||"PET"}`,marginX+8,y+15.5);

    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.setTextColor(cr,cg,cb);
    const precioTxt=fmtARS(p.precio||0);
    doc.text(precioTxt,pageW-marginX-6,y+11,{align:"right"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.setTextColor(120,120,120);
    doc.text("por litro",pageW-marginX-6,y+15.5,{align:"right"});

    let yy=y+21;
    if(descLines.length){
      doc.setFont("helvetica","italic");
      doc.setFontSize(9);
      doc.setTextColor(110,114,118);
      doc.text(descLines,marginX+8,yy);
      yy+=descLines.length*4.2;
    }
    if(tienePromos){
      doc.setFont("helvetica","normal");
      doc.setFontSize(8.5);
      doc.setTextColor(23,141,79);
      const promoTxt=p.promos.map(pr=>`Desde ${pr.minCantidad}u: ${fmtARS(pr.precioUnitario)} c/u`).join("   ·   ");
      doc.text(promoTxt,marginX+8,yy+1,{maxWidth:pageW-marginX*2-14});
    }
    y+=cardH+6;
  });

  const totalPages=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFont("helvetica","italic");
    doc.setFontSize(9);
    doc.setTextColor(150,150,150);
    doc.text("¡Escribinos para hacer tu pedido! · Grunge & Farol",pageW/2,pageH-12,{align:"center"});
  }
  return doc;
}
async function compartirCatalogoPDF(prods){
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert("No se pudo cargar el generador de PDF (jsPDF). Revisá tu conexión a internet y volvé a intentar. Si persiste, avisame para revisarlo.");
    return;
  }
  try{
    const doc=construirCatalogoPDF(prods);
    const fileName=`catalogo-farol-${hoyISO()}.pdf`;
    const blob=doc.output("blob");
    let compartido=false;

    if(navigator.share&&navigator.canShare){
      try{
        const file=new File([blob],fileName,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Catálogo Grunge & Farol",text:"Catálogo de productos Grunge & Farol 🍺"});
          compartido=true;
        }
      }catch(e){
        if(e&&e.name==="AbortError")compartido=true; // el usuario cerró el menú de compartir, no reintentar
      }
    }

    if(!compartido){
      // Abrimos el PDF en una pestaña nueva: el visor de PDF del navegador/celular tiene su propio
      // botón de compartir y guardar, mucho más confiable en mobile que forzar una descarga invisible.
      const url=URL.createObjectURL(blob);
      const nuevaVentana=window.open(url,"_blank");
      if(!nuevaVentana){
        const a=document.createElement("a");a.href=url;a.download=fileName;a.target="_blank";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        alert("Se abrió/descargó el catálogo. Si no ves nada, revisá si el navegador bloqueó una ventana emergente y permitila para este sitio.");
      }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
  }catch(e){
    alert("No se pudo generar el catálogo:\n\n"+(e&&e.message?e.message:String(e))+"\n\nMandame este mensaje para arreglarlo.");
  }
}

function construirRemitoPDF(pedido,cliente,prods){

  const pageW=210,marginX=15;

  if(cliente&&cliente.rubro){doc.text(`${cliente.rubro}${cliente.zona?" · "+cliente.zona:""}`,marginX,y);y+=5.5;}
  if(cliente&&cliente.telefono){doc.text(`Tel: ${cliente.telefono}`,marginX,y);y+=5.5;}

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);
  doc.setTextColor(86,91,96);
  const fechaTxt=`Fecha de entrega: ${fmtDate(pedido.fechaEntrega)} · ${pedido.horaEntrega}hs`;
  doc.text(fechaTxt,pageW-marginX,42,{align:"right"});
  doc.text(pedido.pagado?"Pagado":"Cuenta corriente",pageW-marginX,47.5,{align:"right"});

  y=Math.max(y,58)+4;
  doc.setDrawColor(228,231,229);
  doc.setLineWidth(0.3);
  doc.line(marginX,y,pageW-marginX,y);
  y+=8;

  // Tabla de ítems
  doc.setFont("helvetica","bold");
  doc.setFontSize(9.5);
  doc.setTextColor(120,120,120);
  doc.text("PRODUCTO",marginX,y);
  doc.text("CANT.",pageW-marginX-58,y,{align:"right"});
  doc.text("DESC.",pageW-marginX-32,y,{align:"right"});
  doc.text("SUBTOTAL",pageW-marginX,y,{align:"right"});
  y+=3;
  doc.setLineWidth(0.2);
  doc.line(marginX,y,pageW-marginX,y);
  y+=6;

  doc.setFont("helvetica","normal");
  doc.setFontSize(10.5);
  (pedido.lineas||[]).forEach(l=>{
    const prod=prods.find(x=>x.id===l.productoId);
    const esLata=prod&&prod.envase==="Lata";
    doc.setTextColor(26,26,26);
    doc.text(prod?nombreProdEnvase(prod):l.productoId,marginX,y,{maxWidth:pageW-marginX*2-90});
    doc.text(`${l.cantidad}${esLata?"u":"L"}`,pageW-marginX-58,y,{align:"right"});
    doc.setTextColor(l.descuentoPct>0?200:26,l.descuentoPct>0?60:26,l.descuentoPct>0?60:26);
    doc.text(l.descuentoPct>0?`-${l.descuentoPct}%`:"—",pageW-marginX-32,y,{align:"right"});
    doc.setTextColor(26,26,26);
    doc.setFont("helvetica","bold");
    doc.text(fmtARS(l.monto||0),pageW-marginX,y,{align:"right"});
    doc.setFont("helvetica","normal");
    y+=7.5;
  });

  y+=2;
  doc.setDrawColor(228,231,229);
  doc.line(marginX,y,pageW-marginX,y);
  y+=8;

  const totalLineas=(pedido.lineas||[]).reduce((s,l)=>s+(l.monto||0),0);
  doc.setFontSize(10.5);
  doc.setTextColor(86,91,96);
  doc.text("Subtotal",pageW-marginX-45,y,{align:"right"});
  doc.text(fmtARS(totalLineas),pageW-marginX,y,{align:"right"});
  y+=6.5;

    return;

    const doc=construirRemitoPDF(pedido,cliente,prods);
    const nroRemito=(pedido.id||"").replace(/\D/g,"").slice(-6)||String(Date.now()).slice(-6);
    const fileName=`remito-${nroRemito}-${(cliente&&cliente.nombre?cliente.nombre.replace(/\s+/g,"-").toLowerCase():"cliente")}.pdf`;

      try{

          compartido=true;
        }

        if(e&&e.name==="AbortError")compartido=true;
      }
    }

    if(!compartido){
      const url=URL.createObjectURL(blob);
      const nuevaVentana=window.open(url,"_blank");
      if(!nuevaVentana){
        const a=document.createElement("a");a.href=url;a.download=fileName;a.target="_blank";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        alert("Se abrió/descargó el remito. Si no ves nada, revisá si el navegador bloqueó una ventana emergente y permitila para este sitio.");
      }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
  }catch(e){
    alert("No se pudo generar el remito:\n\n"+(e&&e.message?e.message:String(e))+"\n\nMandame este mensaje para arreglarlo.");
  }finally{
    onEstado&&onEstado(false);
  }
}

// contando cualquier producto de la MARCA (y envase, si se restringió) configurada — no un producto puntual —
// y calcula cuántos bonos ya ganó el cliente vs. cuántos bonos ya se le entregaron.
const prodCuentaParaPromo=(prod,promo51)=>{
  if(!prod||!promo51||!promo51.marcaCuenta)return false;
  if(prod.marca!==promo51.marcaCuenta)return false;
  if(promo51.envaseCuenta&&prod.envase!==promo51.envaseCuenta)return false;
  return true;
};
const progresoPromo51=(cliente,promo51,prods)=>{
  if(!promo51||!promo51.activo||!promo51.marcaCuenta||!promo51.cantidadNecesaria)return null;
  const ventas=cliente.ventas||[];
  const prodMap={};(prods||[]).forEach(p=>{prodMap[p.id]=p;});
  const acumulado=ventas.filter(v=>v.promoAcumulable&&prodCuentaParaPromo(prodMap[v.producto],promo51)).reduce((s,v)=>s+Number(v.cantidad||0),0);
  const bonoEntregadoU=ventas.filter(v=>promo51.productoBonoId&&v.producto===promo51.productoBonoId&&v.esBono).reduce((s,v)=>s+Number(v.cantidad||0),0);
  const cantBono=promo51.cantidadBono||1;
  const bonosGanados=Math.floor(acumulado/promo51.cantidadNecesaria);
  const bonosEntregados=cantBono>0?Math.floor(bonoEntregadoU/cantBono):0;
  const bonosPendientes=Math.max(0,bonosGanados-bonosEntregados);
  const enCicloActual=acumulado%promo51.cantidadNecesaria;
  return{acumulado,bonosGanados,bonosEntregados,bonosPendientes,enCicloActual,faltan:promo51.cantidadNecesaria-enCicloActual};
};

  try{

      setTimeout(()=>{
        const o=ctx.createOscillator(),g=ctx.createGain();

// Aplica un cobro (total o parcial) a las ventas pendientes de un cliente, de más antigua a más nueva.
// Registra fechaCobro y medioPago en cada venta saldada; si el monto no alcanza a cubrir una venta, la divide en dos.
function aplicarCobroACliente(cliente,montoCobro,{medioPago="Efectivo",nota="",fecha=null}={}){
  const monto=Number(montoCobro);
  if(!monto||monto<=0)return cliente;
  const pendientesOrdenadas=(cliente.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(v=>v.id);
  let restante=monto;
  const fechaCobro=fecha||hoyISO();
  const nuevasVentas=[...cliente.ventas].map(v=>{
    if(v.pagado||!pendientesOrdenadas.includes(v.id)||restante<=0)return v;
    if(restante>=v.monto){restante-=v.monto;return{...v,pagado:true,fechaCobro,medioPago,nota:nota||v.nota||""};}
    const montoPagado=restante,montoRestante=v.monto-restante;
    const cantPagada=Math.round((v.cantidad*(montoPagado/v.monto))*10)/10;
    restante=0;
    return{...v,_split:true,_montoPagado:montoPagado,_montoRestante:montoRestante,_cantPagada:cantPagada,_cantRestante:v.cantidad-cantPagada};
  });
  const ventasFinales=[];
  nuevasVentas.forEach(v=>{
    if(v._split){
      ventasFinales.push({id:v.id,fecha:v.fecha,producto:v.producto,cantidad:v._cantPagada,monto:v._montoPagado,pagado:true,fechaCobro,medioPago,nota:nota||v.nota||""});
      ventasFinales.push({id:uid(),fecha:v.fecha,producto:v.producto,cantidad:v._cantRestante,monto:v._montoRestante,pagado:false});
    }else{ventasFinales.push(v);}
  });
  return{...cliente,ventas:ventasFinales};
}

function rangoSemanaActual(){
  const hoy=new Date(),dia=hoy.getDay(),offsetLunes=dia===0?-6:1-dia;
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()+offsetLunes); lunes.setHours(0,0,0,0);
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6); domingo.setHours(23,59,59,999);
  return{lunes,domingo};
}
function litrosEstaSemana(clientes,prods){
  const envaseMap=envaseMapDe(prods);
  const{lunes,domingo}=rangoSemanaActual(); let total=0;
  clientes.forEach(c=>(c.ventas||[]).forEach(v=>{const f=new Date(v.fecha+"T00:00:00");if(f>=lunes&&f<=domingo)total+=litrosDeItem(v.cantidad,envaseMap[v.producto]);}));
  return total;
}

}

// ── Google Calendar hook ──────────────────────────────────────────
function useGoogleCalendar(){
  const[calToken,setCalToken]=useState(null);
  const[calError,setCalError]=useState("");
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const tokenClientRef=React.useRef(null);
 
  // Inicializar gapi.client (librería de Google APIs)
  React.useEffect(()=>{
    const initGapi=()=>{
      if(!window.gapi){setTimeout(initGapi,500);return;}
      window.gapi.load("client",async()=>{
        try{
          await window.gapi.client.init({});
          await window.gapi.client.load("https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest");
          setGapiReady(true);
        }catch(e){
          console.warn("gapi.client init falló:",e);
          setGapiReady(true); // igual marcamos ready para no bloquear
        }
      });
    };
    initGapi();
  },[]);
 
  // Esperar a que Google Identity Services esté disponible
  React.useEffect(()=>{
    const check=()=>{if(window.google?.accounts?.oauth2){setGisReady(true);}else{setTimeout(check,500);}};
    check();
  },[]);
 
  const login=()=>{
    const clientId=getCalClientId();
    if(!clientId){
      setCalError("Primero pegá tu Client ID en Configuración → Google Calendar.");
      return;
    }
    if(!gisReady){setCalError("Google Identity todavía cargando, esperá unos segundos y volvé a intentar.");return;}
    try{
      // Siempre recreamos el token client por si cambió el client_id
      tokenClientRef.current=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:GCAL_SCOPE,
        callback:(resp)=>{
          if(resp.error){
            setCalError("Error OAuth: "+resp.error+". Verificá que el origen esté autorizado en Google Cloud Console.");
            return;
          }
          setCalToken(resp.access_token);
          setCalError("");
          if(window.gapi?.client) window.gapi.client.setToken({access_token:resp.access_token});
        },
        error_callback:(err)=>{
          setCalError("Popup bloqueado o cancelado. Permití popups para este sitio.");
        }
      });
      tokenClientRef.current.requestAccessToken({prompt:""});
    }catch(e){
      setCalError("No se pudo iniciar el login: "+e.message);
    }
  };
 
  const logout=()=>{
    if(calToken&&window.google?.accounts?.oauth2) window.google.accounts.oauth2.revoke(calToken,()=>{});
    setCalToken(null);
    setCalError("");
    tokenClientRef.current=null;
  };
 
  const crearEvento=async({titulo,descripcion,fecha,hora,durMin=60})=>{
    if(!calToken){login();return false;}
    if(!gapiReady){setCalError("La API de Google Calendar todavía está cargando.");return false;}
    try{
      const inicio=new Date(`${fecha}T${hora}:00`);
      const fin=new Date(inicio.getTime()+durMin*60000);
      const toISO=d=>d.toISOString();
      await window.gapi.client.calendar.events.insert({
        calendarId:"primary",
        resource:{
          summary:titulo,
          description:descripcion||"",
          start:{dateTime:toISO(inicio),timeZone:"America/Argentina/Buenos_Aires"},
          end:{dateTime:toISO(fin),timeZone:"America/Argentina/Buenos_Aires"},
          reminders:{useDefault:false,overrides:[{method:"popup",minutes:60},{method:"popup",minutes:10}]},
        }
      });
      return true;
    }catch(e){
      const msg=e.result?.error?.message||e.message||"Error desconocido";
      // Token expirado → intentar renovar
      if(e.status===401){setCalToken(null);login();return false;}
      setCalError("Error al crear evento: "+msg);
      return false;
    }
  };
 
  return{calToken,calError,gapiReady,gisReady,login,logout,crearEvento};
}

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>

        <div><Lbl t="% descuento"/><input type="number" inputMode="numeric" value={f.descuentoPct} onChange={s("descuentoPct")} placeholder="0"/></div>

            {sugConDescuento?<>Sug. con {descPct}% desc: {fmtARS(sugConDescuento)} <span style={{color:MU,textDecoration:"line-through"}}>{fmtARS(sug)}</span></>:<>Sug: {fmtARS(sug)}</>} — usar este monto
          </button>
        )}

      {promoAplicada&&<div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"8px 12px",fontSize:14,color:G}}>🏷 Promo aplicada: {fmtARS(promoAplicada.precioUnitario)}/L desde {promoAplicada.minCantidad}L</div>}
      <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 12px",fontSize:14,color:MU}}>
        {comisionPctDefault?<>% comisión del cliente: <b style={{color:G}}>{comisionPctDefault}%</b>{gananciaEstimada!=null&&<> · Ganancia estimada: <b style={{color:G}}>{fmtARS(gananciaEstimada)}</b></>}</>:<>Este cliente no tiene % de comisión configurado (se puede cargar en su ficha).</>}
      </div>
      <div><Lbl t="¿Se cobró al momento de la entrega?"/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8}}>
          <button onClick={()=>setF(p=>({...p,pagado:true}))} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${f.pagado?GR:BO}`,background:f.pagado?GR+"22":"transparent",color:f.pagado?GR:MU,fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ Pagado</button>
          <button onClick={()=>setF(p=>({...p,pagado:false}))} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${!f.pagado?AM:BO}`,background:!f.pagado?AM+"22":"transparent",color:!f.pagado?AM:MU,fontSize:15,fontWeight:700,cursor:"pointer"}}>Cuenta corriente</button>
        </div>
      </div>
      <div style={{display:"flex",gap:8,paddingTop:4}}><Btn variant="ghost" onClick={onCancel}>Cancelar</Btn><Btn variant="green" onClick={()=>f.cantidad&&f.monto&&onSave({fecha:f.fecha,producto:f.producto,cantidad:Number(f.cantidad),monto:Number(f.monto),descuentoPct:descPct||0,pagado:f.pagado})} disabled={!f.cantidad||!f.monto}>Registrar</Btn></div>
    </div>
  );
}

function SpeechPicker({open,onClose,speeches,telefono,nombre}){
  const[cp,setCp]=useState(null);
  const send=s=>{navigator.clipboard?.writeText(s.texto);setCp(s.id);setTimeout(()=>setCp(null),1500);const l=waLink(telefono,s.texto);if(l)window.open(l,"_blank");};
  return(
    <Modal open={open} onClose={onClose} title={`Speech → ${nombre}`}>
      <p style={{fontSize:15,color:MU,marginBottom:16}}>El mensaje se copia y se abre WhatsApp.</p>
      {speeches.filter(s=>s.canal==="WhatsApp").map(s=>(
        <div key={s.id} style={{background:BG,border:`1px solid ${BO}`,borderRadius:18,padding:14,marginBottom:10}}>
          <div style={{fontSize:16,fontWeight:600,color:CR,marginBottom:2}}>{s.titulo}</div>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>{s.categoria}</div>
          <div style={{fontSize:15,color:"#A89682",lineHeight:1.6,whiteSpace:"pre-wrap",marginBottom:12}}>{s.texto}</div>
          <button onClick={()=>send(s)} style={{width:"100%",padding:"9px 0",borderRadius:8,fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,border:`1px solid ${cp===s.id?"#25D36640":G+"44"}`,background:cp===s.id?"#25D36620":G+"22",color:cp===s.id?"#25D366":G}}>
            {cp===s.id?<>{I.check}Copiado · Abriendo WA...</>:<>{I.wa}Copiar y abrir WhatsApp</>}
          </button>
        </div>
      ))}
    </Modal>
  );
}
 
// ── CuentaCorriente ───────────────────────────────────────────────
function CuentaCorriente({cliente,onUpdate,diasMora}){
  const[montoPago,setMontoPago]=useState("");
  const[showParcial,setShowParcial]=useState(false);
  const[showHistorial,setShowHistorial]=useState(false);
  const[showCobroIndep,setShowCobroIndep]=useState(false);
  const[montoCobroIndep,setMontoCobroIndep]=useState("");
  const[notaCobro,setNotaCobro]=useState("");
  const[medioPago,setMedioPago]=useState("Efectivo");
  const[fechaCobroSel,setFechaCobroSel]=useState(hoyISO());
 
  const pendientes=(cliente.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const pagadas=(cliente.ventas||[]).filter(v=>v.pagado).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const saldo=saldoCliente(cliente);
  const hayVencidas=pendientes.some(v=>daysSince(v.fecha)>=diasMora);
 
  const marcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:true,fechaCobro:fechaCobroSel||hoyISO(),medioPago}:v)});
  const desmarcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:false,fechaCobro:null}:v)});
  const marcarTodo=()=>onUpdate(aplicarCobroACliente(cliente,saldo,{medioPago,fecha:fechaCobroSel}));
 
  // Cobro independiente — registra un pago sin crear venta nueva
  const registrarCobroIndependiente=()=>{
    onUpdate(aplicarCobroACliente(cliente,montoCobroIndep,{medioPago,nota:notaCobro,fecha:fechaCobroSel}));
    setMontoCobroIndep("");setNotaCobro("");setShowCobroIndep(false);
  };
 
  const aplicarPagoParcial=()=>{
    onUpdate(aplicarCobroACliente(cliente,montoPago,{medioPago,fecha:fechaCobroSel}));
    setMontoPago("");setShowParcial(false);
  };
 
  return(
    <div style={{background:saldo>0?RE+"11":GR+"11",border:`1px solid ${saldo>0?RE+"33":GR+"33"}`,borderRadius:10,padding:14,marginBottom:14}}>
      {/* Saldo siempre visible */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:saldo>0?12:0}}>
        <span style={{fontSize:16,fontWeight:700,color:saldo>0?"#C62828":GR}}>
          {saldo>0?"💰 Cuenta corriente":"✓ Sin deuda pendiente"}
        </span>
        <span className="bebas" style={{fontSize:24,color:saldo>0?"#C62828":GR}}>{fmtARS(saldo)}</span>
      </div>
 
      {saldo>0&&(
        <>
          {hayVencidas&&(
            <div style={{background:"#C62828",borderRadius:8,padding:"8px 10px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:700,color:"#fff",display:"flex",alignItems:"center",gap:5}}>⚠ Tiene ventas vencidas (+{diasMora} días sin cobrar)</span>
              {cliente.telefono&&<a href={waLink(cliente.telefono,mensajeRecordatorioDeuda(cliente,saldo,diasMora))} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"5px 10px",borderRadius:6,background:"#fff",color:"#C62828",textDecoration:"none",whiteSpace:"nowrap"}}>{I.wa} Recordar por WhatsApp</a>}
            </div>
          )}
          {/* Ventas pendientes */}
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
            {pendientes.map(v=>{const dias=daysSince(v.fecha),vencida=dias>=diasMora;return(
              <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${vencida?"#C6282866":BO}`,borderRadius:8,padding:"10px 12px"}}>
                <div>
                  <div style={{fontSize:16,color:CR,fontWeight:500}}>{fmtDate(v.fecha)}</div>
                  <div style={{fontSize:14,color:MU}}>{v.cantidad}L · {v.nota||""}</div>
                  {vencida&&<div style={{fontSize:13,color:"#C62828",fontWeight:700,marginTop:2}}>Vencido hace {dias}d</div>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:17,fontWeight:700,color:"#C62828"}}>{fmtARS(v.monto)}</span>
                  <button onClick={()=>marcarPagada(v.id)} style={{fontSize:14,fontWeight:700,padding:"6px 12px",borderRadius:8,background:GR+"22",color:GR,border:`1px solid ${GR}44`,cursor:"pointer"}}>✓ Cobrado</button>
                </div>
              </div>
            );})}
          </div>
 
          {/* Medio de pago y fecha de cobro */}
          <div style={{marginBottom:6}}>
            <Lbl t="Fecha de cobro"/>
            <input type="date" value={fechaCobroSel} max={hoyISO()} onChange={e=>setFechaCobroSel(e.target.value||hoyISO())}/>
          </div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {MEDIOS_PAGO.map(m=>(
              <button key={m.id} onClick={()=>setMedioPago(m.id)} style={{flex:1,padding:"7px 0",borderRadius:8,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${medioPago===m.id?G:BO}`,background:medioPago===m.id?G+"18":"none",color:medioPago===m.id?G:MU}}>{m.ic} {m.id}</button>
            ))}
          </div>
 
          {/* Botones de cobro */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8,marginBottom:10}}>
            <button onClick={()=>{setShowCobroIndep(true);setShowParcial(false);}} style={{padding:"10px 0",borderRadius:10,background:"none",border:`1px dashed ${G}55`,color:G,fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              💵 Cobro en efectivo
            </button>
            <button onClick={()=>{setShowParcial(true);setShowCobroIndep(false);}} style={{padding:"10px 0",borderRadius:10,background:"none",border:`1px dashed ${AM}55`,color:AM,fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              🔢 Pago parcial
            </button>
          </div>
 
          {/* Panel cobro independiente */}
          {showCobroIndep&&(
            <div style={{background:"#fff",border:`1px solid ${G}33`,borderRadius:10,padding:14,marginBottom:10}}>
              <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:10}}>💵 Registrar cobro en efectivo</div>
              <div style={{marginBottom:8}}><Lbl t="Monto cobrado"/><input type="number" inputMode="numeric" value={montoCobroIndep} onChange={e=>setMontoCobroIndep(e.target.value)} placeholder={`Deuda total: ${fmtARS(saldo)}`} autoFocus/></div>
              <div style={{marginBottom:10}}><Lbl t="Nota (opcional)"/><input value={notaCobro} onChange={e=>setNotaCobro(e.target.value)} placeholder="Ej: Cobré en el local, pagó con transferencia..."/></div>
              {montoCobroIndep&&Number(montoCobroIndep)>0&&(
                <div style={{fontSize:15,color:MU,marginBottom:10}}>
                  Cobrás <strong style={{color:G}}>{fmtARS(Number(montoCobroIndep))}</strong> · Saldo restante: <strong style={{color:"#C62828"}}>{fmtARS(Math.max(0,saldo-Number(montoCobroIndep)))}</strong>
                  {!!cliente.comisionPctDefault&&<> · Comisión ({cliente.comisionPctDefault}%): <strong style={{color:G}}>{fmtARS(Math.round(Number(montoCobroIndep)*Number(cliente.comisionPctDefault)/100))}</strong></>}
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{setShowCobroIndep(false);setMontoCobroIndep("");setNotaCobro("");}} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:16,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                <button onClick={registrarCobroIndependiente} disabled={!montoCobroIndep||Number(montoCobroIndep)<=0} style={{flex:2,padding:"10px 0",borderRadius:10,background:G,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",opacity:!montoCobroIndep||Number(montoCobroIndep)<=0?0.4:1}}>
                  ✓ Confirmar cobro
                </button>
              </div>
            </div>
          )}
 
          {/* Panel pago parcial */}
          {showParcial&&(
            <div style={{background:"#fff",border:`1px solid ${AM}33`,borderRadius:10,padding:14,marginBottom:10}}>
              <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:10}}>🔢 Pago parcial</div>
              <div style={{marginBottom:8}}><Lbl t="¿Cuánto te pagó?"/><input type="number" inputMode="numeric" value={montoPago} onChange={e=>setMontoPago(e.target.value)} placeholder={`Máx: ${fmtARS(saldo)}`} autoFocus/></div>
              {montoPago&&Number(montoPago)>0&&(
                <div style={{fontSize:15,color:MU,marginBottom:10}}>
                  Cobro de <strong style={{color:AM}}>{fmtARS(Number(montoPago))}</strong> · Saldo restante: <strong style={{color:"#C62828"}}>{fmtARS(Math.max(0,saldo-Number(montoPago)))}</strong>
                  {!!cliente.comisionPctDefault&&<> · Comisión ({cliente.comisionPctDefault}%): <strong style={{color:G}}>{fmtARS(Math.round(Number(montoPago)*Number(cliente.comisionPctDefault)/100))}</strong></>}
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{setShowParcial(false);setMontoPago("");}} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:16,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                <button onClick={aplicarPagoParcial} disabled={!montoPago||Number(montoPago)<=0} style={{flex:2,padding:"10px 0",borderRadius:10,background:AM,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",opacity:!montoPago||Number(montoPago)<=0?0.4:1}}>
                  ✓ Confirmar {montoPago?fmtARS(Number(montoPago)):"..."}
                </button>
              </div>
            </div>
          )}
 
          {/* Saldar todo */}
          <button onClick={marcarTodo} style={{width:"100%",padding:"11px 0",borderRadius:10,background:GR,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            {I.check} Saldar toda la cuenta · {fmtARS(saldo)}
          </button>
        </>
      )}
 
      {/* Historial de pagos */}
      {pagadas.length>0&&(
        <div style={{marginTop:saldo>0?12:0}}>
          <button onClick={()=>setShowHistorial(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:MU,display:"flex",alignItems:"center",gap:4,padding:0}}>
            {showHistorial?"▲":"▼"} Historial de pagos ({pagadas.length})
          </button>
          {showHistorial&&(
            <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
              {pagadas.slice(0,8).map(v=>(
                <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div>
                    <div style={{fontSize:15,color:CR}}>{fmtDate(v.fechaCobro||v.fecha)}</div>
                    <div style={{fontSize:13,color:GR}}>✓ {v.medioPago||"Cobrado"}{v.nota?` · ${v.nota}`:""}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</span>
                    <button onClick={()=>desmarcarPagada(v.id)} style={{fontSize:13,padding:"4px 8px",borderRadius:6,background:RE+"11",color:"#C62828",border:`1px solid ${RE}33`,cursor:"pointer"}}>Deshacer</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

        :<button onClick={()=>setVForm(true)} style={{width:"100%",marginBottom:10,padding:"10px 0",borderRadius:8,fontSize:16,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,border:"1px dashed #3A3028",background:"none",color:G}}>{I.plus}Nueva venta</button>
      }

      <SpeechPicker open={spOpen} onClose={()=>setSpOpen(false)} speeches={speeches} telefono={cliente.telefono} nombre={cliente.nombre}/>
    </div>
  );
}
 
// ── INICIO ────────────────────────────────────────────────────────

              <span style={{color:"#8FE3B4",flexShrink:0}}>{I.truck}</span>
              <span style={{flex:1,fontSize:15,color:"#fff",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cliente?cliente.nombre:"Cliente"} · {prod?nombreProdEnvase(prod):p.producto} {p.cantidad}L</span>

                </div>

              <div style={{textAlign:"right",flexShrink:0}}>

          <div style={{display:"flex",alignItems:"center",gap:8}}>{I.note}<span style={{fontSize:16,fontWeight:700,color:CR}}>Notas</span></div>
          <button onClick={()=>setTab("notas")} style={{fontSize:14,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:2}}>{(notas||[]).length>0?"Ver todas":"Agregar"}{I.chev}</button>
        </div>
        {(notas||[]).length>0&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"12px 16px"}}>
            {[...notas].sort((a,b)=>new Date(b.actualizadoEn||b.creadoEn)-new Date(a.actualizadoEn||a.creadoEn)).slice(0,8).map(n=>{
              const col=colorNota(n.color);
              return(
                <button key={n.id} onClick={()=>setTab("notas")} style={{padding:"6px 12px",borderRadius:20,fontSize:14,fontWeight:600,cursor:"pointer",background:col.bg,border:`1px solid ${col.bd}`,color:col.tx,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.titulo}</button>

          {!editandoMeta&&<button onClick={()=>{setMetaTmp(String(metaSemanal));setEditandoMeta(true);}} style={{fontSize:13,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>{I.edit}Editar</button>}

        {editandoMeta?(

          </div>

        {alertas.length===0?<p style={{color:MU,fontSize:16,textAlign:"center",padding:"20px 16px"}}>Todos los clientes al día 🍺</p>:alertas.map(c=>{const ls=lastSale(c),d=ls?daysSince(ls.fecha):null,e=EST[estadoC(c)];return(

            <div><div style={{fontSize:16,fontWeight:600,color:CR}}>{c.nombre}</div><div style={{fontSize:14,color:e.c}}>{d} días sin pedir · {c.zona}</div></div>
            <span style={{color:MU}}>{I.chev}</span>
          </button>
        );})}
      </div>
 
      {/* Línea Farol */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden"}}>
        <div onClick={()=>setCatalogoAbierto(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",cursor:"pointer"}}>

            <span style={{background:BG,color:MU,borderRadius:10,padding:"1px 7px",fontSize:12,fontWeight:700,textTransform:"none",letterSpacing:"normal"}}>{prods.length}</span>
          </span>
          <span style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={e=>{e.stopPropagation();setTab("productos");}} style={{fontSize:13,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:0}}>{I.edit}Editar precios</button>

          </span>
        </div>
        {catalogoAbierto&&prods.map(p=>(
          <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderTop:`1px solid ${BO}`}}><div><div style={{fontSize:16,fontWeight:500,color:CR}}>{p.nombre}</div><div style={{fontSize:14,color:MU}}>{p.marca||"Farol"} · {p.envase||"PET"}{(p.promos||[]).length>0?` · ${p.promos.length} promo${p.promos.length>1?"s":""}`:""}</div></div><div className="bebas" style={{fontSize:20,color:G}}>{fmtARS(p.precio)}<span style={{fontSize:12,color:MU,fontWeight:400}}> /L</span></div></div>
        ))}
      </div>
    </div>
  );
}
 
// ── CLIENTES ──────────────────────────────────────────────────────
function Clientes({clientes,setClientes,speeches,cal,prods,diasMora,promo51}){
  const[q,setQ]=useState("");
  const[filtro,setFiltro]=useState("todos");
  const[orden,setOrden]=useState("reciente");
  const[showNew,setShowNew]=useState(false);
  const[sel,setSel]=useState(null);

    if(orden==="az")return a.nombre.localeCompare(b.nombre);
    if(orden==="deuda")return saldoCliente(b)-saldoCliente(a);
    const la=lastSale(a),lb=lastSale(b);return(lb?daysSince(lb.fecha):0)-(la?daysSince(la.fecha):0);
  }),[clientes,q,filtro,orden]);
  const selObj=clientes.find(c=>c.id===sel);

      </div>
      <div style={{position:"relative",marginBottom:12}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>

      </div>

        {[{k:"todos",l:"Todos"},{k:"activo",l:"Activos"},{k:"atencion",l:"Atención"},{k:"inactivo",l:"Inactivos"}].map(f=>(
          <button key={f.k} onClick={()=>setFiltro(f.k)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtro===f.k?G:BO}`,background:filtro===f.k?G:"transparent",color:filtro===f.k?"#fff":MU}}>{f.l}</button>
        ))}
      </div>
      <div style={{marginBottom:16}}>
        <select value={orden} onChange={e=>setOrden(e.target.value)}>
          <option value="reciente">Ordenar: más recientes</option>
          <option value="az">Ordenar: A → Z</option>
          <option value="deuda">Ordenar: mayor deuda</option>
        </select>
      </div>
      {filtered.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:16}}>Sin clientes para mostrar.</p>:filtered.map(c=>{const e=EST[estadoC(c)];const ls=lastSale(c);const deuda=saldoCliente(c);return(
        <button key={c.id} onClick={()=>setSel(c.id)} style={{display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:"12px 16px",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:8}}>
          <div style={{width:38,height:38,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,flexShrink:0}}>{iniciales(c.nombre)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:16,fontWeight:600,color:CR}}>{c.nombre}</span><span style={{color:MU}}>{I.chev}</span></div>
            <div style={{fontSize:14,color:MU,marginTop:2}}>{c.rubro} · {c.zona}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,background:e.c+"15"}}>
                <span style={{width:5,height:5,borderRadius:"50%",background:e.c}}/>
                <span style={{fontSize:13,fontWeight:600,color:e.c}}>{ls?`Hace ${daysSince(ls.fecha)} días`:e.l}</span>
              </div>
              {deuda>0&&<div style={{fontSize:13,fontWeight:700,color:"#E08070"}}>💰{fmtARS(deuda)}</div>}
            </div>
          </div>
        </button>
      );})}
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo cliente">
        <FormCliente onCancel={()=>setShowNew(false)} onSave={f=>{setClientes(p=>[...p,{id:uid(),...f,agenda:[],historial:[],ventas:[]}]);setShowNew(false);}}/>
      </Modal>

        {selObj&&<DetalleCliente cliente={selObj} speeches={speeches} cal={cal} prods={prods} diasMora={diasMora} promo51={promo51} onUpdate={u=>setClientes(p=>p.map(c=>c.id===u.id?u:c))} onDelete={id=>{setClientes(p=>p.filter(c=>c.id!==id));setSel(null);}}/>}
      </Modal>
    </div>
  );
}
 
// ── ENVÍO MASIVO ──────────────────────────────────────────────────
const ENVIO_MASIVO_LS_KEY="farol_envio_masivo_progreso";
function EnvioMasivo({clientes}){
  const[q,setQ]=useState("");
  const[filtroEstado,setFiltroEstado]=useState("todos");
  const[filtroZona,setFiltroZona]=useState("todas");
  const[sel,setSel]=useState(()=>new Set());
  const[mensaje,setMensaje]=useState("");
  const[enCola,setEnCola]=useState(false);
  const[enviados,setEnviados]=useState(()=>new Set());
  const[idx,setIdx]=useState(0);
  const[cargado,setCargado]=useState(false);

  // Recupera el progreso guardado (por si el usuario fue a WhatsApp y volvió, o cerró la app a mitad de camino)
  useEffect(()=>{
    try{
      const raw=localStorage.getItem(ENVIO_MASIVO_LS_KEY);
      if(raw){
        const d=JSON.parse(raw);
        if(d&&Array.isArray(d.ids)&&d.ids.length){
          setSel(new Set(d.ids));
          setMensaje(d.mensaje||"");
          setEnviados(new Set(d.enviados||[]));
          setIdx(d.idx||0);
          setEnCola(!!d.enCola);
        }
      }
    }catch(e){}
    setCargado(true);
  },[]);

  useEffect(()=>{
    if(!cargado)return;
    if(!enCola&&sel.size===0){try{localStorage.removeItem(ENVIO_MASIVO_LS_KEY);}catch(e){}return;}
    try{localStorage.setItem(ENVIO_MASIVO_LS_KEY,JSON.stringify({ids:[...sel],mensaje,enviados:[...enviados],idx,enCola}));}catch(e){}
  },[sel,mensaje,enviados,idx,enCola,cargado]);

  const conTelefono=useMemo(()=>clientes.filter(c=>c.telefono&&c.telefono.trim()),[clientes]);
  const filtrados=useMemo(()=>conTelefono.filter(c=>{
    const t=q.toLowerCase();
    const okQ=!t||c.nombre.toLowerCase().includes(t)||c.zona.toLowerCase().includes(t)||c.rubro.toLowerCase().includes(t);
    const okE=filtroEstado==="todos"||estadoC(c)===filtroEstado;
    const okZ=filtroZona==="todas"||c.zona===filtroZona;
    return okQ&&okE&&okZ;
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre)),[conTelefono,q,filtroEstado,filtroZona]);

  const seleccionados=useMemo(()=>clientes.filter(c=>sel.has(c.id)),[clientes,sel]);

  const toggle=id=>setSel(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleTodosVisibles=()=>{
    const idsVisibles=filtrados.map(c=>c.id);
    const todosMarcados=idsVisibles.length>0&&idsVisibles.every(id=>sel.has(id));
    setSel(prev=>{const n=new Set(prev);idsVisibles.forEach(id=>todosMarcados?n.delete(id):n.add(id));return n;});
  };
  const personalizar=nombre=>mensaje.replace(/\{nombre\}/gi,(nombre||"").split(" ")[0]);
  const iniciar=()=>{setIdx(0);setEnviados(new Set());setEnCola(true);};
  const cancelar=()=>{
    setEnCola(false);setSel(new Set());setEnviados(new Set());setIdx(0);setMensaje("");
    try{localStorage.removeItem(ENVIO_MASIVO_LS_KEY);}catch(e){}
  };

  if(enCola){
    const lista=seleccionados;
    const actual=lista[idx];
    if(!actual){
      return(
        <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto",textAlign:"center"}}>
          <div style={{fontSize:44,marginBottom:12}}>🎉</div>
          <div className="bebas" style={{fontSize:26,color:CR,marginBottom:6}}>¡Listo!</div>
          <div style={{fontSize:16,color:MU,marginBottom:24}}>Enviaste a {enviados.size} de {lista.length} clientes.</div>
          <Btn onClick={cancelar}>Volver a Difusión</Btn>
        </div>
      );
    }
    const yaEnviado=enviados.has(actual.id);
    const link=waLink(actual.telefono,personalizar(actual.nombre));
    return(
      <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span className="bebas" style={{fontSize:26,color:CR}}>Enviando...</span>
          <button onClick={cancelar} style={{background:"none",border:"none",color:MU,fontSize:14,fontWeight:700,cursor:"pointer"}}>Cancelar</button>
        </div>
        <div style={{fontSize:14,color:MU,fontWeight:700,marginBottom:16}}>{enviados.size} enviados · {lista.length-enviados.size} pendientes de {lista.length}</div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:20,marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,flexShrink:0}}>{iniciales(actual.nombre)}</div>
            <div>
              <div style={{fontSize:17,fontWeight:700,color:CR}}>{actual.nombre}</div>
              <div style={{fontSize:13,color:MU}}>{actual.rubro} · {actual.zona}</div>
            </div>
          </div>
          <div style={{fontSize:15,color:CR,whiteSpace:"pre-wrap",background:BG,borderRadius:10,padding:12,marginBottom:16,lineHeight:1.5}}>{personalizar(actual.nombre)}</div>
          {link?(
            <a href={link} target="_blank" rel="noreferrer" onClick={()=>setEnviados(prev=>new Set(prev).add(actual.id))} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,textDecoration:"none",padding:"13px 0",borderRadius:10,background:GR,color:"#fff",fontSize:16,fontWeight:700,marginBottom:10}}>{I.wa}Enviar a {actual.nombre.split(" ")[0]}</a>
          ):(
            <div style={{fontSize:14,color:RE,marginBottom:10}}>Teléfono inválido, no se puede abrir WhatsApp.</div>
          )}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setIdx(i=>Math.min(i+1,lista.length))} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:15,fontWeight:600,cursor:"pointer"}}>Omitir</button>
            <button onClick={()=>{setEnviados(prev=>new Set(prev).add(actual.id));setIdx(i=>Math.min(i+1,lista.length));}} style={{flex:1,padding:"10px 0",borderRadius:10,background:yaEnviado?G:BG,border:`1px solid ${yaEnviado?G:BO}`,color:yaEnviado?"#fff":CR,fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ {yaEnviado?"Enviado":"Marcar y siguiente"}</button>
          </div>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {lista.map((c,i)=>(
            <button key={c.id} onClick={()=>setIdx(i)} title={c.nombre} style={{width:30,height:30,borderRadius:"50%",border:`2px solid ${i===idx?G:"transparent"}`,background:enviados.has(c.id)?G:BO,color:enviados.has(c.id)?"#fff":MU,fontSize:11,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>{enviados.has(c.id)?"✓":iniciales(c.nombre)}</button>
          ))}
        </div>
      </div>
    );
  }

  const todosVisiblesMarcados=filtrados.length>0&&filtrados.every(c=>sel.has(c.id));
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{marginBottom:16}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Envío masivo</span>
        <div style={{fontSize:14,color:MU,marginTop:2}}>Seleccioná clientes y armá un mensaje. Después se abre WhatsApp de a uno para que confirmes cada envío.</div>
      </div>
      <div style={{position:"relative",marginBottom:12}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38}} placeholder="Buscar por nombre, zona o rubro..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"activo",l:"Activos"},{k:"atencion",l:"Atención"},{k:"inactivo",l:"Inactivos"},{k:"nuevo",l:"Sin compras"}].map(f=>(
          <button key={f.k} onClick={()=>setFiltroEstado(f.k)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtroEstado===f.k?G:BO}`,background:filtroEstado===f.k?G:"transparent",color:filtroEstado===f.k?"#fff":MU}}>{f.l}</button>
        ))}
      </div>
      <div style={{marginBottom:12}}>
        <select value={filtroZona} onChange={e=>setFiltroZona(e.target.value)}>
          <option value="todas">Todas las zonas</option>
          {ZONAS.map(z=><option key={z} value={z}>{z}</option>)}
        </select>
      </div>
      <button onClick={toggleTodosVisibles} style={{width:"100%",textAlign:"left",padding:"10px 14px",borderRadius:10,background:BG,border:`1px solid ${BO}`,color:CR,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10}}>
        {todosVisiblesMarcados?"☑️ Deseleccionar todos los visibles":"⬜ Seleccionar todos los visibles"} ({filtrados.length})
      </button>
      <div style={{maxHeight:340,overflowY:"auto",border:`1px solid ${BO}`,borderRadius:14,marginBottom:16}}>
        {filtrados.length===0?<p style={{color:MU,textAlign:"center",padding:"32px 0",fontSize:15}}>Sin clientes con teléfono para este filtro.</p>:filtrados.map(c=>(
          <label key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:`1px solid ${BO}`,cursor:"pointer"}}>
            <input type="checkbox" checked={sel.has(c.id)} onChange={()=>toggle(c.id)} style={{width:18,height:18,flexShrink:0,accentColor:G}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:600,color:CR}}>{c.nombre}</div>
              <div style={{fontSize:13,color:MU}}>{c.rubro} · {c.zona}</div>
            </div>
          </label>
        ))}
      </div>
      <Lbl t={`Mensaje (${sel.size} seleccionados)`}/>
      <textarea rows={5} placeholder="Escribí el mensaje. Usá {nombre} para que se reemplace por el nombre de pila de cada cliente." value={mensaje} onChange={e=>setMensaje(e.target.value)} style={{marginBottom:6,resize:"vertical"}}/>
      {mensaje&&seleccionados[0]&&<div style={{fontSize:13,color:MU,marginBottom:16,fontStyle:"italic"}}>Vista previa: "{personalizar(seleccionados[0].nombre)}"</div>}
      <Btn onClick={iniciar} disabled={sel.size===0||!mensaje.trim()}>{I.wa}Iniciar envío ({sel.size})</Btn>
    </div>
  );
}

// ── ASISTENTE IA ──────────────────────────────────────────────────
const ASISTENTE_URL_LS_KEY="farol_asistente_url";
const ASISTENTE_CHAT_LS_KEY="farol_asistente_chat";
function contextoNegocio(clientes,pedidos,prods){
  const resumenClientes=clientes.slice(0,80).map(c=>{
    const ls=lastSale(c);
    const dias=ls?daysSince(ls.fecha):null;
    const deuda=(c.ventas||[]).filter(v=>!v.pagado).reduce((s,v)=>s+v.monto,0);
    return`${c.nombre} (${c.zona}, ${c.rubro}) — estado:${estadoC(c)}${dias!=null?`, últ. compra hace ${dias}d`:", sin compras"}${deuda>0?`, debe ${fmtARS(deuda)}`:""}`;
  }).join("\n");
  const pedidosPend=(pedidos||[]).filter(p=>p.estado!=="entregado").length;
  const catalogo=prods.map(p=>`${nombreProdEnvase(p)} — ${fmtARS(p.precio)}/L`).join("\n");
  return`Sos el asistente comercial de Grunge & Farol, una distribuidora de cerveza artesanal en Buenos Aires (marcas Grunge y Farol, "Premium, Popular, Porteña"). Ayudás a Nahu (quien te habla) con ventas, cobranzas, atención a clientes y comercios. Respondé breve, concreto, en español rioplatense, sin vueltas.\n\nCATÁLOGO:\n${catalogo||"(sin productos cargados)"}\n\nCLIENTES (${clientes.length} en total${clientes.length>80?", mostrando los primeros 80":""}):\n${resumenClientes||"(sin clientes cargados)"}\n\nPedidos pendientes de entrega: ${pedidosPend}.\nHoy es ${fmtDate(hoyISO())}.`;
}
const ANALISIS_PROMPT="Analizá todo lo que ves de mi negocio (clientes, deuda, pedidos pendientes y catálogo) y dame sugerencias concretas para vender más y mejorar. Organizalo en 4 puntos cortos: 1) a qué clientes debería contactar hoy y por qué, 2) oportunidades de venta que notes, 3) alertas de cobranza urgentes si las hay, 4) cualquier otra mejora que veas. Sé específico, usá nombres y números reales de los datos, nada genérico.";
function AsistenteIA({clientes,pedidos,prods}){
  const[url,setUrl]=useState(()=>{try{return localStorage.getItem(ASISTENTE_URL_LS_KEY)||"";}catch(e){return"";}});
  const[configurando,setConfigurando]=useState(false);
  const[urlTmp,setUrlTmp]=useState(url);
  const[mensajes,setMensajes]=useState(()=>{try{const raw=localStorage.getItem(ASISTENTE_CHAT_LS_KEY);return raw?JSON.parse(raw):[];}catch(e){return[];}});
  const[input,setInput]=useState("");
  const[cargando,setCargando]=useState(false);
  const[error,setError]=useState("");
  const finRef=React.useRef(null);
  const autoDisparado=React.useRef(false);

  useEffect(()=>{try{localStorage.setItem(ASISTENTE_CHAT_LS_KEY,JSON.stringify(mensajes.slice(-40)));}catch(e){}},[mensajes]);
  useEffect(()=>{finRef.current&&finRef.current.scrollIntoView({behavior:"smooth"});},[mensajes,cargando]);

  const guardarUrl=()=>{
    const limpia=urlTmp.trim();
    setUrl(limpia);
    try{localStorage.setItem(ASISTENTE_URL_LS_KEY,limpia);}catch(e){}
    setConfigurando(false);
  };

  const enviar=async(textoForzado,mostrarForzado)=>{
    const texto=(textoForzado||input).trim();
    if(!texto||cargando)return;
    if(!url){setConfigurando(true);return;}
    const mostrar=mostrarForzado||texto;
    setError("");
    const nuevos=[...mensajes,{rol:"user",texto,mostrar}];
    setMensajes(nuevos);
    setInput("");
    setCargando(true);
    try{
      const contexto=contextoNegocio(clientes,pedidos,prods);
      const historial=nuevos.slice(-8).map(m=>({rol:m.rol,texto:m.texto}));
      const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mensaje:texto,historial,contexto})});
      let data=null;
      try{data=await resp.json();}catch(e){}
      if(!resp.ok){
        throw new Error(`HTTP ${resp.status}${data&&data.error?": "+data.error:""}`);
      }
      const respuesta=(data&&(data.respuesta||data.reply||data.texto))||"No obtuve respuesta.";
      setMensajes(prev=>[...prev,{rol:"assistant",texto:respuesta}]);
    }catch(e){
      setError("No se pudo conectar con el asistente. Detalle: "+(e&&e.message?e.message:"error desconocido")+". Revisá la URL en Configurar o probá de nuevo.");
    }finally{
      setCargando(false);
    }
  };

  // Al entrar sin conversación previa, el asistente analiza solo y sugiere mejoras
  useEffect(()=>{
    if(autoDisparado.current)return;
    if(url&&mensajes.length===0){
      autoDisparado.current=true;
      enviar(ANALISIS_PROMPT,"📊 Analizá mi negocio y dame sugerencias");
    }
  },[url]);

  const sugerencias=["¿A quién le ofrezco algo hoy?","Ayudame a responder una objeción de precio","Resumen de deuda pendiente","Ideas para reactivar clientes inactivos"];

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto",display:"flex",flexDirection:"column",minHeight:"calc(100vh - 56px)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>✨ Asistente IA</span>
        <div style={{display:"flex",gap:6}}>
          {mensajes.length>0&&<button onClick={()=>{if(confirm("¿Borrar la conversación?")){setMensajes([]);autoDisparado.current=false;try{localStorage.removeItem(ASISTENTE_CHAT_LS_KEY);}catch(e){}}}} style={{fontSize:13,color:MU,background:"none",border:`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>Borrar chat</button>}
          <button onClick={()=>{setUrlTmp(url);setConfigurando(true);}} style={{fontSize:13,color:MU,background:"none",border:`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>⚙️ Configurar</button>
        </div>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:14}}>Consultas y respuestas comerciales con contexto de tus clientes, pedidos y catálogo.</p>

      {configurando&&(
        <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:14,padding:14,marginBottom:14}}>
          <Lbl t="URL del asistente (Cloudflare Worker)"/>
          <input value={urlTmp} onChange={e=>setUrlTmp(e.target.value)} placeholder="https://asistente-farol.tuusuario.workers.dev" style={{marginBottom:10}}/>
          <div style={{fontSize:12,color:MU,marginBottom:10,lineHeight:1.5}}>Se pega una sola vez, después de desplegar el asistente (te paso el código y los pasos en el chat). Se guarda solo en este celular.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn variant="ghost" onClick={()=>setConfigurando(false)}>Cancelar</Btn>
            <Btn variant="green" onClick={guardarUrl} disabled={!urlTmp.trim()}>Guardar</Btn>
          </div>
        </div>
      )}

      {!url&&!configurando&&(
        <div style={{background:AM+"14",border:`1px solid ${AM}33`,borderRadius:14,padding:14,marginBottom:14,fontSize:14,color:CR,lineHeight:1.5}}>
          💡 Todavía no está conectado. Tocá "⚙️ Configurar" y pegá la URL del asistente una vez que lo despliegues (el código y los pasos te los paso aparte). Apenas lo conectes, te va a analizar el negocio solo.
        </div>
      )}

      {url&&mensajes.length>0&&(
        <button onClick={()=>enviar(ANALISIS_PROMPT,"📊 Analizá mi negocio y dame sugerencias")} disabled={cargando} style={{width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:10,background:GLT,border:`1px solid ${G}44`,borderRadius:12,padding:"10px 14px",marginBottom:14,cursor:"pointer",opacity:cargando?0.6:1}}>
          <span style={{fontSize:18}}>📊</span>
          <span style={{fontSize:14,fontWeight:700,color:G}}>Analizar mi negocio de nuevo</span>
        </button>
      )}

      <div style={{flex:1,display:"flex",flexDirection:"column",gap:10,marginBottom:14,minHeight:200}}>
        {mensajes.length===0?(
          <div style={{textAlign:"center",padding:"30px 16px",color:MU}}>
            <div style={{fontSize:36,marginBottom:10}}>🍺🤖</div>
            <div style={{fontSize:15,marginBottom:16}}>{url?"Te estoy analizando el negocio...":"Preguntame lo que necesites sobre ventas, clientes o cobranzas."}</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,alignItems:"stretch"}}>
              {sugerencias.map(s=>(
                <button key={s} onClick={()=>enviar(s)} style={{textAlign:"left",fontSize:14,color:CR,background:CA,border:`1px solid ${BO}`,borderRadius:12,padding:"10px 14px",cursor:"pointer"}}>{s}</button>
              ))}
            </div>
          </div>
        ):mensajes.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.rol==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:14,fontSize:15,lineHeight:1.5,whiteSpace:"pre-wrap",background:m.rol==="user"?G:CA,color:m.rol==="user"?"#fff":CR,border:m.rol==="user"?"none":`1px solid ${BO}`}}>{m.rol==="user"?(m.mostrar||m.texto):m.texto}</div>
          </div>
        ))}
        {cargando&&(
          <div style={{display:"flex",justifyContent:"flex-start"}}>
            <div style={{padding:"10px 14px",borderRadius:14,background:CA,border:`1px solid ${BO}`,color:MU,fontSize:15}}>Pensando...</div>
          </div>
        )}
        {error&&<div style={{fontSize:13,color:RE,textAlign:"center"}}>{error}</div>}
        <div ref={finRef}/>
      </div>

      <div style={{position:"sticky",bottom:74,display:"flex",gap:8,background:BG,paddingTop:6}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar();}}} placeholder="Escribí tu consulta..." disabled={cargando} style={{flex:1}}/>
        <button onClick={()=>enviar()} disabled={cargando||!input.trim()} style={{width:46,height:46,borderRadius:12,background:G,border:"none",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:cargando||!input.trim()?0.5:1}}>
          <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

// ── GASTOS ────────────────────────────────────────────────────────
function FormGasto({initial,onSave,onCancel,onDelete}){
  const[f,setF]=useState({
    fecha:initial.fecha||hoyISO(),
    tipo:initial.tipo||"negocio",
    categoria:initial.categoria||"combustible",
    monto:initial.monto?String(initial.monto):"",
    descripcion:initial.descripcion||"",
    medioPago:initial.medioPago||"",
  });
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const categoriasDelTipo=GASTO_CATEGORIAS.filter(c=>c.tipo===f.tipo);
  const cambiarTipo=tipo=>setF(p=>({...p,tipo,categoria:GASTO_CATEGORIAS.find(c=>c.tipo===tipo).key}));
  const guardar=()=>{
    if(!f.monto||Number(f.monto)<=0)return;
    onSave({...f,monto:Number(f.monto)});
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:8}}>
        {[{k:"negocio",l:"🏢 Negocio"},{k:"personal",l:"🏠 Personal"}].map(t=>(
          <button key={t.k} onClick={()=>cambiarTipo(t.k)} style={{flex:1,padding:"10px 0",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",border:`1px solid ${f.tipo===t.k?G:BO}`,background:f.tipo===t.k?G:"transparent",color:f.tipo===t.k?"#fff":MU}}>{t.l}</button>
        ))}
      </div>
      <div><Lbl t="Categoría"/><select value={f.categoria} onChange={s("categoria")}>{categoriasDelTipo.map(c=><option key={c.key} value={c.key}>{c.icon} {c.label}</option>)}</select></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
        <div><Lbl t="Fecha"/><input type="date" value={f.fecha} onChange={s("fecha")}/></div>
        <div><Lbl t="Monto ARS"/><input type="number" inputMode="numeric" value={f.monto} onChange={s("monto")} placeholder="0" autoFocus/></div>
      </div>
      <div><Lbl t="Descripción (opcional)"/><input value={f.descripcion} onChange={s("descripcion")} placeholder="Ej: Carga de nafta camioneta"/></div>
      <div>
        <Lbl t="Medio de pago (opcional)"/>
        <select value={f.medioPago} onChange={s("medioPago")}>
          <option value="">Sin especificar</option>
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia</option>
          <option value="tarjeta">Tarjeta</option>
        </select>
      </div>
      <div style={{display:"flex",gap:8,paddingTop:4,alignItems:"center"}}>
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
        {onDelete&&<button onClick={onDelete} title="Eliminar gasto" style={{width:42,height:42,borderRadius:10,background:RE+"14",border:`1px solid ${RE}33`,color:RE,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.trash}</button>}
        <div style={{flex:1}}/>
        <Btn variant="green" onClick={guardar} disabled={!f.monto||Number(f.monto)<=0}>Guardar</Btn>
      </div>
    </div>
  );
}
function Gastos({gastos,setGastos}){
  const[modalOpen,setModalOpen]=useState(false);
  const[editing,setEditing]=useState(null);
  const[filtroTipo,setFiltroTipo]=useState("todos");
  const[filtroMes,setFiltroMes]=useState(hoyISO().slice(0,7));

  const nuevoGasto=()=>{setEditing({});setModalOpen(true);};
  const editarGasto=g=>{setEditing(g);setModalOpen(true);};
  const cerrar=()=>{setModalOpen(false);setEditing(null);};

  const guardar=f=>{
    if(editing&&editing.id){
      setGastos(prev=>prev.map(g=>g.id===editing.id?{...g,...f}:g));
    }else{
      setGastos(prev=>[{id:uid(),...f,creadoEn:new Date().toISOString()},...(prev||[])]);
    }
    cerrar();
  };
  const eliminar=()=>{
    if(!editing||!editing.id)return;
    if(!confirm("¿Eliminar este gasto? No se puede deshacer."))return;
    setGastos(prev=>prev.filter(g=>g.id!==editing.id));
    cerrar();
  };

  const delMes=useMemo(()=>(gastos||[]).filter(g=>(g.fecha||"").slice(0,7)===filtroMes),[gastos,filtroMes]);
  const totalNegocioMes=delMes.filter(g=>g.tipo==="negocio").reduce((s,g)=>s+g.monto,0);
  const totalPersonalMes=delMes.filter(g=>g.tipo==="personal").reduce((s,g)=>s+g.monto,0);

  const filtrados=useMemo(()=>[...delMes]
    .filter(g=>filtroTipo==="todos"||g.tipo===filtroTipo)
    .sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)||new Date(b.creadoEn||0)-new Date(a.creadoEn||0)),[delMes,filtroTipo]);

  const porCategoria=useMemo(()=>{
    const map={};
    filtrados.forEach(g=>{map[g.categoria]=(map[g.categoria]||0)+g.monto;});
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[filtrados]);

  const mesLabel=(()=>{const[y,m]=filtroMes.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});})();

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Gastos</span>
        <Btn variant="green" small onClick={nuevoGasto}>{I.plus}Nuevo</Btn>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:14}}>Gastos del negocio y personales, para ver el margen real.</p>

      <input type="month" value={filtroMes} onChange={e=>setFiltroMes(e.target.value)} style={{marginBottom:12,textTransform:"capitalize"}}/>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8,marginBottom:14}}>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:14,padding:"12px 14px"}}>
          <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:2}}>🏢 Negocio</div>
          <div className="bebas" style={{fontSize:20,color:CR}}>{fmtARS(totalNegocioMes)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:14,padding:"12px 14px"}}>
          <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:2}}>🏠 Personal</div>
          <div className="bebas" style={{fontSize:20,color:CR}}>{fmtARS(totalPersonalMes)}</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"negocio",l:"🏢 Negocio"},{k:"personal",l:"🏠 Personal"}].map(t=>(
          <button key={t.k} onClick={()=>setFiltroTipo(t.k)} style={{whiteSpace:"nowrap",padding:"6px 14px",borderRadius:20,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtroTipo===t.k?G:BO}`,background:filtroTipo===t.k?G:"transparent",color:filtroTipo===t.k?"#fff":MU}}>{t.l}</button>
        ))}
      </div>

      {porCategoria.length>0&&(
        <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:14,padding:14,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Por categoría · {mesLabel}</div>
          {porCategoria.map(([key,monto])=>{
            const cat=catGasto(key);
            const totalFiltrado=filtrados.reduce((s,g)=>s+g.monto,0)||1;
            const pct=Math.round((monto/totalFiltrado)*100);
            return(
              <div key={key} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:CR,marginBottom:3}}>
                  <span>{cat.icon} {cat.label}</span>
                  <span style={{fontWeight:700}}>{fmtARS(monto)}</span>
                </div>
                <div style={{height:6,borderRadius:3,background:BO,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:cat.tipo==="negocio"?G:AM,borderRadius:3}}/>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {filtrados.length===0?(
        <p style={{color:MU,fontSize:16,textAlign:"center",padding:"30px 16px"}}>Sin gastos cargados para {mesLabel}.</p>
      ):filtrados.map(g=>{
        const cat=catGasto(g.categoria);
        return(
          <button key={g.id} onClick={()=>editarGasto(g)} style={{width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${BO}`,borderRadius:14,padding:"12px 14px",marginBottom:8,cursor:"pointer"}}>
            <div style={{width:38,height:38,borderRadius:10,background:g.tipo==="negocio"?GLT:AM+"1a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{cat.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.descripcion||cat.label}</div>
              <div style={{fontSize:12,color:MU,marginTop:1}}>{cat.label} · {fmtDate(g.fecha)}</div>
            </div>
            <div style={{fontSize:15,fontWeight:700,color:CR,flexShrink:0}}>{fmtARS(g.monto)}</div>
          </button>
        );
      })}

      <Modal open={modalOpen} onClose={cerrar} title={editing&&editing.id?"Editar gasto":"Nuevo gasto"}>
        {editing&&<FormGasto initial={editing} onSave={guardar} onCancel={cerrar} onDelete={editing.id?eliminar:null}/>}
      </Modal>
    </div>
  );
}

function Comercios({prospectos,setProspectos,onConvertir,speeches,prods}){
  const[q,setQ]=useState("");
  const[zona,setZona]=useState("");
  const[rubro,setRubro]=useState("");
  const[estadoF,setEstadoF]=useState("");
  const[tieneTel,setTieneTel]=useState(false);
  const[ordenar,setOrdenar]=useState("score");
  const[showNew,setShowNew]=useState(false);
  const[editing,setEditing]=useState(null);
  const[compartiendoId,setCompartiendoId]=useState(null);
  const compartirCatalogoDesdeComercios=async(prospectoId)=>{
    setCompartiendoId(prospectoId);
    try{ await compartirCatalogoPDF(prods||[]); }finally{ setCompartiendoId(null); }
  };
  const[spTarget,setSpTarget]=useState(null);
  const[expandido,setExpandido]=useState(null);
 
  const resultados=useMemo(()=>{
    const t=q.trim().toLowerCase();const terms=t?t.split(/\s+/):[];
    return prospectos.map(p=>{
      let qScore=0;
      if(terms.length){terms.forEach(term=>{if(p.nombre.toLowerCase().includes(term))qScore+=10;if(p.rubro.toLowerCase().includes(term))qScore+=8;if((p.zona||"").toLowerCase().includes(term))qScore+=6;if((p.direccion||"").toLowerCase().includes(term))qScore+=4;if((p.notas||"").toLowerCase().includes(term))qScore+=2;});}else qScore=1;
      const pass=(terms.length===0||qScore>0)&&(!zona||p.zona===zona)&&(!rubro||p.rubro===rubro)&&(!estadoF||p.estado===estadoF)&&(!tieneTel||!!p.telefono);
      return{...p,_qScore:qScore,_potScore:calcScore(p),_pass:pass};
    }).filter(p=>p._pass).sort((a,b)=>{
      if(ordenar==="score")return b._potScore-a._potScore;
      if(ordenar==="relevancia"&&t)return b._qScore-a._qScore;
      if(ordenar==="az")return a.nombre.localeCompare(b.nombre);
      if(ordenar==="estado")return ESTADOS_P.indexOf(a.estado)-ESTADOS_P.indexOf(b.estado);
      return b._potScore-a._potScore;
    });
  },[prospectos,q,zona,rubro,estadoF,tieneTel,ordenar]);
 
  const stats=useMemo(()=>({total:resultados.length,conTel:resultados.filter(p=>p.telefono).length,porC:resultados.filter(p=>p.estado==="Por contactar").length,enN:resultados.filter(p=>p.estado==="En negociación").length,avgScore:resultados.length?Math.round(resultados.reduce((s,p)=>s+p._potScore,0)/resultados.length):0}),[resultados]);
  const hayFiltros=q||zona||rubro||estadoF||tieneTel;
  const limpiar=()=>{setQ("");setZona("");setRubro("");setEstadoF("");setTieneTel(false);};
 
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Comercios</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:14}}>Prospección CABA y GBA · Recorrida con la Berlingo</p>
      <div style={{position:"relative",marginBottom:10}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38,paddingRight:q?36:12}} placeholder="Nombre, rubro, zona, dirección o nota..." value={q} onChange={e=>setQ(e.target.value)}/>
        {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:MU,padding:2}}>{I.x}</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8,marginBottom:8}}>
        <select value={zona} onChange={e=>setZona(e.target.value)}><option value="">Todas las zonas</option>{ZONAS.map(z=><option key={z} value={z}>{z}</option>)}</select>
        <select value={rubro} onChange={e=>setRubro(e.target.value)}><option value="">Todos los rubros</option>{RUBROS.map(r=><option key={r} value={r}>{r}</option>)}</select>
        <select value={estadoF} onChange={e=>setEstadoF(e.target.value)}><option value="">Todos los estados</option>{ESTADOS_P.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <select value={ordenar} onChange={e=>setOrdenar(e.target.value)}><option value="score">Ordenar: potencial</option><option value="relevancia">Ordenar: relevancia</option><option value="az">Ordenar: A → Z</option><option value="estado">Ordenar: estado</option></select>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:15,color:tieneTel?G:MU}}><input type="checkbox" checked={tieneTel} onChange={e=>setTieneTel(e.target.checked)} style={{width:14,height:14,accentColor:G}}/>Solo con teléfono</label>
        {hayFiltros&&<button onClick={limpiar} style={{fontSize:14,color:AM,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Limpiar filtros</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,minmax(0,1fr))",gap:6,marginBottom:16}}>
        {[{l:"Total",v:stats.total,c:CR},{l:"Con WA",v:stats.conTel,c:GR},{l:"Por cont.",v:stats.porC,c:AM},{l:"En neg.",v:stats.enN,c:G},{l:"Score prom.",v:stats.avgScore,c:scoreLabel(stats.avgScore).c}].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 6px",textAlign:"center"}}>

            <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.04em",marginTop:1}}>{s.l}</div>

        ))}
      </div>
      {resultados.length===0?<div style={{textAlign:"center",padding:"48px 0"}}><div style={{color:MU,fontSize:16,marginBottom:8}}>Sin resultados.</div>{hayFiltros&&<button onClick={limpiar} style={{fontSize:15,color:G,background:"none",border:`1px solid ${G}44`,borderRadius:8,padding:"6px 14px",cursor:"pointer"}}>Limpiar filtros</button>}</div>
        :resultados.map(p=>{
          const isOpen=expandido===p.id;const sl=scoreLabel(p._potScore);
          return(
            <div key={p.id} style={{background:CA,border:`1px solid ${isOpen?G:BO}`,borderRadius:18,marginBottom:8,overflow:"hidden",transition:"border-color 0.2s"}}>

                    {p.estado==="En negociación"&&"Prioridad alta. Confirmá pedido y convertilo."}
                    {p.estado==="Descartado"&&"Descartado. Podés actualizarlo si cambia."}
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    <button onClick={()=>setEditing(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:MU,background:"none",border:`1px solid ${BO}`}}>{I.edit}Editar</button>
                    <button onClick={()=>compartirCatalogoDesdeComercios(p.id)} disabled={compartiendoId===p.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:compartiendoId===p.id?"not-allowed":"pointer",color:G,background:"none",border:`1px solid ${G}44`,opacity:compartiendoId===p.id?0.6:1}}>{I.share}{compartiendoId===p.id?"...":"Catálogo"}</button>
                    {p.telefono&&<>
                      <a href={`https://wa.me/${p.telefono}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,background:"#25D36615",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none"}}>{I.wa}WA directo</a>
                      <button onClick={()=>setSpTarget(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",background:G+"20",color:G,border:`1px solid ${G}44`}}>{I.msg}Speech → WA</button>
                    </>}
                    <button onClick={()=>onConvertir(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:GR,background:"none",border:`1px solid ${GR}44`,marginLeft:"auto"}}>{I.plus}→ Cliente</button>
                    <button onClick={()=>{if(window.confirm(`¿Eliminar "${p.nombre}"? Esta acción no se puede deshacer.`)){setProspectos(prev=>prev.filter(x=>x.id!==p.id));setExpandido(null);}}} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,padding:"7px 10px",borderRadius:6,cursor:"pointer",color:RE,background:"none",border:`1px solid ${RE}44`}}>{I.trash}</button>
                  </div>
                </div>
              )}
            </div>
          );
        })
      }
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo comercio">
        <FormProspecto onCancel={()=>setShowNew(false)} onSave={f=>{setProspectos(p=>[...p,{id:uid(),...f}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!editing} onClose={()=>setEditing(null)} title="Editar comercio">
        {editing&&<FormProspecto initial={editing} onCancel={()=>setEditing(null)} onSave={f=>{setProspectos(p=>p.map(x=>x.id===editing.id?{...x,...f}:x));setEditing(null);}}/>}
      </Modal>
      <SpeechPicker open={!!spTarget} onClose={()=>setSpTarget(null)} speeches={speeches} telefono={spTarget?.telefono} nombre={spTarget?.nombre||""}/>
    </div>
  );
}
 
// ── PEDIDOS ───────────────────────────────────────────────────────
function Pedidos({pedidos,setPedidos,clientes,setClientes,prods,setProds,promo51}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const[showNew,setShowNew]=useState(false);
  const[editandoId,setEditandoId]=useState(null);
  // Cabecera del pedido
  const[clienteId,setClienteId]=useState("");
  const[fechaEntrega,setFechaEntrega]=useState(hoyISO());
  const[horaEntrega,setHoraEntrega]=useState("10:00");
  const[pagado,setPagado]=useState(false);
  const[notas,setNotas]=useState("");
  // Líneas del pedido (multi-producto)
  const[lineas,setLineas]=useState([{id:uid(),productoId:"rubia",cantidad:"",monto:"",descuentoPct:"",esBono:false}]);
  const[promoAplica,setPromoAplica]=useState(false);
  const[descuentoPct,setDescuentoPct]=useState("");
  const[incluyeIVA,setIncluyeIVA]=useState(false);
  const[generandoRemitoId,setGenerandoRemitoId]=useState(null);
 
  const resetForm=()=>{
    setClienteId("");setFechaEntrega(hoyISO());setHoraEntrega("10:00");setPagado(false);setNotas("");
    setLineas([{id:uid(),productoId:"rubia",cantidad:"",monto:"",descuentoPct:"",esBono:false}]);
    setDescuentoPct("");setIncluyeIVA(false);setPromoAplica(false);setEditandoId(null);
  };

  const abrirEdicion=p=>{
    setEditandoId(p.id);
    setClienteId(p.clienteId||"");
    setFechaEntrega(p.fechaEntrega||hoyISO());
    setHoraEntrega(p.horaEntrega||"10:00");
    setPagado(!!p.pagado);
    setNotas(p.notas||"");
    setLineas((p.lineas&&p.lineas.length>0?p.lineas:[{productoId:"rubia",cantidad:"",monto:"",descuentoPct:"",esBono:false}]).map(l=>({id:l.id||uid(),productoId:l.productoId,cantidad:String(l.cantidad||""),monto:String(l.monto||""),descuentoPct:l.descuentoPct?String(l.descuentoPct):"",esBono:!!l.esBono})));
    setDescuentoPct(p.descuentoPct?String(p.descuentoPct):"");
    setIncluyeIVA(!!p.incluyeIVA);
    setPromoAplica(!!p.promoAplica);
    setShowNew(true);
  };
