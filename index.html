          <div className="bebas" style={{fontSize:22,color:gananciaPendiente>0?"#C24545":CR}}>{fmtARS(gananciaPendiente)}</div>
        </div>
      </div>

      <div style={{background:GDK,borderRadius:18,padding:18,marginBottom:16}}>
        <div style={{fontSize:13,color:"#8FE3B4",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Este mes</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div>
            <div style={{fontSize:12,color:"#8FE3B4",marginBottom:2}}>Facturado</div>
            <div className="bebas" style={{fontSize:22,color:"#fff"}}>{fmtARS(facturadoMes)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:12,color:"#8FE3B4",marginBottom:2}}>Ganancia</div>
            <div className="bebas" style={{fontSize:22,color:"#fff"}}>{fmtARS(gananciaMes)}</div>
          </div>
        </div>
      </div>

      {sinComision>0&&(
        <div style={{background:AM+"11",border:`1px solid ${AM}33`,borderRadius:14,padding:"10px 14px",fontSize:14,color:"#C08A3E",marginBottom:16}}>
          ⚠ {sinComision} cliente{sinComision!==1?"s":""} sin % de comisión configurado (sus ventas se cuentan con $0 de ganancia). Cargalo en la ficha del cliente: {clientesSinComision.slice(0,3).map(c=>c.nombre).join(", ")}{sinComision>3?"...":""}
        </div>
      )}

      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Ganancia mensual · últimos 6 meses</div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90}}>
          {evolucionGanancia.map((m,i)=>(
            <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
              <div style={{width:"100%",maxWidth:28,height:`${Math.max(4,Math.round((m.ganancia/maxGananciaMes)*68))}px`,borderRadius:6,background:i===evolucionGanancia.length-1?G:GLT,transition:"height 0.4s"}}/>

    lista=[...lista].sort((a,b)=>{

function Metricas({clientes,prods}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const todas=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,clienteNombre:c.nombre,rubro:c.rubro,zona:c.zona}))),[clientes]);

  // KPIs: ticket promedio, frecuencia de compra, cobrado vs pendiente
  const montoTotalVentas=useMemo(()=>todas.reduce((s,v)=>s+(v.monto||0),0),[todas]);
  const ticketPromedio=todas.length?Math.round(montoTotalVentas/todas.length):0;
  const deudaTotal=totalAdeudado(clientes);
  const montoPagado=montoTotalVentas-deudaTotal;
  const pctCobrado=montoTotalVentas>0?Math.round((montoPagado/montoTotalVentas)*100):100;
  const frecuenciaCompraDias=useMemo(()=>{
    const gaps=[];
    clientes.forEach(c=>{
      const fechas=(c.ventas||[]).map(v=>v.fecha).filter(Boolean).sort();
      for(let i=1;i<fechas.length;i++){
        const diff=(new Date(fechas[i]+"T00:00:00")-new Date(fechas[i-1]+"T00:00:00"))/86400000;
        if(diff>=0)gaps.push(diff);
      }
    });
    return gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null;
  },[clientes]);

  // Evolución mensual (últimos 6 meses)
  const evolucionMensual=useMemo(()=>{
    const hoy=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]={litros:0,monto:0});
    todas.forEach(v=>{
      const key=(v.fecha||"").slice(0,7);
      if(map[key]){map[key].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);map[key].monto+=v.monto||0;}
    });
    return meses.map(m=>({...m,...map[m.key]}));
  },[todas,envaseMap]);
  const maxMes=Math.max(1,...evolucionMensual.map(m=>m.litros));
  const maxMesMonto=Math.max(1,...evolucionMensual.map(m=>m.monto));

  // Cobros mensuales — según fecha en que se cobró cada venta (fechaCobro), no la fecha de venta
  const cobrosMensuales=useMemo(()=>{
    const hoy=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]=0);
    todas.forEach(v=>{
      if(!v.pagado)return;
      const key=(v.fechaCobro||v.fecha||"").slice(0,7);
      if(key in map)map[key]+=v.monto||0;
    });
    return meses.map(m=>({...m,monto:map[m.key]}));
  },[todas]);
  const maxCobroMes=Math.max(1,...cobrosMensuales.map(m=>m.monto));

  // Top clientes por facturación total
  const topClientesFacturacion=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.clienteNombre])map[v.clienteNombre]={litros:0,monto:0,pedidos:0};
      map[v.clienteNombre].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.clienteNombre].monto+=v.monto||0;
      map[v.clienteNombre].pedidos+=1;
    });
    return Object.entries(map).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.monto-a.monto).slice(0,8);
  },[todas,envaseMap]);
  const maxFacturacion=topClientesFacturacion[0]?.monto||1;

  // Ventas por tipo de envase
  const ENVASE_COLOR={PET:G,Barril:AM,Lata:"#4472BE"};
  const rankingEnvase=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      const envase=prods.find(p=>p.id===v.producto)?.envase||"Otro";
      if(!map[envase])map[envase]={litros:0,monto:0};
      map[envase].litros+=litrosDeItem(v.cantidad,envase);
      map[envase].monto+=v.monto||0;
    });
    return Object.entries(map).map(([envase,d])=>({envase,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods]);
  const maxEnvase=Math.max(1,...rankingEnvase.map(e=>e.litros));

  // Día de la semana con más ventas
  const DIAS_LBL=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const ventasPorDiaSemana=useMemo(()=>{
    const acc=[0,0,0,0,0,0,0];
    todas.forEach(v=>{
      if(!v.fecha)return;
      const dow=new Date(v.fecha+"T00:00:00").getDay();
      acc[dow===0?6:dow-1]+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
    });
    return DIAS_LBL.map((lbl,i)=>({lbl,litros:acc[i]}));
  },[todas,envaseMap]);
  const maxDiaSem=Math.max(1,...ventasPorDiaSemana.map(d=>d.litros));
  const diaTop=ventasPorDiaSemana.reduce((max,d)=>d.litros>max.litros?d:max,ventasPorDiaSemana[0]);
 
  // Ranking por producto
  const rankingProducto=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.producto])map[v.producto]={litros:0,monto:0,pedidos:0};
      map[v.producto].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.producto].monto+=v.monto;
      map[v.producto].pedidos+=1;
    });
    return Object.entries(map).map(([id,d])=>({id,nombre:prods.find(p=>p.id===id)?.nombre||id,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods,envaseMap]);
 
  // Ranking clientes por producto
  const rankingClientesPorProd=useMemo(()=>{
    const byProd={};
    prods.forEach(p=>byProd[p.id]={});
    todas.forEach(v=>{
      if(!byProd[v.producto])byProd[v.producto]={};
      if(!byProd[v.producto][v.clienteNombre])byProd[v.producto][v.clienteNombre]={litros:0,monto:0};
      byProd[v.producto][v.clienteNombre].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      byProd[v.producto][v.clienteNombre].monto+=v.monto;
    });
    const result={};
    Object.entries(byProd).forEach(([prodId,clientes])=>{
      result[prodId]=Object.entries(clientes).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.litros-a.litros).slice(0,5);
    });
    return result;
  },[todas,prods,envaseMap]);
 
  // Ranking por zona
  const rankingZona=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.zona])map[v.zona]={litros:0,monto:0,pedidos:0};
      map[v.zona].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.zona].monto+=v.monto;
      map[v.zona].pedidos+=1;
    });
    return Object.entries(map).map(([zona,d])=>({zona,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,envaseMap]);
 
  // Ranking por rubro
  const rankingRubro=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.rubro])map[v.rubro]={litros:0,monto:0,pedidos:0};
      map[v.rubro].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.rubro].monto+=v.monto;
      map[v.rubro].pedidos+=1;
    });
    return Object.entries(map).map(([rubro,d])=>({rubro,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,envaseMap]);
 
  const maxZona=rankingZona[0]?.litros||1;

function FormNota({initial,onSave,onCancel,onDelete,cal}){
  const[f,setF]=useState({
    titulo:initial.titulo||"",contenido:initial.contenido||"",color:initial.color||NOTE_COLORS[0].key,
    recordatorioFecha:initial.recordatorioFecha||"",recordatorioHora:initial.recordatorioHora||"09:00",
  });
  const[calSync,setCalSync]=useState(!!initial.calSync);
  const[saving,setSaving]=useState(false);
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const calSafe=cal||{calToken:null,calError:"",login:()=>{},crearEvento:async()=>false};
  const tieneRecordatorio=!!f.recordatorioFecha;
  const guardar=async()=>{
    if(!f.titulo.trim())return;
    setSaving(true);
    let calOk=false;
    if(tieneRecordatorio&&calSync&&calSafe.calToken){
      calOk=await calSafe.crearEvento({titulo:"📝 "+f.titulo,descripcion:f.contenido||"",fecha:f.recordatorioFecha,hora:f.recordatorioHora||"09:00",durMin:15});
    }
    setSaving(false);
    onSave({
      ...f,titulo:f.titulo.trim(),
      recordatorioFecha:tieneRecordatorio?f.recordatorioFecha:"",
      recordatorioHora:tieneRecordatorio?(f.recordatorioHora||"09:00"):"",
      recordatorioDisparado:tieneRecordatorio?!!initial.recordatorioDisparado&&initial.recordatorioFecha===f.recordatorioFecha&&initial.recordatorioHora===f.recordatorioHora:false,
      calSync:tieneRecordatorio&&calSync&&calOk,
    });
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><Lbl t="Título"/><input value={f.titulo} onChange={s("titulo")} placeholder="Ej: Pedido especial Bar Norte" autoFocus/></div>
      <div><Lbl t="Contenido"/><textarea rows={5} value={f.contenido} onChange={s("contenido")} placeholder="Escribí acá los detalles..." style={{fontFamily:"inherit",resize:"vertical"}}/></div>
      <div>
        <Lbl t="Color"/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {NOTE_COLORS.map(c=>(
            <button key={c.key} type="button" onClick={()=>setF(p=>({...p,color:c.key}))} title={c.key} style={{width:34,height:34,borderRadius:"50%",cursor:"pointer",border:`2px solid ${f.color===c.key?c.tx:c.bd}`,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{f.color===c.key&&<span style={{color:c.tx,display:"flex"}}>{I.check}</span>}</button>
          ))}
        </div>
      </div>
      <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:12,padding:14}}>
        <Lbl t="⏰ Recordatorio (opcional)"/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:tieneRecordatorio?10:0}}>
          <div><input type="date" value={f.recordatorioFecha} onChange={s("recordatorioFecha")}/></div>
          <div><input type="time" value={f.recordatorioHora} onChange={s("recordatorioHora")} disabled={!tieneRecordatorio}/></div>
        </div>
        {tieneRecordatorio&&(
          <>
            <button type="button" onClick={()=>setF(p=>({...p,recordatorioFecha:""}))} style={{fontSize:13,color:RE,background:"none",border:"none",cursor:"pointer",textDecoration:"underline",marginBottom:10}}>✕ Quitar recordatorio</button>
            <div style={{fontSize:13,color:MU,marginBottom:10,lineHeight:1.5}}>Con la app abierta te avisamos con sonido y aviso en pantalla a esa hora.</div>
            {calSafe.calToken?(
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:14,color:CR}}>
                <input type="checkbox" checked={calSync} onChange={e=>setCalSync(e.target.checked)} style={{width:18,height:18,flexShrink:0,accentColor:G}}/>
                También crear evento en Google Calendar
              </label>
            ):(
              <div style={{fontSize:13,color:AM,lineHeight:1.5}}>💡 Conectá Google Calendar en Configuración para que este recordatorio también te llegue como notificación del celular, incluso con la app cerrada.</div>
            )}
          </>
        )}
      </div>
      <div style={{display:"flex",gap:8,paddingTop:4,alignItems:"center"}}>
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
        {onDelete&&<button onClick={onDelete} title="Eliminar nota" style={{width:42,height:42,borderRadius:10,background:RE+"14",border:`1px solid ${RE}33`,color:RE,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.trash}</button>}
        <div style={{flex:1}}/>
        <Btn variant="green" onClick={guardar} disabled={!f.titulo.trim()||saving}>{saving?"Guardando...":"Guardar"}</Btn>
      </div>
    </div>
  );
}

function Notas({notas,setNotas,cal}){
  const[modalOpen,setModalOpen]=useState(false);
  const[editing,setEditing]=useState(null);
  const[filtroColor,setFiltroColor]=useState("");
  const[busqueda,setBusqueda]=useState("");

  const nuevaNota=()=>{setEditing({});setModalOpen(true);};
  const editarNota=n=>{setEditing(n);setModalOpen(true);};
  const cerrar=()=>{setModalOpen(false);setEditing(null);};

  const guardar=f=>{
    const ahora=new Date().toISOString();
    if(editing&&editing.id){
      setNotas(prev=>prev.map(n=>n.id===editing.id?{...n,...f,actualizadoEn:ahora}:n));
    }else{
      setNotas(prev=>[{id:uid(),...f,creadoEn:ahora,actualizadoEn:ahora},...(prev||[])]);
    }
    cerrar();
  };
  const eliminar=()=>{
    if(!editing||!editing.id)return;
    if(!confirm("¿Eliminar esta nota? No se puede deshacer."))return;
    setNotas(prev=>prev.filter(n=>n.id!==editing.id));
    cerrar();
  };

  const filtradas=useMemo(()=>{
    const term=busqueda.trim().toLowerCase();
    return[...(notas||[])]
      .filter(n=>(!filtroColor||n.color===filtroColor)&&(!term||n.titulo.toLowerCase().includes(term)||(n.contenido||"").toLowerCase().includes(term)))
      .sort((a,b)=>new Date(b.actualizadoEn||b.creadoEn)-new Date(a.actualizadoEn||a.creadoEn));
  },[notas,filtroColor,busqueda]);

  const permisoNotif=typeof Notification!=="undefined"?Notification.permission:"unsupported";

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Notas</span>
        <Btn variant="green" small onClick={nuevaNota}>{I.plus}Nueva</Btn>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:12}}>Bloc de notas con colores para organizar ideas, pendientes y recordatorios.</p>
      {permisoNotif==="default"&&(
        <button onClick={()=>Notification.requestPermission()} style={{display:"flex",alignItems:"center",gap:8,width:"100%",textAlign:"left",background:G+"11",border:`1px solid ${G}33`,borderRadius:10,padding:"10px 14px",marginBottom:14,cursor:"pointer",fontSize:14,color:G,fontWeight:600}}>
          🔔 Activar avisos del celular para tus recordatorios
        </button>
      )}
      {permisoNotif==="denied"&&(
        <div style={{fontSize:13,color:MU,background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"10px 14px",marginBottom:14,lineHeight:1.5}}>🔕 Los avisos del celular están bloqueados para esta app. Igual te va a avisar con sonido y aviso en pantalla mientras la tenés abierta.</div>
      )}

      <input placeholder="Buscar en notas..." value={busqueda} onChange={e=>setBusqueda(e.target.value)} style={{marginBottom:10}}/>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:18}}>
        <button onClick={()=>setFiltroColor("")} style={{padding:"5px 12px",borderRadius:20,fontSize:13,fontWeight:700,cursor:"pointer",border:`1px solid ${!filtroColor?G:BO}`,background:!filtroColor?G:"transparent",color:!filtroColor?"#fff":MU}}>Todas</button>
        {NOTE_COLORS.map(c=>(
          <button key={c.key} onClick={()=>setFiltroColor(f=>f===c.key?"":c.key)} title={c.key} style={{width:28,height:28,borderRadius:"50%",cursor:"pointer",border:`2px solid ${filtroColor===c.key?c.tx:c.bd}`,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{filtroColor===c.key&&<span style={{color:c.tx,display:"flex",transform:"scale(0.8)"}}>{I.check}</span>}</button>
        ))}
      </div>

      {filtradas.length===0?(
        <p style={{color:MU,fontSize:16,textAlign:"center",padding:"30px 16px"}}>{(notas||[]).length===0?"Todavía no cargaste notas.":"No hay notas que coincidan con la búsqueda/filtro."}</p>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
          {filtradas.map(n=>{
            const col=colorNota(n.color);
            const tieneRec=!!n.recordatorioFecha;
            const recVencido=tieneRec&&new Date(`${n.recordatorioFecha}T${n.recordatorioHora||"09:00"}:00`)<new Date();
            return(
              <button key={n.id} onClick={()=>editarNota(n)} style={{textAlign:"left",background:col.bg,border:`1px solid ${col.bd}`,borderRadius:14,padding:12,cursor:"pointer",display:"flex",flexDirection:"column",gap:6,minHeight:104}}>
                <div style={{fontSize:15,fontWeight:700,color:col.tx,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{n.titulo}</div>
                {n.contenido&&<div style={{fontSize:13,color:col.tx,opacity:0.85,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:4,WebkitBoxOrient:"vertical",flex:1,lineHeight:1.4}}>{n.contenido}</div>}
                {tieneRec&&(
                  <div style={{fontSize:11,fontWeight:700,color:col.tx,opacity:recVencido&&n.recordatorioDisparado?0.5:1,display:"flex",alignItems:"center",gap:4,marginTop:n.contenido?0:"auto"}}>
                    ⏰ {fmtDate(n.recordatorioFecha)} · {n.recordatorioHora}hs{n.calSync?" · 📅":""}
                  </div>
                )}
                <div style={{fontSize:11,color:col.tx,opacity:0.6,marginTop:tieneRec?0:"auto"}}>{fmtDateTime(n.actualizadoEn||n.creadoEn)}</div>
              </button>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={cerrar} title={editing&&editing.id?"Editar nota":"Nueva nota"}>
        {editing&&<FormNota initial={editing} onSave={guardar} onCancel={cerrar} onDelete={editing.id?eliminar:null} cal={cal}/>}
      </Modal>
    </div>
  );
}

function Configuracion({cal,clientes,setClientes,prospectos,setProspectos,pedidos,setPedidos,prods,setProds,speeches,setSpeeches,notas,setNotas,gastos,setGastos,metaSemanal,setMetaSemanal,diasMora,setDiasMora,promo51,setPromo51}){
  const[clientId,setClientId]=useState(getCalClientId());
  const[guardado,setGuardado]=useState(false);
  const[moraTmp,setMoraTmp]=useState(String(diasMora));
  const guardarMora=()=>{const n=Number(moraTmp);if(n>0)setDiasMora(n);};
  const[promoTmp,setPromoTmp]=useState(()=>({activo:promo51.activo,marcaCuenta:promo51.marcaCuenta||"",envaseCuenta:promo51.envaseCuenta||"",cantidadNecesaria:String(promo51.cantidadNecesaria||5),productoBonoId:promo51.productoBonoId||"",cantidadBono:String(promo51.cantidadBono||1)}));
  const promoTieneCambios=promoTmp.activo!==promo51.activo||promoTmp.marcaCuenta!==(promo51.marcaCuenta||"")||promoTmp.envaseCuenta!==(promo51.envaseCuenta||"")||promoTmp.cantidadNecesaria!==String(promo51.cantidadNecesaria||5)||promoTmp.productoBonoId!==(promo51.productoBonoId||"")||promoTmp.cantidadBono!==String(promo51.cantidadBono||1);
  const guardarPromo=()=>{
    setPromo51({
      activo:promoTmp.activo&&!!promoTmp.marcaCuenta&&!!promoTmp.productoBonoId,
      marcaCuenta:promoTmp.marcaCuenta,
      envaseCuenta:promoTmp.envaseCuenta,
      cantidadNecesaria:Number(promoTmp.cantidadNecesaria)||5,
      productoBonoId:promoTmp.productoBonoId,
      cantidadBono:Number(promoTmp.cantidadBono)||1,
    });
  };
 
  const guardarClientId=()=>{
    const val=clientId.trim();
    if(!val)return;
    localStorage.setItem("farol_gcal_client_id",val);
    setGuardado(true);
    setTimeout(()=>setGuardado(false),2000);
  };
  const limpiarClientId=()=>{
    localStorage.removeItem("farol_gcal_client_id");
    setClientId("");
    cal.logout&&cal.logout();
  };
  const tieneClientId=!!getCalClientId();
 
  const envaseMapExport=envaseMapDe(prods);
  // ── Exportaciones ──
  const exportarClientes=()=>{
    const filas=clientes.map(c=>{
      const saldo=saldoCliente(c);
      const totalVentas=c.ventas.reduce((s,v)=>s+v.monto,0);
      const totalLitros=c.ventas.reduce((s,v)=>s+litrosDeItem(v.cantidad,envaseMapExport[v.producto]),0);
      const ultimaVenta=lastSale(c);
      return[
        `"${c.nombre}"`,
        `"${c.rubro}"`,
        `"${c.zona}"`,
        `"${c.direccion||""}"`,
        `"${c.telefono||""}"`,
        totalVentas,
        totalLitros,
        saldo,
        c.ventas.length,
        ultimaVenta?ultimaVenta.fecha:"",
        `"${c.notas||""}"`,
      ].join(",");
    });
    const header="Nombre,Rubro,Zona,Dirección,Teléfono,Total vendido (ARS),Total litros,Saldo pendiente (ARS),Cantidad pedidos,Última venta,Notas";
    descargarCSV(`clientes_farol_${hoyISO()}.csv`,header+"\n"+filas.join("\n"));
  };
 
  const exportarVentas=()=>{
    const filas=clientes.flatMap(c=>
      c.ventas.map(v=>{
        const prod=prods.find(p=>p.id===v.producto);
        return[
          `"${c.nombre}"`,
          `"${c.rubro}"`,
          `"${c.zona}"`,
          v.fecha,
          `"${prod?prod.nombre:v.producto}"`,
          v.cantidad,
          v.monto,
          v.pagado?"Pagado":"Pendiente",
        ].join(",");
      })
    ).sort();
    const header="Cliente,Rubro,Zona,Fecha,Producto,Cantidad (L),Monto (ARS),Estado pago";
    descargarCSV(`ventas_farol_${hoyISO()}.csv`,header+"\n"+filas.join("\n"));
  };
 
  const exportarTodo=async()=>{
    const data=JSON.stringify({
      version:1,exportadoEn:new Date().toISOString(),
      clientes,prospectos,pedidos,prods,speeches,notas,gastos,
      config:{metaSemanal,diasMora,promo51}
    },null,2);
    const fileName=`backup_grunge_farol_${hoyISO()}.json`;
    const blob=new Blob([data],{type:"application/json;charset=utf-8;"});
    let compartido=false;
    if(navigator.share&&navigator.canShare){
      try{
        const file=new File([blob],fileName,{type:"application/json"});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Backup Grunge & Farol",text:"Backup completo de la app"});
          compartido=true;
        }
      }catch(e){if(e&&e.name==="AbortError")compartido=true;}
    }
    if(!compartido){
      const url=URL.createObjectURL(blob);
      const nuevaVentana=window.open(url,"_blank");
      if(!nuevaVentana){
        const a=document.createElement("a");a.href=url;a.download=fileName;a.target="_blank";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
  };
 
  const fileInputRef=React.useRef(null);
  const[restaurando,setRestaurando]=useState(false);
  const restaurarBackup=e=>{
    const archivo=e.target.files&&e.target.files[0];
    if(!archivo)return;
    setRestaurando(true);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data||typeof data!=="object")throw new Error("El archivo no tiene el formato esperado.");
        const resumen=[
          data.clientes?`${data.clientes.length} clientes`:null,
          data.prospectos?`${data.prospectos.length} comercios`:null,
          data.pedidos?`${data.pedidos.length} pedidos`:null,
          data.prods?`${data.prods.length} productos`:null,
          data.notas?`${data.notas.length} notas`:null,
          data.gastos?`${data.gastos.length} gastos`:null,
        ].filter(Boolean).join(", ");
        if(!confirm(`Este backup tiene: ${resumen||"(sin datos reconocibles)"}.\n\nEsto va a REEMPLAZAR todos los datos actuales de la app en este dispositivo (y se sincroniza a la nube). Esta acción no se puede deshacer.\n\n¿Continuar?`))return;
        if(Array.isArray(data.clientes))setClientes(data.clientes);
        if(Array.isArray(data.prospectos))setProspectos(data.prospectos);
        if(Array.isArray(data.pedidos))setPedidos(data.pedidos);
        if(Array.isArray(data.prods)&&data.prods.length>0)setProds(data.prods);
        if(setSpeeches&&Array.isArray(data.speeches))setSpeeches(data.speeches);
        if(setNotas&&Array.isArray(data.notas))setNotas(data.notas);
        if(setGastos&&Array.isArray(data.gastos))setGastos(data.gastos);
        if(data.config){
          if(typeof data.config.metaSemanal==="number")setMetaSemanal(data.config.metaSemanal);
          if(typeof data.config.diasMora==="number")setDiasMora(data.config.diasMora);
          if(data.config.promo51&&typeof data.config.promo51==="object")setPromo51(prev=>({...prev,...data.config.promo51}));
        }
        alert("✓ Backup restaurado correctamente.");
      }catch(err){
        alert("No se pudo leer el backup:\n\n"+(err&&err.message?err.message:String(err))+"\n\nVerificá que sea un archivo JSON exportado desde esta misma app.");
      }finally{
        setRestaurando(false);
        if(fileInputRef.current)fileInputRef.current.value="";
      }
    };
    reader.readAsText(archivo);
  };
 
  function descargarCSV(nombre,contenido){
    const blob=new Blob(["\uFEFF"+contenido],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=nombre;a.click();
  }

  // ── Borrado y reseteo ──
  const borrarClientes=()=>{
    if(!confirm(`¿Borrar los ${clientes.length} clientes? Se pierde todo el historial de ventas y saldos. Esta acción no se puede deshacer.`))return;
    if(!confirm("Confirmá de nuevo: esto borra TODOS los clientes y sus ventas."))return;
    setClientes([]);
  };
  const borrarComercios=()=>{
    if(!confirm(`¿Borrar los ${prospectos.length} comercios/prospectos? Esta acción no se puede deshacer.`))return;
    setProspectos([]);
  };
  const borrarPedidos=()=>{
    if(!confirm(`¿Borrar los ${pedidos.length} pedidos (pendientes e historial de entregas)? No afecta las ventas ya registradas en cada cliente. Esta acción no se puede deshacer.`))return;
    setPedidos([]);
  };
  const borrarNotas=()=>{
    if(!confirm(`¿Borrar las ${(notas||[]).length} notas? Esta acción no se puede deshacer.`))return;
    setNotas([]);
  };
  const restablecerProductos=()=>{
    if(!confirm("¿Restablecer el catálogo de productos a los valores de fábrica? Se pierden los precios, promos y productos cargados manualmente."))return;
    setProds(PRODS_INIT);
  };
  const RESET_BACKUP_KEY="farol_reset_backup";
  const[deshacerDisponible,setDeshacerDisponible]=useState(()=>{
    try{return!!localStorage.getItem(RESET_BACKUP_KEY);}catch(e){return false;}
  });

  const resetGeneral=()=>{
    if(!confirm("¿Resetear el programa por completo? Se borran clientes, comercios, pedidos, speeches, la meta semanal, los días de mora, y los productos vuelven a sus valores de fábrica.\n\n(Vas a poder deshacer esto después con el botón \"Deshacer último reseteo\", mientras no hagas otro reseteo.)"))return;
    if(!confirm("Última confirmación: esto borra TODOS los datos de Grunge & Farol de este dispositivo (se sincroniza a la nube). ¿Continuar?"))return;
    try{
      localStorage.setItem(RESET_BACKUP_KEY,JSON.stringify({
        ts:Date.now(),clientes,prospectos,pedidos,prods,speeches,metaSemanal,diasMora
      }));
      setDeshacerDisponible(true);
    }catch(e){/* si falla el guardado del snapshot, igual seguimos con el reseteo */}
    setClientes([]);
    setProspectos([]);
    setPedidos([]);
    setProds(PRODS_INIT);
    setMetaSemanal(0);
    setDiasMora(15);
    if(setSpeeches)setSpeeches(initSpeeches);
  };

  const deshacerReset=()=>{
    let snap=null;
    try{snap=JSON.parse(localStorage.getItem(RESET_BACKUP_KEY));}catch(e){}
    if(!snap){alert("No se encontró una copia para deshacer.");setDeshacerDisponible(false);return;}
    const cuando=new Date(snap.ts).toLocaleString("es-AR");
    if(!confirm(`Vas a restaurar cómo estaba todo antes del último reseteo (${cuando}). ¿Continuar?`))return;
    setClientes(snap.clientes||[]);
    setProspectos(snap.prospectos||[]);
    setPedidos(snap.pedidos||[]);
    setProds(snap.prods&&snap.prods.length>0?snap.prods:PRODS_INIT);
    setMetaSemanal(typeof snap.metaSemanal==="number"?snap.metaSemanal:0);
    setDiasMora(typeof snap.diasMora==="number"?snap.diasMora:15);
    if(setSpeeches)setSpeeches(snap.speeches||initSpeeches);
    try{localStorage.removeItem(RESET_BACKUP_KEY);}catch(e){}
    setDeshacerDisponible(false);
    alert("✓ Se restauraron los datos previos al reseteo.");
  };

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:30,color:CR,display:"block",marginBottom:4}}>Configuración</span>
      <p style={{fontSize:14,color:MU,marginBottom:24}}>Integraciones, exportaciones y ajustes</p>
 
      {/* ── Exportar datos ── */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:20,marginBottom:16}}>
        <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:4}}>📦 Exportar datos</div>
        <p style={{fontSize:14,color:MU,marginBottom:16,lineHeight:1.5}}>Descargá tus datos como backup o para abrirlos en Excel.</p>
 
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Clientes */}
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:CR}}>Clientes</div>
              <div style={{fontSize:13,color:MU,marginTop:2}}>Nombre, zona, teléfono, saldo, total vendido · {clientes.length} clientes</div>
            </div>
            <button onClick={exportarClientes} style={{padding:"8px 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              ↓ CSV
            </button>
          </div>
 
          {/* Ventas */}
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:CR}}>Ventas</div>
              <div style={{fontSize:13,color:MU,marginTop:2}}>Fecha, cliente, producto, litros, monto, estado de pago · {clientes.reduce((s,c)=>s+c.ventas.length,0)} registros</div>
            </div>
            <button onClick={exportarVentas} style={{padding:"8px 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              ↓ CSV
            </button>
          </div>
 
          {/* Backup completo */}
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"12px 14px"}}>
            <div style={{fontSize:15,fontWeight:700,color:CR}}>Backup completo</div>
            <div style={{fontSize:13,color:MU,marginTop:2,marginBottom:10}}>Clientes, comercios, pedidos, productos, speeches y configuración — todo en un solo archivo JSON.</div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={exportarTodo} style={{flex:1,padding:"10px 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                ↓ Descargar backup
              </button>
              <button onClick={()=>fileInputRef.current&&fileInputRef.current.click()} disabled={restaurando} style={{flex:1,padding:"10px 14px",borderRadius:8,background:"none",color:AM,border:`1px solid ${AM}`,fontSize:14,fontWeight:700,cursor:restaurando?"not-allowed":"pointer",whiteSpace:"nowrap",opacity:restaurando?0.6:1}}>
                {restaurando?"Restaurando...":"↑ Restaurar backup"}
              </button>
              <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={restaurarBackup} style={{display:"none"}}/>
            </div>
            <div style={{fontSize:12,color:MU,marginTop:8,lineHeight:1.5}}>💡 Recomendación: descargá un backup una vez por semana y guardalo en Google Drive o mandátelo por WhatsApp a vos mismo — así tenés una copia fuera de la app por si hay algún problema.</div>
          </div>
        </div>
      </div>
 
      {/* ── Google Calendar ── */}
      <div style={{background:CA,border:`1px solid ${cal.calToken?GR+"44":BO}`,borderRadius:18,padding:20,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style={{width:36,height:36,borderRadius:10,background:cal.calToken?GR+"22":"#4285F422",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📅</div>
          <div>
            <div style={{fontSize:17,fontWeight:700,color:CR}}>Google Calendar</div>
            <div style={{fontSize:14,color:cal.calToken?GR:MU,marginTop:1}}>{cal.calToken?"✓ Conectado y activo":tieneClientId?"Client ID configurado · no conectado":"Sin configurar"}</div>
          </div>
          {cal.calToken&&<button onClick={cal.logout} style={{marginLeft:"auto",fontSize:14,padding:"5px 10px",borderRadius:6,background:"none",border:`1px solid ${RE}44`,color:RE,cursor:"pointer"}}>Desconectar</button>}
        </div>
        <div style={{marginBottom:12}}>
          <Lbl t="Client ID de OAuth 2.0"/>
          <div style={{display:"flex",gap:8}}>
            <input value={clientId} onChange={e=>setClientId(e.target.value)} placeholder="123456789-abc...apps.googleusercontent.com" style={{flex:1,fontSize:15}}/>
            <button onClick={guardarClientId} disabled={!clientId.trim()||clientId.trim()===getCalClientId()} style={{padding:"10px 14px",borderRadius:8,background:guardado?GR:G,color:"#fff",border:"none",fontSize:15,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",minWidth:80}}>
              {guardado?"✓ Guardado":"Guardar"}
            </button>
          </div>
          {tieneClientId&&<div style={{fontSize:13,color:MU,marginTop:4}}>Client ID guardado · <button onClick={limpiarClientId} style={{background:"none",border:"none",color:RE,fontSize:13,cursor:"pointer",textDecoration:"underline"}}>Borrar</button></div>}
        </div>
        {tieneClientId&&!cal.calToken&&(
          <button onClick={cal.login} style={{width:"100%",padding:"12px",borderRadius:10,background:G,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            📅 Conectar con Google Calendar
          </button>
        )}
        {cal.calError&&<div style={{background:RE+"22",border:`1px solid ${RE}44`,borderRadius:8,padding:"10px 12px",marginTop:10,fontSize:14,color:"#E08070",lineHeight:1.5}}>{cal.calError}</div>}
      </div>
 
      {/* ── Guía Google Calendar ── */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:20,marginBottom:16}}>
        <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:16}}>🛠 Cómo configurar Google Calendar</div>
        {[
          {n:1,t:"Crear proyecto en Google Cloud",d:"console.cloud.google.com → Nuevo proyecto → 'Farol CRM'"},
          {n:2,t:"Habilitar la API de Calendar",d:"APIs y servicios → Biblioteca → Google Calendar API → Habilitar"},
          {n:3,t:"Crear credenciales OAuth",d:"Credenciales → Crear → ID de cliente OAuth 2.0 → Aplicación web"},
          {n:4,t:"Agregar el origen autorizado",d:"Orígenes autorizados → https://elmaildenahuel-jpg.github.io"},
          {n:5,t:"Copiar el Client ID",d:"Copiá el ID generado y pegalo en el campo de arriba"},
          {n:6,t:"Pantalla de consentimiento",d:"APIs → Pantalla de consentimiento → Externo → agregá tu email como usuario de prueba"},
        ].map(paso=>(
          <div key={paso.n} style={{display:"flex",gap:12,marginBottom:14}}>
            <div style={{width:24,height:24,borderRadius:"50%",background:G+"33",border:`1px solid ${G}66`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{fontSize:14,fontWeight:700,color:G}}>{paso.n}</span>

// ── FIREBASE SYNC HOOK ────────────────────────────────────────────
const SYNC_STATUS={
  connecting:{icon:"☁️",label:"Conectando…",color:MU},
  saving:    {icon:"⏳",label:"Guardando…", color:AM},
  synced:    {icon:"✓", label:"Guardado",   color:GR},
  offline:   {icon:"⚡",label:"Sin conexión",color:AM},
  error:     {icon:"⚠️",label:"Error sync", color:RE},
};
 
function useFirebaseSync(clientes,setClientes,prospectos,setProspectos,speeches,setSpeeches,pedidos,setPedidos,prods,setProds,notas,setNotas,gastos,setGastos,metaSemanal,setMetaSemanal,diasMora,setDiasMora,promo51,setPromo51){
  const[status,setStatus]=useState("connecting");
  const[errorMsg,setErrorMsg]=useState(null);

  const KEYS=["clientes","prospectos","speeches","pedidos","prods","notas","gastos","config"];
  const valuesRef=React.useRef({});
  valuesRef.current={clientes,prospectos,speeches,pedidos,prods,notas,gastos,config:{metaSemanal,diasMora,promo51}};
  const settersRef=React.useRef({
    clientes:setClientes,prospectos:setProspectos,speeches:setSpeeches,pedidos:setPedidos,
    prods:d=>{if(Array.isArray(d)&&d.length>0)setProds(d);},
    notas:d=>{if(Array.isArray(d))setNotas(d);},
    gastos:d=>{if(Array.isArray(d))setGastos(d);},
    config:d=>{if(d&&typeof d.metaSemanal==="number")setMetaSemanal(d.metaSemanal);if(d&&typeof d.diasMora==="number")setDiasMora(d.diasMora);if(d&&d.promo51&&typeof d.promo51==="object")setPromo51(prev=>({...prev,...d.promo51}));},
  });
  const lastSyncRef=React.useRef({});
  const loadedRef=React.useRef({});
  const timersRef=React.useRef({});

  const fallo=React.useCallback(e=>{
    const msg=(e&&e.code?`[${e.code}] `:"")+(e&&e.message?e.message:String(e||"Error desconocido"));
    setErrorMsg(msg);
    console.error("Firestore error:",e);
    setStatus("error");
  },[]);

  React.useEffect(()=>{
    let cancel=false;
    let intentos=0;
    const unsubs=[];

    const attach=()=>{
      if(cancel)return;
      if(!window.fbAuth||!window.fbDb){
        if(intentos<20){intentos++;setTimeout(attach,500);}
        else fallo(new Error("Firebase no disponible: revisá tu conexión o si algún bloqueador de scripts está activo"));
        return;
      }
      const unsubAuth=window.fbAuth.onAuthStateChanged(async user=>{
        if(!user||cancel)return;
        const col=window.fbDb.collection("farolcrm");

        // Migración única desde el doc viejo "farolcrm/data" (todo-en-uno) hacia documentos separados por sección
        try{
          const legacySnap=await col.doc("data").get();
          if(legacySnap.exists){
            const d=legacySnap.data()||{};
            const checks=await Promise.all(KEYS.map(k=>col.doc(k).get()));
            const batch=window.fbDb.batch();
            let necesitaMigrar=false;
            KEYS.forEach((k,i)=>{
              if(!checks[i].exists){
                necesitaMigrar=true;
                const val=k==="config"?{metaSemanal:d.metaSemanal||0,diasMora:d.diasMora||15,promo51:d.promo51||{activo:false,marcaCuenta:"",envaseCuenta:"",cantidadNecesaria:5,productoBonoId:"",cantidadBono:1}}:(d[k]||[]);
                batch.set(col.doc(k),{value:val,updatedAt:Date.now()});
              }
            });
            if(necesitaMigrar)await batch.commit();
          }
        }catch(e){/* si falla la migración, cada doc se crea solo abajo con el estado local */}

        if(cancel)return;
        KEYS.forEach(k=>{
          const ref=col.doc(k);
          const unsub=ref.onSnapshot(snap=>{
            if(cancel)return;
            if(snap.exists){
              const data=snap.data()||{};
              const incoming=JSON.stringify(data.value);
              if(incoming!==lastSyncRef.current[k]){
                lastSyncRef.current[k]=incoming;
                settersRef.current[k](data.value);
              }
            }else{
              const seedVal=valuesRef.current[k];
              lastSyncRef.current[k]=JSON.stringify(seedVal);
              ref.set({value:seedVal,updatedAt:Date.now()}).catch(fallo);
            }
            loadedRef.current[k]=true;
            if(KEYS.every(kk=>loadedRef.current[kk])){setStatus("synced");setErrorMsg(null);}
          },fallo);
          unsubs.push(unsub);
        });
      });
// NOTA: pantalla de login (email/contraseña) desactivada a pedido de Nahu. El código de <Login/> y
// <AppGate/> sigue completo más abajo — para reactivarla, cambiar el render final al pie del archivo
// de <App/> a <AppGate/>, y sacar el signInAnonymously() de acá abajo (useFirebaseSync).
      unsubs.push(unsubAuth);
      window.fbAuth.signInAnonymously().catch(fallo);
    };
    attach();

    const goOff=()=>setStatus(s=>s==="error"?s:"offline");
    const goOn=()=>setStatus(s=>s==="error"?s:"synced");
    window.addEventListener("offline",goOff);
    window.addEventListener("online",goOn);
    return()=>{
      cancel=true;
      unsubs.forEach(u=>{try{u&&u();}catch(e){}});
      window.removeEventListener("offline",goOff);
      window.removeEventListener("online",goOn);
    };
  },[]);

  // Guardar en Firestore cuando cambia cada sección (debounce 800ms, independiente por sección)
  React.useEffect(()=>{
    KEYS.forEach(k=>{
      if(!loadedRef.current[k])return;
      const val=valuesRef.current[k];
      const current=JSON.stringify(val);
      if(current===lastSyncRef.current[k])return;
      if(timersRef.current[k])clearTimeout(timersRef.current[k]);
      setStatus(s=>s==="error"?s:"saving");
      timersRef.current[k]=setTimeout(()=>{
        if(!window.fbDb){fallo(new Error("Sin conexión a Firestore"));return;}
        window.fbDb.collection("farolcrm").doc(k).set({value:val,updatedAt:Date.now()})
          .then(()=>{
            lastSyncRef.current[k]=current;
            setStatus(s=>s==="error"?s:"synced");
            setErrorMsg(null);
          })
          .catch(e=>{ navigator.onLine?fallo(e):setStatus("offline"); });
      },800);
    });
  },[clientes,prospectos,speeches,pedidos,prods,notas,metaSemanal,diasMora]);

  return{status,errorMsg};
}

function SyncBadge({status,errorMsg}){
  const s=SYNC_STATUS[status]||SYNC_STATUS.connecting;
  const tocable=status==="error"&&errorMsg;
  return(
    <div onClick={()=>{if(tocable)alert("Error de sincronización:\n\n"+errorMsg);}}
      style={{display:"flex",alignItems:"center",gap:4,fontSize:13,fontWeight:700,color:s.color,padding:"3px 8px",borderRadius:6,background:s.color+"11",border:`1px solid ${s.color}33`,cursor:tocable?"pointer":"default"}}>
      <span>{s.icon}</span><span>{s.label}</span>{tocable&&<span style={{textDecoration:"underline"}}>(ver)</span>}
    </div>
  );
}

function Login(){
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[error,setError]=useState("");
  const[cargando,setCargando]=useState(false);
  const[mostrarPass,setMostrarPass]=useState(false);

  const entrar=async(e)=>{
    e.preventDefault();
    setError("");setCargando(true);

    // Si Firebase todavía no terminó de cargar, esperamos un poco antes de rendirnos
    let intentos=0;
    while(!window.fbAuth&&intentos<20){
      await new Promise(r=>setTimeout(r,300));
      intentos++;
    }
    if(!window.fbAuth){
      const msg="No se pudo conectar con el servidor de autenticación. Revisá tu conexión a internet y volvé a intentar. Si persiste, avisame.";
      setError(msg);alert(msg);setCargando(false);
      return;
    }

    // Si el login tarda demasiado (ej: red lenta, o falta habilitar el proveedor en Firebase), avisamos igual
    const timeoutId=setTimeout(()=>{
      const msg="El inicio de sesión está tardando demasiado. Puede ser un problema de conexión, o que todavía no habilitaste el método 'Correo electrónico/contraseña' en Firebase Authentication.";
      setError(msg);alert(msg);setCargando(false);
    },15000);

    try{
      await window.fbAuth.signInWithEmailAndPassword(email.trim(),pass);
      clearTimeout(timeoutId);
    }catch(err){
      clearTimeout(timeoutId);
      const msgs={
        "auth/invalid-email":"El email no es válido.",
        "auth/user-not-found":"No existe una cuenta con ese email.",
        "auth/wrong-password":"Contraseña incorrecta.",
        "auth/invalid-credential":"Email o contraseña incorrectos.",
        "auth/too-many-requests":"Demasiados intentos fallidos. Esperá unos minutos e intentá de nuevo.",
        "auth/network-request-failed":"Sin conexión a internet.",
        "auth/user-disabled":"Esta cuenta fue deshabilitada.",
        "auth/operation-not-allowed":"El método de email/contraseña no está habilitado en Firebase todavía. Andá a Firebase Console → Authentication → Sign-in method y activalo.",
      };
      const msg=msgs[err&&err.code]||("No se pudo iniciar sesión: "+(err&&(err.message||err.code)||"error desconocido"));
      setError(msg);alert(msg);
      setCargando(false);
    }
  };

  return(
    <div style={{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <form onSubmit={entrar} style={{width:"100%",maxWidth:360,background:CA,border:`1px solid ${BO}`,borderRadius:24,padding:32,boxShadow:"0 8px 30px rgba(0,0,0,0.08)"}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:24}}>
          <div style={{width:56,height:56,borderRadius:16,background:"#0E4A2C",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}>{I.beer}</div>
          <div className="bebas" style={{fontSize:28,color:CR}}>Grunge & Farol</div>
          <div style={{fontSize:14,color:MU,marginTop:2}}>Iniciá sesión para continuar</div>
        </div>
        <div style={{marginBottom:14}}>
          <Lbl t="Email"/>
          <input type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" required autoFocus/>
        </div>
        <div style={{marginBottom:14}}>
          <Lbl t="Contraseña"/>
          <div style={{position:"relative"}}>
            <input type={mostrarPass?"text":"password"} autoComplete="current-password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" required style={{paddingRight:40,width:"100%"}}/>
            <button type="button" onClick={()=>setMostrarPass(v=>!v)} style={{position:"absolute",right:6,top:0,bottom:0,background:"none",border:"none",color:MU,cursor:"pointer",display:"flex",alignItems:"center"}}>{mostrarPass?I.eyeOff:I.eye}</button>
          </div>
        </div>
        {error&&<div style={{background:RE+"11",border:`1px solid ${RE}33`,borderRadius:10,padding:"9px 12px",fontSize:14,color:RE,marginBottom:14}}>{error}</div>}
        <button type="submit" disabled={cargando} style={{width:"100%",padding:"13px",borderRadius:14,background:G,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:cargando?"not-allowed":"pointer",opacity:cargando?0.6:1}}>{cargando?"Ingresando...":"Ingresar"}</button>
        <div style={{fontSize:13,color:MU,textAlign:"center",marginTop:16}}>¿No tenés cuenta? Pedile a Nahu que te la cree desde Firebase.</div>
      </form>
    </div>
  );
}

function AppGate(){
  const[user,setUser]=useState(undefined); // undefined=cargando, null=sin sesión, objeto=logueado
  React.useEffect(()=>{
    let cancel=false,intentos=0;
    const check=()=>{
      if(cancel)return;
      if(window.fbAuth){
        window.fbAuth.onAuthStateChanged(u=>{if(!cancel)setUser(u);});
      }else if(intentos<20){
        intentos++;setTimeout(check,300);
      }else{
        setUser(null);
      }
    };
    check();
    return()=>{cancel=true;};
  },[]);

  if(user===undefined){
    return(
      <div style={{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{color:MU,fontSize:15}}>Cargando…</div>
      </div>
    );
  }
  if(!user)return<Login/>;
  return<App/>;
}

function App(){
  const[tab,setTab]=useState("inicio");
  const[showMore,setShowMore]=useState(false);
  const[temaOscuro,setTemaOscuro]=useState(()=>{
    try{return localStorage.getItem("farol_tema")==="oscuro";}catch(e){return false;}
  });
  React.useEffect(()=>{
    document.documentElement.classList.toggle("tema-oscuro",temaOscuro);
    try{localStorage.setItem("farol_tema",temaOscuro?"oscuro":"claro");}catch(e){}
  },[temaOscuro]);
  const[clientes,setClientes]=useState(initClientes);
  const[prospectos,setProspectos]=useState(initProspectos);
  const[speeches,setSpeeches]=useState(initSpeeches);
  const[pedidos,setPedidos]=useState([]);
  const[prods,setProds]=useState(PRODS_INIT);
  const[notas,setNotas]=useState(initNotas);
  const[gastos,setGastos]=useState([]);
  const[metaSemanal,setMetaSemanal]=useState(0);
  const[diasMora,setDiasMora]=useState(15);
  const[promo51,setPromo51]=useState({activo:false,marcaCuenta:"",envaseCuenta:"",cantidadNecesaria:5,productoBonoId:"",cantidadBono:1});
  const cal=useGoogleCalendar();

  // Recordatorios de Notas: chequeo periódico + alarma en pantalla, funciona en cualquier pestaña
  const[alarmas,setAlarmas]=useState([]);
  useEffect(()=>{
    const chequear=()=>{
      const ahora=new Date();
      const vencidas=(notas||[]).filter(n=>n.recordatorioFecha&&!n.recordatorioDisparado&&new Date(`${n.recordatorioFecha}T${n.recordatorioHora||"09:00"}:00`)<=ahora);
      if(vencidas.length===0)return;
      vencidas.forEach(n=>{
        if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
          try{new Notification("⏰ "+n.titulo,{body:n.contenido||"Recordatorio de Grunge & Farol",tag:n.id});}catch(e){}
        }
      });
      setAlarmas(prev=>[...prev,...vencidas.map(n=>({id:n.id,titulo:n.titulo,contenido:n.contenido}))]);
      setNotas(prev=>prev.map(n=>vencidas.some(v=>v.id===n.id)?{...n,recordatorioDisparado:true}:n));
      reproducirBeep();
    };
    chequear();
    const interval=setInterval(chequear,20000);
    return()=>clearInterval(interval);
  },[notas]);
 
  // Sincronización Firebase — todos los datos en la nube
  const{status:syncStatus,errorMsg:syncError}=useFirebaseSync(
    clientes,setClientes,
    prospectos,setProspectos,
    speeches,setSpeeches,
    pedidos,setPedidos,
    prods,setProds,
    notas,setNotas,
    gastos,setGastos,
    metaSemanal,setMetaSemanal,
    diasMora,setDiasMora,
    promo51,setPromo51
  );
 
  const convertir=p=>{
    setClientes(prev=>[...prev,{id:uid(),nombre:p.nombre,rubro:p.rubro,zona:p.zona,direccion:p.direccion,telefono:p.telefono,notas:p.notas,agenda:[],historial:[],ventas:[]}]);
    setProspectos(prev=>prev.filter(x=>x.id!==p.id));
    setTab("clientes");
  };
 
  
  const masActivo=MORE_TAB_KEYS.includes(tab);
 
  return(
    <>
    <div style={{minHeight:"100vh",background:BG}}>
      <div style={{display:"flex"}}>
        {/* Sidebar desktop */}
        <aside style={{width:200,height:"100vh",background:SU,borderRight:`1px solid ${BO}`,position:"fixed",top:0,left:0,flexDirection:"column",display:"none",overflow:"hidden"}} id="sb">
          <div style={{padding:"24px 20px 16px",borderBottom:`1px solid ${BO}`,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <button onClick={()=>setTab("inicio")} style={{background:"none",border:"none",padding:0,cursor:"pointer",textAlign:"left"}}>
              <div className="bebas" style={{fontSize:30,color:G}}>GRUNGE & FAROL</div>
              <div style={{fontSize:12,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.12em",marginTop:2}}>Distribución de cerveza artesanal</div>
            </button>
            <button onClick={()=>setTemaOscuro(t=>!t)} title="Cambiar fondo claro/oscuro" style={{fontSize:15,width:28,height:28,padding:0,flexShrink:0,borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {temaOscuro?"☀️":"🌙"}
            </button>
          </div>
          <nav style={{padding:12,display:"flex",flexDirection:"column",gap:4,flex:1,overflowY:"auto"}}>
            {TABS.map(({key,label,icon})=>(
              <button key={key} onClick={()=>setTab(key)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,fontSize:16,fontWeight:600,cursor:"pointer",border:"none",background:tab===key?G:"transparent",color:tab===key?"#fff":MU}}>{icon}{label}</button>
            ))}
          </nav>
          <div style={{padding:"16px 20px",borderTop:`1px solid ${BO}`}}>
            <SyncBadge status={syncStatus} errorMsg={syncError}/>
            <div style={{fontSize:12,color:BO,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginTop:8}}>Dos marcas, un mismo reparto</div>
          </div>
        </aside>
 
        <main style={{flex:1,minWidth:0,overflowX:"hidden",paddingTop:56,minHeight:"100vh"}} id="mn">
          {tab==="inicio"&&<Inicio clientes={clientes} pedidos={pedidos} prods={prods} notas={notas} metaSemanal={metaSemanal} setMetaSemanal={setMetaSemanal} setTab={setTab}/>}
          {tab==="clientes"&&<Clientes clientes={clientes} setClientes={setClientes} speeches={speeches} cal={cal} prods={prods} diasMora={diasMora} promo51={promo51}/>}
          {tab==="comercios"&&<Comercios prospectos={prospectos} setProspectos={setProspectos} onConvertir={convertir} speeches={speeches} prods={prods}/>}
          {tab==="pedidos"&&<Pedidos pedidos={pedidos} setPedidos={setPedidos} clientes={clientes} setClientes={setClientes} prods={prods} setProds={setProds} promo51={promo51}/>}
          {tab==="cuentascorrientes"&&<CuentasCorrientes clientes={clientes} setClientes={setClientes} diasMora={diasMora}/>}
          {tab==="maps"&&<BuscadorMaps prospectos={prospectos} setProspectos={setProspectos}/>}
          {tab==="speeches"&&<Speeches speeches={speeches} setSpeeches={setSpeeches}/>}
          {tab==="notas"&&<Notas notas={notas} setNotas={setNotas} cal={cal}/>}
          {tab==="difusion"&&<EnvioMasivo clientes={clientes}/>}
          {tab==="asistente"&&<AsistenteIA clientes={clientes} pedidos={pedidos} prods={prods}/>}
          {tab==="ventas"&&<Ventas clientes={clientes} prods={prods}/>}
          {tab==="caja"&&<Caja clientes={clientes} prods={prods}/>}
          {tab==="metricas"&&<Metricas clientes={clientes} prods={prods}/>}
          {tab==="gastos"&&<Gastos gastos={gastos} setGastos={setGastos}/>}
          {tab==="productos"&&<Productos prods={prods} setProds={setProds}/>}
          {tab==="config"&&<Configuracion cal={cal} clientes={clientes} setClientes={setClientes} prospectos={prospectos} setProspectos={setProspectos} pedidos={pedidos} setPedidos={setPedidos} prods={prods} setProds={setProds} speeches={speeches} setSpeeches={setSpeeches} notas={notas} setNotas={setNotas} gastos={gastos} setGastos={setGastos} metaSemanal={metaSemanal} setMetaSemanal={setMetaSemanal} diasMora={diasMora} setDiasMora={setDiasMora} promo51={promo51} setPromo51={setPromo51}/>}
        </main>
      </div>
    </div>

    {/* Todo lo fixed (barra superior, barra de categorías, alarmas, hoja "Más") se porta fuera del árbol con filtro de modo oscuro, así nunca se "traba" ni se mueve al hacer scroll */}
    {ReactDOM.createPortal(
      <>
        {alarmas.length>0&&(
          <div style={{position:"fixed",top:64,left:0,right:0,zIndex:150,display:"flex",flexDirection:"column",gap:8,padding:"0 16px",alignItems:"center"}}>
            {alarmas.map(a=>(
              <div key={a.id} style={{width:"100%",maxWidth:520,background:"#1A1A1A",color:"#fff",borderRadius:14,padding:"14px 16px",boxShadow:"0 8px 24px rgba(0,0,0,0.35)",display:"flex",alignItems:"flex-start",gap:10}}>
                <span style={{fontSize:20,flexShrink:0}}>⏰</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:700}}>{a.titulo}</div>
                  {a.contenido&&<div style={{fontSize:13,opacity:0.8,marginTop:2}}>{a.contenido}</div>}
                </div>
                <button onClick={()=>setAlarmas(prev=>prev.filter(x=>x.id!==a.id))} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:18,padding:2,flexShrink:0}}>✕</button>
              </div>
            ))}
          </div>
        )}

        {/* Acceso rápido flotante al Asistente IA */}
        {tab!=="asistente"&&(
          <button onClick={()=>setTab("asistente")} title="Asistente IA" style={{position:"fixed",right:16,bottom:78,zIndex:45,width:52,height:52,borderRadius:"50%",background:G,border:"none",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,0,0,0.3)"}}>
            ✨
          </button>
        )}

        {/* Header mobile */}
        <div id="tb" style={{position:"fixed",top:0,left:0,right:0,zIndex:40,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",background:temaOscuro?"#1B1B1B":"#FFFFFF",borderBottom:`1px solid ${temaOscuro?"#333":BO}`,boxShadow:"0 1px 8px rgba(0,0,0,0.08)"}}>
          <button onClick={()=>setTab("inicio")} className="bebas" style={{fontSize:21,color:G,background:"none",border:"none",padding:0,cursor:"pointer"}}>GRUNGE & FAROL</button>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <SyncBadge status={syncStatus} errorMsg={syncError}/>
            <button onClick={()=>setTemaOscuro(t=>!t)} title="Cambiar fondo claro/oscuro" style={{fontSize:16,width:30,height:30,padding:0,borderRadius:8,background:"none",border:`1px solid ${temaOscuro?"#444":BO}`,color:MU,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {temaOscuro?"☀️":"🌙"}
            </button>
            <button onClick={()=>setTab("config")} style={{fontSize:14,padding:"5px 10px",borderRadius:8,background:tab==="config"?G:"none",border:`1px solid ${tab==="config"?G:(temaOscuro?"#444":BO)}`,color:tab==="config"?"#fff":cal.calToken?GR:MU,cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
              {cal.calToken?"📅✓":"⚙️"}
            </button>
          </div>
        </div>

        {/* Bottom nav mobile - 1 FILA + "Más" */}
        <div id="bn" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:40,background:temaOscuro?"#1B1B1B":"#FFFFFF",borderTop:`1px solid ${temaOscuro?"#333":BO}`,boxShadow:"0 -2px 12px rgba(0,0,0,0.08)"}}>
          <div style={{display:"flex"}}>
            {MAIN_TAB_KEYS.map(key=>{
              const t=TABS.find(x=>x.key===key);
              if(!t)return null;
              return(
                <button key={key} onClick={()=>setTab(key)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",gap:3,background:"none",border:"none",cursor:"pointer",color:tab===key?G:MU}}>
                  <span style={{width:28,height:28,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:tab===key?GLT:"transparent",transition:"background 0.15s"}}>{React.cloneElement(t.icon,{width:20,height:20})}</span>
                  <span style={{fontSize:12,fontWeight:700}}>{t.label}</span>
                </button>
              );
            })}
            <button onClick={()=>setShowMore(true)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",gap:3,background:"none",border:"none",cursor:"pointer",color:masActivo?G:MU}}>
              <span style={{width:28,height:28,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:masActivo?GLT:"transparent",transition:"background 0.15s"}}>
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
              </span>
              <span style={{fontSize:12,fontWeight:700}}>Más</span>
            </button>
          </div>
        </div>

        {/* Hoja "Más" — resto de las secciones */}
        {showMore&&(
          <div onClick={()=>setShowMore(false)} style={{position:"fixed",inset:0,zIndex:60,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"flex-end"}}>
            <div onClick={e=>e.stopPropagation()} style={{width:"100%",background:temaOscuro?"#1B1B1B":"#FFFFFF",borderRadius:"20px 20px 0 0",padding:"10px 16px 26px",maxHeight:"75vh",overflowY:"auto"}}>
              <div style={{width:40,height:5,borderRadius:3,background:BO,margin:"4px auto 14px"}}/>
              <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:14}}>Más secciones</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:10}}>
                {MORE_TAB_KEYS.map(key=>{
                  const t=TABS.find(x=>x.key===key);
                  if(!t)return null;
                  return(
                    <button key={key} onClick={()=>{setTab(key);setShowMore(false);}} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"14px 6px",borderRadius:14,background:tab===key?GLT:BG,border:`1px solid ${tab===key?G+"55":BO}`,cursor:"pointer",color:tab===key?G:CR}}>
                      <span style={{width:34,height:34,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:tab===key?G+"22":"#FFFFFF"}}>{React.cloneElement(t.icon,{width:20,height:20})}</span>
                      <span style={{fontSize:12,fontWeight:700,textAlign:"center"}}>{t.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        <style>{`@media(min-width:768px){#sb{display:flex!important}#mn{margin-left:200px;padding-top:0!important}#tb{display:none!important}#bn{display:none!important}}`}</style>
      </>,
      document.body
    )}
    </>
  );
}
 
// Login desactivado por ahora (ver nota en useFirebaseSync) — se renderiza <App/> directo.
// Para reactivar el login: ReactDOM.createRoot(document.getElementById("root")).render(<AppGate/>);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
