const RUBRO_SCORE={"Pizzería":22,"Parrilla":20,"Restobar":19,"Bodegón":18,"Bar":16,"Autoservicio":14,"Almacén":12,"Despensa":10,"Kiosco":9,"Otro":6};
const ZONA_SCORE={"CABA Centro":18,"CABA Norte":16,"CABA Sur":15,"GBA Sur":13,"GBA Norte":13,"GBA Oeste":11,"GBA Este":10};
const ESTADO_SCORE={"En negociación":20,"Contactado":14,"Por contactar":8,"Descartado":0};
 
function calcScore(p){
  const rS=RUBRO_SCORE[p.rubro]||6,zS=ZONA_SCORE[p.zona]||10,eS=ESTADO_SCORE[p.estado]||0;
  const telS=p.telefono?15:0,notasS=p.notas&&p.notas.length>30?5:p.notas?2:0;
  return Math.min(100,rS+zS+eS+telS+notasS);
}
function scoreLabel(s){
  if(s>=70)return{l:"Muy alto",c:"#E0AA40"};
  if(s>=55)return{l:"Alto",c:GR};
  if(s>=40)return{l:"Medio",c:AM};
  return{l:"Bajo",c:MU};
}

function precioEfectivo(prod,cantidad){
  if(!prod)return 0;
  const promos=(prod.promos||[]).filter(pr=>cantidad>=pr.minCantidad).sort((a,b)=>b.minCantidad-a.minCantidad);
  return promos.length?promos[0].precioUnitario:prod.precio;
}
function montoTotal(prod,cantidad){ return precioEfectivo(prod,cantidad)*cantidad; }

// ── Cuenta corriente ──────────────────────────────────────────────
function saldoCliente(c){ return (c.ventas||[]).filter(v=>!v.pagado).reduce((s,v)=>s+v.monto,0); }
function totalAdeudado(clientes){ return clientes.reduce((s,c)=>s+saldoCliente(c),0); }
 
// ── Meta semanal helpers ──────────────────────────────────────────
function rangoSemanaActual(){
  const hoy=new Date(),dia=hoy.getDay(),offsetLunes=dia===0?-6:1-dia;
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()+offsetLunes); lunes.setHours(0,0,0,0);
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6); domingo.setHours(23,59,59,999);
  return{lunes,domingo};
}
function litrosEstaSemana(clientes){
  const{lunes,domingo}=rangoSemanaActual(); let total=0;
  clientes.forEach(c=>(c.ventas||[]).forEach(v=>{const f=new Date(v.fecha+"T00:00:00");if(f>=lunes&&f<=domingo)total+=v.cantidad;}));
  return total;
}
function diasRestantesSemana(){
  const{domingo}=rangoSemanaActual();const hoy=new Date();hoy.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((domingo-hoy)/86400000));
}

// ── UI base ───────────────────────────────────────────────────────
function Lbl({t}){return<div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>{t}</div>}
function Pill({children,color}){return<span style={{padding:"4px 10px",borderRadius:6,fontSize:11,fontWeight:700,background:color+"18",color,letterSpacing:"0.04em",border:`1px solid ${color}33`}}>{children}</span>}
function Btn({children,onClick,variant,disabled,small}){
  const pad=small?"8px 14px":"12px 18px",fs=small?13:14;
  const bg=variant==="ghost"?"transparent":variant==="green"?GR:variant==="red"?RE+"22":G;
  const cl=variant==="ghost"?MU:variant==="green"?"#fff":variant==="red"?RE:"#fff";
  const br=variant==="ghost"?`1px solid ${BO}`:variant==="red"?`1px solid ${RE}44`:"none";
  return<button onClick={onClick} disabled={disabled} style={{display:"flex",alignItems:"center",gap:6,padding:pad,borderRadius:10,fontSize:fs,fontWeight:600,cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.4:1,background:bg,color:cl,border:br,boxShadow:variant==="ghost"||variant==="red"?"none":"0 2px 8px rgba(176,120,32,0.3)"}}>{children}</button>;
}
function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center",background:"rgba(0,0,0,0.5)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:SU,border:`1px solid ${BO}`,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:540,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 -8px 40px rgba(0,0,0,0.15)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:`1px solid ${BO}`,position:"sticky",top:0,background:SU}}>
          <span className="bebas" style={{fontSize:22,color:CR}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:MU,cursor:"pointer",padding:4,fontSize:20}}>✕</button>
        </div>
        <div style={{padding:20}}>{children}</div>
      </div>
    </div>
  );
}
function ModalConfirmar({open,onClose,onConfirmar,titulo,mensaje,labelConfirmar}){
  if(!open)return null;
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.88)",padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:SU,border:`1px solid ${RE}44`,borderRadius:16,width:"100%",maxWidth:340,padding:24}}>
        <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:8}}>{titulo||"¿Estás seguro?"}</div>
        <div style={{fontSize:13,color:MU,marginBottom:24,lineHeight:1.5}}>{mensaje||"Esta acción no se puede deshacer."}</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:"11px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:13,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
          <button onClick={()=>{onConfirmar();onClose();}} style={{flex:1,padding:"11px 0",borderRadius:10,background:RE,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>{labelConfirmar||"Eliminar"}</button>
        </div>
      </div>
    </div>
  );
}

// ── Google Calendar hook ──────────────────────────────────────────
function useGoogleCalendar(){
  const[calToken,setCalToken]=useState(null);
  const[calError,setCalError]=useState("");
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const tokenClientRef=React.useRef(null);
 
  // Inicializar gapi.client (librería de Google APIs)
  React.useEffect(()=>{
    const initGapi=()=>{
      if(!window.gapi){setTimeout(initGapi,500);return;}
      window.gapi.load("client",async()=>{
        try{
          await window.gapi.client.init({});
          await window.gapi.client.load("https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest");
          setGapiReady(true);
        }catch(e){
          console.warn("gapi.client init falló:",e);
          setGapiReady(true); // igual marcamos ready para no bloquear
        }
      });
    };
    initGapi();
  },[]);
 
  // Esperar a que Google Identity Services esté disponible
  React.useEffect(()=>{
    const check=()=>{if(window.google?.accounts?.oauth2){setGisReady(true);}else{setTimeout(check,500);}};
    check();
  },[]);
 
  const login=()=>{
    const clientId=getCalClientId();
    if(!clientId){
      setCalError("Primero pegá tu Client ID en Configuración → Google Calendar.");
      return;
    }
    if(!gisReady){setCalError("Google Identity todavía cargando, esperá unos segundos y volvé a intentar.");return;}
    try{
      // Siempre recreamos el token client por si cambió el client_id
      tokenClientRef.current=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:GCAL_SCOPE,
        callback:(resp)=>{
          if(resp.error){
            setCalError("Error OAuth: "+resp.error+". Verificá que el origen esté autorizado en Google Cloud Console.");
            return;
          }
          setCalToken(resp.access_token);
          setCalError("");
          if(window.gapi?.client) window.gapi.client.setToken({access_token:resp.access_token});
        },
        error_callback:(err)=>{
          setCalError("Popup bloqueado o cancelado. Permití popups para este sitio.");
        }
      });
      tokenClientRef.current.requestAccessToken({prompt:""});
    }catch(e){
      setCalError("No se pudo iniciar el login: "+e.message);
    }
  };
 
  const logout=()=>{
    if(calToken&&window.google?.accounts?.oauth2) window.google.accounts.oauth2.revoke(calToken,()=>{});
    setCalToken(null);
    setCalError("");
    tokenClientRef.current=null;
  };
 
  const crearEvento=async({titulo,descripcion,fecha,hora,durMin=60})=>{
    if(!calToken){login();return false;}
    if(!gapiReady){setCalError("La API de Google Calendar todavía está cargando.");return false;}
    try{
      const inicio=new Date(`${fecha}T${hora}:00`);
      const fin=new Date(inicio.getTime()+durMin*60000);
      const toISO=d=>d.toISOString();
      await window.gapi.client.calendar.events.insert({
        calendarId:"primary",
        resource:{
          summary:titulo,
          description:descripcion||"",
          start:{dateTime:toISO(inicio),timeZone:"America/Argentina/Buenos_Aires"},
          end:{dateTime:toISO(fin),timeZone:"America/Argentina/Buenos_Aires"},
          reminders:{useDefault:false,overrides:[{method:"popup",minutes:60},{method:"popup",minutes:10}]},
        }
      });
      return true;
    }catch(e){
      const msg=e.result?.error?.message||e.message||"Error desconocido";
      // Token expirado → intentar renovar
      if(e.status===401){setCalToken(null);login();return false;}
      setCalError("Error al crear evento: "+msg);
      return false;
    }
  };
 
  return{calToken,calError,gapiReady,gisReady,login,logout,crearEvento};
}

// ── CuentaCorriente ───────────────────────────────────────────────
function CuentaCorriente({cliente,onUpdate}){
  const[montoPago,setMontoPago]=useState("");
  const[showParcial,setShowParcial]=useState(false);
  const[showHistorial,setShowHistorial]=useState(false);
 
  const pendientes=(cliente.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const pagadas=(cliente.ventas||[]).filter(v=>v.pagado).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const saldo=saldoCliente(cliente);
 
  const marcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:true}:v)});
  const desmarcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:false}:v)});
  const marcarTodo=()=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>({...v,pagado:true}))});
 
  const aplicarPagoParcial=()=>{
    const pago=Number(montoPago);
    if(!pago||pago<=0)return;
 
    let restante=pago;
    const nuevasVentas=[...cliente.ventas].map(v=>{
      if(v.pagado||restante<=0)return v;
      if(restante>=v.monto){
        // El pago cubre esta venta completa
        restante-=v.monto;
        return{...v,pagado:true};
      } else {
        // El pago cubre parcialmente esta venta:
        // Dividimos en dos: la parte pagada y el resto pendiente
        const montoPagado=restante;
        const montoRestante=v.monto-restante;
        const cantidadPagada=Math.round((v.cantidad*(montoPagado/v.monto))*10)/10;
        const cantidadRestante=v.cantidad-cantidadPagada;
        restante=0;
        // Retornamos la venta dividida como un objeto especial — la manejamos abajo
        return{...v,_split:true,_montoPagado:montoPagado,_montoRestante:montoRestante,_cantPagada:cantidadPagada,_cantRestante:cantidadRestante};
      }
    });
 
    // Expandir ventas divididas en dos entradas
    const ventasFinales=[];
    nuevasVentas.forEach(v=>{
      if(v._split){
        // Parte pagada
        ventasFinales.push({id:v.id,fecha:v.fecha,producto:v.producto,cantidad:v._cantPagada,monto:v._montoPagado,pagado:true});
        // Parte pendiente
        ventasFinales.push({id:uid(),fecha:v.fecha,producto:v.producto,cantidad:v._cantRestante,monto:v._montoRestante,pagado:false});
      } else {
        ventasFinales.push(v);
      }
    });
 
    onUpdate({...cliente,ventas:ventasFinales});
    setMontoPago("");
    setShowParcial(false);
  };
 
  return(
    <div style={{background:saldo>0?RE+"11":GR+"11",border:`1px solid ${saldo>0?RE+"33":GR+"33"}`,borderRadius:10,padding:14,marginBottom:14}}>
      {/* Saldo siempre visible */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:saldo>0?12:0}}>
        <span style={{fontSize:12,fontWeight:700,color:saldo>0?"#E08070":GR}}>
          {saldo>0?"💰 Cuenta corriente":"✓ Sin deuda pendiente"}
        </span>
        <span className="bebas" style={{fontSize:20,color:saldo>0?"#E08070":GR}}>{fmtARS(saldo)}</span>
      </div>
 
      {saldo>0&&(
        <>
          {/* Ventas pendientes */}
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
            {pendientes.map(v=>(
              <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px"}}>
                <div>
                  <span style={{fontSize:11,color:CR}}>{fmtDate(v.fecha)}</span>
                  <span style={{fontSize:10,color:MU,marginLeft:6}}>{v.cantidad}L</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:12,fontWeight:600,color:"#E08070"}}>{fmtARS(v.monto)}</span>
                  <button onClick={()=>marcarPagada(v.id)} style={{fontSize:10,fontWeight:700,padding:"5px 10px",borderRadius:6,background:GR+"22",color:GR,border:`1px solid ${GR}44`,cursor:"pointer"}}>✓ Cobrado</button>
                </div>
              </div>
            ))}
          </div>
 
          {/* Pago parcial */}
          {showParcial?(
            <div style={{background:BG,border:`1px solid ${AM}44`,borderRadius:8,padding:12,marginBottom:8}}>
              <Lbl t="¿Cuánto te pagó?"/>
              <input
                type="number"
                inputMode="numeric"
                value={montoPago}
                onChange={e=>setMontoPago(e.target.value)}
                placeholder={`Ingresá el monto cobrado (máx. ${fmtARS(saldo)})`}
                autoFocus
                style={{marginBottom:8,fontSize:13}}
              />
              {montoPago&&Number(montoPago)>0&&(
                <div style={{fontSize:11,color:MU,marginBottom:10,lineHeight:1.5}}>
                  Vas a registrar un cobro de <strong style={{color:AM}}>{fmtARS(Number(montoPago))}</strong>.
                  Saldo restante: <strong style={{color:"#E08070"}}>{fmtARS(Math.max(0,saldo-Number(montoPago)))}</strong>
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <button
                  onClick={()=>{setShowParcial(false);setMontoPago("");}}
                  style={{flex:1,padding:"9px 0",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:12,fontWeight:600,cursor:"pointer"}}
                >
                  Cancelar
                </button>
                <button
                  onClick={aplicarPagoParcial}
                  disabled={!montoPago||Number(montoPago)<=0}
                  style={{flex:2,padding:"9px 0",borderRadius:8,background:AM,color:"#000",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",opacity:!montoPago||Number(montoPago)<=0?0.4:1}}
                >
                  ✓ Confirmar pago de {montoPago?fmtARS(Number(montoPago)):"..."}
                </button>
              </div>
            </div>
          ):(
            <button onClick={()=>setShowParcial(true)} style={{width:"100%",padding:"9px 0",borderRadius:8,background:"none",border:`1px dashed ${AM}55`,color:AM,fontSize:12,fontWeight:600,cursor:"pointer",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              💵 Registrar pago parcial
            </button>
          )}
 
          {/* Saldar todo */}
          <button onClick={marcarTodo} style={{width:"100%",padding:"10px 0",borderRadius:8,background:GR,color:"#fff",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            {I.check} Saldar toda la cuenta · {fmtARS(saldo)}
          </button>
        </>
      )}
 
      {/* Historial de pagos con opción de deshacer */}
      {pagadas.length>0&&(
        <div style={{marginTop:saldo>0?12:0}}>
          <button onClick={()=>setShowHistorial(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:MU,display:"flex",alignItems:"center",gap:4,padding:0}}>
            {showHistorial?"▲":"▼"} Historial de pagos ({pagadas.length})
          </button>
          {showHistorial&&(
            <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
              {pagadas.slice(0,8).map(v=>(
                <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px"}}>
                  <div>
                    <span style={{fontSize:11,color:CR}}>{fmtDate(v.fecha)}</span>
                    <span style={{fontSize:10,color:MU,marginLeft:6}}>{v.cantidad}L</span>
                    <span style={{fontSize:10,color:GR,marginLeft:6}}>✓ Cobrado</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:MU}}>{fmtARS(v.monto)}</span>
                    <button onClick={()=>desmarcarPagada(v.id)} style={{fontSize:9,padding:"3px 7px",borderRadius:6,background:RE+"22",color:"#E08070",border:`1px solid ${RE}33`,cursor:"pointer"}}>
                      Deshacer
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

        :<button onClick={()=>setVForm(true)} style={{width:"100%",marginBottom:10,padding:"10px 0",borderRadius:8,fontSize:13,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,border:"1px dashed #3A3028",background:"none",color:G}}>{I.plus}Nueva venta</button>
      }
      {sorted.length===0?<p style={{fontSize:13,color:MU,textAlign:"center",padding:16}}>Sin ventas aún.</p>:sorted.map(v=>{const p=prods.find(x=>x.id===v.producto);return(

  const top5=useMemo(()=>[...prospectos].filter(p=>p.estado!=="Descartado").map(p=>({...p,_score:calcScore(p)})).sort((a,b)=>b._score-a._score).slice(0,5),[prospectos]);

      {pedidosHoy.length>0&&<div style={{background:AM+"11",border:`1px solid ${AM}33`,borderRadius:12,overflow:"hidden",marginBottom:16}}><div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${AM}22`}}>{I.truck}<span style={{fontSize:13,fontWeight:700,color:AM}}>Entregas pendientes hoy</span></div>{pedidosHoy.map(p=>{const cliente=clientes.find(c=>c.id===p.clienteId);const prod=prods.find(x=>x.id===p.producto);return<button key={p.id} onClick={()=>setTab("pedidos")} style={{width:"100%",padding:"10px 16px",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",textAlign:"left"}}><span style={{fontSize:12,color:CR}}>{cliente?cliente.nombre:"Cliente"} · {prod?prod.nombre:p.producto} {p.cantidad}L</span><span style={{fontSize:11,color:AM}}>{p.horaEntrega}hs</span></button>;})}</div>}
 
      {/* Top 5 prospectos */}
      <div style={{background:CA,border:`1px solid ${G}44`,borderRadius:12,overflow:"hidden",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${BO}`}}>{I.zap}<span style={{fontSize:13,fontWeight:700,color:G}}>Top 5 para visitar hoy</span><span style={{fontSize:10,color:MU,marginLeft:"auto"}}>por score</span></div>
        {top5.length===0?<p style={{color:MU,fontSize:13,textAlign:"center",padding:"20px 16px"}}>Cargá prospectos para ver el ranking.</p>:top5.map((p,idx)=>(
          <button key={p.id} onClick={()=>setTab("comercios")} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"11px 16px",background:"none",border:"none",borderBottom:`1px solid ${BO}`,cursor:"pointer",textAlign:"left"}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:idx===0?G+"33":BO,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:11,fontWeight:700,color:idx===0?G:MU}}>#{idx+1}</span></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</div>
              <div style={{fontSize:10,color:MU,marginTop:2}}>{p.rubro} · {p.zona}</div>
              <div style={{marginTop:6}}><ScoreBar score={p._score}/></div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
              <Pill color={PEST[p.estado]}>{p.estado}</Pill>
              {p.telefono&&<span style={{fontSize:9,color:GR,display:"flex",alignItems:"center",gap:3}}>{I.phone}WA listo</span>}
            </div>
          </button>
        ))}
        <button onClick={()=>setTab("comercios")} style={{width:"100%",padding:"10px 16px",background:"none",border:"none",fontSize:12,color:G,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>Ver todos {I.chev}</button>
      </div>
 
      {/* Alertas clientes */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:12,overflow:"hidden",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${BO}`,color:G}}>{I.alert}<span style={{fontSize:13,fontWeight:600,color:CR}}>Clientes con seguimiento</span></div>
        {alertas.length===0?<p style={{color:MU,fontSize:13,textAlign:"center",padding:"20px 16px"}}>Todos los clientes al día 🍺</p>:alertas.map(c=>{const ls=lastSale(c),d=ls?daysSince(ls.fecha):null,e=EST[estadoC(c)];return(
          <button key={c.id} onClick={()=>setTab("clientes")} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",background:"none",border:"none",borderBottom:`1px solid ${BO}`,cursor:"pointer",textAlign:"left"}}>
            <div><div style={{fontSize:13,fontWeight:600,color:CR}}>{c.nombre}</div><div style={{fontSize:11,color:e.c}}>{d} días sin pedir · {c.zona}</div></div>
            <span style={{color:MU}}>{I.chev}</span>
          </button>
        );})}
      </div>
 
      {/* Accesos rápidos */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        {[{tab:"comercios",icon:I.store,t:"Prospectos",s:"Sumar nuevas cuentas"},{tab:"speeches",icon:I.msg,t:"Speeches",s:"Copiar y mandar por WA"}].map(x=>(
          <button key={x.tab} onClick={()=>setTab(x.tab)} style={{background:CA,border:`1px solid ${BO}`,borderRadius:12,padding:16,textAlign:"left",cursor:"pointer"}}>
            <div style={{color:G,marginBottom:8}}>{x.icon}</div><div style={{fontSize:13,fontWeight:600,color:CR}}>{x.t}</div><div style={{fontSize:11,color:MU,marginTop:2}}>{x.s}</div>
          </button>
        ))}
      </div>
 
      {/* Línea Farol */}
      <button onClick={()=>setTab("productos")} style={{width:"100%",background:CA,border:`1px solid ${BO}`,borderRadius:12,overflow:"hidden",cursor:"pointer",textAlign:"left"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px 8px"}}><span style={{fontSize:10,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.1em"}}>Línea Farol</span><span style={{fontSize:10,color:G,display:"flex",alignItems:"center",gap:4}}>{I.edit}Editar precios</span></div>
        {prods.map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderTop:`1px solid ${BO}`}}><div><div style={{fontSize:13,fontWeight:500,color:CR}}>{p.nombre}</div><div style={{fontSize:11,color:MU}}>1L PET descartable{(p.promos||[]).length>0?` · ${p.promos.length} promo${p.promos.length>1?"s":""}`:""}</div></div><div className="bebas" style={{fontSize:18,color:G}}>{fmtARS(p.precio)}</div></div>)}
      </button>
    </div>
  );
}
 
// ── CLIENTES ──────────────────────────────────────────────────────
function Clientes({clientes,setClientes,speeches,cal,prods}){
  const[q,setQ]=useState("");
  const[filtro,setFiltro]=useState("todos");
  const[showNew,setShowNew]=useState(false);
  const[sel,setSel]=useState(null);
  const filtered=useMemo(()=>clientes.filter(c=>{const t=q.toLowerCase();return!t||c.nombre.toLowerCase().includes(t)||c.zona.toLowerCase().includes(t)||c.rubro.toLowerCase().includes(t);}).filter(c=>filtro==="todos"||estadoC(c)===filtro).sort((a,b)=>{const la=lastSale(a),lb=lastSale(b);return(lb?daysSince(lb.fecha):0)-(la?daysSince(la.fecha):0);}),[clientes,q,filtro]);
  const selObj=clientes.find(c=>c.id===sel);
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Clientes</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <div style={{position:"relative",marginBottom:12}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38}} placeholder="Buscar por nombre, zona o rubro..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"activo",l:"Activos"},{k:"atencion",l:"Atención"},{k:"inactivo",l:"Inactivos"}].map(f=>(
          <button key={f.k} onClick={()=>setFiltro(f.k)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filtro===f.k?G:BO}`,background:filtro===f.k?G:"transparent",color:filtro===f.k?"#000":MU}}>{f.l}</button>
        ))}
      </div>
      {filtered.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:13}}>Sin clientes para mostrar.</p>:filtered.map(c=>{const e=EST[estadoC(c)];const ls=lastSale(c);const deuda=saldoCliente(c);return(
        <button key={c.id} onClick={()=>setSel(c.id)} style={{display:"flex",alignItems:"stretch",background:CA,border:`1px solid ${BO}`,borderRadius:12,overflow:"hidden",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:8}}>
          <div style={{width:4,background:e.c,flexShrink:0}}/>
          <div style={{flex:1,padding:"12px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,fontWeight:600,color:CR}}>{c.nombre}</span><span style={{color:MU}}>{I.chev}</span></div>
            <div style={{fontSize:11,color:MU,marginTop:2}}>{c.rubro} · {c.zona}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
              <div style={{fontSize:11,color:e.c}}>{ls?`Última compra: hace ${daysSince(ls.fecha)} días`:e.l}</div>
              {deuda>0&&<div style={{fontSize:10,fontWeight:700,color:"#E08070"}}>💰{fmtARS(deuda)}</div>}
            </div>
          </div>
        </button>
      );})}
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo cliente">
        <FormCliente onCancel={()=>setShowNew(false)} onSave={f=>{setClientes(p=>[...p,{id:uid(),...f,agenda:[],historial:[],ventas:[]}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!selObj} onClose={()=>setSel(null)} title={selObj?.nombre||""}>
        {selObj&&<DetalleCliente cliente={selObj} speeches={speeches} cal={cal} prods={prods} onUpdate={u=>setClientes(p=>p.map(c=>c.id===u.id?u:c))} onDelete={id=>{setClientes(p=>p.filter(c=>c.id!==id));setSel(null);}}/>}
      </Modal>
    </div>
  );
}
 
// ── COMERCIOS ─────────────────────────────────────────────────────
function Comercios({prospectos,setProspectos,onConvertir,speeches}){
  const[q,setQ]=useState("");
  const[zona,setZona]=useState("");
  const[rubro,setRubro]=useState("");
  const[estadoF,setEstadoF]=useState("");
  const[tieneTel,setTieneTel]=useState(false);
  const[ordenar,setOrdenar]=useState("score");
  const[showNew,setShowNew]=useState(false);
  const[editing,setEditing]=useState(null);
  const[spTarget,setSpTarget]=useState(null);
  const[expandido,setExpandido]=useState(null);
 
  const resultados=useMemo(()=>{
    const t=q.trim().toLowerCase();const terms=t?t.split(/\s+/):[];
    return prospectos.map(p=>{
      let qScore=0;
      if(terms.length){terms.forEach(term=>{if(p.nombre.toLowerCase().includes(term))qScore+=10;if(p.rubro.toLowerCase().includes(term))qScore+=8;if((p.zona||"").toLowerCase().includes(term))qScore+=6;if((p.direccion||"").toLowerCase().includes(term))qScore+=4;if((p.notas||"").toLowerCase().includes(term))qScore+=2;});}else qScore=1;
      const pass=(terms.length===0||qScore>0)&&(!zona||p.zona===zona)&&(!rubro||p.rubro===rubro)&&(!estadoF||p.estado===estadoF)&&(!tieneTel||!!p.telefono);
      return{...p,_qScore:qScore,_potScore:calcScore(p),_pass:pass};
    }).filter(p=>p._pass).sort((a,b)=>{
      if(ordenar==="score")return b._potScore-a._potScore;
      if(ordenar==="relevancia"&&t)return b._qScore-a._qScore;
      if(ordenar==="az")return a.nombre.localeCompare(b.nombre);
      if(ordenar==="estado")return ESTADOS_P.indexOf(a.estado)-ESTADOS_P.indexOf(b.estado);
      return b._potScore-a._potScore;
    });
  },[prospectos,q,zona,rubro,estadoF,tieneTel,ordenar]);
 
  const stats=useMemo(()=>({total:resultados.length,conTel:resultados.filter(p=>p.telefono).length,porC:resultados.filter(p=>p.estado==="Por contactar").length,enN:resultados.filter(p=>p.estado==="En negociación").length,avgScore:resultados.length?Math.round(resultados.reduce((s,p)=>s+p._potScore,0)/resultados.length):0}),[resultados]);
  const hayFiltros=q||zona||rubro||estadoF||tieneTel;
  const limpiar=()=>{setQ("");setZona("");setRubro("");setEstadoF("");setTieneTel(false);};
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Comercios</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <p style={{fontSize:11,color:MU,marginBottom:14}}>Prospección CABA y GBA · Recorrida con la Berlingo</p>
      <div style={{position:"relative",marginBottom:10}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38,paddingRight:q?36:12}} placeholder="Nombre, rubro, zona, dirección o nota..." value={q} onChange={e=>setQ(e.target.value)}/>
        {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:MU,padding:2}}>{I.x}</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <select value={zona} onChange={e=>setZona(e.target.value)}><option value="">Todas las zonas</option>{ZONAS.map(z=><option key={z} value={z}>{z}</option>)}</select>
        <select value={rubro} onChange={e=>setRubro(e.target.value)}><option value="">Todos los rubros</option>{RUBROS.map(r=><option key={r} value={r}>{r}</option>)}</select>
        <select value={estadoF} onChange={e=>setEstadoF(e.target.value)}><option value="">Todos los estados</option>{ESTADOS_P.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <select value={ordenar} onChange={e=>setOrdenar(e.target.value)}><option value="score">Ordenar: potencial</option><option value="relevancia">Ordenar: relevancia</option><option value="az">Ordenar: A → Z</option><option value="estado">Ordenar: estado</option></select>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,color:tieneTel?G:MU}}><input type="checkbox" checked={tieneTel} onChange={e=>setTieneTel(e.target.checked)} style={{width:14,height:14,accentColor:G}}/>Solo con teléfono</label>
        {hayFiltros&&<button onClick={limpiar} style={{fontSize:11,color:AM,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Limpiar filtros</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:16}}>
        {[{l:"Total",v:stats.total,c:CR},{l:"Con WA",v:stats.conTel,c:GR},{l:"Por cont.",v:stats.porC,c:AM},{l:"En neg.",v:stats.enN,c:G},{l:"Score prom.",v:stats.avgScore,c:scoreLabel(stats.avgScore).c}].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
            <div className="bebas" style={{fontSize:18,color:s.c}}>{s.v}</div>
            <div style={{fontSize:9,color:MU,textTransform:"uppercase",letterSpacing:"0.04em",marginTop:1}}>{s.l}</div>
          </div>
        ))}
      </div>
      {resultados.length===0?<div style={{textAlign:"center",padding:"48px 0"}}><div style={{color:MU,fontSize:13,marginBottom:8}}>Sin resultados.</div>{hayFiltros&&<button onClick={limpiar} style={{fontSize:12,color:G,background:"none",border:`1px solid ${G}44`,borderRadius:8,padding:"6px 14px",cursor:"pointer"}}>Limpiar filtros</button>}</div>
        :resultados.map(p=>{
          const isOpen=expandido===p.id;const sl=scoreLabel(p._potScore);
          return(
            <div key={p.id} style={{background:CA,border:`1px solid ${isOpen?G:BO}`,borderRadius:12,marginBottom:8,overflow:"hidden",transition:"border-color 0.2s"}}>
              <button onClick={()=>setExpandido(isOpen?null:p.id)} style={{width:"100%",display:"flex",alignItems:"center",background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
                <div style={{width:3,alignSelf:"stretch",background:PEST[p.estado],flexShrink:0}}/>
                <div style={{flex:1,padding:"12px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                    <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</div><div style={{fontSize:11,color:MU,marginTop:2}}>{p.rubro} · {p.zona}</div></div>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}><Pill color={PEST[p.estado]}>{p.estado}</Pill><span style={{color:MU,display:"flex",transform:isOpen?"rotate(90deg)":"none",transition:"transform 0.2s"}}>{I.chev}</span></div>
                  </div>
                  <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:9,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",whiteSpace:"nowrap"}}>Potencial</span><div style={{flex:1}}><ScoreBar score={p._potScore}/></div><span style={{fontSize:10,fontWeight:700,color:sl.c,whiteSpace:"nowrap"}}>{sl.l}</span></div>
                </div>
              </button>
              {isOpen&&(
                <div style={{borderTop:`1px solid ${BO}`,padding:"14px 16px"}}>
                  <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px",marginBottom:12}}>
                    <div style={{fontSize:10,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10,display:"flex",justifyContent:"space-between"}}><span>Desglose de score</span><span style={{color:sl.c}}>{p._potScore}/100</span></div>
                    {[{l:"Rubro",v:RUBRO_SCORE[p.rubro]||6,max:22,hint:p.rubro},{l:"Zona",v:ZONA_SCORE[p.zona]||10,max:18,hint:p.zona},{l:"Estado",v:ESTADO_SCORE[p.estado]||0,max:20,hint:p.estado},{l:"Teléfono",v:p.telefono?15:0,max:15,hint:p.telefono?"Cargado":"Sin cargar"},{l:"Notas",v:p.notas&&p.notas.length>30?5:p.notas?2:0,max:5,hint:p.notas?"Completas":"Sin notas"}].map(row=>(
                      <div key={row.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                        <span style={{fontSize:11,color:MU,width:64,flexShrink:0}}>{row.l}</span>
                        <div style={{flex:1,height:3,background:BO,borderRadius:2}}><div style={{width:`${(row.v/row.max)*100}%`,height:"100%",background:G,borderRadius:2}}/></div>
                        <span style={{fontSize:11,fontWeight:600,color:CR,width:28,textAlign:"right",flexShrink:0}}>{row.v}/{row.max}</span>
                        <span style={{fontSize:10,color:MU,width:80,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.hint}</span>
                      </div>
                    ))}
                  </div>
                  {p.direccion&&<div style={{fontSize:11,color:MU,display:"flex",alignItems:"center",gap:4,marginBottom:8}}>{I.map}{p.direccion}</div>}
                  {p.telefono&&<div style={{fontSize:11,color:GR,display:"flex",alignItems:"center",gap:4,marginBottom:8}}>{I.phone}{p.telefono}</div>}
                  {p.notas&&<div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px",marginBottom:12}}><div style={{fontSize:9,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Notas</div><div style={{fontSize:12,color:"#A89682",lineHeight:1.6}}>{p.notas}</div></div>}
                  <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:11,color:G,display:"flex",alignItems:"center",gap:6}}>
                    {I.zap}
                    {p.estado==="Por contactar"&&!p.telefono&&"Conseguí el teléfono para sumar +15 pts."}
                    {p.estado==="Por contactar"&&p.telefono&&"Listo para primer contacto."}
                    {p.estado==="Contactado"&&"Pasalo a 'En negociación' si mostró interés."}
                    {p.estado==="En negociación"&&"Prioridad alta. Confirmá pedido y convertilo."}
                    {p.estado==="Descartado"&&"Descartado. Podés actualizarlo si cambia."}
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    <button onClick={()=>setEditing(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:MU,background:"none",border:`1px solid ${BO}`}}>{I.edit}Editar</button>
                    {p.telefono&&<>
                      <a href={`https://wa.me/${p.telefono}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,padding:"7px 12px",borderRadius:6,background:"#25D36615",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none"}}>{I.wa}WA directo</a>
                      <button onClick={()=>setSpTarget(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",background:G+"20",color:G,border:`1px solid ${G}44`}}>{I.msg}Speech → WA</button>
                    </>}
                    <button onClick={()=>onConvertir(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:GR,background:"none",border:`1px solid ${GR}44`,marginLeft:"auto"}}>{I.plus}→ Cliente</button>
                    <button onClick={()=>{if(window.confirm(`¿Eliminar "${p.nombre}"? Esta acción no se puede deshacer.`)){setProspectos(prev=>prev.filter(x=>x.id!==p.id));setExpandido(null);}}} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,padding:"7px 10px",borderRadius:6,cursor:"pointer",color:RE,background:"none",border:`1px solid ${RE}44`}}>{I.trash}</button>
                  </div>
                </div>
              )}
            </div>
          );
        })
      }
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo comercio">
        <FormProspecto onCancel={()=>setShowNew(false)} onSave={f=>{setProspectos(p=>[...p,{id:uid(),...f}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!editing} onClose={()=>setEditing(null)} title="Editar comercio">
        {editing&&<FormProspecto initial={editing} onCancel={()=>setEditing(null)} onSave={f=>{setProspectos(p=>p.map(x=>x.id===editing.id?{...x,...f}:x));setEditing(null);}}/>}
      </Modal>
      <SpeechPicker open={!!spTarget} onClose={()=>setSpTarget(null)} speeches={speeches} telefono={spTarget?.telefono} nombre={spTarget?.nombre||""}/>
    </div>
  );
}
 
// ── PEDIDOS ───────────────────────────────────────────────────────
function Pedidos({pedidos,setPedidos,clientes,setClientes,prods,setProds}){
  const[showNew,setShowNew]=useState(false);
  // Cabecera del pedido
  const[clienteId,setClienteId]=useState("");
  const[fechaEntrega,setFechaEntrega]=useState(hoyISO());
  const[horaEntrega,setHoraEntrega]=useState("10:00");
  const[pagado,setPagado]=useState(true);
  const[notas,setNotas]=useState("");
  // Líneas del pedido (multi-producto)
  const[lineas,setLineas]=useState([{id:uid(),productoId:"rubia",cantidad:"",monto:""}]);
 
  const resetForm=()=>{
    setClienteId("");setFechaEntrega(hoyISO());setHoraEntrega("10:00");setPagado(true);setNotas("");
    setLineas([{id:uid(),productoId:"rubia",cantidad:"",monto:""}]);
  };
 
  const agregarLinea=()=>setLineas(prev=>[...prev,{id:uid(),productoId:"ipa",cantidad:"",monto:""}]);
  const quitarLinea=id=>setLineas(prev=>prev.filter(l=>l.id!==id));
  const updateLinea=(id,campo,valor)=>setLineas(prev=>prev.map(l=>{
    if(l.id!==id)return l;
    const updated={...l,[campo]:valor};
    // Auto-calcular monto si cambia cantidad o producto
    if(campo==="cantidad"||campo==="productoId"){
      const prod=prods.find(p=>p.id===(campo==="productoId"?valor:l.productoId));
      const cant=Number(campo==="cantidad"?valor:l.cantidad);
      if(prod&&cant>0) updated.monto=String(montoTotal(prod,cant));
    }
    return updated;
  }));
 
  const totalPedido=lineas.reduce((s,l)=>s+Number(l.monto||0),0);
  const totalLitros=lineas.reduce((s,l)=>s+Number(l.cantidad||0),0);
  const lineasValidas=lineas.filter(l=>l.cantidad&&Number(l.cantidad)>0);
 
  const confirmarPedido=()=>{
    if(!clienteId||lineasValidas.length===0)return;
    const nuevoPedido={
      id:uid(),clienteId,fechaEntrega,horaEntrega,pagado,notas,
      lineas:lineasValidas.map(l=>({...l,cantidad:Number(l.cantidad),monto:Number(l.monto||0)})),
      montoTotal:totalPedido,
      estado:"pendiente",creadoEn:new Date().toISOString()
    };
    setPedidos(p=>[nuevoPedido,...p]);
    setShowNew(false);
    resetForm();
  };
 
  const marcarEntregado=(pedidoId)=>{
    const ped=pedidos.find(p=>p.id===pedidoId);
    if(!ped)return;
    // Registrar una venta por cada línea del pedido
    setClientes(prev=>prev.map(c=>{
      if(c.id!==ped.clienteId)return c;
      const nuevasVentas=(ped.lineas||[]).map(l=>({
        id:uid(),fecha:ped.fechaEntrega,producto:l.productoId,
        cantidad:l.cantidad,monto:l.monto,pagado:ped.pagado
      }));
      return{...c,ventas:[...c.ventas,...nuevasVentas]};
    }));
    // Descontar stock por cada línea
    setProds(prev=>prev.map(p=>{
      const linea=(ped.lineas||[]).find(l=>l.productoId===p.id);
      if(!linea)return p;
      return{...p,stock:Math.max(0,(p.stock||0)-linea.cantidad)};
    }));
    setPedidos(prev=>prev.map(p=>p.id===pedidoId?{...p,estado:"entregado"}:p));
  };
 
  const pendientes=pedidos.filter(p=>p.estado==="pendiente").sort((a,b)=>a.fechaEntrega.localeCompare(b.fechaEntrega));
  const entregados=pedidos.filter(p=>p.estado==="entregado").sort((a,b)=>b.fechaEntrega.localeCompare(a.fechaEntrega)).slice(0,10);
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:28,color:CR}}>Pedidos</span>
        <Btn onClick={()=>{resetForm();setShowNew(true);}} small>{I.plus}Nuevo</Btn>
      </div>
 
      {pendientes.length===0
        ?<div style={{background:CA,border:`1px solid ${BO}`,borderRadius:12,padding:24,textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:13,color:MU,marginBottom:8}}>Sin entregas pendientes</div>
          <Btn onClick={()=>setShowNew(true)}>{I.plus}Cargar primer pedido</Btn>
        </div>
        :<div style={{marginBottom:20}}>
          <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Pendientes de entrega ({pendientes.length})</div>
          {pendientes.map(p=>{
            const cliente=clientes.find(c=>c.id===p.clienteId);
            const esHoy=p.fechaEntrega===hoyISO();
            const lineas=p.lineas||[];
            return(
              <div key={p.id} style={{background:CA,border:`1px solid ${esHoy?AM+"44":BO}`,borderRadius:12,padding:16,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:CR}}>{cliente?cliente.nombre:"Cliente eliminado"}</div>
                    <div style={{fontSize:11,color:esHoy?AM:MU,marginTop:2,fontWeight:esHoy?700:400}}>{esHoy?"⏰ HOY · ":"📅 "}{fmtDate(p.fechaEntrega)} · {p.horaEntrega}hs</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="bebas" style={{fontSize:18,color:CR}}>{fmtARS(p.montoTotal||0)}</div>
                    <div style={{fontSize:10,color:p.pagado?GR:AM,marginTop:2}}>{p.pagado?"Pagado":"Cuenta corriente"}</div>
                  </div>
                </div>
                {/* Líneas del pedido */}
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 12px",marginBottom:10}}>
                  {lineas.map((l,idx)=>{
                    const prod=prods.find(x=>x.id===l.productoId);
                    return(
                      <div key={l.id||idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:idx<lineas.length-1?6:0,marginBottom:idx<lineas.length-1?6:0,borderBottom:idx<lineas.length-1?`1px solid ${BO}`:"none"}}>
                        <span style={{fontSize:12,color:CR}}>{prod?prod.nombre:l.productoId}</span>
                        <div style={{display:"flex",gap:12,alignItems:"center"}}>
                          <span style={{fontSize:11,color:MU}}>{l.cantidad}L</span>
                          <span style={{fontSize:12,fontWeight:600,color:CR}}>{fmtARS(l.monto||0)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {p.notas&&<div style={{fontSize:11,color:"#A89682",marginBottom:10}}>{p.notas}</div>}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>marcarEntregado(p.id)} style={{flex:1,padding:"9px 0",borderRadius:8,background:GR,color:"#fff",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{I.check} Marcar entregado</button>
                  <button onClick={()=>{if(window.confirm("¿Cancelar este pedido?"))setPedidos(prev=>prev.map(x=>x.id===p.id?{...x,estado:"cancelado"}:x));}} style={{padding:"9px 12px",borderRadius:8,background:"none",color:RE,border:`1px solid ${RE}44`,fontSize:11,cursor:"pointer"}}>{I.trash}</button>
                </div>
              </div>
            );
          })}
        </div>
      }
 
      {entregados.length>0&&(
        <div>
          <div style={{fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Últimas entregas</div>
          {entregados.map(p=>{
            const cliente=clientes.find(c=>c.id===p.clienteId);
            const lineas=p.lineas||[];
            return(
              <div key={p.id} style={{background:CA,border:`1px solid ${BO}`,borderRadius:10,padding:"12px 14px",marginBottom:6,opacity:0.7}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <div style={{fontSize:12,fontWeight:600,color:CR}}>{cliente?cliente.nombre:"—"}</div>
                  <div style={{textAlign:"right"}}><div style={{fontSize:12,color:CR}}>{fmtARS(p.montoTotal||0)}</div><div style={{fontSize:10,color:GR}}>Entregado · {fmtDate(p.fechaEntrega)}</div></div>
                </div>
                <div style={{fontSize:10,color:MU}}>{lineas.map(l=>{const prod=prods.find(x=>x.id===l.productoId);return`${l.cantidad}L ${prod?prod.nombre:l.productoId}`;}).join(" + ")}</div>
              </div>
            );
          })}
        </div>
      )}
 
      <Modal open={showNew} onClose={()=>{setShowNew(false);resetForm();}} title="Nuevo pedido">
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {/* Cliente */}
          <div><Lbl t="Cliente"/><select value={clienteId} onChange={e=>setClienteId(e.target.value)}><option value="">Seleccioná un cliente</option>{clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select></div>
 
          {/* Líneas de productos */}
          <div>
            <Lbl t="Productos del pedido"/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {lineas.map((l,idx)=>{
                const prod=prods.find(p=>p.id===l.productoId);
                const sug=l.cantidad&&prod?montoTotal(prod,Number(l.cantidad)):null;
                const stockBajo=l.cantidad&&prod&&Number(l.cantidad)>(prod.stock||0);
                return(
                  <div key={l.id} style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:11,fontWeight:700,color:MU}}>Ítem {idx+1}</span>
                      {lineas.length>1&&<button onClick={()=>quitarLinea(l.id)} style={{background:"none",border:"none",cursor:"pointer",color:RE,padding:2}}>{I.trash}</button>}
                    </div>
                    <div style={{marginBottom:8}}>
                      <select value={l.productoId} onChange={e=>updateLinea(l.id,"productoId",e.target.value)}>
                        {prods.map(p=><option key={p.id} value={p.id}>{p.nombre} · stock {p.stock||0}L</option>)}
                      </select>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                      <div>
                        <Lbl t="Cantidad (L)"/>
                        <input type="number" inputMode="numeric" value={l.cantidad} onChange={e=>updateLinea(l.id,"cantidad",e.target.value)} placeholder="12"/>
                        {stockBajo&&<div style={{fontSize:9,color:"#E08070",marginTop:2}}>⚠ Solo {prod.stock||0}L en stock</div>}
                      </div>
                      <div>
                        <Lbl t="Monto ARS"/>
                        <input type="number" inputMode="numeric" value={l.monto} onChange={e=>updateLinea(l.id,"monto",e.target.value)} placeholder={sug||"0"}/>
                        {sug&&!l.monto&&<div style={{fontSize:9,color:G,marginTop:2}}>Sug: {fmtARS(sug)}</div>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={agregarLinea} style={{width:"100%",marginTop:8,padding:"9px 0",borderRadius:8,background:"none",border:`1px dashed ${G}44`,color:G,fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{I.plus}Agregar otro producto</button>
          </div>
 
          {/* Total */}
          {totalPedido>0&&(
            <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:12,color:MU}}>Total del pedido · {totalLitros}L</span>
              <span className="bebas" style={{fontSize:20,color:G}}>{fmtARS(totalPedido)}</span>
            </div>
          )}
 
          {/* Fecha y hora */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Lbl t="Fecha de entrega"/><input type="date" value={fechaEntrega} onChange={e=>setFechaEntrega(e.target.value)}/></div>
            <div><Lbl t="Hora estimada"/><input type="time" value={horaEntrega} onChange={e=>setHoraEntrega(e.target.value)}/></div>
          </div>
 
          {/* Pago */}
          <div><Lbl t="¿Se cobra al momento de la entrega?"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <button onClick={()=>setPagado(true)} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${pagado?GR:BO}`,background:pagado?GR+"22":"transparent",color:pagado?GR:MU,fontSize:12,fontWeight:700,cursor:"pointer"}}>✓ Pagado</button>
              <button onClick={()=>setPagado(false)} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${!pagado?AM:BO}`,background:!pagado?AM+"22":"transparent",color:!pagado?AM:MU,fontSize:12,fontWeight:700,cursor:"pointer"}}>Cuenta corriente</button>
            </div>
          </div>
 
          <div><Lbl t="Notas (opcional)"/><textarea rows={2} value={notas} onChange={e=>setNotas(e.target.value)} placeholder="Alguna aclaración para la entrega..."/></div>
          <div style={{display:"flex",gap:8,paddingTop:4}}>
            <Btn variant="ghost" onClick={()=>{setShowNew(false);resetForm();}}>Cancelar</Btn>
            <Btn variant="green" onClick={confirmarPedido} disabled={!clienteId||lineasValidas.length===0}>{I.box}Confirmar pedido</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}
 
// ── PRODUCTOS ─────────────────────────────────────────────────────
function Productos({prods,setProds}){
  const[editId,setEditId]=useState(null);
  const[ef,setEf]=useState(null);
  const[showPromo,setShowPromo]=useState(null);
  const[pf,setPf]=useState({minCantidad:"",precioUnitario:""});
 
  const startEdit=p=>{setEditId(p.id);setEf({...p});};
  const saveEdit=()=>{setProds(prev=>prev.map(p=>p.id===editId?{...ef,precio:Number(ef.precio),stock:Number(ef.stock||0)}:p));setEditId(null);};
  const agregarPromo=prodId=>{
    if(!pf.minCantidad||!pf.precioUnitario)return;
    setProds(prev=>prev.map(p=>p.id===prodId?{...p,promos:[...(p.promos||[]),{id:uid(),minCantidad:Number(pf.minCantidad),precioUnitario:Number(pf.precioUnitario)}].sort((a,b)=>a.minCantidad-b.minCantidad)}:p));
    setPf({minCantidad:"",precioUnitario:""});setShowPromo(null);
  };
  const eliminarPromo=(prodId,promoId)=>setProds(prev=>prev.map(p=>p.id===prodId?{...p,promos:(p.promos||[]).filter(pr=>pr.id!==promoId)}:p));
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Productos</span>
      <p style={{fontSize:11,color:MU,marginBottom:20}}>Precios, stock y promos por volumen</p>
      {prods.map(p=>(
        <div key={p.id} style={{background:CA,border:`1px solid ${editId===p.id?G:BO}`,borderRadius:12,padding:16,marginBottom:12}}>
          {editId===p.id?(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div><Lbl t="Nombre"/><input value={ef.nombre} onChange={e=>setEf(x=>({...x,nombre:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><Lbl t="Precio base (ARS/L)"/><input type="number" value={ef.precio} onChange={e=>setEf(x=>({...x,precio:e.target.value}))}/></div>
                <div><Lbl t="Stock actual (L)"/><input type="number" value={ef.stock||""} onChange={e=>setEf(x=>({...x,stock:e.target.value}))}/></div>
              </div>
              <div style={{display:"flex",gap:8}}><Btn variant="ghost" onClick={()=>setEditId(null)}>Cancelar</Btn><Btn onClick={saveEdit}>Guardar</Btn></div>
            </div>
          ):(
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:CR}}>{p.nombre}</div>
                  <div style={{fontSize:11,color:MU,marginTop:2}}>1L PET descartable</div>
                </div>
                <button onClick={()=>startEdit(p)} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:MU}}>{I.edit}</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontSize:10,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:2}}>Precio base</div>
                  <div className="bebas" style={{fontSize:22,color:G}}>{fmtARS(p.precio)}</div>
                </div>
                <div style={{background:BG,border:`1px solid ${(p.stock||0)<24?RE+"44":BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontSize:10,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:2}}>Stock</div>
                  <div className="bebas" style={{fontSize:22,color:(p.stock||0)<24?"#E08070":CR}}>{p.stock||0} L</div>
                  {(p.stock||0)<24&&<div style={{fontSize:9,color:"#E08070",marginTop:2}}>⚠ Stock bajo</div>}
                </div>
              </div>
              {/* Promos por volumen */}
              <div style={{marginBottom:12}}>
                <div style={{fontSize:10,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Precios por volumen</div>
                {(p.promos||[]).length===0?<p style={{fontSize:11,color:MU,fontStyle:"italic"}}>Sin promos configuradas.</p>:(p.promos||[]).map(pr=>(
                  <div key={pr.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                    <span style={{fontSize:12,color:CR}}>Desde {pr.minCantidad}L → {fmtARS(pr.precioUnitario)}/L</span>
                    <button onClick={()=>eliminarPromo(p.id,pr.id)} style={{background:"none",border:"none",cursor:"pointer",color:RE,padding:4}}>{I.trash}</button>
                  </div>
                ))}
                {showPromo===p.id?(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginTop:8}}>
                    <div><Lbl t="Desde (L)"/><input type="number" value={pf.minCantidad} onChange={e=>setPf(x=>({...x,minCantidad:e.target.value}))} placeholder="48"/></div>
                    <div><Lbl t="Precio/L"/><input type="number" value={pf.precioUnitario} onChange={e=>setPf(x=>({...x,precioUnitario:e.target.value}))} placeholder="1400"/></div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:6}}>
                      <button onClick={()=>agregarPromo(p.id)} style={{padding:"10px 12px",borderRadius:8,background:G,color:"#000",border:"none",fontWeight:700,cursor:"pointer"}}>{I.check}</button>
                      <button onClick={()=>setShowPromo(null)} style={{padding:"10px 10px",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,cursor:"pointer"}}>{I.x}</button>
                    </div>
                  </div>
                ):(
                  <button onClick={()=>setShowPromo(p.id)} style={{marginTop:8,fontSize:11,color:G,background:"none",border:`1px dashed ${G}44`,borderRadius:8,padding:"7px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>{I.plus}Agregar precio por volumen</button>
                )}
              </div>
            </>
          )}
        </div>
      ))}
    </div>
  );
}

  function buscarPorZona(){

    setLoading(true);setError("");setResultados([]);setNextToken(null);
    const query=busqueda.trim()||`${tipo||"comercio"} en ${zona||"Buenos Aires"}`;
    const coords=ZONAS_COORDS[zona]||{lat:-34.6037,lng:-58.3816};
    svcRef.current.textSearch({query,location:new window.google.maps.LatLng(coords.lat,coords.lng),radius:5000},(results,status,pagination)=>{
      setLoading(false);
      if(status==="OK"){setResultados(results);setNextToken(pagination?.hasNextPage?pagination:null);}
      else setError("Sin resultados. Probá otra búsqueda o zona.");
    });
  }
  function buscarCerca(){
    if(!gpsPos){activarGPS();return;}
    if(!svcRef.current)return;
    setLoading(true);setError("");setResultados([]);setNextToken(null);
    svcRef.current.nearbySearch({location:new window.google.maps.LatLng(gpsPos.lat,gpsPos.lng),radius:radioM,keyword:tipo||"restaurante"},(results,status,pagination)=>{
      setLoading(false);
      if(status==="OK"){setResultados(results);setNextToken(pagination?.hasNextPage?pagination:null);}
      else setError("Sin resultados cerca. Probá aumentar el radio.");
    });
  }
  function cargarMas(){
    if(!nextToken)return;setLoadingMore(true);
    setTimeout(()=>{nextToken.nextPage((results,status,pagination)=>{setLoadingMore(false);if(status==="OK"){setResultados(prev=>[...prev,...results]);setNextToken(pagination?.hasNextPage?pagination:null);}else setNextToken(null);});},2000);
  }
  function activarGPS(){
    if(!navigator.geolocation){setError("Tu dispositivo no soporta GPS.");return;}
    setLoading(true);
    navigator.geolocation.getCurrentPosition(pos=>{
      const{latitude:lat,longitude:lng}=pos.coords;setGpsPos({lat,lng});
      const gc=new window.google.maps.Geocoder();gc.geocode({location:{lat,lng}},(res,st)=>{if(st==="OK"&&res[0])setGpsLabel(res[0].formatted_address);else setGpsLabel(`${lat.toFixed(4)}, ${lng.toFixed(4)}`);});
      setLoading(false);
    },()=>{setLoading(false);setError("No se pudo obtener la ubicación. Activá el GPS.");});
  }
  function buscar(){if(modo==="zona")buscarPorZona();else buscarCerca();}
  function agregarProspecto(lugar){
    const dir=lugar.formatted_address||lugar.vicinity||"";
    const zonaDetectada=Object.keys(ZONAS_COORDS).find(z=>dir.toLowerCase().includes(z.split(",")[0].toLowerCase()))||"CABA Centro";
    const types=lugar.types||[];let rubro="Otro";
    if(types.includes("bar"))rubro="Bar";else if(types.includes("convenience_store"))rubro="Kiosco";
    else if(types.includes("grocery_or_supermarket")||types.includes("supermarket"))rubro="Almacén";
    else if(lugar.name.toLowerCase().includes("pizza"))rubro="Pizzería";else if(lugar.name.toLowerCase().includes("parri"))rubro="Parrilla";
    else if(lugar.name.toLowerCase().includes("bodeg"))rubro="Bodegón";else if(types.includes("restaurant")||types.includes("food"))rubro="Restobar";
    const nuevo={id:uid(),_placeId:lugar.place_id,nombre:lugar.name,rubro,zona:zonaDetectada,direccion:dir,telefono:(lugar.formatted_phone_number||"").replace(/\s|-/g,"").replace(/^0/,"54").replace(/^\+/,""),notas:`Google Maps · Rating: ${lugar.rating||"N/D"} ⭐ (${lugar.user_ratings_total||0} reseñas).`,estado:"Por contactar"};
    setProspectos(prev=>[...prev,nuevo]);setAgregados(prev=>({...prev,[lugar.place_id]:true}));
  }
  function stars(r){if(!r)return"";const full=Math.round(r);return"★".repeat(full)+"☆".repeat(5-full);}
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:28,color:CR,display:"block",marginBottom:4}}>Buscar en Maps</span>
      <p style={{fontSize:11,color:MU,marginBottom:16}}>Encontrá comercios reales con Google Places y agregalos a tu pipeline.</p>
      <div style={{display:"flex",gap:0,marginBottom:16,background:SU,border:`1px solid ${BO}`,borderRadius:10,padding:4}}>
        {[{k:"zona",l:"📍 Por zona"},{k:"cerca",l:"🎯 Cerca de mí"}].map(t=>(
          <button key={t.k} onClick={()=>setModo(t.k)} style={{flex:1,padding:"8px",borderRadius:7,border:"none",fontSize:12,fontWeight:700,background:modo===t.k?G:"transparent",color:modo===t.k?"#000":MU,transition:"all 0.2s"}}>{t.l}</button>
        ))}
      </div>
      {modo==="zona"&&(
        <div>
          <div style={{marginBottom:10}}><Lbl t="¿Qué comercio buscás?"/><input value={tipo} onChange={e=>setTipo(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="Ej: pizzería, bar, kiosco..." list="tipos-sug"/><datalist id="tipos-sug">{TIPOS_LIST.map(t=><option key={t} value={t}/>)}</datalist></div>
          <div style={{marginBottom:10}}><Lbl t="¿En qué zona?"/><input value={zona} onChange={e=>setZona(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="Ej: Palermo, San Isidro, Lomas..." list="zonas-sug"/><datalist id="zonas-sug">{ZONAS_LIST.map(z=><option key={z} value={z}/>)}</datalist></div>
          <div style={{marginBottom:10}}><Lbl t="O búsqueda libre (opcional)"/><div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span><input style={{paddingLeft:36}} placeholder='Ej: "pizzerías en Villa del Parque"' value={busqueda} onChange={e=>setBusqueda(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()}/></div><div style={{fontSize:10,color:MU,marginTop:4}}>Si completás este campo sobreescribe los de arriba</div></div>
        </div>
      )}
      {modo==="cerca"&&(
        <div>
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:14,marginBottom:10,display:"flex",alignItems:"center",gap:10}}><div style={{color:G}}>{I.map}</div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:CR}}>Usar mi ubicación actual</div>{gpsLabel?<div style={{fontSize:11,color:GR,marginTop:2}}>✓ {gpsLabel}</div>:<div style={{fontSize:11,color:MU,marginTop:2}}>Activá el GPS para buscar cerca tuyo</div>}</div><button onClick={activarGPS} style={{padding:"7px 14px",borderRadius:8,background:gpsPos?GR+"22":G+"22",color:gpsPos?GR:G,border:`1px solid ${gpsPos?GR+"44":G+"44"}`,fontSize:12,fontWeight:700}}>{gpsPos?"GPS activo":"Activar GPS"}</button></div>
          <div style={{marginBottom:10}}><Lbl t="¿Qué comercio buscás?"/><input value={tipo} onChange={e=>setTipo(e.target.value)} placeholder="Ej: pizzería, bar, parrilla..." list="tipos-sug-c" onKeyDown={e=>e.key==="Enter"&&buscar()}/><datalist id="tipos-sug-c">{TIPOS_LIST.map(t=><option key={t} value={t}/>)}</datalist></div>
          <div><Lbl t="Radio de búsqueda"/><select value={radioM} onChange={e=>setRadioM(Number(e.target.value))}><option value={500}>500 metros</option><option value={1000}>1 km</option><option value={2000}>2 km</option><option value={5000}>5 km</option></select></div>
        </div>
      )}
      <button onClick={buscar} disabled={loading||(modo==="cerca"&&!gpsPos)} style={{width:"100%",padding:"13px",borderRadius:10,background:G,color:"#000",fontSize:14,fontWeight:700,border:"none",marginTop:16,marginBottom:20,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:(loading||(modo==="cerca"&&!gpsPos))?0.6:1}}>
        {loading?<><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span>Buscando...</>:<>{I.search}Buscar en Google Maps</>}
      </button>
      {error&&<div style={{background:RE+"22",border:`1px solid ${RE}44`,borderRadius:8,padding:"10px 14px",fontSize:12,color:"#E08070",marginBottom:16}}>{error}</div>}
      {resultados.length>0&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontSize:13,fontWeight:600,color:CR}}>{resultados.length} resultados</span><span style={{fontSize:11,color:MU}}>{tipo}s · {modo==="zona"?zona:"cerca de vos"}</span></div>
          {resultados.map(r=>{
            const yaAgregado=agregados[r.place_id]||yaEnCRM.has(r.place_id);
            return(
              <div key={r.place_id} style={{background:CA,border:`1px solid ${yaAgregado?GR+"44":BO}`,borderRadius:12,padding:14,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
                  <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div><div style={{fontSize:11,color:MU,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.formatted_address||r.vicinity||""}</div></div>
                  {yaAgregado&&<span style={{fontSize:10,fontWeight:700,color:GR,background:GR+"22",padding:"3px 8px",borderRadius:4,flexShrink:0}}>En CRM ✓</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,flexWrap:"wrap"}}>
                  {r.rating&&<span style={{fontSize:12,color:"#E0AA40"}}>{stars(r.rating)} <span style={{color:MU}}>{r.rating} ({r.user_ratings_total||0})</span></span>}
                  {r.opening_hours&&<span style={{fontSize:11,fontWeight:600,color:r.opening_hours.open_now?GR:RE}}>{r.opening_hours.open_now?"● Abierto":"● Cerrado"}</span>}
                  {r.formatted_phone_number&&<span style={{fontSize:11,color:MU}}>{I.phone}{r.formatted_phone_number}</span>}
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <a href={`https://maps.google.com/?place_id=${r.place_id}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:11,padding:"6px 10px",borderRadius:6,color:MU,background:"none",border:`1px solid ${BO}`,textDecoration:"none"}}>{I.map}Ver en Maps</a>
                  {!yaAgregado?<button onClick={()=>agregarProspecto(r)} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,padding:"6px 12px",borderRadius:6,color:G,background:G+"11",border:`1px solid ${G}33`}}>{I.plus}Agregar a Prospectos</button>:<span style={{fontSize:11,color:GR,alignSelf:"center",padding:"0 4px"}}>✓ Ya está en tu pipeline</span>}
                </div>
              </div>
            );
          })}
          {nextToken&&<button onClick={cargarMas} disabled={loadingMore} style={{width:"100%",padding:"10px",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:12,cursor:"pointer",marginTop:8}}>{loadingMore?"Cargando...":"Cargar más resultados"}</button>}
        </div>
      )}
    </div>
  );
}

        </div>
      );})}
    </div>
  );
}
 
// ── MÉTRICAS ──────────────────────────────────────────────────────
function Metricas({clientes,prods}){
  const todas=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,clienteNombre:c.nombre,rubro:c.rubro,zona:c.zona}))),[clientes]);
 
  // Ranking por producto
  const rankingProducto=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.producto])map[v.producto]={litros:0,monto:0,pedidos:0};
      map[v.producto].litros+=v.cantidad;
      map[v.producto].monto+=v.monto;
      map[v.producto].pedidos+=1;
    });
    return Object.entries(map).map(([id,d])=>({id,nombre:prods.find(p=>p.id===id)?.nombre||id,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods]);
 
  // Ranking clientes por producto
  const rankingClientesPorProd=useMemo(()=>{
    const byProd={};
    prods.forEach(p=>byProd[p.id]={});
    todas.forEach(v=>{
      if(!byProd[v.producto])byProd[v.producto]={};
      if(!byProd[v.producto][v.clienteNombre])byProd[v.producto][v.clienteNombre]={litros:0,monto:0};
      byProd[v.producto][v.clienteNombre].litros+=v.cantidad;
      byProd[v.producto][v.clienteNombre].monto+=v.monto;
    });
    const result={};
    Object.entries(byProd).forEach(([prodId,clientes])=>{
      result[prodId]=Object.entries(clientes).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.litros-a.litros).slice(0,5);
    });
    return result;
  },[todas,prods]);
 
  // Ranking por zona
  const rankingZona=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.zona])map[v.zona]={litros:0,monto:0,pedidos:0};
      map[v.zona].litros+=v.cantidad;
      map[v.zona].monto+=v.monto;
      map[v.zona].pedidos+=1;
    });
    return Object.entries(map).map(([zona,d])=>({zona,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas]);
 
  // Ranking por rubro
  const rankingRubro=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.rubro])map[v.rubro]={litros:0,monto:0,pedidos:0};
      map[v.rubro].litros+=v.cantidad;
      map[v.rubro].monto+=v.monto;
      map[v.rubro].pedidos+=1;
    });
    return Object.entries(map).map(([rubro,d])=>({rubro,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas]);
 
  const maxZona=rankingZona[0]?.litros||1;
  const maxRubro=rankingRubro[0]?.litros||1;
 
  if(todas.length===0) return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>

function Configuracion({cal,clientes,prods}){
  const[clientId,setClientId]=useState(getCalClientId());
  const[guardado,setGuardado]=useState(false);
 
  const guardarClientId=()=>{
    const val=clientId.trim();
    if(!val)return;
    localStorage.setItem("farol_gcal_client_id",val);
    setGuardado(true);
    setTimeout(()=>setGuardado(false),2000);
  };
  const limpiarClientId=()=>{
    localStorage.removeItem("farol_gcal_client_id");
    setClientId("");
    cal.logout&&cal.logout();
  };
  const tieneClientId=!!getCalClientId();
 
  // ── Exportaciones ──
  const exportarClientes=()=>{
    const filas=clientes.map(c=>{
      const saldo=saldoCliente(c);
      const totalVentas=c.ventas.reduce((s,v)=>s+v.monto,0);
      const totalLitros=c.ventas.reduce((s,v)=>s+v.cantidad,0);
      const ultimaVenta=lastSale(c);
      return[
        `"${c.nombre}"`,
        `"${c.rubro}"`,
        `"${c.zona}"`,
        `"${c.direccion||""}"`,
        `"${c.telefono||""}"`,
        totalVentas,
        totalLitros,
        saldo,
        c.ventas.length,
        ultimaVenta?ultimaVenta.fecha:"",
        `"${c.notas||""}"`,
      ].join(",");
    });
    const header="Nombre,Rubro,Zona,Dirección,Teléfono,Total vendido (ARS),Total litros,Saldo pendiente (ARS),Cantidad pedidos,Última venta,Notas";
    descargarCSV(`clientes_farol_${hoyISO()}.csv`,header+"\n"+filas.join("\n"));
  };
 
  const exportarVentas=()=>{

          `"${c.zona}"`,

          `"${prod?prod.nombre:v.producto}"`,
          v.cantidad,

    a.download=`backup_farol_${hoyISO()}.json`;a.click();

    const blob=new Blob(["\uFEFF"+contenido],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=nombre;a.click();
  }
 
  return(
    <div style={{padding:"24px 16px 130px",maxWidth:640,margin:"0 auto"}}>

// ── FIREBASE SYNC HOOK ────────────────────────────────────────────
const SYNC_STATUS={
  connecting:{icon:"☁️",label:"Conectando…",color:MU},
  saving:    {icon:"⏳",label:"Guardando…", color:AM},
  synced:    {icon:"✓", label:"Guardado",   color:GR},
  offline:   {icon:"⚡",label:"Sin conexión",color:AM},
  error:     {icon:"⚠️",label:"Error sync", color:RE},
};
 
function useFirebaseSync(clientes,setClientes,prospectos,setProspectos,speeches,setSpeeches,pedidos,setPedidos,prods,setProds,metaSemanal,setMetaSemanal){
  const[status,setStatus]=useState("connecting");
  const loadedRef=React.useRef(false);
  const lastSyncRef=React.useRef(null);
  const timerRef=React.useRef(null);
  const isFirstLoad=React.useRef(true);
  const unsubAuthRef=React.useRef(null);
  const unsubSnapRef=React.useRef(null);
 
  const iniciarSync=React.useCallback(()=>{
    if(!window.fbAuth||!window.fbDb){setStatus("error");return;}
 
    const unsubAuth=window.fbAuth.onAuthStateChanged(user=>{
      if(!user)return;
      const ref=window.fbDb.collection("farolcrm").doc("data");
      const unsubSnap=ref.onSnapshot(snap=>{
        if(snap.exists){
          const d=snap.data();
          const incoming=JSON.stringify({
            clientes:d.clientes||[],prospectos:d.prospectos||[],
            speeches:d.speeches||[],pedidos:d.pedidos||[],
            prods:d.prods||[],metaSemanal:d.metaSemanal||0
          });
          if(incoming!==lastSyncRef.current){
            lastSyncRef.current=incoming;
            setClientes(d.clientes||[]);
            setProspectos(d.prospectos||[]);
            setSpeeches(d.speeches||[]);
            setPedidos(d.pedidos||[]);
            if(d.prods&&d.prods.length>0)setProds(d.prods);
            if(d.metaSemanal)setMetaSemanal(d.metaSemanal);
          }
        }else{
          const seed={clientes,prospectos,speeches,pedidos,prods,metaSemanal,updatedAt:Date.now()};
          lastSyncRef.current=JSON.stringify({clientes,prospectos,speeches,pedidos,prods,metaSemanal});
          ref.set(seed).catch(()=>{});
        }
        loadedRef.current=true;
        isFirstLoad.current=false;
        setStatus("synced");
      },err=>{console.error("Firestore error:",err);setStatus("error");});
      unsubSnapRef.current=unsubSnap;
    });
    unsubAuthRef.current=unsubAuth;
    window.fbAuth.signInAnonymously().catch(()=>setStatus("error"));
  },[]);
 
  React.useEffect(()=>{
    // Esperar a que Firebase esté disponible (puede tardar si carga async)
    let intentos=0;
    const intentarConectar=()=>{
      if(window.fbAuth&&window.fbDb){
        iniciarSync();
      }else if(intentos<20){
        intentos++;
        setTimeout(intentarConectar,500);
      }else{
        setStatus("error");
      }
    };
    intentarConectar();
 
    const goOff=()=>setStatus(s=>s==="error"?s:"offline");
    const goOn=()=>setStatus(s=>s==="error"?s:"synced");
    window.addEventListener("offline",goOff);
    window.addEventListener("online",goOn);
    return()=>{
      if(unsubAuthRef.current)unsubAuthRef.current();
      if(unsubSnapRef.current)unsubSnapRef.current();
      window.removeEventListener("offline",goOff);
      window.removeEventListener("online",goOn);
    };
  },[]);
 
  // Guardar en Firestore cuando cambia el estado (debounce 800ms)
  React.useEffect(()=>{
    if(!loadedRef.current||isFirstLoad.current)return;
    const current=JSON.stringify({clientes,prospectos,speeches,pedidos,prods,metaSemanal});
    if(current===lastSyncRef.current)return;
    if(timerRef.current)clearTimeout(timerRef.current);
    setStatus("saving");
    timerRef.current=setTimeout(()=>{
      if(!window.fbDb){setStatus("error");return;}
      window.fbDb.collection("farolcrm").doc("data")
        .set({clientes,prospectos,speeches,pedidos,prods,metaSemanal,updatedAt:Date.now()})
        .then(()=>{lastSyncRef.current=current;setStatus("synced");})
        .catch(()=>setStatus(navigator.onLine?"error":"offline"));
    },800);
  },[clientes,prospectos,speeches,pedidos,prods,metaSemanal]);
 
  return status;
}
 
function SyncBadge({status}){
  const s=SYNC_STATUS[status]||SYNC_STATUS.connecting;
  return(

      <span>{s.icon}</span><span>{s.label}</span>
    </div>
  );
}
