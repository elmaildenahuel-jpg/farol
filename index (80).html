          <div style={{fontSize:13,fontWeight:700,color:"#E08070",textTransform:"uppercase",letterSpacing:"0.06em"}}>Por cobrar</div>
          <div className="bebas" style={{fontSize:20,color:"#E08070",marginTop:2}}>{fmtARS(deuda)}</div>
        </button>
      )}

 
      {/* Alertas clientes */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${BO}`,color:G}}>{I.alert}<span style={{fontSize:16,fontWeight:600,color:CR}}>Clientes con seguimiento</span></div>
        {alertas.length===0?<p style={{color:MU,fontSize:16,textAlign:"center",padding:"20px 16px"}}>Todos los clientes al día 🍺</p>:alertas.map(c=>{const ls=lastSale(c),d=ls?daysSince(ls.fecha):null,e=EST[estadoC(c)];return(
          <button key={c.id} onClick={()=>setTab("clientes")} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",background:"none",border:"none",borderBottom:`1px solid ${BO}`,cursor:"pointer",textAlign:"left"}}>
            <div><div style={{fontSize:16,fontWeight:600,color:CR}}>{c.nombre}</div><div style={{fontSize:14,color:e.c}}>{d} días sin pedir · {c.zona}</div></div>
            <span style={{color:MU}}>{I.chev}</span>
          </button>
        );})}
      </div>
 
      {/* Línea Farol */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden"}}>
        <div onClick={()=>setCatalogoAbierto(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",cursor:"pointer"}}>
          <span style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.1em",display:"flex",alignItems:"center",gap:7}}>
            Catálogo de productos
            <span style={{background:BG,color:MU,borderRadius:10,padding:"1px 7px",fontSize:12,fontWeight:700,textTransform:"none",letterSpacing:"normal"}}>{prods.length}</span>
          </span>
          <span style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={e=>{e.stopPropagation();setTab("productos");}} style={{fontSize:13,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:0}}>{I.edit}Editar precios</button>
            <span style={{color:MU,display:"flex",transition:"transform 0.2s",transform:catalogoAbierto?"rotate(90deg)":"rotate(0deg)"}}>{I.chev}</span>
          </span>
        </div>
        {catalogoAbierto&&prods.map(p=>(
          <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderTop:`1px solid ${BO}`}}><div><div style={{fontSize:16,fontWeight:500,color:CR}}>{p.nombre}</div><div style={{fontSize:14,color:MU}}>{p.marca||"Farol"} · {p.envase||"PET"}{(p.promos||[]).length>0?` · ${p.promos.length} promo${p.promos.length>1?"s":""}`:""}</div></div><div className="bebas" style={{fontSize:20,color:G}}>{fmtARS(p.precio)}<span style={{fontSize:12,color:MU,fontWeight:400}}> /L</span></div></div>
        ))}
      </div>
    </div>
  );
}
 
// ── CLIENTES ──────────────────────────────────────────────────────
function Clientes({clientes,setClientes,speeches,cal,prods,diasMora,promo51,pedidos}){
  const[q,setQ]=useState("");
  const[filtro,setFiltro]=useState("todos");
  const[orden,setOrden]=useState("reciente");
  const[showNew,setShowNew]=useState(false);
  const[sel,setSel]=useState(null);
  const filtered=useMemo(()=>clientes.filter(c=>{const t=q.toLowerCase();return!t||c.nombre.toLowerCase().includes(t)||c.zona.toLowerCase().includes(t)||c.rubro.toLowerCase().includes(t);}).filter(c=>filtro==="todos"||estadoC(c)===filtro).sort((a,b)=>{
    if(orden==="az")return a.nombre.localeCompare(b.nombre);
    if(orden==="deuda")return saldoCliente(b)-saldoCliente(a);
    const la=lastSale(a),lb=lastSale(b);return(lb?daysSince(lb.fecha):0)-(la?daysSince(la.fecha):0);
  }),[clientes,q,filtro,orden]);
  const selObj=clientes.find(c=>c.id===sel);
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Clientes</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <div style={{position:"relative",marginBottom:12}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>
        <input style={{paddingLeft:38}} placeholder="Buscar por nombre, zona o rubro..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"activo",l:"Activos"},{k:"atencion",l:"Atención"},{k:"inactivo",l:"Inactivos"}].map(f=>(
          <button key={f.k} onClick={()=>setFiltro(f.k)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtro===f.k?G:BO}`,background:filtro===f.k?G:"transparent",color:filtro===f.k?"#fff":MU}}>{f.l}</button>
        ))}
      </div>
      <div style={{marginBottom:16}}>
        <select value={orden} onChange={e=>setOrden(e.target.value)}>
          <option value="reciente">Ordenar: más recientes</option>
          <option value="az">Ordenar: A → Z</option>
          <option value="deuda">Ordenar: mayor deuda</option>
        </select>
      </div>
      {filtered.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:16}}>Sin clientes para mostrar.</p>:filtered.map(c=>{const e=EST[estadoC(c)];const ls=lastSale(c);const deuda=saldoCliente(c);return(
        <button key={c.id} onClick={()=>setSel(c.id)} style={{display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:"12px 16px",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:8}}>
          <div style={{width:38,height:38,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,flexShrink:0}}>{iniciales(c.nombre)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:16,fontWeight:600,color:CR}}>{c.nombre}</span><span style={{color:MU}}>{I.chev}</span></div>
            <div style={{fontSize:14,color:MU,marginTop:2}}>{c.rubro} · {c.zona}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,background:e.c+"15"}}>
                <span style={{width:5,height:5,borderRadius:"50%",background:e.c}}/>
                <span style={{fontSize:13,fontWeight:600,color:e.c}}>{ls?`Hace ${daysSince(ls.fecha)} días`:e.l}</span>
              </div>
              {deuda>0&&<div style={{fontSize:13,fontWeight:700,color:"#E08070"}}>💰{fmtARS(deuda)}</div>}
            </div>
          </div>
        </button>
      );})}
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo cliente">
        <FormCliente onCancel={()=>setShowNew(false)} onSave={f=>{setClientes(p=>[...p,{id:uid(),...f,agenda:[],historial:[],ventas:[]}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!selObj} onClose={()=>setSel(null)} title={selObj?.nombre||""}>
        {selObj&&<DetalleCliente cliente={selObj} speeches={speeches} cal={cal} prods={prods} diasMora={diasMora} promo51={promo51} pedidos={pedidos} onUpdate={u=>setClientes(p=>p.map(c=>c.id===u.id?u:c))} onDelete={id=>{setClientes(p=>p.filter(c=>c.id!==id));setSel(null);}}/>}
      </Modal>
    </div>
  );
}
 
// ── CuentaCorrienteProveedor ────────────────────────────────────────
function CuentaCorrienteProveedor({proveedor,onUpdate,prods}){
  const[showHistorial,setShowHistorial]=useState(false);
  const[showPago,setShowPago]=useState(false);
  const pendientes=(proveedor.compras||[]).filter(c=>!c.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const pagadas=(proveedor.compras||[]).filter(c=>c.pagado).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const saldo=saldoProveedor(proveedor);

  // Pago rápido de una compra puntual, hoy y en efectivo — para otra fecha/medio o pago parcial se usa "Registrar pago".
  const marcarPagada=id=>onUpdate({...proveedor,compras:proveedor.compras.map(c=>c.id===id?{...c,pagado:true,fechaPago:hoyISO(),medioPago:"Efectivo"}:c)});
  const desmarcarPagada=id=>onUpdate({...proveedor,compras:proveedor.compras.map(c=>c.id===id?{...c,pagado:false,fechaPago:null}:c)});
  const nombreProd=id=>{const p=(prods||[]).find(x=>x.id===id);return p?nombreProdEnvase(p):id;};

  return(
    <div style={{background:saldo>0?RE+"11":GR+"11",border:`1px solid ${saldo>0?RE+"33":GR+"33"}`,borderRadius:10,padding:14,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:saldo>0?8:0}}>
        <span style={{fontSize:16,fontWeight:700,color:saldo>0?"#C62828":GR}}>
          {saldo>0?"💰 Cuenta corriente (le debo)":"✓ Sin deuda pendiente"}
        </span>
        <span className="bebas" style={{fontSize:24,color:saldo>0?"#C62828":GR}}>{fmtARS(saldo)}</span>
      </div>

      {saldo>0&&(
        <>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:12,marginBottom:12}}>
            {pendientes.map(c=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                <div>
                  <div style={{fontSize:15,fontWeight:500,color:CR}}>{nombreProd(c.producto)}</div>
                  <div style={{fontSize:14,color:MU}}>{fmtDate(c.fecha)} · {c.cantidad}{(prods||[]).find(p=>p.id===c.producto)?.envase==="Lata"?"u":"L"}</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:17,fontWeight:700,color:"#C62828"}}>{fmtARS(c.monto)}</span>
                  <button onClick={()=>marcarPagada(c.id)} style={{fontSize:14,fontWeight:700,padding:"6px 12px",borderRadius:8,background:GR+"22",color:GR,border:`1px solid ${GR}44`,cursor:"pointer"}}>✓ Pagado</button>
                </div>
              </div>
            ))}
          </div>

          {/* Registrar pago — mismo panel unificado que con clientes */}
          {!showPago?(
            <button onClick={()=>setShowPago(true)} style={{width:"100%",padding:"12px 0",borderRadius:10,background:GR,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {I.check} Registrar pago
            </button>
          ):(
            <PanelPagoProveedor proveedor={proveedor} onUpdate={onUpdate} onDone={()=>setShowPago(false)}/>
          )}
        </>
      )}

      {pagadas.length>0&&(
        <div style={{marginTop:saldo>0?12:0}}>
          <button onClick={()=>setShowHistorial(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:MU,display:"flex",alignItems:"center",gap:4,padding:0}}>
            {showHistorial?"▲":"▼"} Historial de pagos ({pagadas.length})
          </button>
          {showHistorial&&(
            <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
              {pagadas.slice(0,8).map(c=>(
                <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div>
                    <div style={{fontSize:15,color:CR}}>{fmtDate(c.fechaPago||c.fecha)}</div>
                    <div style={{fontSize:13,color:GR}}>✓ {c.medioPago||"Pagado"}{c.nota?` · ${c.nota}`:""}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(c.monto)}</span>
                    <button onClick={()=>desmarcarPagada(c.id)} style={{fontSize:13,padding:"4px 8px",borderRadius:6,background:RE+"11",color:"#C62828",border:`1px solid ${RE}33`,cursor:"pointer"}}>Deshacer</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── DetalleProveedor ──────────────────────────────────────────────
function DetalleProveedor({proveedor,onUpdate,onDelete,prods,setProds}){
  const[cForm,setCForm]=useState(false);
  const[edit,setEdit]=useState(false);
  const[editandoCompraId,setEditandoCompraId]=useState(null);
  const[confirmBorrar,setConfirmBorrar]=useState(false);
  const total=(proveedor.compras||[]).reduce((s,c)=>s+c.monto,0);
  const sorted=[...(proveedor.compras||[])].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const marcasDisponibles=useMemo(()=>Array.from(new Set((prods||[]).map(p=>p.marca).filter(Boolean))).sort(),[prods]);
  if(edit)return<FormProveedor initial={proveedor} marcasDisponibles={marcasDisponibles} onCancel={()=>setEdit(false)} onSave={f=>{onUpdate({...proveedor,...f});setEdit(false);}}/>;

  // Registrar compra: agrega el movimiento a la cuenta corriente del proveedor Y suma la cantidad al stock del producto.
  const registrarCompra=c=>{
    onUpdate({...proveedor,compras:[...(proveedor.compras||[]),{id:uid(),...c}]});
    setProds(prev=>prev.map(p=>p.id===c.producto?{...p,stock:(Number(p.stock)||0)+Number(c.cantidad)}:p));
    setCForm(false);
  };

  // Editar compra: corrige el movimiento y ajusta el stock por la diferencia (incluso si cambió de producto),
  // para poder corregir cargas de saldos/compras viejas sin descuadrar el stock.
  const guardarEdicionCompra=(compraVieja,datos)=>{
    onUpdate({...proveedor,compras:proveedor.compras.map(c=>c.id===compraVieja.id?{...c,...datos}:c)});
    setProds(prev=>prev.map(p=>{
      if(p.id===compraVieja.producto&&p.id===datos.producto)return{...p,stock:(Number(p.stock)||0)-Number(compraVieja.cantidad)+Number(datos.cantidad)};
      if(p.id===compraVieja.producto)return{...p,stock:(Number(p.stock)||0)-Number(compraVieja.cantidad)};
      if(p.id===datos.producto)return{...p,stock:(Number(p.stock)||0)+Number(datos.cantidad)};
      return p;
    }));
    setEditandoCompraId(null);
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",marginBottom:16}}>
        <div style={{display:"flex",gap:4}}>
          <button onClick={()=>setEdit(true)} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:MU}}>{I.edit}</button>
          <button onClick={()=>setConfirmBorrar(true)} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:RE}}>{I.trash}</button>
        </div>
      </div>
      <ModalConfirmar open={confirmBorrar} onClose={()=>setConfirmBorrar(false)} onConfirmar={()=>onDelete(proveedor.id)} titulo="¿Eliminar proveedor?" mensaje={`Vas a eliminar a ${proveedor.nombre} y todo su historial de compras. Esta acción no se puede deshacer (el stock ya sumado por compras anteriores no se revierte).`} labelConfirmar="Sí, eliminar"/>
      {proveedor.direccion&&<div style={{color:CR,display:"flex",alignItems:"center",gap:6,fontSize:16,marginBottom:14}}><span style={{color:MU}}>{I.map}</span>{proveedor.direccion}</div>}
      {proveedor.marca&&<div style={{color:CR,fontSize:16,marginBottom:14}}><span style={{color:MU}}>Marca · </span>{proveedor.marca}</div>}
      {proveedor.telefono&&(
        <a href={`https://wa.me/${proveedor.telefono}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"9px 0",borderRadius:8,fontSize:15,fontWeight:700,background:"#25D36620",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none",marginBottom:14}}>{I.wa}WhatsApp</a>
      )}
      {proveedor.notas&&<div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:12,marginBottom:14}}><div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Notas</div><div style={{fontSize:15,color:"#D9C9B5"}}>{proveedor.notas}</div></div>}
      <CuentaCorrienteProveedor proveedor={proveedor} onUpdate={onUpdate} prods={prods}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:16,fontWeight:600,color:CR}}>Historial de compras</span>
        <span style={{fontSize:14,color:MU}}>Total: {fmtARS(total)}</span>
      </div>
      {cForm
        ?<div style={{marginBottom:14}}><FormCompra prods={prods} marcaProveedor={proveedor.marca} onCancel={()=>setCForm(false)} onSave={registrarCompra}/></div>
        :<button onClick={()=>setCForm(true)} style={{width:"100%",marginBottom:10,padding:"10px 0",borderRadius:8,fontSize:16,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,border:"1px dashed #3A3028",background:"none",color:G}}>{I.plus}Nueva compra</button>
      }
      {sorted.length===0?<p style={{fontSize:16,color:MU,textAlign:"center",padding:16}}>Sin compras aún.</p>:sorted.map(c=>{
        if(editandoCompraId===c.id)return(
          <div key={c.id} style={{marginBottom:10,background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:12}}>
            <FormCompra prods={prods} marcaProveedor={proveedor.marca} initial={c} labelGuardar="Guardar cambios" onCancel={()=>setEditandoCompraId(null)} onSave={datos=>guardarEdicionCompra(c,datos)}/>
          </div>
        );
        const p=(prods||[]).find(x=>x.id===c.producto);return(
        <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${c.pagado?BO:RE+"44"}`,borderRadius:8,padding:"10px 12px",marginBottom:6}}>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:CR}}>{p?nombreProdEnvase(p):c.producto}</div>
            <div style={{fontSize:13,color:MU}}>{fmtDate(c.fecha)}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(c.monto)}</div>
              <div style={{fontSize:13,color:c.pagado?GR:"#E08070"}}>{c.cantidad}{p&&p.envase==="Lata"?"u":"L"} · {c.pagado?"Pagado":"Pendiente"}</div>
            </div>
            <button onClick={()=>setEditandoCompraId(c.id)} style={{padding:6,background:"none",border:"none",cursor:"pointer",color:MU,flexShrink:0}}>{I.edit}</button>
          </div>
        </div>
      );})}
    </div>
  );
}

// ── PROVEEDORES ───────────────────────────────────────────────────
function Proveedores({proveedores,setProveedores,prods,setProds}){

  const[sel,setSel]=useState(null);
  const filtered=useMemo(()=>(proveedores||[]).filter(p=>{const t=q.toLowerCase();return!t||(p.nombre||"").toLowerCase().includes(t);}).sort((a,b)=>{
    if(orden==="deuda")return saldoProveedor(b)-saldoProveedor(a);
    return(a.nombre||"").localeCompare(b.nombre||"");
  }),[proveedores,q,orden]);
  const selObj=(proveedores||[]).find(p=>p.id===sel);

      <div style={{marginBottom:16}}>
        <select value={orden} onChange={e=>setOrden(e.target.value)}>

          <option value="deuda">Ordenar: mayor deuda</option>

      </div>
      {filtered.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:16}}>Sin proveedores para mostrar.</p>:filtered.map(p=>{const deuda=saldoProveedor(p);return(

          <div style={{flex:1,minWidth:0}}>

            {deuda>0&&<div style={{fontSize:13,fontWeight:700,color:"#E08070",marginTop:4}}>💰 Le debo {fmtARS(deuda)}</div>}

      );})}
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo proveedor">
        <FormProveedor marcasDisponibles={marcasDisponibles} onCancel={()=>setShowNew(false)} onSave={f=>{setProveedores(prev=>[...(prev||[]),{id:uid(),...f,compras:[]}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!selObj} onClose={()=>setSel(null)} title={selObj?.nombre||""}>
        {selObj&&<DetalleProveedor proveedor={selObj} prods={prods} setProds={setProds} onUpdate={u=>setProveedores(prev=>prev.map(x=>x.id===u.id?u:x))} onDelete={id=>{setProveedores(prev=>prev.filter(x=>x.id!==id));setSel(null);}}/>}
      </Modal>
    </div>
  );
}

// ── ENVÍO MASIVO ──────────────────────────────────────────────────
const ENVIO_MASIVO_LS_KEY="farol_envio_masivo_progreso";
function EnvioMasivo({clientes,speeches}){
  const[q,setQ]=useState("");
  const[filtroEstado,setFiltroEstado]=useState("todos");
  const[filtroZona,setFiltroZona]=useState("todas");
  const[sel,setSel]=useState(()=>new Set());
  const[mensaje,setMensaje]=useState("");
  const[speechSel,setSpeechSel]=useState("");
  const[enCola,setEnCola]=useState(false);
  const[enviados,setEnviados]=useState(()=>new Set());
  const[idx,setIdx]=useState(0);
  const[cargado,setCargado]=useState(false);

  // Recupera el progreso guardado (por si el usuario fue a WhatsApp y volvió, o cerró la app a mitad de camino)
  useEffect(()=>{
    try{
      const raw=localStorage.getItem(ENVIO_MASIVO_LS_KEY);
      if(raw){
        const d=JSON.parse(raw);
        if(d&&Array.isArray(d.ids)&&d.ids.length){
          setSel(new Set(d.ids));
          setMensaje(d.mensaje||"");
          setEnviados(new Set(d.enviados||[]));
          setIdx(d.idx||0);
          setEnCola(!!d.enCola);
        }
      }
    }catch(e){}
    setCargado(true);
  },[]);

  useEffect(()=>{
    if(!cargado)return;
    if(!enCola&&sel.size===0){try{localStorage.removeItem(ENVIO_MASIVO_LS_KEY);}catch(e){}return;}
    try{localStorage.setItem(ENVIO_MASIVO_LS_KEY,JSON.stringify({ids:[...sel],mensaje,enviados:[...enviados],idx,enCola}));}catch(e){}
  },[sel,mensaje,enviados,idx,enCola,cargado]);

  const conTelefono=useMemo(()=>clientes.filter(c=>c.telefono&&c.telefono.trim()),[clientes]);
  const filtrados=useMemo(()=>conTelefono.filter(c=>{
    const t=q.toLowerCase();
    const okQ=!t||c.nombre.toLowerCase().includes(t)||c.zona.toLowerCase().includes(t)||c.rubro.toLowerCase().includes(t);
    const okE=filtroEstado==="todos"||estadoC(c)===filtroEstado;
    const okZ=filtroZona==="todas"||c.zona===filtroZona;
    return okQ&&okE&&okZ;
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre)),[conTelefono,q,filtroEstado,filtroZona]);

  const seleccionados=useMemo(()=>clientes.filter(c=>sel.has(c.id)),[clientes,sel]);

  const toggle=id=>setSel(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleTodosVisibles=()=>{
    const idsVisibles=filtrados.map(c=>c.id);
    const todosMarcados=idsVisibles.length>0&&idsVisibles.every(id=>sel.has(id));
    setSel(prev=>{const n=new Set(prev);idsVisibles.forEach(id=>todosMarcados?n.delete(id):n.add(id));return n;});
  };
  const personalizar=nombre=>mensaje.replace(/\{nombre\}/gi,(nombre||"").split(" ")[0]);
  const iniciar=()=>{setIdx(0);setEnviados(new Set());setEnCola(true);};
  const cancelar=()=>{
    setEnCola(false);setSel(new Set());setEnviados(new Set());setIdx(0);setMensaje("");
    try{localStorage.removeItem(ENVIO_MASIVO_LS_KEY);}catch(e){}
  };

  if(enCola){
    const lista=seleccionados;
    const actual=lista[idx];
    if(!actual){
      return(
        <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto",textAlign:"center"}}>
          <div style={{fontSize:44,marginBottom:12}}>🎉</div>
          <div className="bebas" style={{fontSize:26,color:CR,marginBottom:6}}>¡Listo!</div>
          <div style={{fontSize:16,color:MU,marginBottom:24}}>Enviaste a {enviados.size} de {lista.length} clientes.</div>
          <Btn onClick={cancelar}>Volver a Difusión</Btn>
        </div>
      );
    }
    const yaEnviado=enviados.has(actual.id);
    const link=waLink(actual.telefono,personalizar(actual.nombre));
    return(
      <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span className="bebas" style={{fontSize:26,color:CR}}>Enviando...</span>
          <button onClick={cancelar} style={{background:"none",border:"none",color:MU,fontSize:14,fontWeight:700,cursor:"pointer"}}>Cancelar</button>
        </div>
        <div style={{fontSize:14,color:MU,fontWeight:700,marginBottom:16}}>{enviados.size} enviados · {lista.length-enviados.size} pendientes de {lista.length}</div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:20,marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,flexShrink:0}}>{iniciales(actual.nombre)}</div>
            <div>
              <div style={{fontSize:17,fontWeight:700,color:CR}}>{actual.nombre}</div>
              <div style={{fontSize:13,color:MU}}>{actual.rubro} · {actual.zona}</div>
            </div>
          </div>
          <div style={{fontSize:15,color:CR,whiteSpace:"pre-wrap",background:BG,borderRadius:10,padding:12,marginBottom:16,lineHeight:1.5}}>{personalizar(actual.nombre)}</div>
          {link?(
            <a href={link} target="_blank" rel="noreferrer" onClick={()=>setEnviados(prev=>new Set(prev).add(actual.id))} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,textDecoration:"none",padding:"13px 0",borderRadius:10,background:GR,color:"#fff",fontSize:16,fontWeight:700,marginBottom:10}}>{I.wa}Enviar a {actual.nombre.split(" ")[0]}</a>
          ):(
            <div style={{fontSize:14,color:RE,marginBottom:10}}>Teléfono inválido, no se puede abrir WhatsApp.</div>
          )}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setIdx(i=>Math.min(i+1,lista.length))} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:15,fontWeight:600,cursor:"pointer"}}>Omitir</button>
            <button onClick={()=>{setEnviados(prev=>new Set(prev).add(actual.id));setIdx(i=>Math.min(i+1,lista.length));}} style={{flex:1,padding:"10px 0",borderRadius:10,background:yaEnviado?G:BG,border:`1px solid ${yaEnviado?G:BO}`,color:yaEnviado?"#fff":CR,fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ {yaEnviado?"Enviado":"Marcar y siguiente"}</button>
          </div>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {lista.map((c,i)=>(

  const todosVisiblesMarcados=filtrados.length>0&&filtrados.every(c=>sel.has(c.id));
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>

        <span className="bebas" style={{fontSize:30,color:CR}}>Envío masivo</span>
        <div style={{fontSize:14,color:MU,marginTop:2}}>Seleccioná clientes y armá un mensaje. Después se abre WhatsApp de a uno para que confirmes cada envío.</div>
      </div>
      <div style={{position:"relative",marginBottom:12}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span>

      <div style={{display:"flex",gap:8,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"activo",l:"Activos"},{k:"atencion",l:"Atención"},{k:"inactivo",l:"Inactivos"},{k:"nuevo",l:"Sin compras"}].map(f=>(

      <div style={{marginBottom:12}}>
        <select value={filtroZona} onChange={e=>setFiltroZona(e.target.value)}>

      <button onClick={toggleTodosVisibles} style={{width:"100%",textAlign:"left",padding:"10px 14px",borderRadius:10,background:BG,border:`1px solid ${BO}`,color:CR,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10}}>
        {todosVisiblesMarcados?"☑️ Deseleccionar todos los visibles":"⬜ Seleccionar todos los visibles"} ({filtrados.length})
      </button>
      <div style={{maxHeight:340,overflowY:"auto",border:`1px solid ${BO}`,borderRadius:14,marginBottom:16}}>
        {filtrados.length===0?<p style={{color:MU,textAlign:"center",padding:"32px 0",fontSize:15}}>Sin clientes con teléfono para este filtro.</p>:filtrados.map(c=>(
          <label key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:`1px solid ${BO}`,cursor:"pointer"}}>

              <div style={{fontSize:15,fontWeight:600,color:CR}}>{c.nombre}</div>
              <div style={{fontSize:13,color:MU}}>{c.rubro} · {c.zona}</div>

      </div>
      {speeches&&speeches.length>0&&(
        <div style={{marginBottom:10}}>
          <Lbl t="Usar speech prearmado (opcional)"/>
          <select value={speechSel} onChange={e=>{const id=e.target.value;setSpeechSel(id);const sp=speeches.find(s=>s.id===id);if(sp)setMensaje(sp.texto);}}>

      {mensaje&&seleccionados[0]&&<div style={{fontSize:13,color:MU,marginBottom:16,fontStyle:"italic"}}>Vista previa: "{personalizar(seleccionados[0].nombre)}"</div>}

// ── ASISTENTE IA ──────────────────────────────────────────────────
const ASISTENTE_URL_LS_KEY="farol_asistente_url";
const ASISTENTE_CHAT_LS_KEY="farol_asistente_chat";
function contextoNegocio(clientes,pedidos,prods){
  const resumenClientes=clientes.slice(0,80).map(c=>{
    const ls=lastSale(c);
    const dias=ls?daysSince(ls.fecha):null;
    const deuda=(c.ventas||[]).filter(v=>!v.pagado).reduce((s,v)=>s+v.monto,0);
    return`${c.nombre} (${c.zona}, ${c.rubro}) — estado:${estadoC(c)}${dias!=null?`, últ. compra hace ${dias}d`:", sin compras"}${deuda>0?`, debe ${fmtARS(deuda)}`:""}`;
  }).join("\n");
  const pedidosPend=(pedidos||[]).filter(p=>p.estado!=="entregado").length;
  const catalogo=prods.map(p=>`${nombreProdEnvase(p)} — ${fmtARS(p.precio)}/L`).join("\n");
  return`Sos el asistente comercial de Distribuidora Nómades, una distribuidora de cerveza artesanal en Buenos Aires (marcas Grunge y Farol, "Premium, Popular, Porteña"). Ayudás a Nahu (quien te habla) con ventas, cobranzas, atención a clientes y comercios. Respondé breve, concreto, en español rioplatense, sin vueltas.\n\nCATÁLOGO:\n${catalogo||"(sin productos cargados)"}\n\nCLIENTES (${clientes.length} en total${clientes.length>80?", mostrando los primeros 80":""}):\n${resumenClientes||"(sin clientes cargados)"}\n\nPedidos pendientes de entrega: ${pedidosPend}.\nHoy es ${fmtDate(hoyISO())}.`;
}
const ANALISIS_PROMPT="Analizá todo lo que ves de mi negocio (clientes, deuda, pedidos pendientes y catálogo) y dame sugerencias concretas para vender más y mejorar. Organizalo en 4 puntos cortos: 1) a qué clientes debería contactar hoy y por qué, 2) oportunidades de venta que notes, 3) alertas de cobranza urgentes si las hay, 4) cualquier otra mejora que veas. Sé específico, usá nombres y números reales de los datos, nada genérico.";
function AsistenteIA({clientes,pedidos,prods}){
  const[url,setUrl]=useState(()=>{try{return localStorage.getItem(ASISTENTE_URL_LS_KEY)||"";}catch(e){return"";}});
  const[configurando,setConfigurando]=useState(false);
  const[urlTmp,setUrlTmp]=useState(url);
  const[mensajes,setMensajes]=useState(()=>{try{const raw=localStorage.getItem(ASISTENTE_CHAT_LS_KEY);return raw?JSON.parse(raw):[];}catch(e){return[];}});
  const[input,setInput]=useState("");
  const[cargando,setCargando]=useState(false);
  const[error,setError]=useState("");
  const finRef=React.useRef(null);
  const autoDisparado=React.useRef(false);

  useEffect(()=>{try{localStorage.setItem(ASISTENTE_CHAT_LS_KEY,JSON.stringify(mensajes.slice(-40)));}catch(e){}},[mensajes]);
  useEffect(()=>{finRef.current&&finRef.current.scrollIntoView({behavior:"smooth"});},[mensajes,cargando]);

  const guardarUrl=()=>{
    const limpia=urlTmp.trim();
    setUrl(limpia);
    try{localStorage.setItem(ASISTENTE_URL_LS_KEY,limpia);}catch(e){}
    setConfigurando(false);
  };

  const enviar=async(textoForzado,mostrarForzado)=>{
    const texto=(textoForzado||input).trim();
    if(!texto||cargando)return;
    if(!url){setConfigurando(true);return;}
    const mostrar=mostrarForzado||texto;
    setError("");
    const nuevos=[...mensajes,{rol:"user",texto,mostrar}];
    setMensajes(nuevos);
    setInput("");
    setCargando(true);
    try{
      const contexto=contextoNegocio(clientes,pedidos,prods);
      const historial=nuevos.slice(-8).map(m=>({rol:m.rol,texto:m.texto}));
      const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mensaje:texto,historial,contexto})});
      let data=null;
      try{data=await resp.json();}catch(e){}
      if(!resp.ok){
        throw new Error(`HTTP ${resp.status}${data&&data.error?": "+data.error:""}`);
      }
      const respuesta=(data&&(data.respuesta||data.reply||data.texto))||"No obtuve respuesta.";
      setMensajes(prev=>[...prev,{rol:"assistant",texto:respuesta}]);
    }catch(e){
      setError("No se pudo conectar con el asistente. Detalle: "+(e&&e.message?e.message:"error desconocido")+". Revisá la URL en Configurar o probá de nuevo.");
    }finally{
      setCargando(false);
    }
  };

  // Al entrar sin conversación previa, el asistente analiza solo y sugiere mejoras
  useEffect(()=>{
    if(autoDisparado.current)return;
    if(url&&mensajes.length===0){
      autoDisparado.current=true;
      enviar(ANALISIS_PROMPT,"📊 Analizá mi negocio y dame sugerencias");
    }
  },[url]);

  const sugerencias=["¿A quién le ofrezco algo hoy?","Ayudame a responder una objeción de precio","Resumen de deuda pendiente","Ideas para reactivar clientes inactivos"];

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto",display:"flex",flexDirection:"column",minHeight:"calc(100vh - 56px)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>✨ Asistente IA</span>
        <div style={{display:"flex",gap:6}}>
          {mensajes.length>0&&<button onClick={()=>{if(confirm("¿Borrar la conversación?")){setMensajes([]);autoDisparado.current=false;try{localStorage.removeItem(ASISTENTE_CHAT_LS_KEY);}catch(e){}}}} style={{fontSize:13,color:MU,background:"none",border:`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>Borrar chat</button>}
          <button onClick={()=>{setUrlTmp(url);setConfigurando(true);}} style={{fontSize:13,color:MU,background:"none",border:`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>⚙️ Configurar</button>
        </div>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:14}}>Consultas y respuestas comerciales con contexto de tus clientes, pedidos y catálogo.</p>

      {configurando&&(
        <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:14,padding:14,marginBottom:14}}>
          <Lbl t="URL del asistente (Cloudflare Worker)"/>
          <input value={urlTmp} onChange={e=>setUrlTmp(e.target.value)} placeholder="https://asistente-farol.tuusuario.workers.dev" style={{marginBottom:10}}/>
          <div style={{fontSize:12,color:MU,marginBottom:10,lineHeight:1.5}}>Se pega una sola vez, después de desplegar el asistente (te paso el código y los pasos en el chat). Se guarda solo en este celular.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn variant="ghost" onClick={()=>setConfigurando(false)}>Cancelar</Btn>
            <Btn variant="green" onClick={guardarUrl} disabled={!urlTmp.trim()}>Guardar</Btn>
          </div>
        </div>
      )}

      {!url&&!configurando&&(
        <div style={{background:AM+"14",border:`1px solid ${AM}33`,borderRadius:14,padding:14,marginBottom:14,fontSize:14,color:CR,lineHeight:1.5}}>
          💡 Todavía no está conectado. Tocá "⚙️ Configurar" y pegá la URL del asistente una vez que lo despliegues (el código y los pasos te los paso aparte). Apenas lo conectes, te va a analizar el negocio solo.
        </div>
      )}

      {url&&mensajes.length>0&&(
        <button onClick={()=>enviar(ANALISIS_PROMPT,"📊 Analizá mi negocio y dame sugerencias")} disabled={cargando} style={{width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:10,background:GLT,border:`1px solid ${G}44`,borderRadius:12,padding:"10px 14px",marginBottom:14,cursor:"pointer",opacity:cargando?0.6:1}}>
          <span style={{fontSize:18}}>📊</span>
          <span style={{fontSize:14,fontWeight:700,color:G}}>Analizar mi negocio de nuevo</span>
        </button>
      )}

      <div style={{flex:1,display:"flex",flexDirection:"column",gap:10,marginBottom:14,minHeight:200}}>
        {mensajes.length===0?(
          <div style={{textAlign:"center",padding:"30px 16px",color:MU}}>
            <div style={{fontSize:36,marginBottom:10}}>🍺🤖</div>
            <div style={{fontSize:15,marginBottom:16}}>{url?"Te estoy analizando el negocio...":"Preguntame lo que necesites sobre ventas, clientes o cobranzas."}</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,alignItems:"stretch"}}>
              {sugerencias.map(s=>(
                <button key={s} onClick={()=>enviar(s)} style={{textAlign:"left",fontSize:14,color:CR,background:CA,border:`1px solid ${BO}`,borderRadius:12,padding:"10px 14px",cursor:"pointer"}}>{s}</button>
              ))}
            </div>
          </div>
        ):mensajes.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.rol==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:14,fontSize:15,lineHeight:1.5,whiteSpace:"pre-wrap",background:m.rol==="user"?G:CA,color:m.rol==="user"?"#fff":CR,border:m.rol==="user"?"none":`1px solid ${BO}`}}>{m.rol==="user"?(m.mostrar||m.texto):m.texto}</div>
          </div>
        ))}
        {cargando&&(
          <div style={{display:"flex",justifyContent:"flex-start"}}>
            <div style={{padding:"10px 14px",borderRadius:14,background:CA,border:`1px solid ${BO}`,color:MU,fontSize:15}}>Pensando...</div>
          </div>
        )}
        {error&&<div style={{fontSize:13,color:RE,textAlign:"center"}}>{error}</div>}
        <div ref={finRef}/>
      </div>

      <div style={{position:"sticky",bottom:74,display:"flex",gap:8,background:BG,paddingTop:6}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar();}}} placeholder="Escribí tu consulta..." disabled={cargando} style={{flex:1}}/>
        <button onClick={()=>enviar()} disabled={cargando||!input.trim()} style={{width:46,height:46,borderRadius:12,background:G,border:"none",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:cargando||!input.trim()?0.5:1}}>
          <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  );
}

function FormGasto({initial,onSave,onCancel,onDelete}){
  const[f,setF]=useState({
    fecha:initial.fecha||hoyISO(),
    tipo:initial.tipo||"negocio",
    categoria:initial.categoria||"combustible",
    monto:initial.monto?String(initial.monto):"",
    descripcion:initial.descripcion||"",
    medioPago:initial.medioPago||"",
  });
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const categoriasDelTipo=GASTO_CATEGORIAS.filter(c=>c.tipo===f.tipo);
  const cambiarTipo=tipo=>setF(p=>({...p,tipo,categoria:GASTO_CATEGORIAS.find(c=>c.tipo===tipo).key}));
  const guardar=()=>{
    if(!f.monto||Number(f.monto)<=0)return;
    onSave({...f,monto:Number(f.monto)});
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:8}}>
        {[{k:"negocio",l:"🏢 Negocio"},{k:"personal",l:"🏠 Personal"}].map(t=>(
          <button key={t.k} onClick={()=>cambiarTipo(t.k)} style={{flex:1,padding:"10px 0",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",border:`1px solid ${f.tipo===t.k?G:BO}`,background:f.tipo===t.k?G:"transparent",color:f.tipo===t.k?"#fff":MU}}>{t.l}</button>
        ))}
      </div>
      <div><Lbl t="Categoría"/><select value={f.categoria} onChange={s("categoria")}>{categoriasDelTipo.map(c=><option key={c.key} value={c.key}>{c.icon} {c.label}</option>)}</select></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
        <div><Lbl t="Fecha"/><input type="date" value={f.fecha} onChange={s("fecha")}/></div>
        <div><Lbl t="Monto ARS"/><input type="number" inputMode="numeric" value={f.monto} onChange={s("monto")} placeholder="0" autoFocus/></div>
      </div>
      <div><Lbl t="Descripción (opcional)"/><input value={f.descripcion} onChange={s("descripcion")} placeholder="Ej: Carga de nafta camioneta"/></div>
      <div>
        <Lbl t="Medio de pago (opcional)"/>
        <select value={f.medioPago} onChange={s("medioPago")}>
          <option value="">Sin especificar</option>
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia</option>
          <option value="tarjeta">Tarjeta</option>
        </select>
      </div>
      <div style={{display:"flex",gap:8,paddingTop:4,alignItems:"center"}}>
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
        {onDelete&&<button onClick={onDelete} title="Eliminar gasto" style={{width:42,height:42,borderRadius:10,background:RE+"14",border:`1px solid ${RE}33`,color:RE,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.trash}</button>}
        <div style={{flex:1}}/>
        <Btn variant="green" onClick={guardar} disabled={!f.monto||Number(f.monto)<=0}>Guardar</Btn>
      </div>
    </div>
  );
}
function Gastos({gastos,setGastos}){
  const[modalOpen,setModalOpen]=useState(false);
  const[editing,setEditing]=useState(null);
  const[filtroTipo,setFiltroTipo]=useState("todos");
  const[filtroMes,setFiltroMes]=useState(hoyISO().slice(0,7));

  const nuevoGasto=()=>{setEditing({});setModalOpen(true);};
  const editarGasto=g=>{setEditing(g);setModalOpen(true);};
  const cerrar=()=>{setModalOpen(false);setEditing(null);};

  const guardar=f=>{
    if(editing&&editing.id){
      setGastos(prev=>prev.map(g=>g.id===editing.id?{...g,...f}:g));
    }else{
      setGastos(prev=>[{id:uid(),...f,creadoEn:new Date().toISOString()},...(prev||[])]);
    }
    cerrar();
  };
  const eliminar=()=>{
    if(!editing||!editing.id)return;
    if(!confirm("¿Eliminar este gasto? No se puede deshacer."))return;
    setGastos(prev=>prev.filter(g=>g.id!==editing.id));
    cerrar();
  };

  const delMes=useMemo(()=>(gastos||[]).filter(g=>(g.fecha||"").slice(0,7)===filtroMes),[gastos,filtroMes]);
  const totalNegocioMes=delMes.filter(g=>g.tipo==="negocio").reduce((s,g)=>s+g.monto,0);
  const totalPersonalMes=delMes.filter(g=>g.tipo==="personal").reduce((s,g)=>s+g.monto,0);

  const filtrados=useMemo(()=>[...delMes]
    .filter(g=>filtroTipo==="todos"||g.tipo===filtroTipo)
    .sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)||new Date(b.creadoEn||0)-new Date(a.creadoEn||0)),[delMes,filtroTipo]);

  const porCategoria=useMemo(()=>{
    const map={};
    filtrados.forEach(g=>{map[g.categoria]=(map[g.categoria]||0)+g.monto;});
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[filtrados]);

  const mesLabel=(()=>{const[y,m]=filtroMes.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});})();

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Gastos</span>
        <Btn variant="green" small onClick={nuevoGasto}>{I.plus}Nuevo</Btn>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:14}}>Gastos del negocio y personales, para ver el margen real.</p>

      <input type="month" value={filtroMes} onChange={e=>setFiltroMes(e.target.value)} style={{marginBottom:12,textTransform:"capitalize"}}/>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8,marginBottom:14}}>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:14,padding:"12px 14px"}}>
          <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:2}}>🏢 Negocio</div>
          <div className="bebas" style={{fontSize:20,color:CR}}>{fmtARS(totalNegocioMes)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:14,padding:"12px 14px"}}>
          <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:2}}>🏠 Personal</div>
          <div className="bebas" style={{fontSize:20,color:CR}}>{fmtARS(totalPersonalMes)}</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
        {[{k:"todos",l:"Todos"},{k:"negocio",l:"🏢 Negocio"},{k:"personal",l:"🏠 Personal"}].map(t=>(
          <button key={t.k} onClick={()=>setFiltroTipo(t.k)} style={{whiteSpace:"nowrap",padding:"6px 14px",borderRadius:20,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtroTipo===t.k?G:BO}`,background:filtroTipo===t.k?G:"transparent",color:filtroTipo===t.k?"#fff":MU}}>{t.l}</button>
        ))}
      </div>

      {porCategoria.length>0&&(
        <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:14,padding:14,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Por categoría · {mesLabel}</div>
          {porCategoria.map(([key,monto])=>{
            const cat=catGasto(key);
            const totalFiltrado=filtrados.reduce((s,g)=>s+g.monto,0)||1;
            const pct=Math.round((monto/totalFiltrado)*100);
            return(
              <div key={key} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:CR,marginBottom:3}}>
                  <span>{cat.icon} {cat.label}</span>
                  <span style={{fontWeight:700}}>{fmtARS(monto)}</span>
                </div>
                <div style={{height:6,borderRadius:3,background:BO,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:cat.tipo==="negocio"?G:AM,borderRadius:3}}/>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {filtrados.length===0?(
        <p style={{color:MU,fontSize:16,textAlign:"center",padding:"30px 16px"}}>Sin gastos cargados para {mesLabel}.</p>
      ):filtrados.map(g=>{
        const cat=catGasto(g.categoria);
        return(
          <button key={g.id} onClick={()=>editarGasto(g)} style={{width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${BO}`,borderRadius:14,padding:"12px 14px",marginBottom:8,cursor:"pointer"}}>
            <div style={{width:38,height:38,borderRadius:10,background:g.tipo==="negocio"?GLT:AM+"1a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{cat.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.descripcion||cat.label}</div>
              <div style={{fontSize:12,color:MU,marginTop:1}}>{cat.label} · {fmtDate(g.fecha)}</div>
            </div>
            <div style={{fontSize:15,fontWeight:700,color:CR,flexShrink:0}}>{fmtARS(g.monto)}</div>
          </button>
        );
      })}

      <Modal open={modalOpen} onClose={cerrar} title={editing&&editing.id?"Editar gasto":"Nuevo gasto"}>
        {editing&&<FormGasto initial={editing} onSave={guardar} onCancel={cerrar} onDelete={editing.id?eliminar:null}/>}
      </Modal>
    </div>
  );
}

// ── COMERCIOS ─────────────────────────────────────────────────────

    setCompartiendoId(prospectoId);

  const[spTarget,setSpTarget]=useState(null);
  const[expandido,setExpandido]=useState(null);
 
  const resultados=useMemo(()=>{

    return prospectos.map(p=>{
      let qScore=0;
      if(terms.length){terms.forEach(term=>{if(p.nombre.toLowerCase().includes(term))qScore+=10;if(p.rubro.toLowerCase().includes(term))qScore+=8;if((p.zona||"").toLowerCase().includes(term))qScore+=6;if((p.direccion||"").toLowerCase().includes(term))qScore+=4;if((p.notas||"").toLowerCase().includes(term))qScore+=2;});}else qScore=1;
      const pass=(terms.length===0||qScore>0)&&(!zona||p.zona===zona)&&(!rubro||p.rubro===rubro)&&(!estadoF||p.estado===estadoF)&&(!tieneTel||!!p.telefono);
      return{...p,_qScore:qScore,_potScore:calcScore(p),_pass:pass};
    }).filter(p=>p._pass).sort((a,b)=>{
      if(ordenar==="score")return b._potScore-a._potScore;
      if(ordenar==="relevancia"&&t)return b._qScore-a._qScore;
      if(ordenar==="az")return a.nombre.localeCompare(b.nombre);
      if(ordenar==="estado")return ESTADOS_P.indexOf(a.estado)-ESTADOS_P.indexOf(b.estado);
      return b._potScore-a._potScore;
    });
  },[prospectos,q,zona,rubro,estadoF,tieneTel,ordenar]);
 
  const stats=useMemo(()=>({total:resultados.length,conTel:resultados.filter(p=>p.telefono).length,porC:resultados.filter(p=>p.estado==="Por contactar").length,enN:resultados.filter(p=>p.estado==="En negociación").length,avgScore:resultados.length?Math.round(resultados.reduce((s,p)=>s+p._potScore,0)/resultados.length):0}),[resultados]);
  const hayFiltros=q||zona||rubro||estadoF||tieneTel;

        {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:MU,padding:2}}>{I.x}</button>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8,marginBottom:8}}>
        <select value={zona} onChange={e=>setZona(e.target.value)}><option value="">Todas las zonas</option>{ZONAS.map(z=><option key={z} value={z}>{z}</option>)}</select>
        <select value={rubro} onChange={e=>setRubro(e.target.value)}><option value="">Todos los rubros</option>{RUBROS.map(r=><option key={r} value={r}>{r}</option>)}</select>

        <select value={ordenar} onChange={e=>setOrdenar(e.target.value)}><option value="score">Ordenar: potencial</option><option value="relevancia">Ordenar: relevancia</option><option value="az">Ordenar: A → Z</option><option value="estado">Ordenar: estado</option></select>

      <div style={{display:"grid",gridTemplateColumns:"repeat(5,minmax(0,1fr))",gap:6,marginBottom:16}}>

                  <div style={{flex:1,minWidth:0}}>

                      <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}><Pill color={PEST[p.estado]}>{p.estado}</Pill><span style={{color:MU,display:"flex",transform:isOpen?"rotate(90deg)":"none",transition:"transform 0.2s"}}>{I.chev}</span></div>
                    </div>
                    <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",whiteSpace:"nowrap"}}>Potencial</span><div style={{flex:1}}><ScoreBar score={p._potScore}/></div><span style={{fontSize:14,fontWeight:700,color:sl.c,whiteSpace:"nowrap"}}>{sl.l}</span></div>
                  </div>
                </div>
              </button>
              {isOpen&&(
                <div style={{borderTop:`1px solid ${BO}`,padding:"14px 16px"}}>
                  <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px",marginBottom:12}}>
                    <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10,display:"flex",justifyContent:"space-between"}}><span>Desglose de score</span><span style={{color:sl.c}}>{p._potScore}/100</span></div>
                    {[{l:"Rubro",v:RUBRO_SCORE[p.rubro]||6,max:22,hint:p.rubro},{l:"Zona",v:ZONA_SCORE[p.zona]||10,max:18,hint:p.zona},{l:"Estado",v:ESTADO_SCORE[p.estado]||0,max:20,hint:p.estado},{l:"Teléfono",v:p.telefono?15:0,max:15,hint:p.telefono?"Cargado":"Sin cargar"},{l:"Notas",v:p.notas&&p.notas.length>30?5:p.notas?2:0,max:5,hint:p.notas?"Completas":"Sin notas"}].map(row=>(
                      <div key={row.l} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                        <span style={{fontSize:14,color:MU,width:64,flexShrink:0}}>{row.l}</span>
                        <div style={{flex:1,height:3,background:BO,borderRadius:2}}><div style={{width:`${(row.v/row.max)*100}%`,height:"100%",background:G,borderRadius:2}}/></div>
                        <span style={{fontSize:14,fontWeight:600,color:CR,width:28,textAlign:"right",flexShrink:0}}>{row.v}/{row.max}</span>
                        <span style={{fontSize:13,color:MU,width:80,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.hint}</span>

                    <button onClick={()=>compartirCatalogoDesdeComercios(p.id)} disabled={compartiendoId===p.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:compartiendoId===p.id?"not-allowed":"pointer",color:G,background:"none",border:`1px solid ${G}44`,opacity:compartiendoId===p.id?0.6:1}}>{I.share}{compartiendoId===p.id?"...":"Catálogo"}</button>
                    {p.telefono&&<>
                      <a href={`https://wa.me/${p.telefono}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,background:"#25D36615",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none"}}>{I.wa}WA directo</a>
                      <button onClick={()=>setSpTarget(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",background:G+"20",color:G,border:`1px solid ${G}44`}}>{I.msg}Speech → WA</button>
                    </>}
                    <button onClick={()=>onConvertir(p)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"7px 12px",borderRadius:6,cursor:"pointer",color:GR,background:"none",border:`1px solid ${GR}44`,marginLeft:"auto"}}>{I.plus}→ Cliente</button>
                    <button onClick={()=>{if(window.confirm(`¿Eliminar "${p.nombre}"? Esta acción no se puede deshacer.`)){setProspectos(prev=>prev.filter(x=>x.id!==p.id));setExpandido(null);}}} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,padding:"7px 10px",borderRadius:6,cursor:"pointer",color:RE,background:"none",border:`1px solid ${RE}44`}}>{I.trash}</button>
                  </div>
                </div>

            </div>
          );
        })
      }
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo comercio">
        <FormProspecto onCancel={()=>setShowNew(false)} onSave={f=>{setProspectos(p=>[...p,{id:uid(),...f}]);setShowNew(false);}}/>
      </Modal>
      <Modal open={!!editing} onClose={()=>setEditing(null)} title="Editar comercio">
        {editing&&<FormProspecto initial={editing} onCancel={()=>setEditing(null)} onSave={f=>{setProspectos(p=>p.map(x=>x.id===editing.id?{...x,...f}:x));setEditing(null);}}/>}
      </Modal>
      <SpeechPicker open={!!spTarget} onClose={()=>setSpTarget(null)} speeches={speeches} telefono={spTarget?.telefono} nombre={spTarget?.nombre||""}/>
    </div>
  );
}
 
// ── PEDIDOS ───────────────────────────────────────────────────────
function Pedidos({pedidos,setPedidos,clientes,setClientes,prods,setProds,promo51}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  // Producto/cantidad por defecto al cargar un pedido: Grunge Blonde en barril, 50L — se puede cambiar como siempre.
  const productoDefaultId=useMemo(()=>{
    const p=(prods||[]).find(x=>(x.marca||"").trim().toLowerCase()==="grunge"&&(x.nombre||"").toLowerCase().includes("blonde")&&(x.envase||"")==="Barril")
      ||(prods||[]).find(x=>(x.marca||"").trim().toLowerCase()==="grunge"&&(x.nombre||"").toLowerCase().includes("blonde"));
    return p?p.id:((prods&&prods[0])?prods[0].id:"");
  },[prods]);
  const lineaVacia=()=>{
    const prodDefault=(prods||[]).find(x=>x.id===productoDefaultId);
    return{id:uid(),productoId:productoDefaultId,cantidad:cantidadDefaultParaProd(prodDefault),monto:"",descuentoPct:"",esBono:false};
  };
  const[showNew,setShowNew]=useState(false);
  const[editandoId,setEditandoId]=useState(null);
  // Cabecera del pedido
  const[clienteId,setClienteId]=useState("");
  const[fechaEntrega,setFechaEntrega]=useState(hoyISO());
  const[horaEntrega,setHoraEntrega]=useState("10:00");
  const[pagado,setPagado]=useState(false);
  const[notas,setNotas]=useState("");
  // Líneas del pedido (multi-producto)
  const[lineas,setLineas]=useState([lineaVacia()]);
  const[promoAplica,setPromoAplica]=useState(false);
  const[descuentoPct,setDescuentoPct]=useState("");
  const[incluyeIVA,setIncluyeIVA]=useState(false);
  const[generandoRemitoId,setGenerandoRemitoId]=useState(null);
 
  const resetForm=()=>{
    setClienteId("");setFechaEntrega(hoyISO());setHoraEntrega("10:00");setPagado(false);setNotas("");
    setLineas([lineaVacia()]);
    setDescuentoPct("");setIncluyeIVA(false);setPromoAplica(false);setEditandoId(null);
  };

  const abrirEdicion=p=>{
    setEditandoId(p.id);
    setClienteId(p.clienteId||"");
    setFechaEntrega(p.fechaEntrega||hoyISO());
    setHoraEntrega(p.horaEntrega||"10:00");
    setPagado(!!p.pagado);
    setNotas(p.notas||"");
    setLineas((p.lineas&&p.lineas.length>0?p.lineas:[lineaVacia()]).map(l=>({id:l.id||uid(),productoId:l.productoId,cantidad:String(l.cantidad||""),monto:String(l.monto||""),descuentoPct:l.descuentoPct?String(l.descuentoPct):"",esBono:!!l.esBono})));
    setDescuentoPct(p.descuentoPct?String(p.descuentoPct):"");
    setIncluyeIVA(!!p.incluyeIVA);
    setPromoAplica(!!p.promoAplica);
    setShowNew(true);
  };
 
  const agregarLinea=()=>setLineas(prev=>[...prev,lineaVacia()]);
  const agregarBonoPromo=()=>{
    if(!promo51||!promo51.productoBonoId||!promoProgresoSel||promoProgresoSel.bonosPendientes<=0)return;
    const cant=promo51.cantidadBono*promoProgresoSel.bonosPendientes;
    setLineas(prev=>{
      // si la primera línea está vacía y sin usar, la reemplaza; si no, agrega una nueva
      const base=prev.length===1&&!prev[0].cantidad&&!prev[0].monto&&!prev[0].esBono?prev.slice(0,-1):prev;
      return[...base,{id:uid(),productoId:promo51.productoBonoId,cantidad:String(cant),monto:"0",descuentoPct:"",esBono:true}];
    });
  };
  const quitarLinea=id=>setLineas(prev=>prev.filter(l=>l.id!==id));
  const updateLinea=(id,campo,valor)=>setLineas(prev=>prev.map(l=>{
    if(l.id!==id)return l;
    const updated={...l,[campo]:valor};
    // Al cambiar el producto, la cantidad vuelve al default de ese envase (50 barril/PET, 6 lata, 20 gin, etc.) — se puede reeditar después como siempre.
    if(campo==="productoId"){
      const nuevoProd=prods.find(p=>p.id===valor);
      updated.cantidad=cantidadDefaultParaProd(nuevoProd);
    }
    // Auto-calcular monto si cambia cantidad, producto o el % de descuento de la línea
    if(campo==="cantidad"||campo==="productoId"||campo==="descuentoPct"){
      const prod=prods.find(p=>p.id===(campo==="productoId"?valor:l.productoId));
      const cant=Number(campo==="productoId"?updated.cantidad:(campo==="cantidad"?valor:l.cantidad));
      const descL=Number(campo==="descuentoPct"?valor:l.descuentoPct)||0;
      if(prod&&cant>0){
        const base=montoTotal(prod,cant);
        updated.monto=String(Math.round(base*(1-Math.min(descL,100)/100)));
      }
    }
    return updated;
  }));
 
  const totalPedido=lineas.reduce((s,l)=>s+Number(l.monto||0),0);
  const totalLitros=lineas.reduce((s,l)=>s+litrosDeItem(l.cantidad,envaseMap[l.productoId]),0);
  const lineasValidas=lineas.filter(l=>l.cantidad&&Number(l.cantidad)>0);
  const clienteSel=clientes.find(c=>c.id===clienteId);
  const promoProgresoSel=clienteSel?progresoPromo51(clienteSel,promo51,prods,pedidos):null;
  const comisionPctSel=clienteSel&&clienteSel.comisionPctDefault?Number(clienteSel.comisionPctDefault):0;
  const descPctNum=Number(descuentoPct)||0;
  const montoDescuento=Math.round(totalPedido*descPctNum/100);
  const subtotalConDescuento=totalPedido-montoDescuento;
  const montoIVA=incluyeIVA?Math.round(subtotalConDescuento*0.21):0;
  const totalFinal=subtotalConDescuento+montoIVA;
  const gananciaEstimadaPedido=comisionPctSel?Math.round(totalFinal*comisionPctSel/100):0;
 
  const confirmarPedido=()=>{
    if(!clienteId||lineasValidas.length===0)return;
    // Factor de ajuste (descuento + IVA) que se reparte proporcionalmente entre las líneas al confirmar la entrega
    const factor=totalPedido>0?totalFinal/totalPedido:1;
    const lineasFinal=lineasValidas.map(l=>({...l,cantidad:Number(l.cantidad),monto:Number(l.monto||0),descuentoPct:Number(l.descuentoPct)||0}));
    if(editandoId){
      setPedidos(prev=>prev.map(p=>p.id!==editandoId?p:{
        ...p,clienteId,fechaEntrega,horaEntrega,pagado,notas,
        lineas:lineasFinal,
        descuentoPct:descPctNum,incluyeIVA,factorAjuste:factor,
        montoTotal:totalFinal,promoAplica,
      }));
    }else{
      const nuevoPedido={
        id:uid(),clienteId,fechaEntrega,horaEntrega,pagado,notas,
        lineas:lineasFinal,
        descuentoPct:descPctNum,incluyeIVA,factorAjuste:factor,
        montoTotal:totalFinal,promoAplica,
        estado:"pendiente",creadoEn:new Date().toISOString()
      };
      setPedidos(p=>[nuevoPedido,...p]);
    }
    setShowNew(false);
    resetForm();
  };
 
  const marcarEntregado=(pedidoId)=>{
    const ped=pedidos.find(p=>p.id===pedidoId);
    if(!ped)return;
    const factor=ped.factorAjuste||1;
    // Registrar una venta por cada línea del pedido, aplicando proporcionalmente el descuento/IVA del pedido
    setClientes(prev=>prev.map(c=>{
      if(c.id!==ped.clienteId)return c;
      const nuevasVentas=(ped.lineas||[]).map(l=>{
        const prod=prods.find(x=>x.id===l.productoId);
        return{
          id:uid(),fecha:ped.fechaEntrega,producto:l.productoId,
          cantidad:l.cantidad,monto:Math.round(l.monto*factor),pagado:ped.pagado,
          promoAcumulable:!!(ped.promoAplica&&prodCuentaParaPromo(prod,promo51)),esBono:!!l.esBono,
          ...desgloseAlEntregar(prod,l,ped),
        };
      });
      return{...c,ventas:[...c.ventas,...nuevasVentas]};
    }));
    setPedidos(prev=>prev.map(p=>p.id===pedidoId?{...p,estado:"entregado"}:p));
  };
 
  const pendientes=pedidos.filter(p=>p.estado==="pendiente").sort((a,b)=>a.fechaEntrega.localeCompare(b.fechaEntrega));
  const entregados=pedidos.filter(p=>p.estado==="entregado").sort((a,b)=>b.fechaEntrega.localeCompare(a.fechaEntrega)).slice(0,10);

  const[seleccionRuta,setSeleccionRuta]=useState(()=>new Set());
  const toggleRuta=id=>setSeleccionRuta(prev=>{const next=new Set(prev);next.has(id)?next.delete(id):next.add(id);return next;});
  const abrirRuta=()=>{
    const seleccionados=pendientes.filter(p=>seleccionRuta.has(p.id)).sort((a,b)=>a.horaEntrega.localeCompare(b.horaEntrega));
    const paradas=seleccionados.map(p=>{
      const cliente=clientes.find(c=>c.id===p.clienteId);
      return{pedido:p,cliente,direccion:cliente&&cliente.direccion?cliente.direccion.trim():""};
    });
    const conDireccion=paradas.filter(x=>x.direccion);
    const sinDireccion=paradas.filter(x=>!x.direccion);
    if(conDireccion.length===0){
      alert("Ninguno de los clientes seleccionados tiene dirección cargada. Agregá la dirección en la ficha del cliente para poder rutear.");
      return;
    }
    if(sinDireccion.length>0){
      const nombres=sinDireccion.map(x=>x.cliente?x.cliente.nombre:"Cliente eliminado").join(", ");
      alert(`Estos clientes no tienen dirección cargada y quedan afuera de la ruta:\n\n${nombres}`);
    }
    const direcciones=conDireccion.map(x=>encodeURIComponent(x.direccion));
    const destino=direcciones[direcciones.length-1];
    const waypoints=direcciones.slice(0,-1).join("|");
    let url=`https://www.google.com/maps/dir/?api=1&destination=${destino}&travelmode=driving`;
    if(waypoints)url+=`&waypoints=${waypoints}`;
    window.open(url,"_blank");
  };
 
  // Resumen de producción: suma cuánto queda por entregar de cada producto entre todos los pedidos pendientes.
  // Se recalcula solo — al marcar un pedido como entregado, ese pedido deja de estar "pendiente" y sus litros se descuentan automáticamente.
  const resumenProductos=useMemo(()=>{
    const map={};
    pendientes.forEach(p=>(p.lineas||[]).forEach(l=>{
      map[l.productoId]=(map[l.productoId]||0)+Number(l.cantidad||0);
    }));
    return Object.entries(map)
      .map(([productoId,cantidad])=>({productoId,cantidad,prod:prods.find(x=>x.id===productoId)}))
      .filter(x=>x.cantidad>0)
      .sort((a,b)=>b.cantidad-a.cantidad);
  },[pendientes,prods]);

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Pedidos</span>
        <Btn onClick={()=>{resetForm();setShowNew(true);}} small>{I.plus}Nuevo</Btn>
      </div>

      {resumenProductos.length>0&&(
        <div style={{background:CA,border:`1px solid ${G}33`,borderRadius:18,padding:16,marginBottom:20}}>
          <div style={{fontSize:12,fontWeight:700,color:G,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>🍺 Para preparar · entregas pendientes</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {resumenProductos.map(({productoId,cantidad,prod})=>(
              <div key={productoId} style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:15,color:CR,fontWeight:500}}>{prod?nombreProdEnvase(prod):productoId}</span>
                <span className="bebas" style={{fontSize:20,color:G}}>{cantidad}{prod&&prod.envase==="Lata"?" u.":"L"}</span>
              </div>
            ))}
          </div>
        </div>
      )}
 
      {pendientes.length===0
        ?<div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:24,textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:16,color:MU,marginBottom:8}}>Sin entregas pendientes</div>
          <Btn onClick={()=>{resetForm();setShowNew(true);}}>{I.plus}Cargar primer pedido</Btn>
        </div>
        :<div style={{marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}}>
            <div style={{fontSize:14,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em"}}>Pendientes de entrega ({pendientes.length})</div>
            {seleccionRuta.size>0&&(
              <button onClick={abrirRuta} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:20,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer"}}>{I.map}Rutear ({seleccionRuta.size})</button>
            )}
          </div>
          {pendientes.map(p=>{
            const cliente=clientes.find(c=>c.id===p.clienteId);
            const nombreCliente=cliente?cliente.nombre:"Cliente eliminado";
            const esHoy=p.fechaEntrega===hoyISO();
            const lineas=p.lineas||[];
            const enRuta=seleccionRuta.has(p.id);
            return(
              <div key={p.id} style={{background:CA,border:`1px solid ${enRuta?G:esHoy?G+"55":BO}`,borderRadius:18,padding:14,marginBottom:10,boxShadow:esHoy?`0 2px 8px ${G}22`:"0 1px 3px rgba(0,0,0,0.04)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                    <button onClick={()=>toggleRuta(p.id)} title="Incluir en ruta de reparto" style={{width:22,height:22,borderRadius:6,border:`2px solid ${enRuta?G:BO}`,background:enRuta?G:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer",padding:0}}>
                      {enRuta&&<span style={{color:"#fff",display:"flex"}}>{React.cloneElement(I.check,{width:12,height:12})}</span>}
                    </button>
                    <div style={{width:40,height:40,borderRadius:"50%",background:G+"1a",color:G,border:`1px solid ${G}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,flexShrink:0}}>{iniciales(nombreCliente)}</div>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:17,fontWeight:700,color:CR,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nombreCliente}</div>
                      <div style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:4,padding:"2px 8px",borderRadius:20,background:esHoy?G+"1a":BG,border:`1px solid ${esHoy?G+"44":BO}`}}>
                        <span style={{fontSize:13,fontWeight:esHoy?700:500,color:esHoy?G:MU}}>{esHoy?"⏰ HOY":fmtDate(p.fechaEntrega)}{" · "+p.horaEntrega+"hs"}</span>
                      </div>
                      {p.promoAplica&&<div style={{display:"inline-block",marginTop:4,marginLeft:6,padding:"2px 8px",borderRadius:20,background:AM+"1a",border:`1px solid ${AM}44`,fontSize:12,fontWeight:700,color:AM}}>🎁 Promo</div>}
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div className="bebas" style={{fontSize:21,color:CR}}>{fmtARS(p.montoTotal||0)}</div>
                    {(p.descuentoPct>0||p.incluyeIVA)&&<div style={{fontSize:11,color:MU,marginTop:1}}>{p.descuentoPct>0?`-${p.descuentoPct}% desc.`:""}{p.descuentoPct>0&&p.incluyeIVA?" · ":""}{p.incluyeIVA?"+21% IVA":""}</div>}
                    <div style={{display:"inline-block",marginTop:3,padding:"2px 8px",borderRadius:20,fontSize:12,fontWeight:700,background:p.pagado?GR+"1a":AM+"1a",color:p.pagado?GR:AM}}>{p.pagado?"Pagado":"Cta. corriente"}</div>
                  </div>
                </div>
                {/* Líneas del pedido */}
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"8px 12px",marginBottom:10}}>
                  {lineas.map((l,idx)=>{
                    const prod=prods.find(x=>x.id===l.productoId);
                    return(
                      <div key={l.id||idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:idx<lineas.length-1?6:0,marginBottom:idx<lineas.length-1?6:0,borderBottom:idx<lineas.length-1?`1px solid ${BO}`:"none"}}>
                        <span style={{fontSize:15,color:CR}}>{prod?nombreProdEnvase(prod):l.productoId}{l.descuentoPct>0&&<span style={{fontSize:12,color:RE,marginLeft:6}}>-{l.descuentoPct}%</span>}{l.esBono&&<span style={{fontSize:12,color:AM,marginLeft:6}}>🎁 bono</span>}</span>
                        <div style={{display:"flex",gap:12,alignItems:"center"}}>
                          <span style={{fontSize:14,color:MU}}>{l.cantidad}L</span>
                          <span style={{fontSize:15,fontWeight:600,color:CR}}>{fmtARS(l.monto||0)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {p.notas&&<div style={{fontSize:14,color:"#A89682",marginBottom:10}}>{p.notas}</div>}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>marcarEntregado(p.id)} style={{flex:1,minHeight:44,padding:"9px 0",borderRadius:22,background:GR,color:"#fff",border:"none",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{I.check} Marcar entregado</button>
                  <button onClick={()=>abrirEdicion(p)} title="Editar pedido" style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:"none",color:G,border:`1px solid ${G}44`,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.edit}</button>
                  <button onClick={()=>compartirRemitoPDF(p,cliente,prods,loading=>setGenerandoRemitoId(loading?p.id:null))} disabled={generandoRemitoId===p.id} title="Remito en PDF" style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:"none",color:MU,border:`1px solid ${BO}`,fontSize:14,cursor:generandoRemitoId===p.id?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:generandoRemitoId===p.id?0.6:1}}>
                    {generandoRemitoId===p.id?"...":<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>}
                  </button>
                  {cliente&&cliente.telefono?(
                    <a href={waLink(cliente.telefono,mensajePedido(p,nombreCliente,prods))} target="_blank" rel="noreferrer" title="Enviar pedido por WhatsApp" style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:"#25D36615",color:"#25D366",border:"1px solid #25D36640",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none"}}>{I.wa}</a>
                  ):(
                    <span title="Cliente sin teléfono cargado" style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:BG,color:MU,border:`1px solid ${BO}`,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>{I.wa}</span>
                  )}
                  <button onClick={()=>{if(window.confirm("¿Eliminar este pedido? Esta acción no se puede deshacer."))setPedidos(prev=>prev.filter(x=>x.id!==p.id));}} style={{minHeight:44,minWidth:44,padding:"9px 14px",borderRadius:22,background:"none",color:RE,border:`1px solid ${RE}44`,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.trash}</button>
                </div>
              </div>
            );
          })}
        </div>
      }
 
      {entregados.length>0&&(
        <div>
          <div style={{fontSize:14,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Últimas entregas</div>
          {entregados.map(p=>{
            const cliente=clientes.find(c=>c.id===p.clienteId);
            const nombreCliente=cliente?cliente.nombre:"—";
            const lineas=p.lineas||[];
            return(
              <div key={p.id} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:"10px 12px",marginBottom:6,opacity:0.75,display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:GR+"14",color:GR,border:`1px solid ${GR}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{iniciales(nombreCliente)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{fontSize:15,fontWeight:600,color:CR,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nombreCliente}</div>
                    <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}><div style={{fontSize:15,color:CR}}>{fmtARS(p.montoTotal||0)}</div><div style={{fontSize:12,color:GR}}>Entregado · {fmtDate(p.fechaEntrega)}</div></div>
                  </div>
                  <div style={{fontSize:13,color:MU,marginTop:2}}>{lineas.map(l=>{const prod=prods.find(x=>x.id===l.productoId);return`${l.cantidad}L ${prod?nombreProdEnvase(prod):l.productoId}`;}).join(" + ")}</div>
                </div>
                <button onClick={()=>compartirRemitoPDF(p,cliente,prods,loading=>setGenerandoRemitoId(loading?p.id:null))} disabled={generandoRemitoId===p.id} title="Remito en PDF" style={{padding:8,background:"none",border:"none",cursor:generandoRemitoId===p.id?"not-allowed":"pointer",color:MU,flexShrink:0,opacity:generandoRemitoId===p.id?0.6:1}}>
                  {generandoRemitoId===p.id?"...":<svg width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>}
                </button>
                <button onClick={()=>{if(window.confirm("¿Eliminar este registro de pedido entregado? No afecta la venta ya registrada en el cliente."))setPedidos(prev=>prev.filter(x=>x.id!==p.id));}} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:RE,flexShrink:0}}>{I.trash}</button>
              </div>
            );
          })}
        </div>
      )}
 
      <Modal open={showNew} onClose={()=>{setShowNew(false);resetForm();}} title={editandoId?"Editar pedido":"Nuevo pedido"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {/* Cliente */}
          <div><Lbl t="Cliente"/><select value={clienteId} onChange={e=>setClienteId(e.target.value)}><option value="">Seleccioná un cliente</option>{[...clientes].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select></div>
          {promo51&&promo51.activo&&clienteSel&&(
            <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:12,display:"flex",flexDirection:"column",gap:8}}>
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                <input type="checkbox" checked={promoAplica} onChange={e=>setPromoAplica(e.target.checked)} style={{width:18,height:18,flexShrink:0,accentColor:G}}/>
                <span style={{fontSize:14,fontWeight:600,color:promoAplica?G:CR}}>🎁 Este pedido participa de la promo {promo51.cantidadNecesaria}+{promo51.cantidadBono}</span>
              </label>
              {promoProgresoSel&&(
                promoProgresoSel.bonosPendientes>0?(
                  <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",paddingTop:4,borderTop:`1px solid ${BO}`}}>
                    <span style={{fontSize:13,color:AM,fontWeight:600,flex:1,minWidth:150}}>🎁 ¡Le tocan {promo51.cantidadBono*promoProgresoSel.bonosPendientes} bonificado(s)!</span>
                    <button onClick={agregarBonoPromo} style={{fontSize:13,fontWeight:700,color:"#fff",background:AM,border:"none",borderRadius:8,padding:"7px 12px",cursor:"pointer",flexShrink:0}}>+ Agregar bono</button>
                  </div>
                ):(
                  <div style={{fontSize:12,color:MU,paddingTop:4,borderTop:`1px solid ${BO}`}}>
