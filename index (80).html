            <option value="">Todos los clientes</option>
            {clientesConVentas.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
          <div><Lbl t="Producto"/>
            <select value={fProducto} onChange={e=>setFProducto(e.target.value)}>
              <option value="">Todos</option>
              {[...prods].sort((a,b)=>nombreProdEnvase(a).localeCompare(nombreProdEnvase(b))).map(p=><option key={p.id} value={p.id}>{nombreProdEnvase(p)}</option>)}
            </select>
          </div>
          <div><Lbl t="Envase"/>
            <select value={fEnvase} onChange={e=>setFEnvase(e.target.value)}>
              <option value="">Todos</option>
              {envasesDisponibles.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          </div>
        </div>
        <div style={{marginBottom:10}}>
          <Lbl t="Estado"/>
            <select value={fEstado} onChange={e=>setFEstado(e.target.value)}>
              <option value="todos">Todos</option>
              <option value="pagado">Pagado</option>
              <option value="pendiente">Pendiente</option>
            </select>

        </div>
        <div>
          <Lbl t="Ordenar por"/>
          <select value={fOrden} onChange={e=>setFOrden(e.target.value)}>
            <option value="fecha-desc">Fecha (más reciente primero)</option>
            <option value="fecha-asc">Fecha (más antigua primero)</option>
            <option value="monto-desc">Monto (mayor a menor)</option>
            <option value="monto-asc">Monto (menor a mayor)</option>
            <option value="cliente">Cliente (A-Z)</option>
          </select>
        </div>
        {hayFiltrosVenta&&(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
            <span style={{fontSize:13,color:MU}}>{filtradas.length} de {todas.length} venta{todas.length!==1?"s":""}</span>
            <button onClick={limpiarFiltrosVenta} style={{fontSize:13,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>✕ Limpiar</button>
          </div>
        )}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:12,marginBottom:20}}>
        {[{l:hayFiltrosVenta?"Total filtrado":"Total histórico",v:fmtARS(totalARS),ic:I.trend},{l:"Litros",v:`${litros} L`,ic:I.box}].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16}}>
            <div style={{width:26,height:26,borderRadius:9,background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:8}}>{React.cloneElement(s.ic,{width:14,height:14})}</div>
            <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{s.l}</div>
            <div className="bebas" style={{fontSize:24,color:CR}}>{s.v}</div>
          </div>
        ))}
      </div>
      {filtradas.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:16}}>{hayFiltrosVenta?"Ningún resultado con estos filtros.":"Sin ventas registradas."}</p>:filtradas.map((v,i)=>{const p=prods.find(x=>x.id===v.producto);return(
        <div key={v.id+i} style={{display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${v.pagado?BO:RE+"33"}`,borderRadius:18,padding:"12px 16px",marginBottom:8}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,flexShrink:0}}>{iniciales(v.cn)}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.cn}</div><div style={{fontSize:14,color:MU,marginTop:2}}>{p?nombreProdEnvase(p):v.producto} · {fmtDate(v.fecha)}</div></div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:3,padding:"2px 8px",borderRadius:20,background:v.pagado?GLT:RE+"15"}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:v.pagado?G:RE}}/>
              <span style={{fontSize:12,fontWeight:700,color:v.pagado?G:RE}}>{v.cantidad}L · {v.pagado?"Pagado":"Pendiente"}</span>
            </div>
          </div>
        </div>
      );})}
    </div>
  );
}
 
// ── COMPRAS (estadísticas de lo comprado a proveedores) ────────────
function Compras({proveedores,prods}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const todasSinFiltro=useMemo(()=>(proveedores||[]).flatMap(p=>(p.compras||[]).map(c=>({...c,proveedorId:p.id,proveedorNombre:p.nombre}))),[proveedores]);

  // ── Filtros ──
  const[fDesde,setFDesde]=useState("");
  const[fHasta,setFHasta]=useState("");
  const[fProveedor,setFProveedor]=useState("");
  const[fProducto,setFProducto]=useState("");
  const[fEnvase,setFEnvase]=useState("");
  const[fMarca,setFMarca]=useState("");
  const[fEstado,setFEstado]=useState("todos"); // todos | pagado | pendiente
  const[fOrden,setFOrden]=useState("fecha-desc");

  const envasesDisponibles=useMemo(()=>Array.from(new Set(prods.map(p=>p.envase||"PET"))).sort(),[prods]);
  const marcasDisponibles=useMemo(()=>Array.from(new Set(prods.map(p=>p.marca).filter(Boolean))).sort(),[prods]);
  const proveedoresConCompras=useMemo(()=>[...(proveedores||[])].filter(p=>(p.compras||[]).length>0).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")),[proveedores]);
  const hayFiltros=fDesde||fHasta||fProveedor||fProducto||fEnvase||fMarca||fEstado!=="todos"||fOrden!=="fecha-desc";

  const filtradas=useMemo(()=>{
    let lista=todasSinFiltro.filter(c=>{
      if(fDesde&&c.fecha<fDesde)return false;
      if(fHasta&&c.fecha>fHasta)return false;
      if(fProveedor&&c.proveedorId!==fProveedor)return false;
      if(fProducto&&c.producto!==fProducto)return false;
      if(fEnvase&&envaseMap[c.producto]!==fEnvase)return false;
      if(fMarca&&(prods.find(p=>p.id===c.producto)?.marca||"")!==fMarca)return false;
      if(fEstado==="pagado"&&!c.pagado)return false;
      if(fEstado==="pendiente"&&c.pagado)return false;
      return true;
    });
    lista=[...lista].sort((a,b)=>{
      switch(fOrden){
        case"fecha-asc":return new Date(a.fecha)-new Date(b.fecha);
        case"monto-desc":return(b.monto||0)-(a.monto||0);
        case"monto-asc":return(a.monto||0)-(b.monto||0);
        case"proveedor":return a.proveedorNombre.localeCompare(b.proveedorNombre);
        default:return new Date(b.fecha)-new Date(a.fecha);
      }
    });
    return lista;
  },[todasSinFiltro,fDesde,fHasta,fProveedor,fProducto,fEnvase,fMarca,fEstado,fOrden,envaseMap,prods]);

  const limpiarFiltros=()=>{setFDesde("");setFHasta("");setFProveedor("");setFProducto("");setFEnvase("");setFMarca("");setFEstado("todos");setFOrden("fecha-desc");};

  const totalARS=filtradas.reduce((s,c)=>s+(c.monto||0),0);
  const litros=filtradas.reduce((s,c)=>s+litrosDeItem(c.cantidad,envaseMap[c.producto]),0);
  const pendiente=filtradas.filter(c=>!c.pagado).reduce((s,c)=>s+(c.monto||0),0);

  const exportCSV=()=>{const h="Proveedor,Fecha,Producto,Cantidad,Monto ARS,Pagado\n",r=filtradas.map(c=>`"${c.proveedorNombre}",${c.fecha},${c.producto},${c.cantidad},${c.monto},${c.pagado?"Sí":"No"}`).join("\n"),b=new Blob([h+r],{type:"text/csv;charset=utf-8;"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`compras_${hoyISO()}.csv`;a.click();};

  // Evolución mensual (últimos 6 meses, sin filtrar — panorama fijo)
  const evolucionMensual=useMemo(()=>{
    const hoy=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});}
    const map={};meses.forEach(m=>map[m.key]={litros:0,monto:0});
    todasSinFiltro.forEach(c=>{const key=(c.fecha||"").slice(0,7);if(map[key]){map[key].litros+=litrosDeItem(c.cantidad,envaseMap[c.producto]);map[key].monto+=c.monto||0;}});
    return meses.map(m=>({...m,...map[m.key]}));
  },[todasSinFiltro,envaseMap]);
  const maxMesMonto=Math.max(1,...evolucionMensual.map(m=>m.monto));

  // Ranking por envase
  const ENVASE_COLOR={PET:G,Barril:AM,Lata:"#4472BE"};
  const rankingEnvase=useMemo(()=>{
    const map={};
    filtradas.forEach(c=>{
      const envase=prods.find(p=>p.id===c.producto)?.envase||"Otro";
      if(!map[envase])map[envase]={litros:0,monto:0};
      map[envase].litros+=litrosDeItem(c.cantidad,envase);
      map[envase].monto+=c.monto||0;
    });
    return Object.entries(map).map(([envase,d])=>({envase,...d})).sort((a,b)=>b.litros-a.litros);
  },[filtradas,prods]);
  const maxEnvase=Math.max(1,...rankingEnvase.map(e=>e.litros));

  // Ranking por marca
  const rankingMarca=useMemo(()=>{
    const map={};
    filtradas.forEach(c=>{
      const marca=prods.find(p=>p.id===c.producto)?.marca||"Sin marca";
      if(!map[marca])map[marca]={litros:0,monto:0,compras:0};
      map[marca].litros+=litrosDeItem(c.cantidad,envaseMap[c.producto]);
      map[marca].monto+=c.monto||0;
      map[marca].compras+=1;
    });
    return Object.entries(map).map(([marca,d])=>({marca,...d})).sort((a,b)=>b.litros-a.litros);
  },[filtradas,prods,envaseMap]);
  const maxMarca=Math.max(1,...rankingMarca.map(m=>m.litros));

  // Ranking por estilo (cada producto es, en los hechos, un estilo propio)
  const rankingEstilo=useMemo(()=>{
    const map={};
    filtradas.forEach(c=>{
      const nombre=prods.find(p=>p.id===c.producto)?.nombre||c.producto;
      if(!map[nombre])map[nombre]={litros:0,monto:0,compras:0};
      map[nombre].litros+=litrosDeItem(c.cantidad,envaseMap[c.producto]);
      map[nombre].monto+=c.monto||0;
      map[nombre].compras+=1;
    });
    return Object.entries(map).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.litros-a.litros);
  },[filtradas,prods,envaseMap]);
  const maxEstilo=Math.max(1,...rankingEstilo.map(e=>e.litros));

  // Top proveedores
  const[topCriterio,setTopCriterio]=useState("monto"); // "monto" | "litros"
  const topProveedores=useMemo(()=>{
    const map={};
    filtradas.forEach(c=>{
      if(!map[c.proveedorNombre])map[c.proveedorNombre]={litros:0,monto:0,compras:0};
      map[c.proveedorNombre].litros+=litrosDeItem(c.cantidad,envaseMap[c.producto]);
      map[c.proveedorNombre].monto+=c.monto||0;
      map[c.proveedorNombre].compras+=1;
    });
    return Object.entries(map).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b[topCriterio]-a[topCriterio]).slice(0,8);
  },[filtradas,envaseMap,topCriterio]);
  const maxTopProveedor=Math.max(1,...topProveedores.map(p=>p[topCriterio]));

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Compras</span>
        <button onClick={exportCSV} style={{fontSize:14,padding:"6px 12px",borderRadius:8,cursor:"pointer",border:`1px solid ${BO}`,background:"none",color:MU}}>Exportar CSV</button>
      </div>

      {/* ── Filtros ── */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}}>🔍 Filtrar compras</div>
        <BotonesPeriodo actual={{desde:fDesde,hasta:fHasta}} onSelect={r=>{setFDesde(r.desde);setFHasta(r.hasta);}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
          <div><Lbl t="Desde"/><input type="date" value={fDesde} onChange={e=>setFDesde(e.target.value)} max={fHasta||undefined}/></div>
          <div><Lbl t="Hasta"/><input type="date" value={fHasta} onChange={e=>setFHasta(e.target.value)} min={fDesde||undefined}/></div>
        </div>
        <div style={{marginBottom:10}}>
          <Lbl t="Proveedor"/>
          <select value={fProveedor} onChange={e=>setFProveedor(e.target.value)}>
            <option value="">Todos los proveedores</option>
            {proveedoresConCompras.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
          <div><Lbl t="Producto"/>
            <select value={fProducto} onChange={e=>setFProducto(e.target.value)}>
              <option value="">Todos</option>
              {[...prods].sort((a,b)=>nombreProdEnvase(a).localeCompare(nombreProdEnvase(b))).map(p=><option key={p.id} value={p.id}>{nombreProdEnvase(p)}</option>)}
            </select>
          </div>
          <div><Lbl t="Envase"/>
            <select value={fEnvase} onChange={e=>setFEnvase(e.target.value)}>
              <option value="">Todos</option>
              {envasesDisponibles.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
          <div><Lbl t="Marca"/>
            <select value={fMarca} onChange={e=>setFMarca(e.target.value)}>
              <option value="">Todas</option>
              {marcasDisponibles.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <div><Lbl t="Estado"/>
            <select value={fEstado} onChange={e=>setFEstado(e.target.value)}>
              <option value="todos">Todos</option>
              <option value="pagado">Pagado</option>
              <option value="pendiente">Pendiente</option>
            </select>
          </div>
        </div>
        <div>
          <Lbl t="Ordenar por"/>
          <select value={fOrden} onChange={e=>setFOrden(e.target.value)}>
            <option value="fecha-desc">Fecha (más reciente primero)</option>
            <option value="fecha-asc">Fecha (más antigua primero)</option>
            <option value="monto-desc">Monto (mayor a menor)</option>
            <option value="monto-asc">Monto (menor a mayor)</option>
            <option value="proveedor">Proveedor (A-Z)</option>
          </select>
        </div>
        {hayFiltros&&(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
            <span style={{fontSize:13,color:MU}}>{filtradas.length} de {todasSinFiltro.length} compra{todasSinFiltro.length!==1?"s":""}</span>
            <button onClick={limpiarFiltros} style={{fontSize:13,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>✕ Limpiar</button>
          </div>
        )}
      </div>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:10,marginBottom:20}}>
        {[{l:hayFiltros?"Facturado (filtro)":"Facturado total",v:fmtARS(totalARS)},{l:"Litros",v:`${litros} L`},{l:"Pendiente",v:fmtARS(pendiente)}].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:16,padding:"12px 10px"}}>
            <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{s.l}</div>
            <div className="bebas" style={{fontSize:19,color:CR}}>{s.v}</div>
          </div>
        ))}
      </div>

      {/* Evolución mensual */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:12}}>📅 Compras por mes (gastado en $)</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:8,height:100}}>
          {evolucionMensual.map(m=>(
            <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{width:"100%",height:Math.max(3,(m.monto/maxMesMonto)*76),background:G,borderRadius:4}}/>
              <span style={{fontSize:11,color:MU,textTransform:"capitalize"}}>{m.lbl}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Ranking por envase */}
      {rankingEnvase.length>0&&(
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:12}}>📦 Por envase</div>
          {rankingEnvase.map(e=>(
            <div key={e.envase} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:4}}>
                <span style={{color:CR,fontWeight:600}}>{e.envase}</span>
                <span style={{color:MU}}>{Math.round(e.litros*10)/10}L · {fmtARS(e.monto)}</span>
              </div>
              <div style={{height:8,background:BG,borderRadius:4,overflow:"hidden"}}>
                <div style={{width:`${(e.litros/maxEnvase)*100}%`,height:"100%",background:ENVASE_COLOR[e.envase]||MU,borderRadius:4}}/>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Ranking por marca */}
      {rankingMarca.length>0&&(
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:12}}>🏷 Por marca</div>
          {rankingMarca.map(m=>(
            <div key={m.marca} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:4}}>
                <span style={{color:CR,fontWeight:600}}>{m.marca}</span>
                <span style={{color:MU}}>{Math.round(m.litros*10)/10}L · {fmtARS(m.monto)}</span>
              </div>
              <div style={{height:8,background:BG,borderRadius:4,overflow:"hidden"}}>
                <div style={{width:`${(m.litros/maxMarca)*100}%`,height:"100%",background:G,borderRadius:4}}/>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Ranking por estilo */}
      {rankingEstilo.length>0&&(
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:700,color:CR,marginBottom:12}}>🍺 Por estilo</div>
          {rankingEstilo.map(e=>(
            <div key={e.nombre} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:4}}>
                <span style={{color:CR,fontWeight:600}}>{e.nombre}</span>
                <span style={{color:MU}}>{Math.round(e.litros*10)/10}L · {fmtARS(e.monto)}</span>
              </div>
              <div style={{height:8,background:BG,borderRadius:4,overflow:"hidden"}}>
                <div style={{width:`${(e.litros/maxEstilo)*100}%`,height:"100%",background:AM,borderRadius:4}}/>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Top proveedores */}
      {topProveedores.length>0&&(
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <span style={{fontSize:16,fontWeight:700,color:CR}}>🏆 Proveedores</span>
            <div style={{display:"flex",gap:4}}>
              {[{k:"monto",l:"$"},{k:"litros",l:"L"}].map(o=>(
                <button key={o.k} onClick={()=>setTopCriterio(o.k)} style={{fontSize:12,fontWeight:700,padding:"4px 10px",borderRadius:6,cursor:"pointer",border:`1px solid ${topCriterio===o.k?G:BO}`,background:topCriterio===o.k?G:"none",color:topCriterio===o.k?"#fff":MU}}>{o.l}</button>
              ))}
            </div>
          </div>
          {topProveedores.map(p=>(
            <div key={p.nombre} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:4}}>
                <span style={{color:CR,fontWeight:600}}>{p.nombre}</span>
                <span style={{color:MU}}>{topCriterio==="monto"?fmtARS(p.monto):`${Math.round(p.litros*10)/10}L`}</span>
              </div>
              <div style={{height:8,background:BG,borderRadius:4,overflow:"hidden"}}>
                <div style={{width:`${(p[topCriterio]/maxTopProveedor)*100}%`,height:"100%",background:G,borderRadius:4}}/>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Listado */}
      <div style={{fontSize:16,fontWeight:600,color:CR,marginBottom:10}}>Listado</div>
      {filtradas.length===0?<p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:16}}>{hayFiltros?"Ningún resultado con estos filtros.":"Sin compras registradas."}</p>:filtradas.map((c,i)=>{const p=prods.find(x=>x.id===c.producto);return(
        <div key={c.id+i} style={{display:"flex",alignItems:"center",gap:12,background:CA,border:`1px solid ${c.pagado?BO:RE+"33"}`,borderRadius:18,padding:"12px 16px",marginBottom:8}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,flexShrink:0}}>{iniciales(c.proveedorNombre)}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.proveedorNombre}</div><div style={{fontSize:14,color:MU,marginTop:2}}>{p?nombreProdEnvase(p):c.producto} · {fmtDate(c.fecha)}</div></div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(c.monto)}</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:3,padding:"2px 8px",borderRadius:20,background:c.pagado?GLT:RE+"15"}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:c.pagado?G:RE}}/>
              <span style={{fontSize:12,fontWeight:700,color:c.pagado?G:RE}}>{c.cantidad}{p&&p.envase==="Lata"?"u":"L"} · {c.pagado?"Pagado":"Pendiente"}</span>
            </div>
          </div>
        </div>
      );})}
    </div>
  );
}

// ── RENTABILIDAD (compra vs. venta, por producto) ───────────────────
// Compara el costo promedio pagado a proveedores por litro/unidad contra el precio promedio
// cobrado a clientes, para estimar el margen. Es un promedio histórico acumulado (no rastrea
// lotes específicos de stock), así que es una estimación — se aclara en la propia pantalla.
function Rentabilidad({clientes,proveedores,prods}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const ventasTodas=useMemo(()=>(clientes||[]).flatMap(c=>(c.ventas||[])),[clientes]);
  const comprasTodas=useMemo(()=>(proveedores||[]).flatMap(p=>(p.compras||[])),[proveedores]);

  const porProducto=useMemo(()=>{
    const map={};
    prods.forEach(p=>{map[p.id]={id:p.id,nombre:p.nombre,envase:p.envase||"PET",marca:p.marca,litrosVendidos:0,montoVendido:0,litrosComprados:0,montoComprado:0};});
    ventasTodas.forEach(v=>{if(!map[v.producto])return;map[v.producto].litrosVendidos+=litrosDeItem(v.cantidad,envaseMap[v.producto]);map[v.producto].montoVendido+=v.monto||0;});
    comprasTodas.forEach(c=>{if(!map[c.producto])return;map[c.producto].litrosComprados+=litrosDeItem(c.cantidad,envaseMap[c.producto]);map[c.producto].montoComprado+=c.monto||0;});
    return Object.values(map).map(p=>{
      const costoPorL=p.litrosComprados>0?p.montoComprado/p.litrosComprados:null;
      const ventaPorL=p.litrosVendidos>0?p.montoVendido/p.litrosVendidos:null;
      const margenPct=(costoPorL!=null&&ventaPorL!=null&&ventaPorL>0)?Math.round(((ventaPorL-costoPorL)/ventaPorL)*1000)/10:null;
      const gananciaPorL=(costoPorL!=null&&ventaPorL!=null)?ventaPorL-costoPorL:null;
      const gananciaEstimada=gananciaPorL!=null?Math.round(gananciaPorL*p.litrosVendidos):null;
      return{...p,costoPorL,ventaPorL,margenPct,gananciaPorL,gananciaEstimada};
    }).filter(p=>p.litrosVendidos>0||p.litrosComprados>0).sort((a,b)=>(b.margenPct??-999)-(a.margenPct??-999));
  },[ventasTodas,comprasTodas,prods,envaseMap]);

  const totales=useMemo(()=>{
    const montoVendido=ventasTodas.reduce((s,v)=>s+(v.monto||0),0);
    const montoComprado=comprasTodas.reduce((s,c)=>s+(c.monto||0),0);
    const gananciaBruta=montoVendido-montoComprado;
    const margenGlobal=montoVendido>0?Math.round((gananciaBruta/montoVendido)*1000)/10:null;
    return{montoVendido,montoComprado,gananciaBruta,margenGlobal};
  },[ventasTodas,comprasTodas]);

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{marginBottom:16}}>
        <span className="bebas" style={{fontSize:30,color:CR,display:"block"}}>Rentabilidad</span>
        <p style={{fontSize:14,color:MU}}>Lo que pagás a proveedores vs. lo que cobrás a clientes, por producto</p>
      </div>

      <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"10px 12px",marginBottom:16,fontSize:13,color:MU,lineHeight:1.4}}>
        ℹ️ Es un promedio histórico acumulado (todo lo comprado vs. todo lo vendido de cada producto), no un seguimiento de lotes puntuales de stock. Sirve como estimación, no como contabilidad exacta.
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:20}}>
        {[
          {l:"Total vendido",v:fmtARS(totales.montoVendido)},
          {l:"Total comprado",v:fmtARS(totales.montoComprado)},
          {l:"Ganancia bruta",v:fmtARS(totales.gananciaBruta)},
          {l:"Margen global",v:totales.margenGlobal!=null?`${totales.margenGlobal}%`:"—"},
        ].map(s=>(
          <div key={s.l} style={{background:CA,border:`1px solid ${BO}`,borderRadius:16,padding:"12px 10px"}}>
            <div style={{fontSize:11,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{s.l}</div>
            <div className="bebas" style={{fontSize:19,color:CR}}>{s.v}</div>
          </div>
        ))}
      </div>

      <div style={{fontSize:16,fontWeight:600,color:CR,marginBottom:10}}>Por producto</div>
      {porProducto.length===0?(
        <p style={{color:MU,textAlign:"center",padding:"48px 0",fontSize:16}}>Todavía no hay compras y ventas registradas para comparar.</p>
      ):porProducto.map(p=>{
        const u=p.envase==="Lata"?"u":"L";
        const sinDatos=p.costoPorL==null||p.ventaPorL==null;
        return(
          <div key={p.id} style={{background:CA,border:`1px solid ${p.margenPct!=null&&p.margenPct<0?RE+"55":BO}`,borderRadius:14,padding:14,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:10}}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:15,fontWeight:700,color:CR}}>{p.nombre}</div>
                <div style={{fontSize:12,color:MU}}>{p.marca?`${p.marca} · `:""}{p.envase}</div>
              </div>
              {p.margenPct!=null?(
                <span style={{fontSize:15,fontWeight:700,color:p.margenPct<0?RE:G,whiteSpace:"nowrap"}}>{p.margenPct>0?"+":""}{p.margenPct}%</span>
              ):(
                <span style={{fontSize:13,fontWeight:700,color:MU,whiteSpace:"nowrap"}}>Sin datos</span>
              )}
            </div>
            {sinDatos?(
              <div style={{fontSize:13,color:MU}}>
                {p.litrosComprados===0&&p.litrosVendidos===0?"Sin compras ni ventas registradas.":p.litrosComprados===0?"Falta registrar compras de este producto para calcular el costo.":"Falta registrar ventas de este producto para calcular el margen."}
              </div>
            ):(
              <>
                <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:12,marginBottom:8}}>
                  <div>
                    <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em"}}>Costo prom./{u}</div>
                    <div style={{fontSize:16,fontWeight:700,color:CR}}>{fmtARS(Math.round(p.costoPorL))}</div>
                  </div>
                  <div>
                    <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em"}}>Venta prom./{u}</div>
                    <div style={{fontSize:16,fontWeight:700,color:CR}}>{fmtARS(Math.round(p.ventaPorL))}</div>
                  </div>
                </div>
                <div style={{height:8,background:BG,borderRadius:4,overflow:"hidden",marginBottom:8}}>
                  <div style={{width:`${Math.min(100,Math.max(0,Math.round((p.costoPorL/p.ventaPorL)*100)))}%`,height:"100%",background:p.margenPct<0?RE:G,borderRadius:4}}/>
                </div>
                <div style={{fontSize:13,color:MU}}>Ganancia por {u}: <strong style={{color:p.gananciaPorL<0?RE:G}}>{fmtARS(Math.round(p.gananciaPorL))}</strong> · Ganancia estimada sobre lo vendido: <strong style={{color:p.gananciaEstimada<0?RE:G}}>{fmtARS(p.gananciaEstimada)}</strong></div>
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── MÉTRICAS ──────────────────────────────────────────────────────
function Metricas({clientes,prods,pedidos}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const todasSinFiltro=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,clienteId:c.id,clienteNombre:c.nombre,rubro:c.rubro,zona:c.zona}))),[clientes]);

  // ── Filtro de período (afecta los rankings de más abajo, no la evolución mensual fija) ──
  const[pDesde,setPDesde]=useState("");
  const[pHasta,setPHasta]=useState("");
  const[pEnvase,setPEnvase]=useState("");
  const envasesDisponibles=useMemo(()=>Array.from(new Set(prods.map(p=>p.envase||"PET"))).sort(),[prods]);
  const hayFiltroPeriodo=!!(pDesde||pHasta||pEnvase);
  const todas=useMemo(()=>!hayFiltroPeriodo?todasSinFiltro:todasSinFiltro.filter(v=>(!pDesde||v.fecha>=pDesde)&&(!pHasta||v.fecha<=pHasta)&&(!pEnvase||envaseMap[v.producto]===pEnvase)),[todasSinFiltro,pDesde,pHasta,pEnvase,envaseMap,hayFiltroPeriodo]);

  // KPIs: ticket promedio, frecuencia de compra, cobrado vs pendiente
  const montoTotalVentas=useMemo(()=>todas.reduce((s,v)=>s+(v.monto||0),0),[todas]);
  const ticketPromedio=todas.length?Math.round(montoTotalVentas/todas.length):0;
  const deudaTotal=totalAdeudado(clientes);
  const montoPagado=montoTotalVentas-deudaTotal;
  const pctCobrado=montoTotalVentas>0?Math.round((montoPagado/montoTotalVentas)*100):100;
  const litrosTotalVentas=useMemo(()=>todas.reduce((s,v)=>s+litrosDeItem(v.cantidad,envaseMap[v.producto]),0),[todas,envaseMap]);

  // Evolución mensual (últimos 6 meses)
  const evolucionMensual=useMemo(()=>{
    const hoy=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]={litros:0,monto:0});
    todasSinFiltro.forEach(v=>{
      const key=(v.fecha||"").slice(0,7);
      if(map[key]){map[key].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);map[key].monto+=v.monto||0;}
    });
    return meses.map(m=>({...m,...map[m.key]}));
  },[todasSinFiltro,envaseMap]);
  const maxMes=Math.max(1,...evolucionMensual.map(m=>m.litros));
  const maxMesMonto=Math.max(1,...evolucionMensual.map(m=>m.monto));

  // Cobros mensuales — según fecha en que se cobró cada venta (fechaCobro), no la fecha de venta
  const cobrosMensuales=useMemo(()=>{
    const hoy=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]=0);
    todasSinFiltro.forEach(v=>{
      if(!v.pagado)return;
      const key=(v.fechaCobro||v.fecha||"").slice(0,7);
      if(key in map)map[key]+=v.monto||0;
    });
    return meses.map(m=>({...m,monto:map[m.key]}));
  },[todasSinFiltro]);
  const maxCobroMes=Math.max(1,...cobrosMensuales.map(m=>m.monto));

  // Top clientes — ordenable por facturación o litros, de mayor a menor o de menor a mayor
  const[topCriterio,setTopCriterio]=useState("monto"); // "monto" | "litros"
  const[topOrden,setTopOrden]=useState("desc"); // "desc" | "asc"
  const topClientesFacturacion=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.clienteNombre])map[v.clienteNombre]={litros:0,monto:0,pedidos:0};
      map[v.clienteNombre].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.clienteNombre].monto+=v.monto||0;
      map[v.clienteNombre].pedidos+=1;
    });
    const arr=Object.entries(map).map(([nombre,d])=>({nombre,...d}));
    arr.sort((a,b)=>topOrden==="desc"?b[topCriterio]-a[topCriterio]:a[topCriterio]-b[topCriterio]);
    return arr.slice(0,8);
  },[todas,envaseMap,topCriterio,topOrden]);
  const maxFacturacion=Math.max(1,...topClientesFacturacion.map(c=>c[topCriterio]));

  // Descuentos y bonificaciones (el rango de fechas y el envase filtran el resumen y el ranking; la evolución mensual es fija, como las demás)
  const ctxDesc=useMemo(()=>ctxDescuentos(prods,pedidos),[prods,pedidos]);
  const itemsDescTodos=useMemo(()=>todasSinFiltro.map(v=>({v,d:desgloseVenta(v,v.clienteId,ctxDesc)})),[todasSinFiltro,ctxDesc]);
  const itemsDesc=useMemo(()=>!hayFiltroPeriodo?itemsDescTodos:itemsDescTodos.filter(({v})=>(!pDesde||v.fecha>=pDesde)&&(!pHasta||v.fecha<=pHasta)&&(!pEnvase||envaseMap[v.producto]===pEnvase)),[itemsDescTodos,pDesde,pHasta,pEnvase,envaseMap,hayFiltroPeriodo]);
  const resDesc=useMemo(()=>resumenDescuentos(itemsDesc),[itemsDesc]);
  const descMensual=useMemo(()=>serieMensualDescuentos(itemsDescTodos,6),[itemsDescTodos]);
  const maxPctMes=Math.max(1,...descMensual.map(m=>m.pct));
  const[descCriterio,setDescCriterio]=useState("monto"); // "monto" | "pct"
  const rankingDesc=useMemo(()=>{
    const map={};
    itemsDesc.forEach(it=>{const k=it.v.clienteNombre;(map[k]=map[k]||[]).push(it);});
    const arr=Object.entries(map).map(([nombre,its])=>({nombre,...resumenDescuentos(its)})).filter(c=>c.beneficio>0);
    arr.sort((a,b)=>descCriterio==="pct"?b.pct-a.pct:b.beneficio-a.beneficio);
    return arr.slice(0,8);
  },[itemsDesc,descCriterio]);
  const maxRankMonto=Math.max(1,...rankingDesc.map(c=>c.beneficio));
  const maxRankPct=Math.max(1,...rankingDesc.map(c=>c.pct));

  // Litros por estilo — para un cliente puntual (respeta el filtro de período)
  const clientesConVentasNombres=useMemo(()=>[...new Set(todasSinFiltro.map(v=>v.clienteNombre))].sort((a,b)=>a.localeCompare(b)),[todasSinFiltro]);
  const[clienteEstiloSel,setClienteEstiloSel]=useState("");
  const litrosPorEstiloCliente=useMemo(()=>{
    if(!clienteEstiloSel)return[];
    const map={};
    todas.filter(v=>v.clienteNombre===clienteEstiloSel).forEach(v=>{
      const nombre=prods.find(p=>p.id===v.producto)?.nombre||v.producto;
      if(!map[nombre])map[nombre]={litros:0,monto:0,pedidos:0};
      map[nombre].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[nombre].monto+=v.monto||0;
      map[nombre].pedidos+=1;
    });
    return Object.entries(map).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,clienteEstiloSel,prods,envaseMap]);
  const maxLitroEstilo=Math.max(1,...litrosPorEstiloCliente.map(e=>e.litros));

  // Ventas por tipo de envase
  const ENVASE_COLOR={PET:G,Barril:AM,Lata:"#4472BE"};
  const rankingEnvase=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      const envase=prods.find(p=>p.id===v.producto)?.envase||"Otro";
      if(!map[envase])map[envase]={litros:0,monto:0};
      map[envase].litros+=litrosDeItem(v.cantidad,envase);
      map[envase].monto+=v.monto||0;
    });
    return Object.entries(map).map(([envase,d])=>({envase,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods]);
  const maxEnvase=Math.max(1,...rankingEnvase.map(e=>e.litros));

  // Día de la semana con más ventas
  const DIAS_LBL=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const ventasPorDiaSemana=useMemo(()=>{
    const acc=[0,0,0,0,0,0,0];
    todas.forEach(v=>{
      if(!v.fecha)return;
      const dow=new Date(v.fecha+"T00:00:00").getDay();
      acc[dow===0?6:dow-1]+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
    });
    return DIAS_LBL.map((lbl,i)=>({lbl,litros:acc[i]}));
  },[todas,envaseMap]);
  const maxDiaSem=Math.max(1,...ventasPorDiaSemana.map(d=>d.litros));
  const diaTop=ventasPorDiaSemana.reduce((max,d)=>d.litros>max.litros?d:max,ventasPorDiaSemana[0]);
 
  // Ranking por producto
  const rankingProducto=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.producto])map[v.producto]={litros:0,monto:0,pedidos:0};
      map[v.producto].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.producto].monto+=v.monto;
      map[v.producto].pedidos+=1;
    });
    return Object.entries(map).map(([id,d])=>({id,nombre:prods.find(p=>p.id===id)?.nombre||id,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods,envaseMap]);

  // Resumen por marca — mismos filtros (período/envase) que el ranking por producto; si hay un cliente elegido en el selector de abajo, agrupa solo lo de ese cliente
  const rankingMarca=useMemo(()=>{
    const base=clienteEstiloSel?todas.filter(v=>v.clienteNombre===clienteEstiloSel):todas;
    const map={};
    base.forEach(v=>{
      const marca=prods.find(p=>p.id===v.producto)?.marca||"Sin marca";
      if(!map[marca])map[marca]={litros:0,monto:0,pedidos:0};
      map[marca].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[marca].monto+=v.monto;
      map[marca].pedidos+=1;
    });
    return Object.entries(map).map(([marca,d])=>({marca,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,prods,envaseMap,clienteEstiloSel]);
 
  // Ranking clientes por producto
  const rankingClientesPorProd=useMemo(()=>{
    const byProd={};
    prods.forEach(p=>byProd[p.id]={});
    todas.forEach(v=>{
      if(!byProd[v.producto])byProd[v.producto]={};
      if(!byProd[v.producto][v.clienteNombre])byProd[v.producto][v.clienteNombre]={litros:0,monto:0};
      byProd[v.producto][v.clienteNombre].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      byProd[v.producto][v.clienteNombre].monto+=v.monto;
    });
    const result={};
    Object.entries(byProd).forEach(([prodId,clientes])=>{
      result[prodId]=Object.entries(clientes).map(([nombre,d])=>({nombre,...d})).sort((a,b)=>b.litros-a.litros).slice(0,5);
    });
    return result;
  },[todas,prods,envaseMap]);
 
  // Ranking por zona
  const rankingZona=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.zona])map[v.zona]={litros:0,monto:0,pedidos:0};
      map[v.zona].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.zona].monto+=v.monto;
      map[v.zona].pedidos+=1;
    });
    return Object.entries(map).map(([zona,d])=>({zona,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,envaseMap]);
 
  // Ranking por rubro
  const rankingRubro=useMemo(()=>{
    const map={};
    todas.forEach(v=>{
      if(!map[v.rubro])map[v.rubro]={litros:0,monto:0,pedidos:0};
      map[v.rubro].litros+=litrosDeItem(v.cantidad,envaseMap[v.producto]);
      map[v.rubro].monto+=v.monto;
      map[v.rubro].pedidos+=1;
    });
    return Object.entries(map).map(([rubro,d])=>({rubro,...d})).sort((a,b)=>b.litros-a.litros);
  },[todas,envaseMap]);
 
  const maxZona=rankingZona[0]?.litros||1;
  const maxRubro=rankingRubro[0]?.litros||1;
 
  if(todasSinFiltro.length===0) return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:30,color:CR,display:"block",marginBottom:4}}>Métricas</span>
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:32,textAlign:"center",marginTop:20}}>
        <div style={{fontSize:17,color:MU}}>Sin ventas registradas todavía.</div>
        <div style={{fontSize:14,color:MU,marginTop:6}}>Las métricas aparecen cuando registrés pedidos entregados.</div>
      </div>
    </div>
  );
 
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:30,color:CR,display:"block",marginBottom:4}}>Métricas</span>
      <p style={{fontSize:14,color:MU,marginBottom:14}}>Rankings de ventas · {todas.length} registro{todas.length!==1?"s":""}{hayFiltroPeriodo?" en el período":""}</p>

      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>🔍 Período (afecta los rankings de abajo)</div>
        <BotonesPeriodo actual={{desde:pDesde,hasta:pHasta}} onSelect={r=>{setPDesde(r.desde);setPHasta(r.hasta);}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
          <div><Lbl t="Desde"/><input type="date" value={pDesde} onChange={e=>setPDesde(e.target.value)} max={pHasta||undefined}/></div>
          <div><Lbl t="Hasta"/><input type="date" value={pHasta} onChange={e=>setPHasta(e.target.value)} min={pDesde||undefined}/></div>
        </div>
        <div style={{marginTop:10}}>
          <Lbl t="Envase"/>
          <select value={pEnvase} onChange={e=>setPEnvase(e.target.value)}>
            <option value="">Todos</option>
            {envasesDisponibles.map(e=><option key={e} value={e}>{e}</option>)}
          </select>
        </div>
        {hayFiltroPeriodo&&<button onClick={()=>{setPDesde("");setPHasta("");setPEnvase("");}} style={{marginTop:10,fontSize:13,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>✕ Limpiar período</button>}
      </div>

      {/* KPIs generales */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:16}}>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ticket promedio</div>
          <div className="bebas" style={{fontSize:22,color:CR}}>{fmtARS(ticketPromedio)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Litros vendidos</div>
          <div className="bebas" style={{fontSize:22,color:CR}}>{Math.round(litrosTotalVentas*10)/10}L</div>
        </div>
        <div style={{background:CA,border:`1px solid ${G}33`,borderRadius:18,padding:14}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Cobrado</div>
          <div className="bebas" style={{fontSize:22,color:G}}>{pctCobrado}%</div>
          <div style={{fontSize:13,color:MU,marginTop:1}}>{fmtARS(montoPagado)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${deudaTotal>0?RE+"33":BO}`,borderRadius:18,padding:14}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Pendiente de cobro</div>
          <div className="bebas" style={{fontSize:22,color:deudaTotal>0?"#C24545":CR}}>{fmtARS(deudaTotal)}</div>
        </div>
      </div>

      {/* Evolución mensual */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Evolución mensual · litros vendidos</div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90}}>
          {evolucionMensual.map((m,i)=>(
            <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
              <div title={`${m.lbl}: ${Math.round(m.litros*10)/10} L`} style={{width:"100%",maxWidth:28,height:`${Math.max(4,Math.round((m.litros/maxMes)*68))}px`,borderRadius:6,background:i===evolucionMensual.length-1?G:GLT,transition:"height 0.4s",cursor:"default"}}/>
              <span style={{fontSize:11,fontWeight:i===evolucionMensual.length-1?700:500,color:i===evolucionMensual.length-1?G:MU,textTransform:"capitalize"}}>{m.lbl}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Ventas mensuales $ */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Ventas mensuales · $ facturado</div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90}}>
          {evolucionMensual.map((m,i)=>(
            <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
              <div title={`${m.lbl}: ${fmtARS(m.monto)}`} style={{width:"100%",maxWidth:28,height:`${Math.max(4,Math.round((m.monto/maxMesMonto)*68))}px`,borderRadius:6,background:i===evolucionMensual.length-1?G:GLT,transition:"height 0.4s",cursor:"default"}}/>
              <span style={{fontSize:11,fontWeight:i===evolucionMensual.length-1?700:500,color:i===evolucionMensual.length-1?G:MU,textTransform:"capitalize"}}>{m.lbl}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>

        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90}}>

              <span style={{fontSize:11,fontWeight:i===cobrosMensuales.length-1?700:500,color:i===cobrosMensuales.length-1?GR:MU,textTransform:"capitalize"}}>{m.lbl}</span>

        <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>🏷️ Descuentos y bonificaciones{hayFiltroPeriodo?" (período)":""}</div>
        <div style={{fontSize:13,color:MU,marginBottom:12,lineHeight:1.4}}>Se mide contra la venta a lista: lo que se habría facturado sin descuentos ni bonificaciones.</div>
        {resDesc.ventas===0?(
          <p style={{fontSize:15,color:MU,textAlign:"center",padding:"8px 0"}}>Sin ventas en el período.</p>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:12}}>
              <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:14,padding:12}}>
                <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Venta a lista</div>
                <div className="bebas" style={{fontSize:20,color:CR}}>{fmtARS(Math.round(resDesc.bruto))}</div>
                <div style={{fontSize:12,color:MU,marginTop:1}}>Neto facturado {fmtARS(Math.round(resDesc.neto))}</div>
              </div>
              <div style={{background:BG,border:`1px solid ${RE}22`,borderRadius:14,padding:12}}>
                <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Descontado</div>
                <div className="bebas" style={{fontSize:20,color:resDesc.descuento>0?"#C24545":CR}}>{resDesc.descuento>0?`−${fmtARS(Math.round(resDesc.descuento))}`:"—"}</div>
                <div style={{fontSize:12,color:MU,marginTop:1}}>{fmtPct(resDesc.pctDescuento)} de lo facturado a lista</div>
              </div>
              <div style={{background:BG,border:`1px solid ${AM}33`,borderRadius:14,padding:12}}>
                <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Bonificado</div>
                <div className="bebas" style={{fontSize:20,color:resDesc.bono>0?"#B7691F":CR}}>{resDesc.bono>0?fmtARS(Math.round(resDesc.bono)):"—"}</div>
                <div style={{fontSize:12,color:MU,marginTop:1}}>{Math.round(resDesc.litrosBono*10)/10} L regalados{resDesc.estimado?"*":""}</div>
              </div>
              <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:14,padding:12}}>
                <div style={{fontSize:12,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Beneficio total</div>
                <div className="bebas" style={{fontSize:20,color:CR}}>{fmtPct(resDesc.pct)}</div>
                <div style={{fontSize:12,color:MU,marginTop:1}}>{resDesc.conBeneficio} de {resDesc.ventas} venta{resDesc.ventas!==1?"s":""} · prom. {resDesc.conBeneficio>0?fmtARS(Math.round(resDesc.promPorVentaConBeneficio)):"—"}</div>
              </div>
            </div>
            {resDesc.litrosPagos>0&&(
              <div style={{fontSize:13,color:MU,marginBottom:16,lineHeight:1.45}}>
                💲 Precio promedio por litro: lista <b style={{color:CR}}>{fmtARS(Math.round(resDesc.precioLitroLista))}</b> → real <b style={{color:CR}}>{fmtARS(Math.round(resDesc.precioLitroReal))}</b>
                {resDesc.precioLitroLista>resDesc.precioLitroReal?<> (−{fmtARS(Math.round(resDesc.precioLitroLista-resDesc.precioLitroReal))}/L)</>:null}
              </div>
            )}

            <div style={{fontSize:12,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Evolución mensual · % sobre venta a lista</div>
            <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:6,height:90,marginBottom:10}}>
              {descMensual.map((m,i)=>(
                <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
                  <div title={`${m.lbl}: ${fmtPct(m.pct)} · ${fmtARS(Math.round(m.beneficio))}`} style={{width:"100%",maxWidth:28,height:`${Math.max(4,Math.round((m.pct/maxPctMes)*68))}px`,borderRadius:6,background:i===descMensual.length-1?AM:AM+"44",transition:"height 0.3s"}}/>
                  <span style={{fontSize:11,fontWeight:i===descMensual.length-1?700:500,color:i===descMensual.length-1?AM:MU,textTransform:"capitalize"}}>{m.lbl}</span>
                </div>
              ))}
            </div>
            <div style={{border:`1px solid ${BO}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
              <div style={{display:"grid",gridTemplateColumns:"0.8fr 1.2fr 1fr 1fr 0.8fr",gap:6,padding:"6px 10px",background:BG,fontSize:11,fontWeight:700,color:MU,textTransform:"uppercase"}}>
                <span>Mes</span><span style={{textAlign:"right"}}>A lista</span><span style={{textAlign:"right"}}>Desc.</span><span style={{textAlign:"right"}}>Bonif.</span><span style={{textAlign:"right"}}>%</span>
              </div>
              {descMensual.map(m=>(
                <div key={m.key} style={{display:"grid",gridTemplateColumns:"0.8fr 1.2fr 1fr 1fr 0.8fr",gap:6,padding:"7px 10px",borderTop:`1px solid ${BO}`,fontSize:12,color:CR}}>
                  <span style={{textTransform:"capitalize"}}>{m.lbl}</span>
                  <span style={{textAlign:"right"}}>{m.ventas?fmtARS(Math.round(m.bruto)):"—"}</span>
                  <span style={{textAlign:"right",color:m.descuento>0?"#C24545":MU}}>{m.descuento>0?`−${fmtARS(Math.round(m.descuento))}`:"—"}</span>
                  <span style={{textAlign:"right",color:m.bono>0?"#B7691F":MU}}>{m.bono>0?fmtARS(Math.round(m.bono)):"—"}</span>
                  <span style={{textAlign:"right",fontWeight:700}}>{m.ventas?fmtPct(m.pct):"—"}</span>
                </div>
              ))}
            </div>

            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:6}}>
              <span style={{fontSize:12,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.06em"}}>Clientes con más beneficios</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setDescCriterio("monto")} style={{fontSize:12,fontWeight:700,color:descCriterio==="monto"?G:MU,background:descCriterio==="monto"?GLT:BG,border:descCriterio==="monto"?"none":`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>Por $</button>
                <button onClick={()=>setDescCriterio("pct")} style={{fontSize:12,fontWeight:700,color:descCriterio==="pct"?G:MU,background:descCriterio==="pct"?GLT:BG,border:descCriterio==="pct"?"none":`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>Por %</button>
              </div>
            </div>
            {rankingDesc.length===0?(
              <p style={{fontSize:14,color:MU,textAlign:"center",padding:"10px 0"}}>Sin descuentos ni bonificaciones en el período.</p>
            ):rankingDesc.map(c=>(
              <div key={c.nombre} style={{padding:"9px 0",borderTop:`1px solid ${BO}`}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"baseline"}}>
                  <span style={{fontSize:15,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nombre}</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#B7691F",flexShrink:0}}>−{fmtARS(Math.round(c.beneficio))} · {fmtPct(c.pct)}</span>
                </div>
                <div style={{height:5,borderRadius:3,background:BG,margin:"5px 0 3px",overflow:"hidden"}}>
                  <div style={{width:`${Math.min(100,Math.round((descCriterio==="pct"?c.pct/maxRankPct:c.beneficio/maxRankMonto)*100))}%`,height:"100%",background:AM,borderRadius:3}}/>
                </div>
                <div style={{fontSize:12,color:MU,lineHeight:1.4}}>Desc. {fmtARS(Math.round(c.descuento))} · Bonif. {fmtARS(Math.round(c.bono))}{c.litrosBono>0?` (${Math.round(c.litrosBono*10)/10} L)`:""} · {c.conBeneficio} de {c.ventas} venta{c.ventas!==1?"s":""} · lista {fmtARS(Math.round(c.bruto))}</div>
              </div>
            ))}
            {resDesc.estimado&&<div style={{fontSize:12,color:MU,marginTop:8,lineHeight:1.4}}>* Las bonificaciones anteriores al registro detallado se valúan al precio de lista actual.</div>}
          </>
        )}
      </div>

      {/* Top clientes — ordenable por facturación o litros, mayor→menor o menor→mayor */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
            <span style={{fontSize:16,fontWeight:700,color:CR}}>{topCriterio==="litros"?"🍺":"💰"} Top clientes{hayFiltroPeriodo?" (período)":""}</span>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={()=>setTopCriterio("monto")} style={{fontSize:12,fontWeight:700,color:topCriterio==="monto"?G:MU,background:topCriterio==="monto"?GLT:BG,border:topCriterio==="monto"?"none":`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>$ Facturación</button>
            <button onClick={()=>setTopCriterio("litros")} style={{fontSize:12,fontWeight:700,color:topCriterio==="litros"?G:MU,background:topCriterio==="litros"?GLT:BG,border:topCriterio==="litros"?"none":`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>🍺 Litros</button>
            <button onClick={()=>setTopOrden(p=>p==="desc"?"asc":"desc")} style={{fontSize:12,fontWeight:700,color:MU,background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"6px 10px",cursor:"pointer"}}>{topOrden==="desc"?"Mayor → menor":"Menor → mayor"}</button>
          </div>
        </div>
        {topClientesFacturacion.length===0?<p style={{padding:16,fontSize:15,color:MU,textAlign:"center"}}>Sin datos.</p>:topClientesFacturacion.map((c,idx)=>(
          <div key={c.nombre} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:idx===0?GLT:BG,color:idx===0?G:MU,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:14,fontWeight:700}}>{iniciales(c.nombre)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nombre}</div>
              <div style={{marginTop:4,height:3,background:BO,borderRadius:2}}><div style={{width:`${(c[topCriterio]/maxFacturacion)*100}%`,height:"100%",background:G,borderRadius:2}}/></div>
              <div style={{fontSize:12,color:MU,marginTop:3}}>Ticket prom.: {fmtARS(Math.round(c.monto/c.pedidos))}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:15,fontWeight:700,color:G}}>{topCriterio==="litros"?`${Math.round(c.litros*10)/10}L`:fmtARS(c.monto)}</div>
              <div style={{fontSize:13,color:MU}}>{topCriterio==="litros"?fmtARS(c.monto):`${Math.round(c.litros*10)/10}L`} · {c.pedidos} pedido{c.pedidos!==1?"s":""}</div>
            </div>
          </div>

      {/* Litros por estilo — cliente puntual */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14,marginBottom:16}}>

        <select value={clienteEstiloSel} onChange={e=>setClienteEstiloSel(e.target.value)} style={{marginBottom:12}}>
          <option value="">Elegí un cliente...</option>
          {clientesConVentasNombres.map(n=><option key={n} value={n}>{n}</option>)}

        {clienteEstiloSel&&(
          litrosPorEstiloCliente.length===0?(
            <p style={{fontSize:14,color:MU,textAlign:"center",padding:"16px 0"}}>Sin compras de {clienteEstiloSel}{hayFiltroPeriodo?" en este período":""}.</p>

            <>
              <div style={{display:"flex",gap:16,marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${BO}`}}>

      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${BO}`}}><span style={{fontSize:16,fontWeight:700,color:CR}}>📦 Ventas por envase</span></div>
        {rankingEnvase.map(e=>(
          <div key={e.envase} style={{padding:"10px 16px",borderBottom:`1px solid ${BO}`,display:"flex",alignItems:"center",gap:10}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:ENVASE_COLOR[e.envase]||MU,flexShrink:0}}/>

function FormNota({initial,onSave,onCancel,onDelete,cal}){
  const[f,setF]=useState({
    titulo:initial.titulo||"",contenido:initial.contenido||"",color:initial.color||NOTE_COLORS[0].key,
    recordatorioFecha:initial.recordatorioFecha||"",recordatorioHora:initial.recordatorioHora||"09:00",
  });
  const[calSync,setCalSync]=useState(!!initial.calSync);
  const[saving,setSaving]=useState(false);
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const calSafe=cal||{calToken:null,calError:"",login:()=>{},crearEvento:async()=>false};
  const tieneRecordatorio=!!f.recordatorioFecha;
  const guardar=async()=>{
    if(!f.titulo.trim())return;
    setSaving(true);
    let calOk=false;
    if(tieneRecordatorio&&calSync&&calSafe.calToken){
      calOk=await calSafe.crearEvento({titulo:"📝 "+f.titulo,descripcion:f.contenido||"",fecha:f.recordatorioFecha,hora:f.recordatorioHora||"09:00",durMin:15});
    }
    setSaving(false);
    onSave({
      ...f,titulo:f.titulo.trim(),
      recordatorioFecha:tieneRecordatorio?f.recordatorioFecha:"",
      recordatorioHora:tieneRecordatorio?(f.recordatorioHora||"09:00"):"",
      recordatorioDisparado:tieneRecordatorio?!!initial.recordatorioDisparado&&initial.recordatorioFecha===f.recordatorioFecha&&initial.recordatorioHora===f.recordatorioHora:false,
      calSync:tieneRecordatorio&&calSync&&calOk,
    });
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><Lbl t="Título"/><input value={f.titulo} onChange={s("titulo")} placeholder="Ej: Pedido especial Bar Norte" autoFocus/></div>
      <div><Lbl t="Contenido"/><textarea rows={5} value={f.contenido} onChange={s("contenido")} placeholder="Escribí acá los detalles..." style={{fontFamily:"inherit",resize:"vertical"}}/></div>
      <div>
        <Lbl t="Color"/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {NOTE_COLORS.map(c=>(
            <button key={c.key} type="button" onClick={()=>setF(p=>({...p,color:c.key}))} title={c.key} style={{width:34,height:34,borderRadius:"50%",cursor:"pointer",border:`2px solid ${f.color===c.key?c.tx:c.bd}`,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{f.color===c.key&&<span style={{color:c.tx,display:"flex"}}>{I.check}</span>}</button>
          ))}
        </div>
      </div>
      <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:12,padding:14}}>
        <Lbl t="⏰ Recordatorio (opcional)"/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:tieneRecordatorio?10:0}}>
          <div><input type="date" value={f.recordatorioFecha} onChange={s("recordatorioFecha")}/></div>
          <div><input type="time" value={f.recordatorioHora} onChange={s("recordatorioHora")} disabled={!tieneRecordatorio}/></div>
        </div>
        {tieneRecordatorio&&(
          <>
            <button type="button" onClick={()=>setF(p=>({...p,recordatorioFecha:""}))} style={{fontSize:13,color:RE,background:"none",border:"none",cursor:"pointer",textDecoration:"underline",marginBottom:10}}>✕ Quitar recordatorio</button>
            <div style={{fontSize:13,color:MU,marginBottom:10,lineHeight:1.5}}>Con la app abierta te avisamos con sonido y aviso en pantalla a esa hora.</div>
            {calSafe.calToken?(
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:14,color:CR}}>
                <input type="checkbox" checked={calSync} onChange={e=>setCalSync(e.target.checked)} style={{width:18,height:18,flexShrink:0,accentColor:G}}/>
                También crear evento en Google Calendar
              </label>
            ):(
              <div style={{fontSize:13,color:AM,lineHeight:1.5}}>💡 Conectá Google Calendar en Configuración para que este recordatorio también te llegue como notificación del celular, incluso con la app cerrada.</div>
            )}
          </>
        )}
      </div>
      <div style={{display:"flex",gap:8,paddingTop:4,alignItems:"center"}}>
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
        {onDelete&&<button onClick={onDelete} title="Eliminar nota" style={{width:42,height:42,borderRadius:10,background:RE+"14",border:`1px solid ${RE}33`,color:RE,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{I.trash}</button>}
        <div style={{flex:1}}/>
        <Btn variant="green" onClick={guardar} disabled={!f.titulo.trim()||saving}>{saving?"Guardando...":"Guardar"}</Btn>
      </div>
    </div>
  );
}

function Notas({notas,setNotas,cal}){
  const[modalOpen,setModalOpen]=useState(false);
  const[editing,setEditing]=useState(null);
  const[filtroColor,setFiltroColor]=useState("");
  const[busqueda,setBusqueda]=useState("");

  const nuevaNota=()=>{setEditing({});setModalOpen(true);};
  const editarNota=n=>{setEditing(n);setModalOpen(true);};
  const cerrar=()=>{setModalOpen(false);setEditing(null);};

  const guardar=f=>{
    const ahora=new Date().toISOString();
    if(editing&&editing.id){
      setNotas(prev=>prev.map(n=>n.id===editing.id?{...n,...f,actualizadoEn:ahora}:n));
    }else{
      setNotas(prev=>[{id:uid(),...f,creadoEn:ahora,actualizadoEn:ahora},...(prev||[])]);
    }
    cerrar();
  };
  const eliminar=()=>{
    if(!editing||!editing.id)return;
    if(!confirm("¿Eliminar esta nota? No se puede deshacer."))return;
    setNotas(prev=>prev.filter(n=>n.id!==editing.id));
    cerrar();
  };

  const filtradas=useMemo(()=>{
    const term=busqueda.trim().toLowerCase();
    return[...(notas||[])]
      .filter(n=>(!filtroColor||n.color===filtroColor)&&(!term||n.titulo.toLowerCase().includes(term)||(n.contenido||"").toLowerCase().includes(term)))
      .sort((a,b)=>new Date(b.actualizadoEn||b.creadoEn)-new Date(a.actualizadoEn||a.creadoEn));
  },[notas,filtroColor,busqueda]);

  const permisoNotif=typeof Notification!=="undefined"?Notification.permission:"unsupported";

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Notas</span>
        <Btn variant="green" small onClick={nuevaNota}>{I.plus}Nueva</Btn>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:12}}>Bloc de notas con colores para organizar ideas, pendientes y recordatorios.</p>
      {permisoNotif==="default"&&(
        <button onClick={()=>Notification.requestPermission()} style={{display:"flex",alignItems:"center",gap:8,width:"100%",textAlign:"left",background:G+"11",border:`1px solid ${G}33`,borderRadius:10,padding:"10px 14px",marginBottom:14,cursor:"pointer",fontSize:14,color:G,fontWeight:600}}>
          🔔 Activar avisos del celular para tus recordatorios
        </button>
      )}
      {permisoNotif==="denied"&&(
        <div style={{fontSize:13,color:MU,background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:"10px 14px",marginBottom:14,lineHeight:1.5}}>🔕 Los avisos del celular están bloqueados para esta app. Igual te va a avisar con sonido y aviso en pantalla mientras la tenés abierta.</div>
      )}

      <input placeholder="Buscar en notas..." value={busqueda} onChange={e=>setBusqueda(e.target.value)} style={{marginBottom:10}}/>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:18}}>
        <button onClick={()=>setFiltroColor("")} style={{padding:"5px 12px",borderRadius:20,fontSize:13,fontWeight:700,cursor:"pointer",border:`1px solid ${!filtroColor?G:BO}`,background:!filtroColor?G:"transparent",color:!filtroColor?"#fff":MU}}>Todas</button>
        {NOTE_COLORS.map(c=>(
          <button key={c.key} onClick={()=>setFiltroColor(f=>f===c.key?"":c.key)} title={c.key} style={{width:28,height:28,borderRadius:"50%",cursor:"pointer",border:`2px solid ${filtroColor===c.key?c.tx:c.bd}`,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{filtroColor===c.key&&<span style={{color:c.tx,display:"flex",transform:"scale(0.8)"}}>{I.check}</span>}</button>
        ))}
      </div>

      {filtradas.length===0?(
        <p style={{color:MU,fontSize:16,textAlign:"center",padding:"30px 16px"}}>{(notas||[]).length===0?"Todavía no cargaste notas.":"No hay notas que coincidan con la búsqueda/filtro."}</p>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
          {filtradas.map(n=>{
            const col=colorNota(n.color);
            const tieneRec=!!n.recordatorioFecha;
            const recVencido=tieneRec&&new Date(`${n.recordatorioFecha}T${n.recordatorioHora||"09:00"}:00`)<new Date();
            return(
              <button key={n.id} onClick={()=>editarNota(n)} style={{textAlign:"left",background:col.bg,border:`1px solid ${col.bd}`,borderRadius:14,padding:12,cursor:"pointer",display:"flex",flexDirection:"column",gap:6,minHeight:104}}>
                <div style={{fontSize:15,fontWeight:700,color:col.tx,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{n.titulo}</div>
                {n.contenido&&<div style={{fontSize:13,color:col.tx,opacity:0.85,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:4,WebkitBoxOrient:"vertical",flex:1,lineHeight:1.4}}>{n.contenido}</div>}
                {tieneRec&&(
                  <div style={{fontSize:11,fontWeight:700,color:col.tx,opacity:recVencido&&n.recordatorioDisparado?0.5:1,display:"flex",alignItems:"center",gap:4,marginTop:n.contenido?0:"auto"}}>
                    ⏰ {fmtDate(n.recordatorioFecha)} · {n.recordatorioHora}hs{n.calSync?" · 📅":""}
                  </div>
                )}
                <div style={{fontSize:11,color:col.tx,opacity:0.6,marginTop:tieneRec?0:"auto"}}>{fmtDateTime(n.actualizadoEn||n.creadoEn)}</div>
              </button>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={cerrar} title={editing&&editing.id?"Editar nota":"Nueva nota"}>
        {editing&&<FormNota initial={editing} onSave={guardar} onCancel={cerrar} onDelete={editing.id?eliminar:null} cal={cal}/>}
      </Modal>
    </div>
  );
}

function Configuracion({cal,clientes,setClientes,prospectos,setProspectos,pedidos,setPedidos,prods,setProds,speeches,setSpeeches,notas,setNotas,gastos,setGastos,comisiones,setComisiones,metaSemanal,setMetaSemanal,diasMora,setDiasMora,promo51,setPromo51,envasesExtra,setEnvasesExtra,proveedores,setProveedores}){

  const[guardado,setGuardado]=useState(false);
