                    Lleva {promoProgresoSel.enCicloActual}/{promo51.cantidadNecesaria} acumulados (entregado){promoAplica?" (este pedido ya lo cuenta si el producto corresponde)":""}. Faltan {promoProgresoSel.faltan}.{promoProgresoSel.pendiente>0&&<span style={{color:AM}}> +{promoProgresoSel.pendiente} en otros pedidos pendientes de entregar.</span>}
                  </div>
                )
              )}
              <PromoDetalleLista detalle={promoProgresoSel&&promoProgresoSel.detalle}/>
            </div>
          )}
 
          {/* Líneas de productos */}
          <div>
            <Lbl t="Productos del pedido"/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {lineas.map((l,idx)=>{
                const prod=prods.find(p=>p.id===l.productoId);
                const sug=l.cantidad&&prod?montoTotal(prod,Number(l.cantidad)):null;
                return(
                  <div key={l.id} style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:14,fontWeight:700,color:MU}}>Ítem {idx+1}</span>
                      {lineas.length>1&&<button onClick={()=>quitarLinea(l.id)} style={{background:"none",border:"none",cursor:"pointer",color:RE,padding:2}}>{I.trash}</button>}
                    </div>
                    <div style={{marginBottom:8}}>
                      <select value={l.productoId} onChange={e=>updateLinea(l.id,"productoId",e.target.value)}>
                        {[...prods].sort((a,b)=>nombreProdEnvase(a).localeCompare(nombreProdEnvase(b))).map(p=><option key={p.id} value={p.id}>{nombreProdEnvase(p)}</option>)}
                      </select>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8}}>
                      <div>
                        <Lbl t={prod&&prod.envase==="Lata"?"Cantidad (u.)":"Cantidad (L)"}/>
                        <input type="number" inputMode="numeric" value={l.cantidad} onChange={e=>updateLinea(l.id,"cantidad",e.target.value)} placeholder={prod&&prod.envase==="Lata"?"12":"12"}/>
                        {prod&&prod.envase==="Lata"&&<div style={{fontSize:11,color:MU,marginTop:2}}>1 lata = 0.50L</div>}
                      </div>
                      <div>
                        <Lbl t="% desc."/>
                        <input type="number" inputMode="numeric" value={l.descuentoPct} onChange={e=>updateLinea(l.id,"descuentoPct",e.target.value)} placeholder="0"/>
                      </div>
                      <div>
                        <Lbl t="Monto ARS"/>
                        <input type="number" inputMode="numeric" value={l.monto} onChange={e=>updateLinea(l.id,"monto",e.target.value)} placeholder={sug||"0"}/>
                        {sug&&!l.monto&&<div style={{fontSize:11,color:G,marginTop:2}}>Sug: {fmtARS(sug)}</div>}
                      </div>
                    </div>
                    {promo51&&promo51.activo&&promo51.productoBonoId===l.productoId&&(
                      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginTop:8,fontSize:13,color:l.esBono?AM:MU}}>
                        <input type="checkbox" checked={l.esBono} onChange={e=>updateLinea(l.id,"esBono",e.target.checked)} style={{width:16,height:16,flexShrink:0,accentColor:AM}}/>
                        🎁 Es el bono de la promo (gratis)
                      </label>
                    )}
                  </div>
                );
              })}
            </div>
            <button onClick={agregarLinea} style={{width:"100%",marginTop:8,padding:"9px 0",borderRadius:8,background:"none",border:`1px dashed ${G}44`,color:G,fontSize:15,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{I.plus}Agregar otro producto</button>
          </div>
 
          {/* Total, descuento e IVA */}
          {totalPedido>0&&(
            <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"12px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:15,color:MU}}>Subtotal · {totalLitros}L</span>
                <span style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(totalPedido)}</span>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
                <div><Lbl t="% descuento"/><input type="number" inputMode="numeric" value={descuentoPct} onChange={e=>setDescuentoPct(e.target.value)} placeholder="0"/></div>
                <label style={{display:"flex",alignItems:"center",gap:8,marginTop:20,cursor:"pointer"}}>
                  <input type="checkbox" checked={incluyeIVA} onChange={e=>setIncluyeIVA(e.target.checked)} style={{width:18,height:18}}/>
                  <span style={{fontSize:14,color:CR,fontWeight:600}}>Agregar IVA (21%)</span>
                </label>
              </div>

              {(descPctNum>0||incluyeIVA)&&(
                <div style={{fontSize:14,color:MU,marginBottom:8}}>
                  {descPctNum>0&&<div>Descuento ({descPctNum}%): <span style={{color:RE,fontWeight:600}}>-{fmtARS(montoDescuento)}</span></div>}
                  {incluyeIVA&&<div>IVA (21%): <span style={{color:G,fontWeight:600}}>+{fmtARS(montoIVA)}</span></div>}
                </div>
              )}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:`1px solid ${G}33`}}>
                <span style={{fontSize:15,fontWeight:700,color:CR}}>Total final</span>
                <span className="bebas" style={{fontSize:24,color:G}}>{fmtARS(totalFinal)}</span>
              </div>
            </div>
          )}
 
          {/* Fecha y hora */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
            <div><Lbl t="Fecha de entrega"/><input type="date" value={fechaEntrega} onChange={e=>setFechaEntrega(e.target.value)}/></div>
            <div><Lbl t="Hora estimada"/><input type="time" value={horaEntrega} onChange={e=>setHoraEntrega(e.target.value)}/></div>
          </div>
 
          {/* Pago */}
          <div><Lbl t="¿Se cobra al momento de la entrega?"/>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8}}>
              <button onClick={()=>setPagado(true)} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${pagado?GR:BO}`,background:pagado?GR+"22":"transparent",color:pagado?GR:MU,fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ Pagado</button>
              <button onClick={()=>setPagado(false)} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${!pagado?AM:BO}`,background:!pagado?AM+"22":"transparent",color:!pagado?AM:MU,fontSize:15,fontWeight:700,cursor:"pointer"}}>Cuenta corriente</button>
            </div>
          </div>

          {/* Ganancia */}
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 12px",fontSize:14,color:MU}}>
            {clienteSel?(comisionPctSel?<>% comisión del cliente: <b style={{color:G}}>{comisionPctSel}%</b>{gananciaEstimadaPedido>0&&<> · Ganancia estimada: <b style={{color:G}}>{fmtARS(gananciaEstimadaPedido)}</b></>}</>:<>Este cliente no tiene % de comisión configurado (se puede cargar en su ficha).</>):"Seleccioná un cliente para ver su % de comisión."}
          </div>
 
          <div><Lbl t="Notas (opcional)"/><textarea rows={2} value={notas} onChange={e=>setNotas(e.target.value)} placeholder="Alguna aclaración para la entrega..."/></div>
          <div style={{display:"flex",gap:8,paddingTop:4}}>
            <Btn variant="ghost" onClick={()=>{setShowNew(false);resetForm();}}>Cancelar</Btn>
            <Btn variant="green" onClick={confirmarPedido} disabled={!clienteId||lineasValidas.length===0}>{I.box}{editandoId?"Guardar cambios":"Confirmar pedido"}</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}
 
// ── PRODUCTOS ─────────────────────────────────────────────────────
function Productos({prods,setProds,promo51,envasesExtra}){
  const envasesTodos=useMemo(()=>[...ENVASES,...(envasesExtra||[])],[envasesExtra]);
  const[editId,setEditId]=useState(null);
  const[ef,setEf]=useState(null);
  const[showPromo,setShowPromo]=useState(null);
  const[pf,setPf]=useState({minCantidad:"",precioUnitario:""});
 
  const[showHist,setShowHist]=useState(null);
  const[showNewProd,setShowNewProd]=useState(false);
  const[np,setNp]=useState({nombre:"",precio:"",marca:"",envase:"PET",descripcion:""});
  const[exportando,setExportando]=useState(false);
  const[vistaLista,setVistaLista]=useState(false);

  // ── Búsqueda, filtros y orden ──
  const[busqueda,setBusqueda]=useState("");
  const[filtroMarca,setFiltroMarca]=useState("");
  const[filtroEnvase,setFiltroEnvase]=useState("");
  const[orden,setOrden]=useState("nombre-asc");

  const marcasDisponibles=useMemo(()=>[...new Set(prods.map(p=>(p.marca||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),[prods]);
  const envasesDisponibles=useMemo(()=>[...new Set(prods.map(p=>p.envase||"PET").filter(Boolean))].sort((a,b)=>a.localeCompare(b)),[prods]);
  const hayFiltrosProd=busqueda||filtroMarca||filtroEnvase||orden!=="nombre-asc";

  const prodsFiltrados=useMemo(()=>{
    const q=busqueda.trim().toLowerCase();
    let lista=prods.filter(p=>{
      if(filtroMarca&&(p.marca||"")!==filtroMarca)return false;
      if(filtroEnvase&&(p.envase||"PET")!==filtroEnvase)return false;
      if(q){
        const texto=`${p.nombre||""} ${p.marca||""} ${p.envase||""} ${p.descripcion||""}`.toLowerCase();
        if(!texto.includes(q))return false;
      }
      return true;
    });
    lista=[...lista].sort((a,b)=>{
      switch(orden){
        case"nombre-desc":return(b.nombre||"").localeCompare(a.nombre||"");
        case"precio-asc":return(a.precio||0)-(b.precio||0);
        case"precio-desc":return(b.precio||0)-(a.precio||0);
        case"marca":return(a.marca||"").localeCompare(b.marca||"")||(a.nombre||"").localeCompare(b.nombre||"");
        default:return(a.nombre||"").localeCompare(b.nombre||"");
      }
    });
    return lista;
  },[prods,busqueda,filtroMarca,filtroEnvase,orden]);

  const limpiarFiltrosProd=()=>{setBusqueda("");setFiltroMarca("");setFiltroEnvase("");setOrden("nombre-asc");};

  const compartirCatalogo=async()=>{
    setExportando(true);
    try{ await compartirCatalogoPDF(prodsFiltrados,promo51); }finally{ setExportando(false); }
  };

  const crearProducto=()=>{
    const nombre=(np.nombre||"").trim();
    const precio=Number(np.precio);
    if(!nombre||!precio||precio<=0)return;
    const nuevoId=uid();
    setProds(prev=>[...prev,{
      id:nuevoId,nombre,precio,
      marca:(np.marca||"").trim(),envase:np.envase||"PET",descripcion:(np.descripcion||"").trim(),
      promos:[],historialPrecios:[],stock:0,
    }]);
    setNp({nombre:"",precio:"",marca:"",envase:"PET",descripcion:""});
    setShowNewProd(false);
  };

  const startEdit=p=>{setEditId(p.id);setEf({...p});};
  const saveEdit=()=>{
    setProds(prev=>prev.map(p=>{
      if(p.id!==editId)return p;
      const precioAnterior=Number(p.precio)||0;
      const precioIngresado=Number(ef.precio);
      const precioValido=!isNaN(precioIngresado)&&precioIngresado>0;
      const precioNuevo=precioValido?precioIngresado:precioAnterior;
      const historialPrecios=p.historialPrecios||[];
      const huboCambio=precioValido&&precioNuevo!==precioAnterior;
      return{
        ...ef,
        precio:precioNuevo,
        historialPrecios:huboCambio
          ?[{id:uid(),precioAnterior,precioNuevo,fecha:new Date().toISOString()},...historialPrecios]
          :historialPrecios,
      };
    }));
    setEditId(null);
  };
  const agregarPromo=prodId=>{
    if(!pf.minCantidad||!pf.precioUnitario)return;
    setProds(prev=>prev.map(p=>p.id===prodId?{...p,promos:[...(p.promos||[]),{id:uid(),minCantidad:Number(pf.minCantidad),precioUnitario:Number(pf.precioUnitario)}].sort((a,b)=>a.minCantidad-b.minCantidad)}:p));
    setPf({minCantidad:"",precioUnitario:""});setShowPromo(null);
  };
  const eliminarPromo=(prodId,promoId)=>setProds(prev=>prev.map(p=>p.id===prodId?{...p,promos:(p.promos||[]).filter(pr=>pr.id!==promoId)}:p));
 
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:10,flexWrap:"wrap"}}>
        <div style={{minWidth:0}}>
          <span className="bebas" style={{fontSize:30,color:CR,display:"block"}}>Productos</span>
          <p style={{fontSize:14,color:MU}}>Precios y promos por volumen</p>
        </div>
        <div style={{display:"flex",gap:8,flexShrink:0,flexWrap:"wrap"}}>
          <Btn onClick={()=>setVistaLista(v=>!v)} small variant={vistaLista?"green":"ghost"}>📋{vistaLista?"Tarjetas":"Lista de precios"}</Btn>
          <Btn onClick={compartirCatalogo} small variant="ghost" disabled={exportando||prodsFiltrados.length===0}>{I.share}{exportando?"...":`Catálogo${hayFiltrosProd?` (${prodsFiltrados.length})`:""}`}</Btn>
          <Btn onClick={()=>{setNp({nombre:"",precio:"",marca:"",envase:"PET",descripcion:""});setShowNewProd(true);}} small>{I.plus}Nuevo</Btn>
        </div>
      </div>
      <div style={{marginBottom:16}}/>

      {/* ── Búsqueda, filtros y orden ── */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:14,marginBottom:16}}>
        <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="🔎 Buscar por nombre, marca, envase o estilo..." style={{marginBottom:10}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
          <div>
            <Lbl t="Marca"/>
            <select value={filtroMarca} onChange={e=>setFiltroMarca(e.target.value)}>
              <option value="">Todas</option>
              {marcasDisponibles.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <div>
            <Lbl t="Envase"/>
            <select value={filtroEnvase} onChange={e=>setFiltroEnvase(e.target.value)}>
              <option value="">Todos</option>
              {envasesDisponibles.map(v=><option key={v} value={v}>{v}</option>)}
            </select>
          </div>
        </div>
        <div>
          <Lbl t="Ordenar por"/>
          <select value={orden} onChange={e=>setOrden(e.target.value)}>
            <option value="nombre-asc">Nombre (A-Z)</option>
            <option value="nombre-desc">Nombre (Z-A)</option>
            <option value="marca">Marca</option>
            <option value="precio-asc">Precio (menor a mayor)</option>
            <option value="precio-desc">Precio (mayor a menor)</option>
          </select>
        </div>
        {hayFiltrosProd&&(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
            <span style={{fontSize:13,color:MU}}>{prodsFiltrados.length} de {prods.length} producto{prods.length!==1?"s":""}</span>
            <button onClick={limpiarFiltrosProd} style={{fontSize:13,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>✕ Limpiar</button>
          </div>
        )}
        <div style={{fontSize:12,color:G,marginTop:8,lineHeight:1.4}}>💡 El botón "Catálogo" exporta el PDF con estos mismos filtros y este mismo orden.</div>
      </div>

      {prodsFiltrados.length===0&&(
        <p style={{textAlign:"center",color:MU,fontSize:15,padding:"30px 0"}}>Ningún producto coincide con la búsqueda o los filtros.</p>
      )}

      {vistaLista&&prodsFiltrados.length>0&&(
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
          {prodsFiltrados.map((p,i)=>(
            <button key={p.id} onClick={()=>{startEdit(p);setVistaLista(false);}} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"12px 16px",background:"none",border:"none",borderBottom:i<prodsFiltrados.length-1?`1px solid ${BO}`:"none",cursor:"pointer",textAlign:"left"}}>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:15,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</div>
                <div style={{fontSize:12,color:MU,marginTop:2}}>{p.marca||"Sin marca"} · {p.envase||"PET"}</div>
              </div>
              <div style={{fontSize:18,fontWeight:700,color:G,flexShrink:0}} className="bebas">{fmtARS(p.precio||0)}</div>
            </button>
          ))}
        </div>
      )}

      {!vistaLista&&prodsFiltrados.map(p=>(
        <div key={p.id} style={{background:CA,border:`1px solid ${editId===p.id?G:BO}`,borderRadius:18,padding:16,marginBottom:12}}>
          {editId===p.id?(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div><Lbl t="Nombre"/><input value={ef.nombre} onChange={e=>setEf(x=>({...x,nombre:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
                <div><Lbl t="Marca"/><input value={ef.marca||""} onChange={e=>setEf(x=>({...x,marca:e.target.value}))} placeholder="Ej: Farol"/></div>
                <div><Lbl t="Envase"/><select value={ef.envase||"PET"} onChange={e=>setEf(x=>({...x,envase:e.target.value}))}>{envasesTodos.map(v=><option key={v}>{v}</option>)}</select></div>
              </div>
              <div><Lbl t="Precio base (ARS/L)"/><input type="number" value={ef.precio} onChange={e=>setEf(x=>({...x,precio:e.target.value}))}/></div>
              <div><Lbl t="Descripción corta (estilo, sabor)"/><input value={ef.descripcion||""} onChange={e=>setEf(x=>({...x,descripcion:e.target.value}))} placeholder="Ej: Rubia liviana, notas cítricas, 5% ABV" maxLength={90}/></div>
              <div style={{display:"flex",gap:8}}><Btn variant="ghost" onClick={()=>setEditId(null)}>Cancelar</Btn><Btn onClick={saveEdit}>Guardar</Btn></div>
            </div>
          ):(
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div>
                  <div style={{fontSize:17,fontWeight:700,color:CR}}>{p.nombre}</div>
                  <div style={{fontSize:14,color:MU,marginTop:2}}>{p.marca||"Farol"} · {p.envase||"PET"}</div>
                  {p.descripcion&&<div style={{fontSize:14,color:MU,marginTop:3,fontStyle:"italic"}}>{p.descripcion}</div>}
                </div>
                <div style={{display:"flex",gap:4,flexShrink:0}}>
                  <button onClick={()=>startEdit(p)} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:MU}}>{I.edit}</button>
                  <button onClick={()=>{if(window.confirm(`¿Eliminar "${p.nombre}" del catálogo? Esta acción no se puede deshacer.`))setProds(prev=>prev.filter(x=>x.id!==p.id));}} style={{padding:8,background:"none",border:"none",cursor:"pointer",color:RE}}>{I.trash}</button>
                </div>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                    <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.08em"}}>Precio base</div>
                    {(p.historialPrecios||[]).length>0&&(
                      <button onClick={()=>setShowHist(showHist===p.id?null:p.id)} title="Ver historial de precios" style={{background:"none",border:"none",cursor:"pointer",color:showHist===p.id?G:MU,padding:2,display:"flex",alignItems:"center"}}>
                        {I.clock}
                      </button>
                    )}
                  </div>
                  <div className="bebas" style={{fontSize:24,color:G}}>{fmtARS(p.precio)}<span style={{fontSize:14,color:MU,fontWeight:400}}> /L</span></div>
                </div>
              </div>
              {/* Historial de precios */}
              {showHist===p.id&&(
                <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:10,padding:12,marginBottom:12}}>
                  <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,display:"flex",alignItems:"center",gap:5}}>{I.clock}Historial de precios</div>
                  {(p.historialPrecios||[]).length===0?(
                    <p style={{fontSize:14,color:MU,fontStyle:"italic"}}>Sin cambios registrados.</p>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:220,overflowY:"auto"}}>
                      {(p.historialPrecios||[]).map(h=>{
                        const anterior=Number(h.precioAnterior)||0,nuevo=Number(h.precioNuevo)||0;
                        const subio=nuevo>anterior;
                        return(
                          <div key={h.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:SU,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px"}}>
                            <div style={{fontSize:14,color:MU}}>{fmtDateTime(h.fecha)}</div>
                            <div style={{fontSize:15,fontWeight:600,color:CR,display:"flex",alignItems:"center",gap:5}}>
                              <span style={{color:MU,textDecoration:"line-through"}}>{fmtARS(anterior)}</span>
                              <span style={{color:subio?RE:GR}}>→ {fmtARS(nuevo)}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
              {/* Promos por volumen */}
              <div style={{marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Precios por volumen</div>
                {(p.promos||[]).length===0?<p style={{fontSize:14,color:MU,fontStyle:"italic"}}>Sin promos configuradas.</p>:(p.promos||[]).map(pr=>(
                  <div key={pr.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                    <span style={{fontSize:15,color:CR}}>Desde {pr.minCantidad}L → {fmtARS(pr.precioUnitario)}/L</span>
                    <button onClick={()=>eliminarPromo(p.id,pr.id)} style={{background:"none",border:"none",cursor:"pointer",color:RE,padding:4}}>{I.trash}</button>
                  </div>
                ))}
                {showPromo===p.id?(
                  <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr) auto",gap:8,marginTop:8}}>
                    <div><Lbl t="Desde (L)"/><input type="number" value={pf.minCantidad} onChange={e=>setPf(x=>({...x,minCantidad:e.target.value}))} placeholder="48"/></div>
                    <div><Lbl t="Precio/L"/><input type="number" value={pf.precioUnitario} onChange={e=>setPf(x=>({...x,precioUnitario:e.target.value}))} placeholder="1400"/></div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:6}}>
                      <button onClick={()=>agregarPromo(p.id)} style={{padding:"10px 12px",borderRadius:8,background:G,color:"#fff",border:"none",fontWeight:700,cursor:"pointer"}}>{I.check}</button>
                      <button onClick={()=>setShowPromo(null)} style={{padding:"10px 10px",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,cursor:"pointer"}}>{I.x}</button>
                    </div>
                  </div>
                ):(
                  <button onClick={()=>setShowPromo(p.id)} style={{marginTop:8,fontSize:14,color:G,background:"none",border:`1px dashed ${G}44`,borderRadius:8,padding:"7px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>{I.plus}Agregar precio por volumen</button>
                )}
              </div>
            </>
          )}
        </div>
      ))}
      <Modal open={showNewProd} onClose={()=>setShowNewProd(false)} title="Nuevo producto">
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><Lbl t="Nombre"/><input value={np.nombre} onChange={e=>setNp(x=>({...x,nombre:e.target.value}))} placeholder="Ej: Stout Malandra" autoFocus/></div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
            <div><Lbl t="Marca"/><input value={np.marca} onChange={e=>setNp(x=>({...x,marca:e.target.value}))} placeholder="Ej: Farol"/></div>
            <div><Lbl t="Envase"/><select value={np.envase} onChange={e=>setNp(x=>({...x,envase:e.target.value}))}>{envasesTodos.map(v=><option key={v}>{v}</option>)}</select></div>
          </div>
          <div><Lbl t="Precio base (ARS/L)"/><input type="number" inputMode="numeric" value={np.precio} onChange={e=>setNp(x=>({...x,precio:e.target.value}))} placeholder="1500"/></div>
          <div><Lbl t="Descripción corta (estilo, sabor)"/><input value={np.descripcion} onChange={e=>setNp(x=>({...x,descripcion:e.target.value}))} placeholder="Ej: Rubia liviana, notas cítricas, 5% ABV" maxLength={90}/></div>
          <div style={{display:"flex",gap:8,paddingTop:4}}>
            <Btn variant="ghost" onClick={()=>setShowNewProd(false)}>Cancelar</Btn>
            <Btn onClick={crearProducto} disabled={!np.nombre.trim()||!np.precio||Number(np.precio)<=0}>{I.plus}Crear producto</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}
 
// ── BUSCADOR MAPS ─────────────────────────────────────────────────
function BuscadorMaps({prospectos,setProspectos}){
  const[modo,setModo]=useState("zona");
  const[tipo,setTipo]=useState("");
  const[zona,setZona]=useState("");
  const[radioM,setRadioM]=useState(1000);
  const[busqueda,setBusqueda]=useState("");
  const[loading,setLoading]=useState(false);
  const[resultados,setResultados]=useState([]);
  const[nextToken,setNextToken]=useState(null);
  const[loadingMore,setLoadingMore]=useState(false);
  const[error,setError]=useState("");
  const[gpsPos,setGpsPos]=useState(null);
  const[gpsLabel,setGpsLabel]=useState("");
  const[agregados,setAgregados]=useState({});
  const svcRef=React.useRef(null);
  const yaEnCRM=useMemo(()=>new Set(prospectos.map(p=>p._placeId).filter(Boolean)),[prospectos]);
 
  React.useEffect(()=>{
    if(window.google&&!svcRef.current){
      try{const div=document.createElement("div");const map=new window.google.maps.Map(div);svcRef.current=new window.google.maps.places.PlacesService(map);}
      catch(e){console.warn("Places init falló:",e);}
    }
  },[]);
 
  const ZONAS_COORDS={
    "Palermo, Buenos Aires":{lat:-34.5883,lng:-58.4269},"Villa Crespo, Buenos Aires":{lat:-34.5999,lng:-58.4398},
    "Almagro, Buenos Aires":{lat:-34.6088,lng:-58.4218},"Caballito, Buenos Aires":{lat:-34.6196,lng:-58.4411},
    "Flores, Buenos Aires":{lat:-34.6298,lng:-58.4634},"Belgrano, Buenos Aires":{lat:-34.5614,lng:-58.4573},
    "San Telmo, Buenos Aires":{lat:-34.6218,lng:-58.3732},"Boedo, Buenos Aires":{lat:-34.6268,lng:-58.4209},
    "Paternal, Buenos Aires":{lat:-34.5961,lng:-58.4731},"San Isidro, GBA Norte":{lat:-34.4731,lng:-58.5273},
    "Lomas de Zamora, GBA Sur":{lat:-34.7583,lng:-58.3994},"Ramos Mejía, GBA Oeste":{lat:-34.6462,lng:-58.5643},
    "Avellaneda, GBA Sur":{lat:-34.6607,lng:-58.3657},"Quilmes, GBA Sur":{lat:-34.7206,lng:-58.2537},
  };
  const TIPOS_LIST=["pizzería","bar","parrilla","kiosco","almacén","restaurante","bodegón","autoservicio"];
  const ZONAS_LIST=Object.keys(ZONAS_COORDS);
 
  function buscarPorZona(){
    if(!svcRef.current)return;
    setLoading(true);setError("");setResultados([]);setNextToken(null);
    const query=busqueda.trim()||`${tipo||"comercio"} en ${zona||"Buenos Aires"}`;
    const coords=ZONAS_COORDS[zona]||{lat:-34.6037,lng:-58.3816};
    svcRef.current.textSearch({query,location:new window.google.maps.LatLng(coords.lat,coords.lng),radius:5000},(results,status,pagination)=>{
      setLoading(false);
      if(status==="OK"){setResultados(results);setNextToken(pagination?.hasNextPage?pagination:null);}
      else setError("Sin resultados. Probá otra búsqueda o zona.");
    });
  }
  function buscarCerca(){
    if(!gpsPos){activarGPS();return;}
    if(!svcRef.current)return;
    setLoading(true);setError("");setResultados([]);setNextToken(null);
    svcRef.current.nearbySearch({location:new window.google.maps.LatLng(gpsPos.lat,gpsPos.lng),radius:radioM,keyword:tipo||"restaurante"},(results,status,pagination)=>{
      setLoading(false);
      if(status==="OK"){setResultados(results);setNextToken(pagination?.hasNextPage?pagination:null);}
      else setError("Sin resultados cerca. Probá aumentar el radio.");
    });
  }
  function cargarMas(){
    if(!nextToken)return;setLoadingMore(true);
    setTimeout(()=>{nextToken.nextPage((results,status,pagination)=>{setLoadingMore(false);if(status==="OK"){setResultados(prev=>[...prev,...results]);setNextToken(pagination?.hasNextPage?pagination:null);}else setNextToken(null);});},2000);
  }
  function activarGPS(){
    if(!navigator.geolocation){setError("Tu dispositivo no soporta GPS.");return;}
    setLoading(true);
    navigator.geolocation.getCurrentPosition(pos=>{
      const{latitude:lat,longitude:lng}=pos.coords;setGpsPos({lat,lng});
      const gc=new window.google.maps.Geocoder();gc.geocode({location:{lat,lng}},(res,st)=>{if(st==="OK"&&res[0])setGpsLabel(res[0].formatted_address);else setGpsLabel(`${lat.toFixed(4)}, ${lng.toFixed(4)}`);});
      setLoading(false);
    },()=>{setLoading(false);setError("No se pudo obtener la ubicación. Activá el GPS.");});
  }
  function buscar(){if(modo==="zona")buscarPorZona();else buscarCerca();}
  function agregarProspecto(lugar){
    const dir=lugar.formatted_address||lugar.vicinity||"";
    const zonaDetectada=Object.keys(ZONAS_COORDS).find(z=>dir.toLowerCase().includes(z.split(",")[0].toLowerCase()))||"CABA Centro";
    const types=lugar.types||[];let rubro="Otro";
    if(types.includes("bar"))rubro="Bar";else if(types.includes("convenience_store"))rubro="Kiosco";
    else if(types.includes("grocery_or_supermarket")||types.includes("supermarket"))rubro="Almacén";
    else if(lugar.name.toLowerCase().includes("pizza"))rubro="Pizzería";else if(lugar.name.toLowerCase().includes("parri"))rubro="Parrilla";
    else if(lugar.name.toLowerCase().includes("bodeg"))rubro="Bodegón";else if(types.includes("restaurant")||types.includes("food"))rubro="Restobar";
    const nuevo={id:uid(),_placeId:lugar.place_id,nombre:lugar.name,rubro,zona:zonaDetectada,direccion:dir,telefono:(lugar.formatted_phone_number||"").replace(/\s|-/g,"").replace(/^0/,"54").replace(/^\+/,""),notas:`Google Maps · Rating: ${lugar.rating||"N/D"} ⭐ (${lugar.user_ratings_total||0} reseñas).`,estado:"Por contactar"};
    setProspectos(prev=>[...prev,nuevo]);setAgregados(prev=>({...prev,[lugar.place_id]:true}));
  }
  function stars(r){if(!r)return"";const full=Math.round(r);return"★".repeat(full)+"☆".repeat(5-full);}
 
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:30,color:CR,display:"block",marginBottom:4}}>Buscar en Maps</span>
      <p style={{fontSize:14,color:MU,marginBottom:16}}>Encontrá comercios reales con Google Places y agregalos a tu pipeline.</p>
      <div style={{display:"flex",gap:0,marginBottom:16,background:SU,border:`1px solid ${BO}`,borderRadius:10,padding:4}}>
        {[{k:"zona",l:"📍 Por zona"},{k:"cerca",l:"🎯 Cerca de mí"}].map(t=>(
          <button key={t.k} onClick={()=>setModo(t.k)} style={{flex:1,padding:"8px",borderRadius:7,border:"none",fontSize:15,fontWeight:700,background:modo===t.k?G:"transparent",color:modo===t.k?"#fff":MU,transition:"all 0.2s"}}>{t.l}</button>
        ))}
      </div>
      {modo==="zona"&&(
        <div>
          <div style={{marginBottom:10}}><Lbl t="¿Qué comercio buscás?"/><input value={tipo} onChange={e=>setTipo(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="Ej: pizzería, bar, kiosco..." list="tipos-sug"/><datalist id="tipos-sug">{TIPOS_LIST.map(t=><option key={t} value={t}/>)}</datalist></div>
          <div style={{marginBottom:10}}><Lbl t="¿En qué zona?"/><input value={zona} onChange={e=>setZona(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="Ej: Palermo, San Isidro, Lomas..." list="zonas-sug"/><datalist id="zonas-sug">{ZONAS_LIST.map(z=><option key={z} value={z}/>)}</datalist></div>
          <div style={{marginBottom:10}}><Lbl t="O búsqueda libre (opcional)"/><div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:MU,pointerEvents:"none"}}>{I.search}</span><input style={{paddingLeft:36}} placeholder='Ej: "pizzerías en Villa del Parque"' value={busqueda} onChange={e=>setBusqueda(e.target.value)} onKeyDown={e=>e.key==="Enter"&&buscar()}/></div><div style={{fontSize:13,color:MU,marginTop:4}}>Si completás este campo sobreescribe los de arriba</div></div>
        </div>
      )}
      {modo==="cerca"&&(
        <div>
          <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:14,marginBottom:10,display:"flex",alignItems:"center",gap:10}}><div style={{color:G}}>{I.map}</div><div style={{flex:1}}><div style={{fontSize:16,fontWeight:600,color:CR}}>Usar mi ubicación actual</div>{gpsLabel?<div style={{fontSize:14,color:GR,marginTop:2}}>✓ {gpsLabel}</div>:<div style={{fontSize:14,color:MU,marginTop:2}}>Activá el GPS para buscar cerca tuyo</div>}</div><button onClick={activarGPS} style={{padding:"7px 14px",borderRadius:8,background:gpsPos?GR+"22":G+"22",color:gpsPos?GR:G,border:`1px solid ${gpsPos?GR+"44":G+"44"}`,fontSize:15,fontWeight:700}}>{gpsPos?"GPS activo":"Activar GPS"}</button></div>
          <div style={{marginBottom:10}}><Lbl t="¿Qué comercio buscás?"/><input value={tipo} onChange={e=>setTipo(e.target.value)} placeholder="Ej: pizzería, bar, parrilla..." list="tipos-sug-c" onKeyDown={e=>e.key==="Enter"&&buscar()}/><datalist id="tipos-sug-c">{TIPOS_LIST.map(t=><option key={t} value={t}/>)}</datalist></div>
          <div><Lbl t="Radio de búsqueda"/><select value={radioM} onChange={e=>setRadioM(Number(e.target.value))}><option value={500}>500 metros</option><option value={1000}>1 km</option><option value={2000}>2 km</option><option value={5000}>5 km</option></select></div>
        </div>
      )}
      <button onClick={buscar} disabled={loading||(modo==="cerca"&&!gpsPos)} style={{width:"100%",padding:"13px",borderRadius:10,background:G,color:"#fff",fontSize:17,fontWeight:700,border:"none",marginTop:16,marginBottom:20,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:(loading||(modo==="cerca"&&!gpsPos))?0.6:1}}>
        {loading?<><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span>Buscando...</>:<>{I.search}Buscar en Google Maps</>}
      </button>
      {error&&<div style={{background:RE+"22",border:`1px solid ${RE}44`,borderRadius:8,padding:"10px 14px",fontSize:15,color:"#E08070",marginBottom:16}}>{error}</div>}
      {resultados.length>0&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontSize:16,fontWeight:600,color:CR}}>{resultados.length} resultados</span><span style={{fontSize:14,color:MU}}>{tipo}s · {modo==="zona"?zona:"cerca de vos"}</span></div>
          {resultados.map(r=>{
            const yaAgregado=agregados[r.place_id]||yaEnCRM.has(r.place_id);
            return(
              <div key={r.place_id} style={{background:CA,border:`1px solid ${yaAgregado?GR+"44":BO}`,borderRadius:18,padding:14,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
                  <div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:700,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div><div style={{fontSize:14,color:MU,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.formatted_address||r.vicinity||""}</div></div>
                  {yaAgregado&&<span style={{fontSize:13,fontWeight:700,color:GR,background:GR+"22",padding:"3px 8px",borderRadius:4,flexShrink:0}}>En CRM ✓</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,flexWrap:"wrap"}}>
                  {r.rating&&<span style={{fontSize:15,color:"#E0AA40"}}>{stars(r.rating)} <span style={{color:MU}}>{r.rating} ({r.user_ratings_total||0})</span></span>}
                  {r.opening_hours&&<span style={{fontSize:14,fontWeight:600,color:r.opening_hours.open_now?GR:RE}}>{r.opening_hours.open_now?"● Abierto":"● Cerrado"}</span>}
                  {r.formatted_phone_number&&<span style={{fontSize:14,color:MU}}>{I.phone}{r.formatted_phone_number}</span>}
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <a href={`https://maps.google.com/?place_id=${r.place_id}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:14,padding:"6px 10px",borderRadius:6,color:MU,background:"none",border:`1px solid ${BO}`,textDecoration:"none"}}>{I.map}Ver en Maps</a>
                  {!yaAgregado?<button onClick={()=>agregarProspecto(r)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"6px 12px",borderRadius:6,color:G,background:G+"11",border:`1px solid ${G}33`}}>{I.plus}Agregar a Prospectos</button>:<span style={{fontSize:14,color:GR,alignSelf:"center",padding:"0 4px"}}>✓ Ya está en tu pipeline</span>}
                </div>
              </div>
            );
          })}
          {nextToken&&<button onClick={cargarMas} disabled={loadingMore} style={{width:"100%",padding:"10px",borderRadius:8,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:15,cursor:"pointer",marginTop:8}}>{loadingMore?"Cargando...":"Cargar más resultados"}</button>}
        </div>
      )}
    </div>
  );
}
 
// ── SPEECHES ──────────────────────────────────────────────────────
function Speeches({speeches,setSpeeches}){
  const[cat,setCat]=useState("todas");
  const[cp,setCp]=useState(null);
  const[editId,setEditId]=useState(null);
  const[editF,setEditF]=useState(null);
  const[showNew,setShowNew]=useState(false);
  const[nF,setNF]=useState({titulo:"",categoria:"Primer contacto",canal:"WhatsApp",texto:""});
  const CATS=["Primer contacto","Seguimiento","Reactivación","Cierre","Promoción"];
  const cats=["todas",...Array.from(new Set(speeches.map(s=>s.categoria)))];
  const filtered=cat==="todas"?speeches:speeches.filter(s=>s.categoria===cat);
  const copy=s=>{navigator.clipboard?.writeText(s.texto);setCp(s.id);setTimeout(()=>setCp(null),1500);};
  const startEdit=s=>{setEditId(s.id);setEditF({...s});};
  const saveEdit=()=>{setSpeeches(p=>p.map(s=>s.id===editId?{...editF}:s));setEditId(null);};
  const saveNew=()=>{if(!nF.titulo.trim()||!nF.texto.trim())return;setSpeeches(p=>[...p,{id:uid(),...nF}]);setNF({titulo:"",categoria:"Primer contacto",canal:"WhatsApp",texto:""});setShowNew(false);};
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Speeches</span>
        <Btn onClick={()=>setShowNew(true)} small>{I.plus}Nuevo</Btn>
      </div>
      <p style={{fontSize:14,color:MU,marginBottom:16}}>Editá y copiá mensajes. Desde clientes y prospectos los enviás directo a WA.</p>
      <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
        {cats.map(c=><button key={c} onClick={()=>setCat(c)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${cat===c?G:BO}`,background:cat===c?G:"transparent",color:cat===c?"#fff":MU}}>{c==="todas"?"Todos":c}</button>)}
      </div>
      {filtered.map(s=>(
        <div key={s.id} style={{background:CA,border:`1px solid ${editId===s.id?G:BO}`,borderRadius:18,padding:16,marginBottom:10}}>
          {editId===s.id?(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
                <div><Lbl t="Categoría"/><select value={editF.categoria} onChange={e=>setEditF(p=>({...p,categoria:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
                <div><Lbl t="Canal"/><select value={editF.canal} onChange={e=>setEditF(p=>({...p,canal:e.target.value}))}>{["WhatsApp","Instagram"].map(c=><option key={c}>{c}</option>)}</select></div>
              </div>
              <div><Lbl t="Título"/><input value={editF.titulo} onChange={e=>setEditF(p=>({...p,titulo:e.target.value}))}/></div>
              <div><Lbl t="Mensaje"/><textarea rows={7} value={editF.texto} onChange={e=>setEditF(p=>({...p,texto:e.target.value}))}/></div>
              <div style={{display:"flex",gap:8}}><Btn variant="ghost" onClick={()=>setEditId(null)}>Cancelar</Btn><Btn onClick={saveEdit}>Guardar</Btn></div>
            </div>
          ):(
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div><div style={{fontSize:16,fontWeight:600,color:CR}}>{s.titulo}</div><div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:2}}>{s.categoria} · {s.canal}</div></div>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <button onClick={()=>startEdit(s)} style={{padding:7,background:"none",border:"none",cursor:"pointer",color:MU}}>{I.edit}</button>
                  <button onClick={()=>setSpeeches(p=>p.filter(x=>x.id!==s.id))} style={{padding:7,background:"none",border:"none",cursor:"pointer",color:RE}}>{I.trash}</button>
                  <button onClick={()=>copy(s)} style={{display:"flex",alignItems:"center",gap:4,fontSize:14,fontWeight:700,padding:"6px 10px",borderRadius:6,cursor:"pointer",border:`1px solid ${cp===s.id?"#25D36640":G+"44"}`,background:cp===s.id?"#25D36620":G+"22",color:cp===s.id?"#25D366":G}}>
                    {cp===s.id?<>{I.check}Copiado</>:<>{I.copy}Copiar</>}
                  </button>
                </div>
              </div>
              <div style={{fontSize:15,color:"#A89682",lineHeight:1.65,whiteSpace:"pre-wrap"}}>{s.texto}</div>
            </>
          )}
        </div>
      ))}
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevo speech">
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
            <div><Lbl t="Categoría"/><select value={nF.categoria} onChange={e=>setNF(p=>({...p,categoria:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
            <div><Lbl t="Canal"/><select value={nF.canal} onChange={e=>setNF(p=>({...p,canal:e.target.value}))}>{["WhatsApp","Instagram"].map(c=><option key={c}>{c}</option>)}</select></div>
          </div>
          <div><Lbl t="Título"/><input value={nF.titulo} onChange={e=>setNF(p=>({...p,titulo:e.target.value}))} placeholder="Ej: Propuesta inicial pizzería"/></div>
          <div><Lbl t="Mensaje"/><textarea rows={7} value={nF.texto} onChange={e=>setNF(p=>({...p,texto:e.target.value}))} placeholder="Escribí el mensaje..."/></div>
          <div style={{display:"flex",gap:8,paddingTop:4}}><Btn variant="ghost" onClick={()=>setShowNew(false)}>Cancelar</Btn><Btn onClick={saveNew} disabled={!nF.titulo.trim()||!nF.texto.trim()}>Guardar</Btn></div>
        </div>
      </Modal>
    </div>
  );
}
 
// ── VENTAS ────────────────────────────────────────────────────────
function CuentasCorrientes({clientes,setClientes,diasMora,prods,pedidos}){
  const ctxDesc=useMemo(()=>ctxDescuentos(prods,pedidos),[prods,pedidos]);
  const[expandido,setExpandido]=useState(null);
  const[filtro,setFiltro]=useState("todos"); // todos | vencidos
  const[pagoAbierto,setPagoAbierto]=useState(null); // id del cliente con el panel de pago abierto

  const todasConDeuda=useMemo(()=>clientes
    .map(c=>({cliente:c,deuda:saldoCliente(c),pendientes:(c.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))}))
    .filter(x=>x.deuda>0)
    .map(x=>({...x,vencidas:x.pendientes.filter(v=>daysSince(v.fecha)>=diasMora)}))
    .sort((a,b)=>b.deuda-a.deuda),[clientes,diasMora]);
  const deudaTotal=todasConDeuda.reduce((s,x)=>s+x.deuda,0);
  const clientesVencidos=todasConDeuda.filter(x=>x.vencidas.length>0);
  const deudaVencida=clientesVencidos.reduce((s,x)=>s+x.vencidas.reduce((a,v)=>a+v.monto,0),0);
  const conDeuda=filtro==="vencidos"?clientesVencidos:todasConDeuda;

  // Cobro rápido de una venta puntual, hoy y en efectivo — para otra fecha/medio o pago parcial se usa "Registrar pago".
  const marcarPagada=(clienteId,ventaId)=>setClientes(prev=>prev.map(c=>c.id!==clienteId?c:{...c,ventas:c.ventas.map(v=>v.id===ventaId?{...v,pagado:true,fechaCobro:hoyISO(),medioPago:"Efectivo"}:v)}));
  const actualizarCliente=u=>setClientes(prev=>prev.map(c=>c.id===u.id?u:c));

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:30,color:CR,display:"block",marginBottom:4}}>Cuentas corrientes</span>
      <p style={{fontSize:14,color:MU,marginBottom:16}}>{todasConDeuda.length} cliente{todasConDeuda.length!==1?"s":""} con saldo pendiente</p>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:16}}>
        <div style={{background:CA,border:`1px solid ${RE}33`,borderRadius:18,padding:16}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Total pendiente</div>
          <div className="bebas" style={{fontSize:24,color:"#C24545"}}>{fmtARS(deudaTotal)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${clientesVencidos.length>0?"#C6282866":BO}`,borderRadius:18,padding:16}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>⚠ Vencido (+{diasMora}d)</div>
          <div className="bebas" style={{fontSize:24,color:clientesVencidos.length>0?"#C62828":CR}}>{fmtARS(deudaVencida)}</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:18}}>
        <button onClick={()=>setFiltro("todos")} style={{flex:1,padding:"8px 0",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtro==="todos"?G:BO}`,background:filtro==="todos"?G+"18":"none",color:filtro==="todos"?G:MU}}>Todos ({todasConDeuda.length})</button>
        <button onClick={()=>setFiltro("vencidos")} style={{flex:1,padding:"8px 0",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${filtro==="vencidos"?"#C62828":BO}`,background:filtro==="vencidos"?"#C6282818":"none",color:filtro==="vencidos"?"#C62828":MU}}>⚠ Vencidos ({clientesVencidos.length})</button>
      </div>

      {conDeuda.length===0?(
        <p style={{color:MU,textAlign:"center",padding:"40px 0",fontSize:16}}>{filtro==="vencidos"?"🎉 No hay cuentas vencidas.":"🎉 No hay cuentas pendientes. Todo cobrado."}</p>
      ):conDeuda.map(({cliente,deuda,pendientes,vencidas})=>{
        const abierto=expandido===cliente.id;
        const tieneVencidas=vencidas.length>0;
        return(
          <div key={cliente.id} style={{background:CA,border:`1px solid ${tieneVencidas?"#C6282866":BO}`,borderRadius:18,overflow:"hidden",marginBottom:10}}>
            <button onClick={()=>setExpandido(abierto?null:cliente.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:14,background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:RE+"15",color:"#C24545",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,flexShrink:0}}>{iniciales(cliente.nombre)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:16,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cliente.nombre}</div>
                <div style={{fontSize:13,color:tieneVencidas?"#C62828":MU,marginTop:2,fontWeight:tieneVencidas?700:400}}>{tieneVencidas?`⚠ ${vencidas.length} vencida${vencidas.length!==1?"s":""} · `:""}{pendientes.length} venta{pendientes.length!==1?"s":""} pendiente{pendientes.length!==1?"s":""}</div>
              </div>
              <div style={{fontSize:16,fontWeight:700,color:"#C24545",flexShrink:0}}>{fmtARS(deuda)}</div>
              <span style={{color:MU,display:"flex",flexShrink:0,transform:abierto?"rotate(90deg)":"none",transition:"transform 0.2s"}}>{I.chev}</span>
            </button>
            {abierto&&(
              <div style={{borderTop:`1px solid ${BO}`,padding:"8px 14px 14px"}}>
                {pendientes.map(v=>{const dias=daysSince(v.fecha),vencida=dias>=diasMora;return(
                  <div key={v.id} style={{padding:"8px 0",borderBottom:`1px solid ${BO}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                      <div style={{fontSize:14,color:vencida?"#C62828":MU,fontWeight:vencida?700:400}}>{fmtDate(v.fecha)} · {v.cantidad}L{vencida?` · vencido ${dias}d`:""}</div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:15,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</span>
                        <button onClick={()=>marcarPagada(cliente.id,v.id)} style={{padding:"5px 10px",borderRadius:8,background:G,color:"#fff",border:"none",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>Cobrado</button>
                      </div>
                    </div>
                    <ChipBeneficio d={desgloseVenta(v,cliente.id,ctxDesc)}/>
                    {!!cliente.comisionPctDefault&&<div style={{fontSize:13,color:G,marginTop:4}}>% comisión ({cliente.comisionPctDefault}%) = {fmtARS(Math.round(v.monto*Number(cliente.comisionPctDefault)/100))}</div>}
                  </div>
                );})}

                <PanelDescuentosCliente items={(cliente.ventas||[]).map(v=>({v,d:desgloseVenta(v,cliente.id,ctxDesc)}))}/>
                {vencidas.length>0&&cliente.telefono&&(
                  <a href={waLink(cliente.telefono,mensajeRecordatorioDeuda(cliente,deuda,diasMora))} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"9px 0",borderRadius:8,fontSize:13,fontWeight:700,background:"#25D36620",color:"#25D366",border:"1px solid #25D36640",textDecoration:"none",marginTop:10}}>{I.wa} Recordar deuda por WhatsApp</a>
                )}

                {pagoAbierto===cliente.id?(
                  <div style={{marginTop:10}}>
                    <PanelCobro cliente={cliente} onUpdate={actualizarCliente} onDone={()=>setPagoAbierto(null)}/>
                  </div>
                ):(
                  <button onClick={()=>setPagoAbierto(cliente.id)} style={{width:"100%",marginTop:10,padding:"10px 0",borderRadius:10,background:G,color:"#fff",border:"none",fontSize:14,fontWeight:700,cursor:"pointer"}}>💰 Registrar pago</button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Caja({clientes,setClientes,prods,comisiones,setComisiones,pedidos}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const todas=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,clienteId:c.id,clienteNombre:c.nombre,comisionPct:Number(c.comisionPctDefault)||0}))),[clientes]);
  const clientesSinComision=useMemo(()=>clientes.filter(c=>(c.ventas||[]).length>0&&!Number(c.comisionPctDefault)),[clientes]);
  const totalFacturado=todas.reduce((s,v)=>s+(v.monto||0),0);
  const totalGanancia=todas.reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);
  const gananciaCobrada=todas.filter(v=>v.pagado).reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);
  const gananciaPendiente=totalGanancia-gananciaCobrada;

  // Liquidación de comisiones: la fábrica te paga en montos sueltos, sin relación 1 a 1 con ventas puntuales.
  // Se lleva como una cuenta corriente aparte: DEBE = ganancia cobrada acumulada, HABER = liquidaciones registradas (monto libre).
  const liquidacionesOrdenadas=useMemo(()=>[...(comisiones||[])].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)||String(a.id).localeCompare(String(b.id))),[comisiones]);
  const totalLiquidado=liquidacionesOrdenadas.reduce((s,l)=>s+(Number(l.monto)||0),0);
  const pendienteLiquidar=gananciaCobrada-totalLiquidado;

  // Recordatorio: hace cuánto no se liquida con la fábrica, y qué ventas cobradas sustentan lo pendiente
  // (todo lo cobrado a clientes después de la última liquidación registrada; si nunca liquidaste, todo el historial).
  const ultimaLiquidacion=liquidacionesOrdenadas.length?liquidacionesOrdenadas[liquidacionesOrdenadas.length-1]:null;
  const ventasCobradasOrdenadas=useMemo(()=>todas.filter(v=>v.pagado).sort((a,b)=>new Date(a.fechaCobro||a.fecha)-new Date(b.fechaCobro||b.fecha)),[todas]);
  const diasDesdeUltimaLiquidacion=ultimaLiquidacion?daysSince(ultimaLiquidacion.fecha):(ventasCobradasOrdenadas[0]?daysSince(ventasCobradasOrdenadas[0].fechaCobro||ventasCobradasOrdenadas[0].fecha):null);
  const sugerirLiquidar=pendienteLiquidar>0&&diasDesdeUltimaLiquidacion!==null&&diasDesdeUltimaLiquidacion>=PERIODO_LIQUIDACION_DIAS;
  const ventasParaSolicitud=useMemo(()=>ventasCobradasOrdenadas.filter(v=>!ultimaLiquidacion||(v.fechaCobro||v.fecha)>ultimaLiquidacion.fecha),[ventasCobradasOrdenadas,ultimaLiquidacion]);
  const[generandoSolicitud,setGenerandoSolicitud]=useState(false);
  const generarSolicitudLiquidacion=async()=>{
    setGenerandoSolicitud(true);
    try{
      await compartirSolicitudLiquidacionPDF(ventasParaSolicitud,{desde:ultimaLiquidacion?ultimaLiquidacion.fecha:(ventasParaSolicitud[0]&&(ventasParaSolicitud[0].fechaCobro||ventasParaSolicitud[0].fecha)),hasta:hoyISO(),pendiente:pendienteLiquidar},()=>{});
    }finally{
      setGenerandoSolicitud(false);
    }
  };

  const[showLiquidar,setShowLiquidar]=useState(false);
  const[showMensualComision,setShowMensualComision]=useState(false);
  const[showHistorialComision,setShowHistorialComision]=useState(false);
  const[montoLiquidar,setMontoLiquidar]=useState("");
  const[fechaLiquidar,setFechaLiquidar]=useState(hoyISO());
  const[notaLiquidar,setNotaLiquidar]=useState("");
  const abrirLiquidar=()=>{setMontoLiquidar(pendienteLiquidar>0?String(pendienteLiquidar):"");setFechaLiquidar(hoyISO());setNotaLiquidar("");setShowLiquidar(true);};
  const confirmarLiquidacion=()=>{
    const monto=Number(montoLiquidar);
    if(!monto||monto<=0)return;
    setComisiones(prev=>[...(prev||[]),{id:uid(),fecha:fechaLiquidar||hoyISO(),monto,nota:notaLiquidar.trim()}]);
    setShowLiquidar(false);setMontoLiquidar("");setNotaLiquidar("");
  };
  const borrarLiquidacion=id=>{
    if(!confirm("¿Borrar esta liquidación? Esta acción no se puede deshacer."))return;
    setComisiones(prev=>(prev||[]).filter(l=>l.id!==id));
  };
  const movimientosComision=useMemo(()=>{
    const debes=todas.filter(v=>v.pagado).map(v=>({tipo:"debe",fecha:v.fecha,monto:Math.round((v.monto||0)*(v.comisionPct||0)/100),concepto:`Venta ${v.clienteNombre}`}));
    const haberes=liquidacionesOrdenadas.map(l=>({tipo:"haber",fecha:l.fecha,monto:Number(l.monto)||0,concepto:l.nota?`Liquidación — ${l.nota}`:"Liquidación de comisión"}));
    return[...debes,...haberes].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  },[todas,liquidacionesOrdenadas]);

  // Comisiones mes a mes: generado, liquidado y saldo arrastrado (si un mes no se liquida del todo, el saldo sigue acumulado en los meses siguientes)
  const comisionesPorMes=useMemo(()=>{
    const hoyD=new Date();
    const finKey=`${hoyD.getFullYear()}-${String(hoyD.getMonth()+1).padStart(2,"0")}`;
    if(movimientosComision.length===0){
      return[{key:finKey,lbl:hoyD.toLocaleDateString("es-AR",{month:"long",year:"numeric"}),generado:0,liquidado:0,saldo:0}];
    }
    const primeraFecha=movimientosComision.reduce((min,m)=>m.fecha<min?m.fecha:min,movimientosComision[0].fecha);
    const inicioD=new Date(primeraFecha+"T00:00:00");
    const meses=[];
    let d=new Date(inicioD.getFullYear(),inicioD.getMonth(),1);
    const fin=new Date(hoyD.getFullYear(),hoyD.getMonth(),1);
    while(d<=fin){
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"long",year:"numeric"})});
      d=new Date(d.getFullYear(),d.getMonth()+1,1);
    }
    let saldoAcum=0;
    const conSaldo=meses.map(m=>{
      const generado=movimientosComision.filter(x=>x.tipo==="debe"&&(x.fecha||"").slice(0,7)===m.key).reduce((s,x)=>s+x.monto,0);
      const liquidado=movimientosComision.filter(x=>x.tipo==="haber"&&(x.fecha||"").slice(0,7)===m.key).reduce((s,x)=>s+x.monto,0);
      saldoAcum+=generado-liquidado;
      return{...m,generado,liquidado,saldo:saldoAcum};
    });
    return[...conSaldo].reverse(); // más reciente primero
  },[movimientosComision]);
  const mesActualComision=comisionesPorMes[0]||{generado:0,liquidado:0,saldo:0};
  const mesAnteriorComision=comisionesPorMes[1]||null;

  const exportarComisiones=()=>{
    const header="Fecha,Concepto,Debe (ganancia generada),Haber (liquidado),Saldo,Nota";
    const filas=[];
    let saldo=0;
    movimientosComision.forEach(m=>{
      saldo+=m.tipo==="debe"?m.monto:-m.monto;
      filas.push([m.fecha,`"${m.concepto}"`,m.tipo==="debe"?m.monto:"",m.tipo==="haber"?m.monto:"",saldo,""].join(","));
    });
    const blob=new Blob(["\uFEFF"+header+"\n"+filas.join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`comisiones_ctacte_${hoyISO()}.csv`;a.click();
  };
  const[exportandoComisionesPDF,setExportandoComisionesPDF]=useState(false);
  const exportarComisionesPDF=async()=>{
    setExportandoComisionesPDF(true);
    try{
      await compartirComisionesPDF(movimientosComision,{generada:gananciaCobrada,liquidado:totalLiquidado,pendiente:pendienteLiquidar},()=>{});
    }finally{
      setExportandoComisionesPDF(false);
    }
  };

  const hoy=hoyISO();
  const mesActual=hoy.slice(0,7);
  const delMes=todas.filter(v=>(v.fecha||"").slice(0,7)===mesActual);
  const facturadoMes=delMes.reduce((s,v)=>s+(v.monto||0),0);
  const gananciaMes=delMes.reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);

  const dHoy=new Date();
  const dMesAnterior=new Date(dHoy.getFullYear(),dHoy.getMonth()-1,1);
  const mesAnterior=`${dMesAnterior.getFullYear()}-${String(dMesAnterior.getMonth()+1).padStart(2,"0")}`;
  const lblMesAnterior=dMesAnterior.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  const delMesAnterior=todas.filter(v=>(v.fecha||"").slice(0,7)===mesAnterior);
  const facturadoMesAnterior=delMesAnterior.reduce((s,v)=>s+(v.monto||0),0);
  const gananciaMesAnterior=delMesAnterior.reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0);
  const pctVar=(actual,anterior)=>anterior>0?Math.round(((actual-anterior)/anterior)*100):(actual>0?100:0);
  const varFacturado=pctVar(facturadoMes,facturadoMesAnterior);
  const varGanancia=pctVar(gananciaMes,gananciaMesAnterior);

  const litrosMes=delMes.reduce((s,v)=>s+litrosDeItem(v.cantidad,envaseMap[v.producto]),0);
  const topClientesMes=useMemo(()=>{
    const map={};
    delMes.forEach(v=>{map[v.clienteNombre]=(map[v.clienteNombre]||0)+(v.monto||0);});
    return Object.entries(map).map(([nombre,monto])=>({nombre,monto})).sort((a,b)=>b.monto-a.monto).slice(0,5);
  },[delMes]);
  const[exportandoCierre,setExportandoCierre]=useState(false);
  const exportarCierreMensual=async()=>{
    setExportandoCierre(true);
    try{
      const ctxD=ctxDescuentos(prods,pedidos);
      const itemsMes=delMes.map(v=>({v,d:desgloseVenta(v,v.clienteId,ctxD)}));
      const resMes=resumenDescuentos(itemsMes);
      const porClienteMes={};
      itemsMes.forEach(it=>{(porClienteMes[it.v.clienteNombre]=porClienteMes[it.v.clienteNombre]||[]).push(it);});
      const topDescMes=Object.entries(porClienteMes).map(([nombre,its])=>({nombre,...resumenDescuentos(its)})).filter(c=>c.beneficio>0).sort((a,b)=>b.beneficio-a.beneficio).slice(0,5).map(c=>({nombre:c.nombre,beneficio:c.beneficio,pct:c.pct}));
      await compartirCierreMensualPDF({
        desc:{ventas:resMes.ventas,conBeneficio:resMes.conBeneficio,bruto:resMes.bruto,descuento:resMes.descuento,bono:resMes.bono,beneficio:resMes.beneficio,pct:resMes.pct,litrosBono:resMes.litrosBono,estimado:resMes.estimado,top:topDescMes},
        mesLbl:new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"}),
        facturado:facturadoMes,ganancia:gananciaMes,litros:litrosMes,
        facturadoAnterior:facturadoMesAnterior,mesAnteriorLbl:lblMesAnterior,
        topClientes:topClientesMes,
        comision:{generado:mesActualComision.generado,liquidado:mesActualComision.liquidado,saldo:mesActualComision.saldo},
        clientesSinComision:clientesSinComision.length,
      },()=>{});
    }finally{
      setExportandoCierre(false);
    }
  };

  const evolucionGanancia=useMemo(()=>{
    const hoyD=new Date();
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(hoyD.getFullYear(),hoyD.getMonth()-i,1);
      meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"})});
    }
    const map={};
    meses.forEach(m=>map[m.key]=0);
    todas.forEach(v=>{
      const key=(v.fecha||"").slice(0,7);
      if(key in map)map[key]+=Math.round((v.monto||0)*(v.comisionPct||0)/100);
    });
    return meses.map(m=>({...m,ganancia:map[m.key]}));
  },[todas]);
  const maxGananciaMes=Math.max(1,...evolucionGanancia.map(m=>m.ganancia));

  const sinComision=clientesSinComision.length;

  // ── Filtros de análisis ──
  const[fDesde,setFDesde]=useState("");
  const[fHasta,setFHasta]=useState("");
  const[fTipoFecha,setFTipoFecha]=useState("venta"); // venta | cobro
  const[fCliente,setFCliente]=useState("");
  const[fEstado,setFEstado]=useState("todos"); // todos | pagado | pendiente
  const[fComision,setFComision]=useState("todos"); // todos | valor exacto

  const clientesConVentas=useMemo(()=>[...clientes].filter(c=>(c.ventas||[]).length>0).sort((a,b)=>a.nombre.localeCompare(b.nombre)),[clientes]);
  const comisionesDisponibles=useMemo(()=>[...new Set(todas.map(v=>v.comisionPct||0))].sort((a,b)=>a-b),[todas]);
  const hayFiltrosActivos=fDesde||fHasta||fCliente||fEstado!=="todos"||fComision!=="todos";

  const filtradas=useMemo(()=>todas.filter(v=>{
    const fechaComparar=fTipoFecha==="cobro"?v.fechaCobro:v.fecha;
    if(fTipoFecha==="cobro"&&!v.pagado)return false;
    if(fDesde&&(!fechaComparar||fechaComparar<fDesde))return false;
    if(fHasta&&(!fechaComparar||fechaComparar>fHasta))return false;
    if(fCliente&&v.clienteId!==fCliente)return false;
    if(fEstado==="pagado"&&!v.pagado)return false;
    if(fEstado==="pendiente"&&v.pagado)return false;
    if(fComision!=="todos"&&String(v.comisionPct||0)!==fComision)return false;
    return true;
  }).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)),[todas,fDesde,fHasta,fTipoFecha,fCliente,fEstado,fComision]);

  const resumenFiltrado=useMemo(()=>({
    cantidad:filtradas.length,
    litros:filtradas.reduce((s,v)=>s+litrosDeItem(v.cantidad,envaseMap[v.producto]),0),
    facturado:filtradas.reduce((s,v)=>s+(v.monto||0),0),
    ganancia:filtradas.reduce((s,v)=>s+Math.round((v.monto||0)*(v.comisionPct||0)/100),0),
    cobrado:filtradas.filter(v=>v.pagado).reduce((s,v)=>s+(v.monto||0),0),
    pendiente:filtradas.filter(v=>!v.pagado).reduce((s,v)=>s+(v.monto||0),0),
  }),[filtradas]);

  const limpiarFiltros=()=>{setFDesde("");setFHasta("");setFCliente("");setFEstado("todos");setFComision("todos");};

  const exportarFiltrado=()=>{
    const header="Cliente,Fecha venta,Fecha cobro,Producto,Cantidad (L),Monto ARS,% comisión,Ganancia ARS,Estado,Medio de pago";
    const filas=filtradas.map(v=>[
      `"${v.clienteNombre}"`,v.fecha,v.fechaCobro||"",`"${v.producto}"`,v.cantidad,v.monto,v.comisionPct||0,
      Math.round((v.monto||0)*(v.comisionPct||0)/100),v.pagado?"Pagado":"Pendiente",`"${v.medioPago||""}"`
    ].join(","));
    const blob=new Blob(["\uFEFF"+header+"\n"+filas.join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`caja_filtrado_${hoyISO()}.csv`;a.click();
  };

  const mostrar=hayFiltrosActivos?filtradas:[...todas].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,15);

  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <span className="bebas" style={{fontSize:30,color:CR,display:"block",marginBottom:4}}>Caja</span>
      <p style={{fontSize:14,color:MU,marginBottom:20}}>Ventas totales y ganancia según el % de comisión configurado en cada cliente</p>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:16}}>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Total facturado</div>
          <div className="bebas" style={{fontSize:22,color:CR}}>{fmtARS(totalFacturado)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${G}33`,borderRadius:18,padding:16}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ganancia total</div>
          <div className="bebas" style={{fontSize:22,color:G}}>{fmtARS(totalGanancia)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ganancia cobrada</div>
          <div className="bebas" style={{fontSize:22,color:GR}}>{fmtARS(gananciaCobrada)}</div>
        </div>
        <div style={{background:CA,border:`1px solid ${gananciaPendiente>0?RE+"33":BO}`,borderRadius:18,padding:16}}>
          <div style={{fontSize:13,color:MU,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Ganancia pendiente</div>

}

function Ventas({clientes,prods}){
  const envaseMap=useMemo(()=>envaseMapDe(prods),[prods]);
  const todas=useMemo(()=>clientes.flatMap(c=>c.ventas.map(v=>({...v,cn:c.nombre,clienteId:c.id}))).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)),[clientes]);

  // ── Filtros ──
  const[fDesde,setFDesde]=useState("");
  const[fHasta,setFHasta]=useState("");
  const[fCliente,setFCliente]=useState("");
  const[fProducto,setFProducto]=useState("");
  const[fEnvase,setFEnvase]=useState("");
  const[fEstado,setFEstado]=useState("todos"); // todos | pagado | pendiente
  const[fOrden,setFOrden]=useState("fecha-desc");

  const envasesDisponibles=useMemo(()=>Array.from(new Set(prods.map(p=>p.envase||"PET"))).sort(),[prods]);
  const clientesConVentas=useMemo(()=>[...clientes].filter(c=>(c.ventas||[]).length>0).sort((a,b)=>a.nombre.localeCompare(b.nombre)),[clientes]);
  const hayFiltrosVenta=fDesde||fHasta||fCliente||fProducto||fEnvase||fEstado!=="todos"||fOrden!=="fecha-desc";

  const filtradas=useMemo(()=>{
    let lista=todas.filter(v=>{
      if(fDesde&&v.fecha<fDesde)return false;
      if(fHasta&&v.fecha>fHasta)return false;
      if(fCliente&&v.clienteId!==fCliente)return false;
      if(fProducto&&v.producto!==fProducto)return false;
      if(fEnvase&&envaseMap[v.producto]!==fEnvase)return false;
      if(fEstado==="pagado"&&!v.pagado)return false;
      if(fEstado==="pendiente"&&v.pagado)return false;
      return true;
    });
    lista=[...lista].sort((a,b)=>{
      switch(fOrden){
        case"fecha-asc":return new Date(a.fecha)-new Date(b.fecha);
        case"monto-desc":return(b.monto||0)-(a.monto||0);
        case"monto-asc":return(a.monto||0)-(b.monto||0);
        case"cliente":return a.cn.localeCompare(b.cn);
        default:return new Date(b.fecha)-new Date(a.fecha);
      }
    });
    return lista;
  },[todas,fDesde,fHasta,fCliente,fProducto,fEnvase,fEstado,fOrden]);

  const limpiarFiltrosVenta=()=>{setFDesde("");setFHasta("");setFCliente("");setFProducto("");setFEnvase("");setFEstado("todos");setFOrden("fecha-desc");};

  const totalARS=filtradas.reduce((s,v)=>s+v.monto,0);
  const litros=filtradas.reduce((s,v)=>s+litrosDeItem(v.cantidad,envaseMap[v.producto]),0);
  const exportCSV=()=>{const h="Cliente,Fecha,Producto,Cantidad (L),Monto ARS,Pagado\n",r=filtradas.map(v=>`"${v.cn}",${v.fecha},${v.producto},${v.cantidad},${v.monto},${v.pagado?"Sí":"No"}`).join("\n"),b=new Blob([h+r],{type:"text/csv;charset=utf-8;"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`ventas_nomades_${hoyISO()}.csv`;a.click();};
  return(
    <div style={{padding:"24px 16px 90px",maxWidth:640,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span className="bebas" style={{fontSize:30,color:CR}}>Ventas</span>
        <button onClick={exportCSV} style={{fontSize:14,padding:"6px 12px",borderRadius:8,cursor:"pointer",border:`1px solid ${BO}`,background:"none",color:MU}}>Exportar CSV</button>

        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginBottom:10}}>
          <div><Lbl t="Desde"/><input type="date" value={fDesde} onChange={e=>setFDesde(e.target.value)} max={fHasta||undefined}/></div>
          <div><Lbl t="Hasta"/><input type="date" value={fHasta} onChange={e=>setFHasta(e.target.value)} min={fDesde||undefined}/></div>
        </div>
        <div style={{marginBottom:10}}>
          <Lbl t="Cliente"/>
