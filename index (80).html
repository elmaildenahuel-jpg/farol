const LogoNomades=({w,h,style})=><img src={LOGO_NOMADES} alt="Distribuidora Nómades" className="logo-nomades" draggable={false} style={{display:"block",width:w||"auto",height:h||"auto",...style}}/>;

// Dibuja el logo en un PDF (jsPDF). Devuelve el ancho dibujado en mm. Si falla, escribe el nombre en texto para no romper el PDF.
function pdfLogo(doc,x,y,h){
  const w=h*LOGO_ASPECT;
  try{
    doc.addImage(LOGO_NOMADES,"PNG",x,y,w,h,"logo-nomades","FAST");
  }catch(e){
    console.warn("No se pudo dibujar el logo en el PDF:",e);
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.text("DISTRIBUIDORA NÓMADES",x,y+h/2);
  }
  return w;
}
// Logo sobre una cajita blanca (para los encabezados con fondo verde). Devuelve el ancho total de la caja en mm.
function pdfLogoCaja(doc,x,y,boxH){
  const pad=1.6,h=boxH-pad*2,w=h*LOGO_ASPECT;
  doc.setFillColor(255,255,255);
  doc.roundedRect(x,y,w+pad*2,boxH,2,2,"F");
  pdfLogo(doc,x+pad,y+pad,h);
  return w+pad*2;
}

  const rS=RUBRO_SCORE[p.rubro]||6,zS=ZONA_SCORE[p.zona]||10,eS=ESTADO_SCORE[p.estado]||0;
  const telS=p.telefono?15:0,notasS=p.notas&&p.notas.length>30?5:p.notas?2:0;
  return Math.min(100,rS+zS+eS+telS+notasS);
}
function scoreLabel(s){
  if(s>=70)return{l:"Muy alto",c:"#E0AA40"};
  if(s>=55)return{l:"Alto",c:GR};
  if(s>=40)return{l:"Medio",c:AM};
  return{l:"Bajo",c:MU};
}

function precioEfectivo(prod,cantidad){
  if(!prod)return 0;
  const promos=(prod.promos||[]).filter(pr=>cantidad>=pr.minCantidad).sort((a,b)=>b.minCantidad-a.minCantidad);
  return promos.length?promos[0].precioUnitario:prod.precio;
}
function montoTotal(prod,cantidad){ return precioEfectivo(prod,cantidad)*cantidad; }

// ── Helpers ───────────────────────────────────────────────────────
const fmtARS=n=>n.toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const fmtDate=s=>new Date(s+"T00:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"});
const fmtDateCorta=s=>{const d=new Date(s+"T00:00:00");return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;};
const fmtDateTime=iso=>{
  if(!iso)return"—";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"—";
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
};
// ── Catálogo PDF (para compartir por WhatsApp) ──────────────────────
function construirCatalogoPDF(prods,promo51){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const pageW=210,pageH=297,marginX=16;
  const NEGRO=[26,26,26],GRIS=[130,130,130],GRIS_CLARO=[225,225,225],ACENTO=[23,141,79];
  const bonoProd=promo51&&promo51.activo?(prods||[]).find(p=>p.id===promo51.productoBonoId):null;

  let y=0;
  const dibujarHeader=()=>{
    const wLogo=pdfLogo(doc,marginX,4,24);
    const xTxt=marginX+wLogo+7;
    doc.setTextColor(NEGRO[0],NEGRO[1],NEGRO[2]);
    doc.setFont("helvetica","bold");
    doc.setFontSize(17);
    doc.text("LISTA DE PRECIOS",xTxt,17);
    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.setTextColor(GRIS[0],GRIS[1],GRIS[2]);
    doc.text("Cerveza artesanal",xTxt,22.5);
    const fecha=new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
    doc.setFontSize(8.5);
    doc.text(fecha,pageW-marginX,17,{align:"right"});
    doc.setDrawColor(NEGRO[0],NEGRO[1],NEGRO[2]);
    doc.setLineWidth(0.6);
    doc.line(marginX,31,pageW-marginX,31);
    y=41;
  };
  dibujarHeader();
  const asegurarEspacio=h=>{if(y+h>pageH-16){doc.addPage();dibujarHeader();}};

  // Banner de promo general, si no está restringida a un envase puntual (va arriba de todo, una sola vez) — recuadro simple, sin relleno de color
  const bannerPromo=(texto)=>{
    asegurarEspacio(12);
    doc.setDrawColor(NEGRO[0],NEGRO[1],NEGRO[2]);
    doc.setLineWidth(0.35);
    doc.rect(marginX,y,pageW-marginX*2,9.5);
    doc.setFont("helvetica","bold");
    doc.setFontSize(8.5);
    doc.setTextColor(NEGRO[0],NEGRO[1],NEGRO[2]);
    doc.text(texto,marginX+4,y+6,{maxWidth:pageW-marginX*2-8});
    y+=17;
  };
  if(promo51&&promo51.activo&&!promo51.envaseCuenta&&bonoProd){
    bannerPromo(`PROMO: cada ${promo51.cantidadNecesaria} ${promo51.marcaCuenta} te regalamos ${promo51.cantidadBono>1?promo51.cantidadBono+" ":""}${nombreProdEnvase(bonoProd)}`);
  }

  // Orden especial para Barriles: primero Grunge, después Blest (cada grupo de menor a mayor precio); otras marcas al final, también por precio
  const ordenarBarriles=arr=>{
    const norm=m=>(m||"").trim().toLowerCase();
    const grupo=marca=>arr.filter(p=>norm(p.marca)===marca).sort((a,b)=>(a.precio||0)-(b.precio||0));
    const grunge=grupo("grunge"),blest=grupo("blest");
    const otras=arr.filter(p=>!["grunge","blest"].includes(norm(p.marca))).sort((a,b)=>(a.precio||0)-(b.precio||0));
    return[...grunge,...blest,...otras];
  };

  // Segmentos por tipo de envase, en este orden fijo
  const SEGMENTOS=[
    {envase:"Barril",titulo:"Barriles · por litro"},
    {envase:"Lata",titulo:"Latas 473 ml"},
    {envase:"PET",titulo:"Pet 1 Lt"},
  ];
  SEGMENTOS.forEach(seg=>{
    let prodsSeg=(prods||[]).filter(p=>(p.envase||"PET")===seg.envase);
    if(prodsSeg.length===0)return;
    prodsSeg=seg.envase==="Barril"?ordenarBarriles(prodsSeg):prodsSeg.sort((a,b)=>(a.marca||"").localeCompare(b.marca||"")||(a.nombre||"").localeCompare(b.nombre||""));

    // Título de envase: grande, negro, con una regla debajo — sin cajas de color
    // (reserva lugar para título + encabezado de marca + al menos una fila, para no dejarlo huérfano al pie de la hoja)
    asegurarEspacio(26);
    doc.setFont("helvetica","bold");
    doc.setFontSize(13);
    doc.setTextColor(NEGRO[0],NEGRO[1],NEGRO[2]);
    doc.text(seg.titulo.toUpperCase(),marginX,y);
    doc.setDrawColor(NEGRO[0],NEGRO[1],NEGRO[2]);
    doc.setLineWidth(0.4);
    doc.line(marginX,y+2.2,pageW-marginX,y+2.2);
    y+=9.5;

    // Banner de promo 5+1 genérica, si está restringida a este envase puntual (Barril usa su propio recuadro fijo al final del listado, ver abajo)
    if(seg.envase!=="Barril"&&promo51&&promo51.activo&&promo51.envaseCuenta===seg.envase&&bonoProd){
      bannerPromo(`PROMO: cada ${promo51.cantidadNecesaria} ${promo51.marcaCuenta} en ${seg.envase.toLowerCase()} te regalamos ${promo51.cantidadBono>1?promo51.cantidadBono+" ":""}${nombreProdEnvase(bonoProd)}`);
    }

    // Agrupado por marca dentro del envase: encabezado de marca en verde (único acento de color).
    // Cada fila tiene el mismo aire arriba y abajo (ROW_PAD) y la línea separadora queda justo en el medio entre una fila y la siguiente.
    const ROW_PAD=2.4;    // mm de aire entre la línea separadora y el texto (arriba y abajo)
    const CAP=2.65;       // alto aprox. de una mayúscula de 10,5 pt (precio), en mm
    let marcaActual=null;
    prodsSeg.forEach(p=>{
      const marca=(p.marca||"Sin marca").trim()||"Sin marca";
      if(marca!==marcaActual){
        const primera=marcaActual===null;
        marcaActual=marca;
        const paginaAntes=doc.internal.getNumberOfPages();
        asegurarEspacio(20);
        const nuevaHoja=doc.internal.getNumberOfPages()!==paginaAntes;
        const yMarca=(primera||nuevaHoja)?y:y+6;   // separación extra respecto de la línea de la marca anterior
        doc.setFont("helvetica","bold");
        doc.setFontSize(10.5);
        doc.setTextColor(ACENTO[0],ACENTO[1],ACENTO[2]);
        doc.text(marca.toUpperCase(),marginX,yMarca);
        y=yMarca+1;
      }

      const descLines=p.descripcion?doc.splitTextToSize(String(p.descripcion),pageW-marginX*2-4):[];
      const tienePromos=(p.promos||[]).length>0;
      const promoTxt=tienePromos?p.promos.map(pr=>`Desde ${pr.minCantidad}u: ${fmtARS(pr.precioUnitario)} c/u`).join("  ·  "):"";
      const promoLines=tienePromos?doc.splitTextToSize(promoTxt,pageW-marginX*2-4):[];

      // Líneas base de cada renglón, medidas desde el tope de la fila
      let baseUlt=ROW_PAD+CAP;
      const baseNombre=baseUlt;
      const basesDesc=[];
      descLines.forEach((_,i)=>{baseUlt+=(i===0?3.9:3.2);basesDesc.push(baseUlt);});
      const basesPromo=[];
      promoLines.forEach((_,i)=>{baseUlt+=(i===0?3.6:3.2);basesPromo.push(baseUlt);});
      const descendUlt=(descLines.length||promoLines.length)?0.6:0.8;   // descendentes del último renglón (7,5 pt vs 10 pt)
      const filaH=baseUlt+descendUlt+ROW_PAD;   // la línea separadora cae acá: mismo aire arriba y abajo
      asegurarEspacio(filaH);
      const top=y;

      doc.setFont("helvetica","normal");
      doc.setFontSize(10);
      doc.setTextColor(50,50,50);
      doc.text(String(p.nombre||"Producto"),marginX,top+baseNombre);
      doc.setFont("helvetica","bold");
      doc.setFontSize(10.5);
      doc.setTextColor(NEGRO[0],NEGRO[1],NEGRO[2]);
      doc.text(fmtARS(p.precio||0),pageW-marginX,top+baseNombre,{align:"right"});
      if(descLines.length){
        doc.setFont("helvetica","italic");
        doc.setFontSize(7.5);
        doc.setTextColor(GRIS[0],GRIS[1],GRIS[2]);
        descLines.forEach((ln,i)=>doc.text(ln,marginX,top+basesDesc[i]));
      }
      if(promoLines.length){
        doc.setFont("helvetica","normal");
        doc.setFontSize(7.5);
        doc.setTextColor(GRIS[0],GRIS[1],GRIS[2]);
        promoLines.forEach((ln,i)=>doc.text(ln,marginX,top+basesPromo[i]));
      }
      const yLinea=top+filaH;
      doc.setDrawColor(GRIS_CLARO[0],GRIS_CLARO[1],GRIS_CLARO[2]);
      doc.setLineWidth(0.15);
      doc.line(marginX,yLinea,pageW-marginX,yLinea);
      y=yLinea;
    });

    // Recuadro fijo de la promo de barriles, apenas termina el listado de Barriles — mismo estilo simple sin relleno
    if(seg.envase==="Barril"){
      y+=6;
      asegurarEspacio(17);
      doc.setDrawColor(NEGRO[0],NEGRO[1],NEGRO[2]);
      doc.setLineWidth(0.35);
      doc.rect(marginX,y,pageW-marginX*2,15);
      doc.setFont("helvetica","bold");
      doc.setFontSize(9.5);
      doc.setTextColor(NEGRO[0],NEGRO[1],NEGRO[2]);
      doc.text("PROMO BARRILES 5 + 1",marginX+4,y+6);
      doc.setFont("helvetica","normal");
      doc.setFontSize(8);
      doc.setTextColor(GRIS[0],GRIS[1],GRIS[2]);
      doc.text("Cada 5 barriles de Grunge te regalamos 1 Blonde",marginX+4,y+10.2);
      doc.text("Cada 5 barriles de Blest te regalamos 1 Pilsen",marginX+4,y+13.6);
      y+=25;
    } else {
      y+=10;
    }
  });

  const totalPages=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setDrawColor(GRIS_CLARO[0],GRIS_CLARO[1],GRIS_CLARO[2]);
    doc.setLineWidth(0.2);
    doc.line(marginX,pageH-12,pageW-marginX,pageH-12);
    doc.setFont("helvetica","italic");
    doc.setFontSize(7.5);
    doc.setTextColor(GRIS[0],GRIS[1],GRIS[2]);
    doc.text("¡Escribinos para hacer tu pedido! · Distribuidora Nómades",pageW/2,pageH-7,{align:"center"});
  }
  return doc;
}
async function compartirCatalogoPDF(prods,promo51){
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert("No se pudo cargar el generador de PDF (jsPDF). Revisá tu conexión a internet y volvé a intentar. Si persiste, avisame para revisarlo.");
    return;
  }
  try{
    const doc=construirCatalogoPDF(prods,promo51);
    const fileName=`catalogo-nomades-${hoyISO()}.pdf`;
    const blob=doc.output("blob");
    let compartido=false;

    if(navigator.share&&navigator.canShare){
      try{
        const file=new File([blob],fileName,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Catálogo Distribuidora Nómades",text:"Catálogo de productos Distribuidora Nómades 🍺"});
          compartido=true;
        }
      }catch(e){
        if(e&&e.name==="AbortError")compartido=true; // el usuario cerró el menú de compartir, no reintentar
      }
    }

    if(!compartido){
      // Abrimos el PDF en una pestaña nueva: el visor de PDF del navegador/celular tiene su propio
      // botón de compartir y guardar, mucho más confiable en mobile que forzar una descarga invisible.
      const url=URL.createObjectURL(blob);
      const nuevaVentana=window.open(url,"_blank");
      if(!nuevaVentana){
        const a=document.createElement("a");a.href=url;a.download=fileName;a.target="_blank";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        alert("Se abrió/descargó el catálogo. Si no ves nada, revisá si el navegador bloqueó una ventana emergente y permitila para este sitio.");
      }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
  }catch(e){
    alert("No se pudo generar el catálogo:\n\n"+(e&&e.message?e.message:String(e))+"\n\nMandame este mensaje para arreglarlo.");
  }
}

function construirEstadoCuentaPDF(cliente,prods,pedidos){

  const esLata=id=>envaseMap[id]==="Lata";
  const precioListaU=id=>{const p=(prods||[]).find(x=>x.id===id);return p?(p.precio||0):0;};
  const ctxDesc=ctxDescuentos(prods,pedidos);
  const detalleDe=v=>desgloseVenta(v,cliente.id,ctxDesc);
  const valorDescuento=v=>Math.round(detalleDe(v).beneficio);

  let y=0;

    doc.setFillColor(14,74,44);

    doc.setFont("helvetica","bold");
    doc.setFontSize(12.5);
    doc.text("ESTADO DE CUENTA",pageW-marginX,14,{align:"right"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(8);
    const fechaEmision=new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
    doc.text(`Emitido: ${fechaEmision}`,pageW-marginX,20.5,{align:"right"});
    y=33;
  };
  dibujarHeader();

  const asegurarEspacio=h=>{if(y+h>pageH-16){doc.addPage();dibujarHeader();}};

  // Datos del cliente
  doc.setTextColor(26,26,26);
  doc.setFont("helvetica","bold");
  doc.setFontSize(13);
  doc.text(cliente.nombre||"Cliente",marginX,y);
  y+=6;
  doc.setFont("helvetica","normal");
  doc.setFontSize(9.5);
  doc.setTextColor(86,91,96);
  [cliente.direccion,[cliente.rubro,cliente.zona].filter(Boolean).join(" · "),cliente.telefono?`Tel: ${cliente.telefono}`:""].filter(Boolean).forEach(t=>{doc.text(t,marginX,y);y+=5;});

  const totalFacturado=ventas.reduce((s,v)=>s+(v.monto||0),0);
  const totalCobrado=ventas.filter(v=>v.pagado).reduce((s,v)=>s+(v.monto||0),0);
  const saldoActual=totalFacturado-totalCobrado;

  // Resumen (3 recuadros)
  y+=3;
  asegurarEspacio(20);
  const boxW=(pageW-marginX*2-8)/3;
  const resumen=[["Total facturado",fmtARS(totalFacturado),[26,26,26]],["Total cobrado",fmtARS(totalCobrado),[15,122,66]],["Saldo actual",fmtARS(saldoActual),saldoActual>0?[198,40,40]:[15,122,66]]];
  resumen.forEach((r,i)=>{
    const bx=marginX+i*(boxW+4);
    doc.setFillColor(248,248,247);
    doc.setDrawColor(228,231,229);
    doc.setLineWidth(0.25);
    doc.roundedRect(bx,y,boxW,17,2,2,"FD");
    doc.setFont("helvetica","normal");
    doc.setFontSize(7.5);
    doc.setTextColor(120,120,120);
    doc.text(r[0].toUpperCase(),bx+4,y+6);
    doc.setFont("helvetica","bold");
    doc.setFontSize(11.5);
    doc.setTextColor(r[2][0],r[2][1],r[2][2]);
    doc.text(r[1],bx+4,y+13);
  });
  y+=24;

  // Libro de movimientos: cada venta genera una fila "venta" en su fecha de remito,
  // y si está pagada genera además una fila "pago" en la fecha real del cobro.
  // El saldo se acumula línea por línea, correlacionando venta con pago en el orden en que ocurrieron.
  const movs=[];
  ventas.forEach(v=>{
    movs.push({id:v.id+"-v",orden:0,fecha:v.fecha,tipo:"venta",producto:v.producto,cantidad:v.cantidad,monto:v.monto||0});
    if(v.pagado){
      movs.push({id:v.id+"-p",orden:1,fecha:v.fechaCobro||v.fecha,tipo:"pago",medioPago:v.medioPago,monto:v.monto||0});
    }
  });

  asegurarEspacio(12);

    doc.text("PAGO",colX.saldo-24,y,{align:"right"});
    doc.text("SALDO",colX.saldo,y,{align:"right"});
    y+=5.5;
  };
  dibujarHeaderTabla();

  let saldoAcum=0;
  doc.setFont("helvetica","normal");
  movs.forEach(m=>{
    asegurarEspacio(7);
    if(y<40){dibujarHeaderTabla();}
    saldoAcum+=m.tipo==="venta"?m.monto:-m.monto;
    doc.setFontSize(8.3);
    if(m.tipo==="venta"){
      const cantTxt=`${m.cantidad}${esLata(m.producto)?"u":"L"}`;
      doc.setTextColor(60,60,60);
      doc.text(fmtDateCorta(m.fecha),colX.fecha+1,y);
      doc.text(nombreDeProd(m.producto),colX.prod+1,y,{maxWidth:54});
      doc.text(cantTxt,colX.monto-4,y,{align:"right"});
      doc.text(fmtARS(m.monto),colX.pago-2,y,{align:"right"});
    }else{
      doc.setTextColor(15,122,66);
      doc.text(fmtDateCorta(m.fecha),colX.fecha+1,y);
      doc.text(`Pago recibido${m.medioPago?" · "+m.medioPago:""}`,colX.prod+1,y,{maxWidth:54});
      doc.text(fmtARS(m.monto),colX.saldo-24,y,{align:"right"});
    }
    doc.setFont("helvetica","bold");
    doc.setTextColor(saldoAcum>0?198:15,saldoAcum>0?40:122,saldoAcum>0?40:66);
    doc.text(fmtARS(saldoAcum),colX.saldo,y,{align:"right"});
    doc.setFont("helvetica","normal");
    y+=6.3;
    doc.setDrawColor(240,241,240);
    doc.setLineWidth(0.15);
    doc.line(marginX,y-4.3,pageW-marginX,y-4.3);

  if(movs.length===0){

  const conPromo=ventas.filter(v=>detalleDe(v).beneficio>0).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  y+=6;
  asegurarEspacio(14);

  doc.setTextColor(26,26,26);
  doc.text("Promos y descuentos aplicados",marginX,y);
  y+=6;
  if(conPromo.length===0){
    doc.setFont("helvetica","normal");
    doc.setFontSize(9.5);
    doc.setTextColor(120,120,120);
    doc.text("Sin promos ni descuentos registrados en este cliente.",marginX,y);
    y+=6;
  }else{
    const colP={fecha:marginX,prod:marginX+22,cant:marginX+84,tipo:marginX+108,valor:pageW-marginX};
    const dibujarHeaderPromo=()=>{
      doc.setFillColor(255,247,230);
      doc.rect(marginX,y-4.5,pageW-marginX*2,6.5,"F");
      doc.setFont("helvetica","bold");
      doc.setFontSize(7.5);
      doc.setTextColor(140,100,30);
      doc.text("FECHA",colP.fecha+1,y);
      doc.text("PRODUCTO",colP.prod+1,y);
      doc.text("CANT.",colP.cant+18,y,{align:"right"});
      doc.text("TIPO",colP.tipo+1,y);
      doc.text("VALOR",colP.valor,y,{align:"right"});
      y+=5.5;
    };
    dibujarHeaderPromo();
    let totalValorPromos=0;
    doc.setFont("helvetica","normal");
    conPromo.forEach(v=>{
      asegurarEspacio(7);
      if(y<40){dibujarHeaderPromo();}

      const dd=detalleDe(v);
      doc.text(dd.esBono?"Bonificado":`-${fmtPct((dd.linea+dd.pedido)/((dd.neto+dd.linea+dd.pedido)||1)*100)} desc.`,colP.tipo+1,y);
      doc.setTextColor(198,40,40);
      doc.text(`-${fmtARS(valor)}`,colP.valor,y,{align:"right"});
      y+=6.3;
      doc.setDrawColor(250,240,220);
      doc.setLineWidth(0.15);
      doc.line(marginX,y-4.3,pageW-marginX,y-4.3);

    asegurarEspacio(8);
    doc.setFont("helvetica","bold");
    doc.setFontSize(9);
    doc.setTextColor(183,121,31);
    doc.text("Total bonificado/descontado",colP.tipo+1,y);

    doc.setFontSize(8.3);

    if(resAll.estimado){

const mensajePedido=(p,nombreCliente,prods)=>{
  const lineas=p.lineas||[];
  const detalle=lineas.map(l=>{
    const prod=prods.find(x=>x.id===l.productoId);
    return`• ${l.cantidad}L ${prod?nombreProdEnvase(prod):l.productoId} — ${fmtARS(l.monto||0)}`;
  }).join("\n");
  const subtotal=lineas.reduce((s,l)=>s+(l.monto||0),0);
  const descPct=p.descuentoPct||0;
  const montoDesc=descPct?Math.round(subtotal*descPct/100):0;
  const montoIVA=p.incluyeIVA?Math.round((subtotal-montoDesc)*0.21):0;
  let resumen="";
  if(descPct>0||p.incluyeIVA){
    resumen=`\nSubtotal: ${fmtARS(subtotal)}`;
    if(descPct>0)resumen+=`\nDescuento (${descPct}%): -${fmtARS(montoDesc)}`;
    if(p.incluyeIVA)resumen+=`\nIVA (21%): +${fmtARS(montoIVA)}`;
    resumen+="\n";
  }
  const esHoy=p.fechaEntrega===hoyISO();
  return`¡Hola${nombreCliente?" "+nombreCliente:""}! 🍺 Te confirmo tu pedido:\n\n${detalle}\n${resumen}\n*Total: ${fmtARS(p.montoTotal||0)}*\n📅 Entrega estimada: ${esHoy?"HOY":fmtDate(p.fechaEntrega)} · ${p.horaEntrega}hs\n\n¡Gracias por la confianza!`;
};
const daysSince=s=>Math.floor((Date.now()-new Date(s+"T00:00:00"))/86400000);
const lastSale=c=>c.ventas.length?[...c.ventas].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]:null;
const estadoC=c=>{const ls=lastSale(c);if(!ls)return"nuevo";const d=daysSince(ls.fecha);return d<=21?"activo":d<=45?"atencion":"inactivo";};
const frecuenciaCompraCliente=c=>{
  const fechas=(c.ventas||[]).map(v=>v.fecha).filter(Boolean).sort();
  const gaps=[];
  for(let i=1;i<fechas.length;i++){
    const diff=(new Date(fechas[i]+"T00:00:00")-new Date(fechas[i-1]+"T00:00:00"))/86400000;
    if(diff>0)gaps.push(diff);
  }
  if(gaps.length<2)return null; // necesita al menos 3 compras para un promedio confiable
  const promedio=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
  const ls=lastSale(c);
  const diasUltima=ls?daysSince(ls.fecha):null;
  return{promedio,diasUltima,atrasado:diasUltima!=null&&diasUltima>promedio*1.5};
};
// Promo 5+1 (o la relación que se configure): acumula unidades marcadas con el tilde de promo,
// contando cualquier producto de la MARCA (y envase, si se restringió) configurada — no un producto puntual —
// y calcula cuántos bonos ya ganó el cliente vs. cuántos bonos ya se le entregaron.
const prodCuentaParaPromo=(prod,promo51)=>{
  if(!prod||!promo51||!promo51.marcaCuenta)return false;
  if(prod.marca!==promo51.marcaCuenta)return false;
  if(promo51.envaseCuenta&&prod.envase!==promo51.envaseCuenta)return false;
  return true;
};
const progresoPromo51=(cliente,promo51,prods,pedidos)=>{
  if(!promo51||!promo51.activo||!promo51.marcaCuenta||!promo51.cantidadNecesaria)return null;

  const nombreDe=id=>prodMap[id]?nombreProdEnvase(prodMap[id]):id;
  const ventasPromo=ventas.filter(v=>v.promoAcumulable&&prodCuentaParaPromo(prodMap[v.producto],promo51));
  const acumulado=ventasPromo.reduce((s,v)=>s+Number(v.cantidad||0),0);
  const bonoEntregadoU=ventas.filter(v=>promo51.productoBonoId&&v.producto===promo51.productoBonoId&&v.esBono).reduce((s,v)=>s+Number(v.cantidad||0),0);
  const cantBono=promo51.cantidadBono||1;
  const bonosGanados=Math.floor(acumulado/promo51.cantidadNecesaria);
  const bonosEntregados=cantBono>0?Math.floor(bonoEntregadoU/cantBono):0;
  const bonosPendientes=Math.max(0,bonosGanados-bonosEntregados);
  const enCicloActual=acumulado%promo51.cantidadNecesaria;
  // Pendiente = lo que ya está en pedidos con la promo tildada pero todavía no entregados (referencia, no cuenta como ganado hasta que se entregue)
  let pendiente=0;
  const detallePendiente=[];
  (pedidos||[]).filter(p=>p.clienteId===cliente.id&&p.estado!=="entregado"&&p.promoAplica).forEach(p=>{
    (p.lineas||[]).forEach(l=>{

// ── Cuenta corriente ──────────────────────────────────────────────
function saldoCliente(c){ return (c.ventas||[]).filter(v=>!v.pagado).reduce((s,v)=>s+v.monto,0); }

// ── Descuentos y bonificaciones ─────────────────────────────────────────────
// Cada venta que se genera al entregar un pedido guarda su desglose exacto (dv:1): neto facturado (sin IVA), descuento de línea,
// descuento de pedido, bonificación (valor a precio de lista) y escala por volumen.
// Las ventas anteriores se reconstruyen desde el pedido original cuando existe; si no, solo se usan datos explícitos
// (% de descuento cargado a mano o bonificación). Nunca se compara contra el precio de lista actual para "adivinar" descuentos
// (los precios cambian y daría falsos positivos). La única estimación es el valor de bonificaciones viejas (a precio de lista actual).
const fmtPct=n=>`${(Math.round((Number(n)||0)*10)/10).toLocaleString("es-AR")}%`;
function ctxDescuentos(prods,pedidos){
  const prodMap={};(prods||[]).forEach(p=>{prodMap[p.id]=p;});
  return{prodMap,envaseMap:envaseMapDe(prods),idx:indicePedidosEntregados(pedidos)};
}
function indicePedidosEntregados(pedidos){
  const idx={};
  (pedidos||[]).forEach(ped=>{
    if(ped.estado!=="entregado")return;
    (ped.lineas||[]).forEach(l=>{
      const k=`${ped.clienteId}|${ped.fechaEntrega}|${l.productoId}|${Number(l.cantidad)||0}`;
      (idx[k]=idx[k]||[]).push({ped,l});
    });
  });
  return idx;
}
// Desglose que se guarda en la venta al marcar un pedido como entregado
function desgloseAlEntregar(prod,l,ped){
  const cant=Number(l.cantidad)||0;
  const precioLista=prod?(Number(prod.precio)||0):0;
  const montoLinea=Number(l.monto)||0;
  const baseEscala=prod?montoTotal(prod,cant):montoLinea;   // a precio de lista, con la escala por volumen del catálogo
  const dp=Number(ped.descuentoPct)||0;
  if(l.esBono)return{dv:1,neto:0,volumen:0,linea:0,pedido:0,bono:Math.round(precioLista*cant),iva:0,descuentoPct:0,descPedidoPct:0};
  const neto=montoLinea*(1-dp/100);
  return{
    dv:1,neto:Math.round(neto),
    volumen:Math.max(0,Math.round(precioLista*cant-baseEscala)),
    linea:Math.max(0,Math.round(baseEscala-montoLinea)),
    pedido:Math.round(montoLinea*dp/100),
    bono:0,iva:ped.incluyeIVA?Math.round(neto*0.21):0,
    descuentoPct:Number(l.descuentoPct)||0,descPedidoPct:dp,
  };
}
// Desglose de cualquier venta (nueva o vieja). ctx = ctxDescuentos(prods,pedidos)
function desgloseVenta(v,clienteId,ctx){
  const monto=Number(v.monto)||0,cant=Number(v.cantidad)||0;
  const prod=ctx.prodMap[v.producto];
  const precioLista=prod?(Number(prod.precio)||0):0;
  const o={neto:0,volumen:0,linea:0,pedido:0,bono:0,iva:0,estimado:false};
  if(v.dv===1){
    o.neto=Number(v.neto)||0;o.volumen=Number(v.volumen)||0;o.linea=Number(v.linea)||0;
    o.pedido=Number(v.pedido)||0;o.bono=Number(v.bono)||0;o.iva=Number(v.iva)||0;
  }else{
    const cands=ctx.idx[`${clienteId}|${v.fecha}|${v.producto}|${cant}`]||[];
    const m=cands.find(x=>Math.round((Number(x.l.monto)||0)*(Number(x.ped.factorAjuste)||1))===Math.round(monto));
    if(v.esBono||(m&&m.l.esBono)){
      o.bono=precioLista*cant;o.estimado=true;
    }else if(m){
      const dl=Number(m.l.descuentoPct)||0,dp=Number(m.ped.descuentoPct)||0,montoLinea=Number(m.l.monto)||0;
      const base=dl>0&&dl<100?montoLinea/(1-dl/100):montoLinea;
      o.linea=Math.max(0,base-montoLinea);
      o.pedido=montoLinea*dp/100;
      o.neto=montoLinea-o.pedido;
      o.iva=m.ped.incluyeIVA?o.neto*0.21:0;
    }else{
      const dp=Number(v.descuentoPct)||0;
      o.neto=monto;
      if(dp>0&&dp<100)o.linea=monto*dp/(100-dp);
    }
  }
  o.bruto=o.neto+o.linea+o.pedido+o.bono;          // lo que valdría a precio de lista, sin descuentos ni bonificaciones
  o.beneficio=o.linea+o.pedido+o.bono;             // todo lo que se le "regaló" al cliente en esta venta
  o.litros=litrosDeItem(cant,ctx.envaseMap[v.producto]);
  o.esBono=o.bono>0&&o.neto===0&&o.linea+o.pedido===0;
  o.litrosBono=o.esBono?o.litros:0;
  return o;
}
// items = [{v,d}] → totales y promedios
function resumenDescuentos(items){
  const r={ventas:0,conBeneficio:0,bruto:0,neto:0,linea:0,pedido:0,bono:0,volumen:0,litros:0,litrosPagos:0,litrosBono:0,estimado:false};
  (items||[]).forEach(it=>{
    const d=it&&it.d;if(!d)return;
    r.ventas++;if(d.beneficio>0)r.conBeneficio++;
    r.bruto+=d.bruto;r.neto+=d.neto;r.linea+=d.linea;r.pedido+=d.pedido;r.bono+=d.bono;r.volumen+=d.volumen;
    r.litros+=d.litros;r.litrosBono+=d.litrosBono;if(!d.esBono)r.litrosPagos+=d.litros;
    if(d.estimado)r.estimado=true;
  });
  r.descuento=r.linea+r.pedido;
  r.beneficio=r.descuento+r.bono;
  r.brutoFacturable=r.neto+r.descuento;                                        // venta a lista de lo que sí se facturó (sin bonificaciones)
  r.pct=r.bruto>0?r.beneficio/r.bruto*100:0;                                   // descuentos + bonificaciones sobre venta a lista
  r.pctDescuento=r.brutoFacturable>0?r.descuento/r.brutoFacturable*100:0;      // solo descuentos, sobre lo facturado a lista
  r.promPorVentaConBeneficio=r.conBeneficio>0?r.beneficio/r.conBeneficio:0;
  r.precioLitroLista=r.litrosPagos>0?r.brutoFacturable/r.litrosPagos:0;
  r.precioLitroReal=r.litrosPagos>0?r.neto/r.litrosPagos:0;
  return r;
}
// Últimos N meses (incluye el actual) con el resumen de cada uno
function serieMensualDescuentos(items,cant){
  const hoy=new Date();const meses=[];

    const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
    meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("es-AR",{month:"short"}).replace(".",""),items:[]});
  }
  const map={};meses.forEach(m=>{map[m.key]=m;});
  (items||[]).forEach(it=>{const m=map[((it.v&&it.v.fecha)||"").slice(0,7)];if(m)m.items.push(it);});
  return meses.map(m=>({key:m.key,lbl:m.lbl,...resumenDescuentos(m.items)}));
}

// Cada cuántos días sugerimos liquidar comisiones con la fábrica si hay saldo pendiente.
const PERIODO_LIQUIDACION_DIAS=30;
// Aplica un cobro (total o parcial) a las ventas pendientes de un cliente, de más antigua a más nueva.
// Registra fechaCobro y medioPago en cada venta saldada; si el monto no alcanza a cubrir una venta, la divide en dos.
function aplicarCobroACliente(cliente,montoCobro,{medioPago="Efectivo",nota="",fecha=null}={}){
  const monto=Number(montoCobro);
  if(!monto||monto<=0)return cliente;
  const pendientesOrdenadas=(cliente.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(v=>v.id);
  let restante=monto;
  const fechaCobro=fecha||hoyISO();
  const nuevasVentas=[...cliente.ventas].map(v=>{
    if(v.pagado||!pendientesOrdenadas.includes(v.id)||restante<=0)return v;
    if(restante>=v.monto){restante-=v.monto;return{...v,pagado:true,fechaCobro,medioPago,nota:nota||v.nota||""};}
    const montoPagado=restante,montoRestante=v.monto-restante;
    const cantPagada=Math.round((v.cantidad*(montoPagado/v.monto))*10)/10;
    restante=0;
    return{...v,_split:true,_montoPagado:montoPagado,_montoRestante:montoRestante,_cantPagada:cantPagada,_cantRestante:v.cantidad-cantPagada};
  });
  const ventasFinales=[];
  nuevasVentas.forEach(v=>{
    if(v._split){
      ventasFinales.push({id:v.id,fecha:v.fecha,producto:v.producto,cantidad:v._cantPagada,monto:v._montoPagado,pagado:true,fechaCobro,medioPago,nota:nota||v.nota||""});
      ventasFinales.push({id:uid(),fecha:v.fecha,producto:v.producto,cantidad:v._cantRestante,monto:v._montoRestante,pagado:false});
    }else{ventasFinales.push(v);}
  });
  return{...cliente,ventas:ventasFinales};
}

function aplicarPagoAProveedor(proveedor,montoPago,{medioPago="Efectivo",nota="",fecha=null}={}){
  const monto=Number(montoPago);
  if(!monto||monto<=0)return proveedor;
  const pendientesOrdenadas=(proveedor.compras||[]).filter(c=>!c.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(c=>c.id);
  let restante=monto;
  const fechaPago=fecha||hoyISO();
  const nuevasCompras=[...proveedor.compras].map(c=>{
    if(c.pagado||!pendientesOrdenadas.includes(c.id)||restante<=0)return c;
    if(restante>=c.monto){restante-=c.monto;return{...c,pagado:true,fechaPago,medioPago,nota:nota||c.nota||""};}
    const montoPagado=restante,montoRestante=c.monto-restante;
    const cantPagada=Math.round((c.cantidad*(montoPagado/c.monto))*10)/10;
    restante=0;
    return{...c,_split:true,_montoPagado:montoPagado,_montoRestante:montoRestante,_cantPagada:cantPagada,_cantRestante:c.cantidad-cantPagada};
  });
  const comprasFinales=[];
  nuevasCompras.forEach(c=>{
    if(c._split){
      comprasFinales.push({id:c.id,fecha:c.fecha,producto:c.producto,cantidad:c._cantPagada,monto:c._montoPagado,pagado:true,fechaPago,medioPago,nota:nota||c.nota||""});
      comprasFinales.push({id:uid(),fecha:c.fecha,producto:c.producto,cantidad:c._cantRestante,monto:c._montoRestante,pagado:false});
    }else{comprasFinales.push(c);}
  });
  return{...proveedor,compras:comprasFinales};
}

// ── Meta semanal helpers ──────────────────────────────────────────
function rangoSemanaActual(){
  const hoy=new Date(),dia=hoy.getDay(),offsetLunes=dia===0?-6:1-dia;
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()+offsetLunes); lunes.setHours(0,0,0,0);
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6); domingo.setHours(23,59,59,999);
  return{lunes,domingo};
}
function litrosEstaSemana(clientes,prods){
  const envaseMap=envaseMapDe(prods);
  const{lunes,domingo}=rangoSemanaActual(); let total=0;
  clientes.forEach(c=>(c.ventas||[]).forEach(v=>{const f=new Date(v.fecha+"T00:00:00");if(f>=lunes&&f<=domingo)total+=litrosDeItem(v.cantidad,envaseMap[v.producto]);}));
  return total;
}
// Las latas son de 0.50L cada una — la cantidad cargada en una venta/línea de Lata representa unidades, no litros directos.
function envaseMapDe(prods){ const m={}; (prods||[]).forEach(p=>{m[p.id]=p.envase||"PET";}); return m; }
function litrosDeItem(cantidad,envase){ return envase==="Lata"?(Number(cantidad)||0)*0.5:(Number(cantidad)||0); }
function diasRestantesSemana(){
  const{domingo}=rangoSemanaActual();const hoy=new Date();hoy.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((domingo-hoy)/86400000));
}

// ── Google Calendar hook ──────────────────────────────────────────
function useGoogleCalendar(){
  const[calToken,setCalToken]=useState(null);
  const[calError,setCalError]=useState("");
  const[gapiReady,setGapiReady]=useState(false);
  const[gisReady,setGisReady]=useState(false);
  const tokenClientRef=React.useRef(null);
 
  // Inicializar gapi.client (librería de Google APIs)
  React.useEffect(()=>{
    const initGapi=()=>{
      if(!window.gapi){setTimeout(initGapi,500);return;}
      window.gapi.load("client",async()=>{
        try{
          await window.gapi.client.init({});
          await window.gapi.client.load("https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest");
          setGapiReady(true);
        }catch(e){
          console.warn("gapi.client init falló:",e);
          setGapiReady(true); // igual marcamos ready para no bloquear
        }
      });
    };
    initGapi();
  },[]);
 
  // Esperar a que Google Identity Services esté disponible
  React.useEffect(()=>{
    const check=()=>{if(window.google?.accounts?.oauth2){setGisReady(true);}else{setTimeout(check,500);}};
    check();
  },[]);
 
  const login=()=>{
    const clientId=getCalClientId();
    if(!clientId){
      setCalError("Primero pegá tu Client ID en Configuración → Google Calendar.");
      return;
    }
    if(!gisReady){setCalError("Google Identity todavía cargando, esperá unos segundos y volvé a intentar.");return;}
    try{
      // Siempre recreamos el token client por si cambió el client_id
      tokenClientRef.current=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:GCAL_SCOPE,
        callback:(resp)=>{
          if(resp.error){
            setCalError("Error OAuth: "+resp.error+". Verificá que el origen esté autorizado en Google Cloud Console.");
            return;
          }
          setCalToken(resp.access_token);
          setCalError("");
          if(window.gapi?.client) window.gapi.client.setToken({access_token:resp.access_token});
        },
        error_callback:(err)=>{
          setCalError("Popup bloqueado o cancelado. Permití popups para este sitio.");
        }
      });
      tokenClientRef.current.requestAccessToken({prompt:""});
    }catch(e){
      setCalError("No se pudo iniciar el login: "+e.message);
    }
  };
 
  const logout=()=>{
    if(calToken&&window.google?.accounts?.oauth2) window.google.accounts.oauth2.revoke(calToken,()=>{});
    setCalToken(null);
    setCalError("");
    tokenClientRef.current=null;
  };
 
  const crearEvento=async({titulo,descripcion,fecha,hora,durMin=60})=>{
    if(!calToken){login();return false;}
    if(!gapiReady){setCalError("La API de Google Calendar todavía está cargando.");return false;}
    try{
      const inicio=new Date(`${fecha}T${hora}:00`);
      const fin=new Date(inicio.getTime()+durMin*60000);
      const toISO=d=>d.toISOString();
      await window.gapi.client.calendar.events.insert({
        calendarId:"primary",
        resource:{
          summary:titulo,
          description:descripcion||"",
          start:{dateTime:toISO(inicio),timeZone:"America/Argentina/Buenos_Aires"},
          end:{dateTime:toISO(fin),timeZone:"America/Argentina/Buenos_Aires"},
          reminders:{useDefault:false,overrides:[{method:"popup",minutes:60},{method:"popup",minutes:10}]},
        }
      });
      return true;
    }catch(e){
      const msg=e.result?.error?.message||e.message||"Error desconocido";
      // Token expirado → intentar renovar
      if(e.status===401){setCalToken(null);login();return false;}
      setCalError("Error al crear evento: "+msg);
      return false;
    }
  };
 
  return{calToken,calError,gapiReady,gisReady,login,logout,crearEvento};
}

function ModalAgenda({open,onClose,entidad,onGuardar,cal}){
  const[titulo,setTitulo]=useState("");
  const[fecha,setFecha]=useState(hoyISO());
  const[hora,setHora]=useState("10:00");
  const[dur,setDur]=useState(30);
  const[nota,setNota]=useState("");
  const[saving,setSaving]=useState(false);
  const[ok,setOk]=useState(false);
  React.useEffect(()=>{if(open&&entidad)setTitulo(`Visita Farol → ${entidad.nombre}`);},[open,entidad]);
  const guardar=async()=>{
    if(!titulo.trim()||!fecha||!hora)return;
    setSaving(true);
    const evento={titulo,descripcion:nota||`Visita comercial Farol a ${entidad?.nombre}`,fecha,hora,durMin:dur};
    let calOk=false;
    if(cal.calToken)calOk=await cal.crearEvento(evento);
    onGuardar({...evento,calSync:calOk,id:uid(),creadoEn:new Date().toISOString()});
    setSaving(false);setOk(true);
    setTimeout(()=>{setOk(false);onClose();},1200);
  };
  return(
    <Modal open={open} onClose={onClose} title={`Agendar visita · ${entidad?.nombre||""}`}>
      {!cal.calToken&&!getCalClientId()&&(
        <div style={{background:AM+"11",border:`1px solid ${AM}33`,borderRadius:8,padding:"10px 14px",marginBottom:14}}>
          <div style={{fontSize:15,fontWeight:700,color:AM,marginBottom:2}}>⚙️ Google Calendar no configurado</div>

        </div>
      )}
      {!cal.calToken&&getCalClientId()&&(
        <div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div><div style={{fontSize:15,fontWeight:700,color:G}}>Conectar Google Calendar</div><div style={{fontSize:14,color:MU,marginTop:2}}>Para sincronizar este evento con tu agenda</div></div>
          <button onClick={cal.login} style={{padding:"7px 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontSize:15,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>Conectar</button>
        </div>

function ModalContacto({open,onClose,entidad,onGuardar}){

// ── HistorialAgenda (bloque reutilizable) ─────────────────────────

  const proxVisita=agendaSafe.filter(e=>new Date(e.fecha+"T"+e.hora)>=new Date()).sort((a,b)=>new Date(a.fecha+"T"+a.hora)-new Date(b.fecha+"T"+b.hora))[0];

    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8,marginBottom:14}}>

      {historialSafe.length>0&&(
        <div style={{marginBottom:14}}>
          <div style={{fontSize:14,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Historial de contactos</div>
          {[...historialSafe].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(c=>{const t=CONTACTO_TIPOS.find(x=>x.id===c.tipo);return(
            <div key={c.id} style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px",marginBottom:6,display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:18,flexShrink:0}}>{t?.icon||"📋"}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}><span style={{fontSize:15,fontWeight:600,color:CR}}>{c.resultado}</span><span style={{fontSize:13,color:MU,flexShrink:0}}>{fmtDate(c.fecha)}</span></div>
                {c.nota&&<div style={{fontSize:14,color:"#A89682",marginTop:3,lineHeight:1.4}}>{c.nota}</div>}
              </div>
            </div>
          );})}
        </div>
      )}
      {agendaSafe.filter(e=>new Date(e.fecha+"T"+e.hora)>=new Date()).length>1&&(
        <div>
          <div style={{fontSize:14,fontWeight:700,color:MU,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Próximas visitas</div>
          {agendaSafe.filter(e=>new Date(e.fecha+"T"+e.hora)>=new Date()).sort((a,b)=>new Date(a.fecha+"T"+a.hora)-new Date(b.fecha+"T"+b.hora)).slice(1).map(e=>(
            <div key={e.id} style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 12px",marginBottom:6,display:"flex",gap:8,alignItems:"center"}}>
              <span>📅</span><div style={{flex:1}}><div style={{fontSize:15,color:CR}}>{e.titulo}</div><div style={{fontSize:13,color:MU}}>{fmtDate(e.fecha)} · {e.hora}hs</div></div>

          ))}
        </div>
      )}

function FormVenta({prods,onSave,onCancel,comisionPctDefault,initial,labelGuardar}){
  const[f,setF]=useState(initial?{fecha:initial.fecha,producto:initial.producto,cantidad:String(initial.cantidad??""),monto:String(initial.monto??""),descuentoPct:String(initial.descuentoPct||""),pagado:!!initial.pagado}:{fecha:hoyISO(),producto:"rubia",cantidad:"",monto:"",descuentoPct:"",pagado:true});

  const sug=f.cantidad&&prod?montoTotal(prod,Number(f.cantidad)):null;
  const descPct=Number(f.descuentoPct)||0;
  const sugConDescuento=sug&&descPct?Math.round(sug*(1-descPct/100)):null;

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>

        <div><Lbl t="% descuento"/><input type="number" inputMode="numeric" value={f.descuentoPct} onChange={s("descuentoPct")} placeholder="0"/></div>
      </div>
      <div>
        <Lbl t="Monto ARS"/><input type="number" inputMode="numeric" value={f.monto} onChange={s("monto")} placeholder={sugConDescuento||sug||"36000"}/>
        {sug&&!f.monto&&(
          <button type="button" onClick={()=>setF(p=>({...p,monto:String(sugConDescuento||sug)}))} style={{display:"block",marginTop:4,fontSize:13,color:G,background:"none",border:"none",padding:0,cursor:"pointer",textDecoration:"underline"}}>
            {sugConDescuento?<>Sug. con {descPct}% desc: {fmtARS(sugConDescuento)} <span style={{color:MU,textDecoration:"line-through"}}>{fmtARS(sug)}</span></>:<>Sug: {fmtARS(sug)}</>} — usar este monto
          </button>
        )}
      </div>
      {promoAplicada&&<div style={{background:G+"11",border:`1px solid ${G}33`,borderRadius:8,padding:"8px 12px",fontSize:14,color:G}}>🏷 Promo aplicada: {fmtARS(promoAplicada.precioUnitario)}/L desde {promoAplicada.minCantidad}L</div>}
      <div style={{background:BG,border:`1px solid ${BO}`,borderRadius:8,padding:"8px 12px",fontSize:14,color:MU}}>
        {comisionPctDefault?<>% comisión del cliente: <b style={{color:G}}>{comisionPctDefault}%</b>{gananciaEstimada!=null&&<> · Ganancia estimada: <b style={{color:G}}>{fmtARS(gananciaEstimada)}</b></>}</>:<>Este cliente no tiene % de comisión configurado (se puede cargar en su ficha).</>}
      </div>
      <div><Lbl t="¿Se cobró al momento de la entrega?"/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:8}}>
          <button onClick={()=>setF(p=>({...p,pagado:true}))} style={{padding:"10px 0",borderRadius:8,border:`1px solid ${f.pagado?GR:BO}`,background:f.pagado?GR+"22":"transparent",color:f.pagado?GR:MU,fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ Pagado</button>

  const saldo=saldoCliente(cliente);
  const[monto,setMonto]=useState(saldo>0?String(saldo):"");
  const[medioPago,setMedioPago]=useState("Efectivo");
  const[fecha,setFecha]=useState(hoyISO());
  const[nota,setNota]=useState("");
  const montoNum=Number(monto)||0;
  const esParcial=montoNum>0&&montoNum<saldo;
  const confirmar=()=>{
    if(!montoNum||montoNum<=0)return;
    onUpdate(aplicarCobroACliente(cliente,montoNum,{medioPago,nota,fecha}));
    onDone&&onDone();
  };
  return(
    <div style={{background:"#fff",border:`1px solid ${G}33`,borderRadius:10,padding:14}}>
      <div style={{marginBottom:8}}>
        <Lbl t="Monto cobrado"/>
        <input type="number" inputMode="numeric" value={monto} onChange={e=>setMonto(e.target.value)} placeholder={`Deuda total: ${fmtARS(saldo)}`} autoFocus/>
        <div style={{display:"flex",gap:6,marginTop:6}}>
          <button onClick={()=>setMonto(String(saldo))} style={{fontSize:12,fontWeight:700,padding:"4px 10px",borderRadius:6,background:G+"15",color:G,border:`1px solid ${G}33`,cursor:"pointer"}}>Todo ({fmtARS(saldo)})</button>
          <button onClick={()=>setMonto(saldo>1?String(Math.round(saldo/2)):"")} style={{fontSize:12,fontWeight:700,padding:"4px 10px",borderRadius:6,background:BO+"55",color:MU,border:`1px solid ${BO}`,cursor:"pointer"}}>Mitad ({fmtARS(Math.round(saldo/2))})</button>
        </div>
      </div>
      <div style={{marginBottom:8}}>
        <Lbl t="Fecha de cobro"/>
        <input type="date" value={fecha} max={hoyISO()} onChange={e=>setFecha(e.target.value||hoyISO())}/>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        {MEDIOS_PAGO.map(m=>(
          <button key={m.id} onClick={()=>setMedioPago(m.id)} style={{flex:1,padding:"7px 0",borderRadius:8,fontSize:14,fontWeight:700,cursor:"pointer",border:`1px solid ${medioPago===m.id?G:BO}`,background:medioPago===m.id?G+"18":"none",color:medioPago===m.id?G:MU}}>{m.ic} {m.id}</button>

      </div>
      <div style={{marginBottom:10}}><Lbl t="Nota (opcional)"/><input value={nota} onChange={e=>setNota(e.target.value)} placeholder="Ej: pagó en el local, transferencia..."/></div>
      {montoNum>0&&(
        <div style={{fontSize:14,color:MU,marginBottom:10}}>
          {esParcial?"Pago parcial":"Salda toda la cuenta"} de <strong style={{color:G}}>{fmtARS(montoNum)}</strong> · Saldo restante: <strong style={{color:"#C62828"}}>{fmtARS(Math.max(0,saldo-montoNum))}</strong>
          {!!cliente.comisionPctDefault&&<> · Comisión ({cliente.comisionPctDefault}%): <strong style={{color:G}}>{fmtARS(Math.round(montoNum*Number(cliente.comisionPctDefault)/100))}</strong></>}
        </div>
      )}
      <div style={{display:"flex",gap:8}}>
        <button onClick={onDone} style={{flex:1,padding:"10px 0",borderRadius:10,background:"none",border:`1px solid ${BO}`,color:MU,fontSize:16,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
        <button onClick={confirmar} disabled={!montoNum||montoNum<=0} style={{flex:2,padding:"10px 0",borderRadius:10,background:G,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",opacity:!montoNum||montoNum<=0?0.4:1}}>
          ✓ Confirmar {montoNum?fmtARS(montoNum):"..."}
        </button>
      </div>
    </div>
  );
}

// ── CuentaCorriente ───────────────────────────────────────────────
function CuentaCorriente({cliente,onUpdate,diasMora,prods,pedidos}){
  const[showHistorial,setShowHistorial]=useState(false);
  const itemsDesc=useMemo(()=>{const ctx=ctxDescuentos(prods,pedidos);return(cliente.ventas||[]).map(v=>({v,d:desgloseVenta(v,cliente.id,ctx)}));},[cliente,prods,pedidos]);
  const descPorId=useMemo(()=>{const m={};itemsDesc.forEach(({v,d})=>{m[v.id]=d;});return m;},[itemsDesc]);
  const[showPago,setShowPago]=useState(false);
  const[compartiendoEC,setCompartiendoEC]=useState(false);
 
  const pendientes=(cliente.ventas||[]).filter(v=>!v.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const pagadas=(cliente.ventas||[]).filter(v=>v.pagado).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const saldo=saldoCliente(cliente);
  const hayVencidas=pendientes.some(v=>daysSince(v.fecha)>=diasMora);
 
  // Cobro rápido de una venta puntual (queda para el caso de "cobré justo esto, hoy, en efectivo").
  // Para fecha/medio de pago distintos, o pagos parciales, se usa el panel unificado "Registrar pago".
  const marcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:true,fechaCobro:hoyISO(),medioPago:"Efectivo"}:v)});
  const desmarcarPagada=id=>onUpdate({...cliente,ventas:cliente.ventas.map(v=>v.id===id?{...v,pagado:false,fechaCobro:null}:v)});
 
  return(
    <div style={{background:saldo>0?RE+"11":GR+"11",border:`1px solid ${saldo>0?RE+"33":GR+"33"}`,borderRadius:10,padding:14,marginBottom:14}}>
      {/* Saldo siempre visible */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:16,fontWeight:700,color:saldo>0?"#C62828":GR}}>
          {saldo>0?"💰 Cuenta corriente":"✓ Sin deuda pendiente"}
        </span>
        <span className="bebas" style={{fontSize:24,color:saldo>0?"#C62828":GR}}>{fmtARS(saldo)}</span>
      </div>
      <button onClick={async()=>{setCompartiendoEC(true);try{await compartirEstadoCuentaPDF(cliente,prods,()=>{},pedidos);}finally{setCompartiendoEC(false);}}} disabled={compartiendoEC||!(cliente.ventas||[]).length} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"8px 0",borderRadius:8,fontSize:14,fontWeight:700,background:"#fff",color:G,border:`1px solid ${G}44`,cursor:compartiendoEC?"not-allowed":"pointer",marginBottom:saldo>0?12:0,opacity:compartiendoEC?0.6:1}}>{I.share}{compartiendoEC?"Generando estado de cuenta...":"Enviar estado de cuenta (PDF)"}</button>
 
      {saldo>0&&(
        <>
          {hayVencidas&&(
            <div style={{background:"#C62828",borderRadius:8,padding:"8px 10px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:700,color:"#fff",display:"flex",alignItems:"center",gap:5}}>⚠ Tiene ventas vencidas (+{diasMora} días sin cobrar)</span>
              {cliente.telefono&&<a href={waLink(cliente.telefono,mensajeRecordatorioDeuda(cliente,saldo,diasMora))} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,padding:"5px 10px",borderRadius:6,background:"#fff",color:"#C62828",textDecoration:"none",whiteSpace:"nowrap"}}>{I.wa} Recordar por WhatsApp</a>}
            </div>
          )}
          {/* Ventas pendientes */}
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
            {pendientes.map(v=>{const dias=daysSince(v.fecha),vencida=dias>=diasMora;return(
              <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${vencida?"#C6282866":BO}`,borderRadius:8,padding:"10px 12px"}}>
                <div>
                  <div style={{fontSize:16,color:CR,fontWeight:500}}>{fmtDate(v.fecha)}</div>
                  <div style={{fontSize:14,color:MU}}>{v.cantidad}L · {v.nota||""}</div>
                  <ChipBeneficio d={descPorId[v.id]}/>
                  {vencida&&<div style={{fontSize:13,color:"#C62828",fontWeight:700,marginTop:2}}>Vencido hace {dias}d</div>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:17,fontWeight:700,color:"#C62828"}}>{fmtARS(v.monto)}</span>
                  <button onClick={()=>marcarPagada(v.id)} style={{fontSize:14,fontWeight:700,padding:"6px 12px",borderRadius:8,background:GR+"22",color:GR,border:`1px solid ${GR}44`,cursor:"pointer"}}>✓ Cobrado</button>
                </div>
              </div>
            );})}
          </div>
 
          {/* Registrar pago — panel único (reemplaza los antiguos "efectivo"/"parcial"/"saldar todo") */}
          {!showPago?(
            <button onClick={()=>setShowPago(true)} style={{width:"100%",padding:"12px 0",borderRadius:10,background:GR,color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {I.check} Registrar pago
            </button>
          ):(
            <PanelCobro cliente={cliente} onUpdate={onUpdate} onDone={()=>setShowPago(false)}/>
          )}
        </>
      )}
 
      {/* Descuentos y bonificaciones del cliente */}
      <PanelDescuentosCliente items={itemsDesc}/>

      {/* Historial de pagos */}
      {pagadas.length>0&&(
        <div style={{marginTop:saldo>0?12:0}}>
          <button onClick={()=>setShowHistorial(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:MU,display:"flex",alignItems:"center",gap:4,padding:0}}>
            {showHistorial?"▲":"▼"} Historial de pagos ({pagadas.length})
          </button>
          {showHistorial&&(
            <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
              {pagadas.slice(0,8).map(v=>(
                <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:`1px solid ${BO}`,borderRadius:8,padding:"10px 12px"}}>
                  <div>
                    <div style={{fontSize:15,color:CR}}>{fmtDate(v.fechaCobro||v.fecha)}</div>
                    <div style={{fontSize:13,color:GR}}>✓ {v.medioPago||"Cobrado"}{v.nota?` · ${v.nota}`:""}</div>
                    <ChipBeneficio d={descPorId[v.id]}/>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</span>
                    <button onClick={()=>desmarcarPagada(v.id)} style={{fontSize:13,padding:"4px 8px",borderRadius:6,background:RE+"11",color:"#C62828",border:`1px solid ${RE}33`,cursor:"pointer"}}>Deshacer</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

        <HistorialAgenda entidad={cliente} agenda={cliente.agenda||[]} historial={cliente.historial||[]} cal={cal} onAgregarAgenda={ev=>onUpdate({...cliente,agenda:[...(cliente.agenda||[]),ev]})} onAgregarContacto={c=>onUpdate({...cliente,historial:[...(cliente.historial||[]),c]})}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:16,fontWeight:600,color:CR}}>Historial de ventas</span>
        <span style={{fontSize:14,color:MU}}>Total: {fmtARS(total)}</span>
      </div>
      {vForm
        ?<div style={{marginBottom:14}}><FormVenta prods={prods} comisionPctDefault={cliente.comisionPctDefault} onCancel={()=>setVForm(false)} onSave={v=>{onUpdate({...cliente,ventas:[...cliente.ventas,{id:uid(),...v}]});setVForm(false);}}/></div>
        :<button onClick={()=>setVForm(true)} style={{width:"100%",marginBottom:10,padding:"10px 0",borderRadius:8,fontSize:16,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,border:"1px dashed #3A3028",background:"none",color:G}}>{I.plus}Nueva venta</button>
      }
      {sorted.length===0?<p style={{fontSize:16,color:MU,textAlign:"center",padding:16}}>Sin ventas aún.</p>:sorted.map(v=>{
        if(editandoVentaId===v.id)return(

          </div>
        );
        const p=prods.find(x=>x.id===v.producto);return(
        <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:BG,border:`1px solid ${v.pagado?BO:RE+"44"}`,borderRadius:8,padding:"10px 12px",marginBottom:6}}>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:CR}}>{p?nombreProdEnvase(p):v.producto}</div>
            <div style={{fontSize:13,color:MU}}>{fmtDate(v.fecha)}</div>
            <ChipBeneficio d={descPorId[v.id]}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:16,fontWeight:600,color:CR}}>{fmtARS(v.monto)}</div>
              <div style={{fontSize:13,color:v.pagado?GR:"#E08070"}}>{v.cantidad} L · {v.pagado?"Pagado":"Pendiente"}</div>
            </div>
            <button onClick={()=>setEditandoVentaId(v.id)} style={{padding:6,background:"none",border:"none",cursor:"pointer",color:MU,flexShrink:0}}>{I.edit}</button>
          </div>
        </div>
      );})}
      <SpeechPicker open={spOpen} onClose={()=>setSpOpen(false)} speeches={speeches} telefono={cliente.telefono} nombre={cliente.nombre}/>
    </div>
  );
}
 
// ── INICIO ────────────────────────────────────────────────────────

              <span style={{color:"#8FE3B4",flexShrink:0}}>{I.truck}</span>
              <span style={{flex:1,fontSize:15,color:"#fff",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cliente?cliente.nombre:"Cliente"} · {prod?nombreProdEnvase(prod):p.producto} {p.cantidad}L</span>
              <span style={{fontSize:14,color:"#8FE3B4",flexShrink:0,fontWeight:700}}>{p.horaEntrega}hs</span>
            </button>

              <span style={{color:"#8FE3B4",flexShrink:0}}>{I.alert}</span>
              <span style={{flex:1,fontSize:15,color:"#fff",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.titulo}</span>
              <span style={{fontSize:14,color:"#8FE3B4",flexShrink:0,fontWeight:700}}>{r.hora}hs</span>

        <span style={{color:"#fff",flexShrink:0}}>{I.box}</span>
        <span style={{flex:1,textAlign:"left",fontSize:17,fontWeight:700,color:"#fff"}}>Cargar pedido</span>
        <span style={{color:"#fff",opacity:0.75}}>{I.chev}</span>

        <div style={{display:"flex",gap:6,padding:"10px 16px 0"}}>
          {[{k:"todos",l:"Todos"},{k:"pendientes",l:"Pendientes"},{k:"entregados",l:"Entregados"}].map(f=>(
            <button key={f.k} onClick={()=>setFiltroPedidos(f.k)} style={{padding:"5px 12px",borderRadius:20,fontSize:13,fontWeight:700,cursor:"pointer",border:`1px solid ${filtroPedidos===f.k?G:BO}`,background:filtroPedidos===f.k?G:"transparent",color:filtroPedidos===f.k?"#fff":MU}}>{f.l}</button>

        </div>
        {ultimosPedidos.length===0?(
          <p style={{color:MU,fontSize:16,textAlign:"center",padding:"20px 16px"}}>Todavía no cargaste pedidos.</p>

          const nombreCliente=cliente?cliente.nombre:"Cliente eliminado";

          const resumen=lineas.length
            ?lineas.map(l=>{const prod=prods.find(x=>x.id===l.productoId);return`${l.cantidad}L ${prod?nombreProdEnvase(prod):l.productoId}`;}).join(" + ")
            :(prods.find(x=>x.id===p.producto)?.nombre||"—");
          const entregado=p.estado==="entregado";
          return(
            <button key={p.id} onClick={()=>setTab("pedidos")} style={{width:"100%",padding:"10px 16px",background:"none",border:"none",borderTop:`1px solid ${BO}`,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,textAlign:"left"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:GLT,color:G,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,flexShrink:0}}>{iniciales(nombreCliente)}</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:600,color:CR,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nombreCliente}</div>
                  <div style={{fontSize:13,color:MU,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{resumen}</div>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:15,fontWeight:600,color:CR}}>{fmtARS(p.montoTotal||0)}</div>
                <div style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:3,padding:"2px 8px",borderRadius:20,background:entregado?GLT:AM+"1a"}}>
                  <span style={{width:5,height:5,borderRadius:"50%",background:entregado?G:AM}}/>
                  <span style={{fontSize:12,fontWeight:700,color:entregado?G:AM}}>{entregado?"Entregado":"Pendiente"}</span>
                </div>
              </div>
            </button>
          );
        })}
      </div>

      {/* Notas */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,overflow:"hidden",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderBottom:(notas||[]).length>0?`1px solid ${BO}`:"none",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>{I.note}<span style={{fontSize:16,fontWeight:700,color:CR}}>Notas</span></div>
          <button onClick={()=>setTab("notas")} style={{fontSize:14,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:2}}>{(notas||[]).length>0?"Ver todas":"Agregar"}{I.chev}</button>
        </div>
        {(notas||[]).length>0&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"12px 16px"}}>
            {[...notas].sort((a,b)=>new Date(b.actualizadoEn||b.creadoEn)-new Date(a.actualizadoEn||a.creadoEn)).slice(0,8).map(n=>{
              const col=colorNota(n.color);
              return(
                <button key={n.id} onClick={()=>setTab("notas")} style={{padding:"6px 12px",borderRadius:20,fontSize:14,fontWeight:600,cursor:"pointer",background:col.bg,border:`1px solid ${col.bd}`,color:col.tx,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.titulo}</button>
              );
            })}
          </div>
        )}
      </div>

      {/* Meta semanal */}
      <div style={{background:CA,border:`1px solid ${BO}`,borderRadius:18,padding:16,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:15,fontWeight:700,color:CR}}>🎯 Meta semanal</span>
          {!editandoMeta&&<button onClick={()=>{setMetaTmp(String(metaSemanal));setEditandoMeta(true);}} style={{fontSize:13,color:G,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>{I.edit}Editar</button>}
        </div>
        {editandoMeta?(
          <div style={{display:"flex",gap:8}}>
            <input type="number" inputMode="numeric" value={metaTmp} onChange={e=>setMetaTmp(e.target.value)} placeholder="Litros por semana" autoFocus/>
            <button onClick={()=>{const n=Number(metaTmp);if(n>0)setMetaSemanal(n);setEditandoMeta(false);}} style={{padding:"0 14px",borderRadius:8,background:G,color:"#fff",border:"none",fontWeight:700,cursor:"pointer"}}>{I.check}</button>
          </div>
        ):metaSemanal>0?(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
              <span className="bebas" style={{fontSize:22,color:G}}>{litrosSemana}L <span style={{fontSize:16,color:MU}}>/ {metaSemanal}L</span></span>
              <span style={{fontSize:14,color:MU}}>{diasRest} día{diasRest!==1?"s":""} restantes</span>
            </div>
            <div style={{height:8,background:BO,borderRadius:4,overflow:"hidden"}}>
              <div style={{width:`${pctMeta}%`,height:"100%",background:pctMeta>=100?GR:G,borderRadius:4,transition:"width 0.4s"}}/>

            <div style={{fontSize:14,color:pctMeta>=100?GR:MU,marginTop:6,fontWeight:pctMeta>=100?700:400}}>
              {pctMeta>=100?"🎉 ¡Meta alcanzada esta semana!":`Llevás ${pctMeta}% de la meta`}

          <button onClick={()=>setEditandoMeta(true)} style={{fontSize:15,color:MU,background:"none",border:`1px dashed ${BO}`,borderRadius:8,padding:"10px 0",width:"100%",cursor:"pointer"}}>Definir meta semanal de litros</button>

      {/* Alerta: deuda pendiente */}
